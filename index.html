"o": ["It is a cat.", "They are cats.", "This is cat.", "Yes, it is."], "sol": "What is this? 問一個東西，回答用 It is…。", "w": ["問句是單數 this，回答要用單數 It is。", "this 指一個東西，cat 前面還要有 a。", "What 問句不能用 Yes 回答。"], "parent": "回答 What is this? 時，用 it 代替 this。", "ex": "— What is this? — It is a cat."}, {"id": "EN-L2-E108", "subj": "英語", "unit": "Lesson 2", "point": "動物字彙 elephant", "diff": "簡單", "type": "字彙", "q": "「大象」的英文是：", "o": ["elephant", "monkey", "rabbit", "tiger"], "sol": "大象是 elephant。", "w": ["monkey 是猴子。", "rabbit 是兔子。", "tiger 是老虎。"], "parent": "可以邊畫圖邊記動物單字。", "ex": "That is an elephant. It is big."}, {"id": "EN-L2-E109", "subj": "英語", "unit": "Lesson 2", "point": "those 配 are", "diff": "簡單", "type": "選擇填空", "q": "Those ________ lions.", "o": ["are", "is", "am", "be"], "sol": "Those（那些）是複數，配 are。", "w": ["is 配單數。", "am 只配 I。", "be 要換成 am、is 或 are。"], "parent": "these、those 是複數，一定配 are。", "ex": "Those are lions. They are strong."}, {"id": "EN-L2-M101", "subj": "英語", "unit": "Lesson 2", "point": "回答 What are these?", "diff": "中等", "type": "問答配對", "q": "— What are these?\n— ________", "o": ["They are rabbits.", "These are rabbit.", "It is rabbits.", "They is rabbits."], "sol": "What are these? 問很多個東西，回答用 They are＋複數名詞。", "w": ["rabbit 要用複數 rabbits。", "It 是單數，不能配複數 rabbits。", "They 要配 are。"], "parent": "these 問 → they 答，名詞加 s。", "ex": "— What are these? — They are rabbits."}, {"id": "EN-L2-M102", "subj": "英語", "unit": "Lesson 2", "point": "單數改複數（that→those）", "diff": "中等", "type": "句型改寫", "q": "把 That is a watch. 改成複數：", "o": ["Those are watches.", "Those are watch.", "Those is watches.", "That are watches."], "sol": "That→Those，is→are，a watch→watches（去掉 a，ch 結尾加 es）。", "w": ["watch 也要改成複數 watches。", "Those 要配 are。", "That 也要改成複數的 Those。"], "parent": "改複數要改三個地方：指示詞、be 動詞、名詞。", "ex": "That is a watch. → Those are watches."}, {"id": "EN-L2-M103", "subj": "英語", "unit": "Lesson 2", "point": "複數改單數", "diff": "中等", "type": "句型改寫", "q": "把 These are dogs. 改成單數：", "o": ["This is a dog.", "This is dogs.", "These is a dog.", "This are a dog."], "sol": "These→This，are→is，dogs→a dog。", "w": ["dogs 也要改成單數 a dog。", "These 要改成單數的 This。", "This 要配 is。"], "parent": "改單數一樣要改三個地方，名詞前面還要加 a。", "ex": "These are dogs. → This is a dog."}, {"id": "EN-L2-M104", "subj": "英語", "unit": "Lesson 2", "point": "回答 Is this…?", "diff": "中等", "type": "問答配對", "q": "— Is this your bag?\n— Yes, ________.", "o": ["it is", "this is", "it's", "they are"], "sol": "回答時用 it 代替 this；肯定簡答不縮寫：Yes, it is.", "w": ["回答時要用 it 代替 this。", "肯定簡答句不能縮寫成 it's。", "一個包包是單數，不用 they。"], "parent": "this、that 問 → it 答。", "ex": "— Is this your bag? — Yes, it is."}, {"id": "EN-L2-M105", "subj": "英語", "unit": "Lesson 2", "point": "回答 Are those…?", "diff": "中等", "type": "問答配對", "q": "— Are those your dogs?\n— No, ________.", "o": ["they aren't", "those aren't", "it isn't", "they are"], "sol": "those 是複數，回答時用 they 代替；回答 No，用 aren't。", "w": ["回答時要用 they 代替 those。", "those 是複數，不能用 it。", "前面說 No，後面要用否定。"], "parent": "these、those 問 → they 答。", "ex": "— Are those your dogs? — No, they aren't."}, {"id": "EN-L2-M106", "subj": "英語", "unit": "Lesson 2", "point": "辨識正確的複數拼字", "diff": "中等", "type": "拼字", "q": "下列哪一個複數拼字正確？", "o": ["boxes", "babys", "watchs", "boyes"], "sol": "box 字尾是 x，加 es：boxes。", "w": ["baby 是子音＋y，要寫成 babies。", "watch 字尾是 ch，要寫成 watches。", "boy 是母音＋y，直接加 s，寫成 boys。"], "parent": "把四種規則各舉一個例子背起來：cats、boxes、babies、boys。", "ex": "These are boxes. Those are babies."}, {"id": "EN-L2-M107", "subj": "英語", "unit": "Lesson 2", "point": "monkey 的複數", "diff": "中等", "type": "拼字", "q": "Those are three ________.（monkey）", "o": ["monkeys", "monkies", "monkey", "monkeyes"], "sol": "monkey 的 y 前面是母音 e，直接加 s：monkeys。", "w": ["y 前面是母音 e，不改 ies。", "three 後面要用複數。", "直接加 s 就好，不加 es。"], "parent": "y 前面是 a、e、i、o、u 就直接加 s：boys、monkeys。", "ex": "Those are three monkeys."}, {"id": "EN-L2-M108", "subj": "英語", "unit": "Lesson 2", "point": "否定簡答後補充說明", "diff": "中等", "type": "問答配對", "q": "— Is that a tiger?\n— No, ________. It is a lion.", "o": ["it isn't", "that isn't", "it is", "they aren't"], "sol": "that 回答時換成 it；後面說「牠是獅子」，所以前面是否定 it isn't。", "w": ["回答時要用 it 代替 that。", "後面說牠是獅子，所以不是老虎，要用否定。", "一隻動物是單數，不用 they。"], "parent": "回答時把 that 換成 it，前後意思要一致。", "ex": "— Is that a tiger? — No, it isn't. It is a lion."}, {"id": "EN-L2-M109", "subj": "英語", "unit": "Lesson 2", "point": "字尾 sh 加 es", "diff": "中等", "type": "拼字", "q": "two ________（dish）", "o": ["dishes", "dishs", "dishies", "dish"], "sol": "dish 字尾是 sh，加 es：dishes。", "w": ["sh 結尾要加 es。", "字尾沒有 y，不改 ies。", "two 後面要用複數。"], "parent": "s、x、ch、sh 結尾加 es，念起來會多一個音節。", "ex": "These are dishes."}, {"id": "EN-L2-M110", "subj": "英語", "unit": "Lesson 2", "point": "those 遠處複數", "diff": "中等", "type": "選擇填空", "q": "（Ben 指著窗外遠處的三隻鳥）\n________ are birds.", "o": ["Those", "These", "That", "This"], "sol": "遠處、三隻（複數），用 Those，配 are。", "w": ["These 是近處的。", "That 是單數。", "This 是近處的單數。"], "parent": "先看遠近，再看數量。", "ex": "Those are birds. They are in the tree."}, {"id": "EN-L2-M111", "subj": "英語", "unit": "Lesson 2", "point": "複數句改問句", "diff": "中等", "type": "句型改寫", "q": "把 Those are elephants. 改成問句：", "o": ["Are those elephants?", "Is those elephants?", "Those are elephants?", "Are they elephant?"], "sol": "把 are 移到 those 前面：Are those elephants?", "w": ["those 是複數，要配 are。", "問句要把 be 動詞移到最前面。", "elephant 要保持複數 elephants，主詞也不用改成 they。"], "parent": "問句：be 動詞搬到前面，其他保持原樣。", "ex": "Are those elephants? Yes, they are."}, {"id": "EN-L2-M112", "subj": "英語", "unit": "Lesson 2", "point": "What's 的意思", "diff": "中等", "type": "觀念辨識", "q": "What's this? 中的 What's 是哪兩個字的縮寫？", "o": ["What is", "What are", "What does", "What has"], "sol": "What's this? 是 What is this? 的縮寫，後面接單數 this。", "w": ["What are 不能縮寫成 What's，而且 this 是單數，要配 is。", "這個句子沒有 does。", "What's this? 是在問「這是什麼」，不是「有什麼」。"], "parent": "'s 在 What's、Who's、It's 裡都是 is。", "ex": "What's this? It's a box."}, {"id": "EN-L2-M113", "subj": "英語", "unit": "Lesson 2", "point": "依答句選問句（單數）", "diff": "中等", "type": "問答配對", "q": "— ________\n— It is a monkey.", "o": ["What is that?", "What are those?", "Who is that?", "Is it a monkey?"], "sol": "答句 It is a monkey. 說的是一隻動物，而且沒有 Yes/No，問句是 What is that?", "w": ["What are those? 問複數，回答會是 They are…。", "Who 問人，猴子是動物，要用 What。", "Is it a monkey? 要用 Yes 或 No 回答。"], "parent": "答句是 It is → 問句是單數 this／that。", "ex": "— What is that? — It is a monkey."}, {"id": "EN-L2-M114", "subj": "英語", "unit": "Lesson 2", "point": "依答句選問句（複數）", "diff": "中等", "type": "問答配對", "q": "— ________\n— They are cats.", "o": ["What are these?", "What is this?", "Who are they?", "Are these cats?"], "sol": "答句 They are cats. 說的是很多隻動物，而且沒有 Yes/No，問句是 What are these?", "w": ["What is this? 問一個東西，回答會是 It is…。", "Who 問人，貓是動物。", "Are these cats? 要用 Yes 或 No 回答。"], "parent": "答句是 They are → 問句是 these／those。", "ex": "— What are these? — They are cats."}, {"id": "EN-L2-M115", "subj": "英語", "unit": "Lesson 2", "point": "整句單複數一致", "diff": "中等", "type": "句子判斷", "q": "想說「這些是我的貓」，下列哪一句正確？", "o": ["These are my cats.", "These is my cats.", "This are my cats.", "These are my cat."], "sol": "These（複數）配 are，後面的名詞也要用複數 cats。", "w": ["These 是複數，要配 are。", "This 是單數，不能配 are 和 cats。", "These 指很多隻，cat 要加 s。"], "parent": "一句話裡：指示詞、be 動詞、名詞，三個的單複數要一致。", "ex": "These are my cats."}, {"id": "EN-L2-M116", "subj": "英語", "unit": "Lesson 2", "point": "動物字彙 tiger", "diff": "中等", "type": "字彙", "q": "It is big and strong. It is not a lion. It is a ________.（提示：老虎）", "o": ["tiger", "monkey", "rabbit", "bird"], "sol": "老虎是 tiger。", "w": ["monkey 是猴子。", "rabbit 是兔子。", "bird 是鳥。"], "parent": "把動物單字分組記：大型（lion、tiger、elephant）、小型（rabbit、bird）。", "ex": "That is a tiger. It is big."}, {"id": "EN-L2-M117", "subj": "英語", "unit": "Lesson 2", "point": "名詞所有格 's", "diff": "中等", "type": "閱讀理解", "q": "根據上面的對話，那隻狗是誰的？", "o": ["B 的哥哥或弟弟", "B", "A", "A 的哥哥或弟弟"], "sol": "B 說 No, it isn't.（不是我的），接著說 It is my brother's dog.（是我哥哥或弟弟的狗）。", "w": ["B 回答 No，表示不是自己的狗。", "A 是問問題的人，對話沒說狗是 A 的。", "my 是 B 說的話，指的是 B 的兄弟，不是 A 的。"], "parent": "'s 表示「…的」：my brother's dog＝我哥哥（或弟弟）的狗。", "fig": "<div class=\"fig dialog\"><p><b>A:</b> Is this your dog?</p><p><b>B:</b> No, it isn't. It is my brother's dog.</p></div>", "ex": "It is not my dog. It is my brother's dog."}, {"id": "EN-L2-H101", "subj": "英語", "unit": "Lesson 2", "point": "依遠近與數量判斷句子", "diff": "困難", "type": "圖表判讀", "q": "根據上表，哪一個句子描述正確？", "o": ["乙：Those are monkeys.", "甲：These are cats.", "丙：These are rabbit.", "丁：This is a bird."], "sol": "乙是遠處的三隻猴子：遠＋複數 → Those are monkeys.", "w": ["甲是近處的「一隻」貓，要用 This is a cat.", "丙是兩隻兔子，rabbit 要加 s。", "丁在遠處，要用 That is a bird."], "parent": "每一個都檢查三件事：遠還是近？一個還是很多個？名詞有沒有加 s？", "fig": "<table class=\"fig\"><caption>Kevin 在動物園看到的動物</caption><tr><th></th><th>動物</th><th>位置</th><th>數量</th></tr><tr><td>甲</td><td>貓</td><td>近處（在 Kevin 身邊）</td><td>1 隻</td></tr><tr><td>乙</td><td>猴子</td><td>遠處</td><td>3 隻</td></tr><tr><td>丙</td><td>兔子</td><td>近處</td><td>2 隻</td></tr><tr><td>丁</td><td>鳥</td><td>遠處</td><td>1 隻</td></tr></table>", "ex": "This is a cat. Those are monkeys."}, {"id": "EN-L2-H102", "subj": "英語", "unit": "Lesson 2", "point": "複數規則應用到新單字", "diff": "困難", "type": "規則遷移", "q": "下列哪一組複數拼字「全部」正確？（key 鑰匙、city 城市、bus 公車）", "o": ["keys, cities, buses", "keies, cities, buses", "keys, citys, buses", "keys, cities, buss"], "sol": "key：y 前面是母音 e，直接加 s → keys。city：y 前面是子音 t，改 ies → cities。bus：字尾是 s，加 es → buses。", "w": ["key 的 y 前面是母音 e，直接加 s。", "city 的 y 前面是子音 t，要改成 ies。", "bus 字尾是 s，要加 es。"], "parent": "新單字也一樣：先看最後一兩個字母，再套規則。", "ex": "These are my keys. Those are buses."}, {"id": "EN-L2-H103", "subj": "英語", "unit": "Lesson 2", "point": "對話中的單複數與代名詞", "diff": "困難", "type": "克漏字", "q": "A: What are those?\nB: ______(1)______\nA: Are they your dogs?\nB: No, ______(2)______. They are my uncle's dogs.\n(1)、(2) 依序應填入什麼？", "o": ["They are dogs.；they aren't", "It is a dog.；they aren't", "They are dogs.；it isn't", "Those are dog.；they aren't"], "sol": "(1) What are those? 問複數，回答 They are dogs.。(2) Are they…? 的否定簡答是 they aren't。後面說是叔叔的狗，所以前面是 No。", "w": ["(1) those 是複數，不能用 It is a dog. 回答。", "(2) 問句主詞是 they，回答也要用 they aren't。", "(1) dog 要加 s，回答也習慣用 They are…。"], "parent": "每格都回頭看問句：問句是複數，回答就跟著用複數。", "ex": "— What are those? — They are dogs. — Are they your dogs? — No, they aren't."}, {"id": "EN-L2-H104", "subj": "英語", "unit": "Lesson 2", "point": "閱讀計數與排除", "diff": "困難", "type": "閱讀推理", "q": "根據上面的短文，Nina 自己有幾隻寵物？", "o": ["3 隻", "4 隻", "2 隻", "1 隻"], "sol": "Lucky 是一隻狗，Kiki 和 Coco 是兩隻鳥，共 3 隻。Mimi 是姊姊（或妹妹）的貓，不是 Nina 的，不能算。", "w": ["把 Mimi 也算進去了；Mimi 是 sister's cat。", "把 Kiki 和 Coco 當成一隻；They are birds. 表示兩隻。", "只算了 Lucky。"], "parent": "一邊讀一邊畫記：是誰的？有幾隻？", "fig": "<div class=\"fig passage\"><p>Hi, I'm Nina. These are my pets. This is Lucky. It is a dog. Those are Kiki and Coco. They are birds. That is Mimi. It is a cat. It is not my cat. It is my sister's cat.</p></div>", "ex": "Those are Kiki and Coco. They are birds."}, {"id": "EN-RV-H101", "subj": "英語", "unit": "Review 1", "point": "對話中的所有格與簡答", "diff": "困難", "type": "克漏字", "q": "A: Who's that girl?\nB: She is my cousin. ______(1)______ name is Jill.\nA: Is that her dog?\nB: No, ______(2)______. It is my dog.\n(1)、(2) 依序應填入什麼？", "o": ["Her；it isn't", "She；it isn't", "Her；she isn't", "His；it isn't"], "sol": "(1) 後面接名詞 name，「她的」用 Her。(2) 問的是那隻狗（that…dog），回答用 it；後面說是我的狗，所以是否定 it isn't。", "w": ["(1) 後面有名詞 name，不能用主詞 She。", "(2) 問的是狗，不是女孩，要用 it 回答。", "(1) Jill 是女孩，要用 Her，不是 His。"], "parent": "每一格都先問自己：這裡說的是誰？是人還是東西？", "ex": "She is my cousin. Her name is Jill. — Is that her dog? — No, it isn't."}, {"id": "EN-RV-H102", "subj": "英語", "unit": "Review 1", "point": "短文找出數字資訊", "diff": "困難", "type": "閱讀推理", "q": "根據上面的短文，誰是十一歲？", "o": ["May", "Amy", "Joe", "Max"], "sol": "短文說 May is not fifteen. She is eleven.，所以十一歲的是 May。", "w": ["Amy 是十五歲（fifteen）。", "短文沒有說 Joe 幾歲。", "Max 是狗的名字，短文沒有說牠幾歲。"], "parent": "看到 not 要特別小心，下一句才是真正的答案。", "fig": "<div class=\"fig passage\"><p>I'm Joe. This is my family. My father is a teacher. My mother is a doctor. These are my sisters, Amy and May. They are students. Amy is fifteen. May is not fifteen. She is eleven. Those are our dogs. Their names are Max and Bo.</p></div>", "ex": "May is not fifteen. She is eleven."}, {"id": "EN-RV-H103", "subj": "英語", "unit": "Review 1", "point": "短文判斷敘述正誤", "diff": "困難", "type": "閱讀推理", "q": "根據上面的短文，下列哪一個敘述正確？", "o": ["Joe's sisters are students.", "Joe's mother is a teacher.", "Max is Joe's sister.", "May is fifteen."], "sol": "短文說 These are my sisters, Amy and May. They are students.，所以 Joe 的姊妹是學生。", "w": ["Joe 的媽媽是醫生，爸爸才是老師。", "Max 是狗的名字，不是姊妹。", "May 不是十五歲，是十一歲。"], "parent": "每個敘述都回到短文找證據，找得到才選。", "fig": "<div class=\"fig passage\"><p>I'm Joe. This is my family. My father is a teacher. My mother is a doctor. These are my sisters, Amy and May. They are students. Amy is fifteen. May is not fifteen. She is eleven. Those are our dogs. Their names are Max and Bo.</p></div>", "ex": "These are my sisters. They are students."}, {"id": "EN-RV-H104", "subj": "英語", "unit": "Review 1", "point": "代名詞 Their 的指涉", "diff": "困難", "type": "閱讀推理", "q": "根據上面的短文，最後一句的 Their 指的是誰？", "o": ["Joe 家的狗", "Amy 和 May", "Joe 的爸爸和媽媽", "Joe 和他的姊妹"], "sol": "最後兩句是 Those are our dogs. Their names are Max and Bo.，Their 指的是前一句的 dogs。", "w": ["Amy 和 May 在前面就介紹過了；Their 前一句講的是狗。", "短文沒有說爸爸媽媽的名字是 Max 和 Bo。", "our 才包含 Joe 和家人；Their 指的是狗。"], "parent": "their 通常指前一句提到的「複數」名詞。", "fig": "<div class=\"fig passage\"><p>I'm Joe. This is my family. My father is a teacher. My mother is a doctor. These are my sisters, Amy and May. They are students. Amy is fifteen. May is not fifteen. She is eleven. Those are our dogs. Their names are Max and Bo.</p></div>", "ex": "Those are our dogs. Their names are Max and Bo."}, {"id": "EN-RV-H105", "subj": "英語", "unit": "Review 1", "point": "含所有格的句子改成複數", "diff": "困難", "type": "句型改寫", "q": "把 This is my brother's box. 改成複數（有很多個盒子，主人還是同一個哥哥）：", "o": ["These are my brother's boxes.", "These are my brothers' box.", "This are my brother's boxes.", "These is my brother's boxes."], "sol": "盒子變多了，所以 This→These、is→are、box→boxes；主人還是一個哥哥，所以 my brother's 不變。", "w": ["要變複數的是盒子，不是哥哥；box 要變 boxes。", "This 要改成 These。", "These 要配 are。"], "parent": "先找出「什麼東西變多了」，只改那個東西和指示詞、be 動詞。", "ex": "This is my brother's box. → These are my brother's boxes."}, {"id": "EN-RV-H106", "subj": "英語", "unit": "Review 1", "point": "人稱轉換回答問句", "diff": "困難", "type": "問答配對", "q": "— Are you and Ken classmates?\n— Yes, ________.", "o": ["we are", "you are", "they are", "I am"], "sol": "問的是「你和 Ken」，回答的人說的是「我和 Ken」，也就是 we（我們），配 are。", "w": ["you are 是照抄問句；回答的人要說「我們」。", "they 是「他們」，不包含說話的人自己。", "I am 只說到自己一個人，漏了 Ken。"], "parent": "回答時站在自己的角度：「你和 Ken」對自己來說是「我和 Ken」＝we。", "ex": "— Are you and Ken classmates? — Yes, we are."}, {"id": "EN-RV-H107", "subj": "英語", "unit": "Review 1", "point": "由答句判斷問人或問物", "diff": "困難", "type": "問答配對", "q": "— ________\n— They are my uncle's cats.", "o": ["What are those?", "Who are those?", "Are those your cats?", "What is that?"], "sol": "答句說的是貓（動物），而且是複數、沒有 Yes/No，所以問句是 What are those?", "w": ["Who 問人；答句說的是貓。", "Yes/No 問句要先回答 Yes 或 No。", "What is that? 問單數，回答應該是 It is…。"], "parent": "從答句找三個線索：是人還是東西？一個還是很多個？有沒有 Yes/No？", "ex": "— What are those? — They are my uncle's cats."}, {"id": "HI-L1-E101", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "民國元年與西元換算", "diff": "簡單", "type": "計算", "q": "民國元年是西元哪一年？", "o": ["1912 年", "1911 年", "1900 年", "1949 年"], "sol": "民國元年＝西元 1912 年。換算公式是：西元年－1911＝民國年，所以 1912－1911＝1。", "w": ["1911 是換算時要減的數字，不是民國元年。", "1900 年還沒有中華民國。", "1949 年是民國 38 年。"], "parent": "記住「西元減 1911 就是民國」，民國元年就是 1912 年。"}, {"id": "HI-L1-E102", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "世紀的判斷", "diff": "簡單", "type": "計算", "q": "西元 1987 年屬於第幾世紀？", "o": ["20 世紀", "19 世紀", "21 世紀", "2 世紀"], "sol": "遮住後兩位剩 19，不是整百年要加 1，所以是 20 世紀。", "w": ["忘了加 1。", "加了 2。", "只看千位數是錯的；要遮住後兩位，看剩下的 19。"], "parent": "遮後兩位、再加 1；剛好整百年才不加。"}, {"id": "HI-L1-E103", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "西元紀年的起點", "diff": "簡單", "type": "觀念辨識", "q": "西元紀年傳統上以哪一件事發生的那一年作為元年？", "o": ["耶穌誕生", "中華民國成立", "孔子出生", "鄭成功來臺"], "sol": "西元紀年傳統上以耶穌誕生的那一年作為西元元年。", "w": ["中華民國成立是民國紀年的元年。", "孔子出生和西元紀年無關。", "鄭成功來臺是 17 世紀的事。"], "parent": "西元看耶穌誕生，民國看中華民國成立。"}, {"id": "HI-L1-E104", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "民國換算西元", "diff": "簡單", "type": "計算", "q": "民國 100 年是西元哪一年？", "o": ["2011 年", "2000 年", "2111 年", "1911 年"], "sol": "民國年＋1911＝西元年：100＋1911＝2011。", "w": ["以為民國 100 年剛好是 2000 年，忘了加 1911。", "加錯了，100＋1911＝2011。", "1911 是換算用的數字。"], "parent": "民國換西元：加 1911。"}, {"id": "HI-L1-E105", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "研究史前時代的依據", "diff": "簡單", "type": "觀念辨識", "q": "研究臺灣史前時代，主要依靠下列哪一種資料？", "o": ["遺址和出土的遺物", "當時的官方公文", "當時的報紙", "當時的族譜"], "sol": "史前時代沒有當時的文字紀錄，主要靠考古發掘的遺址與遺物（例如石器、陶器）來了解。", "w": ["史前時代沒有文字，不會有官方公文。", "史前時代沒有報紙。", "族譜是用文字寫的，史前時代沒有。"], "parent": "史前＝沒有文字，所以要靠挖出來的東西。"}, {"id": "HI-L1-E106", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "新石器時代的特徵", "diff": "簡單", "type": "觀念辨識", "q": "「磨製石器」和「陶器」開始普遍出現，代表進入哪一個時代？", "o": ["新石器時代", "舊石器時代", "金屬器時代", "歷史時代"], "sol": "新石器時代的特徵是磨製石器、陶器，並逐步發展農耕。", "w": ["舊石器時代使用打製石器，還沒有陶器。", "金屬器時代的特徵是使用鐵器等金屬工具。", "歷史時代是看有沒有文字紀錄，不是看陶器。"], "parent": "敲石頭＝舊石器；磨石頭、做陶器＝新石器；用鐵器＝金屬器。"}, {"id": "HI-L1-E107", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "長濱文化的時代", "diff": "簡單", "type": "觀念辨識", "q": "長濱文化屬於哪一個時代？", "o": ["舊石器時代", "新石器時代", "金屬器時代", "歷史時代"], "sol": "長濱文化使用打製石器，以採集、狩獵、漁撈為生，屬於舊石器時代。", "w": ["新石器時代有磨製石器和陶器，例如大坌坑文化。", "金屬器時代會用鐵器，例如十三行文化。", "長濱文化沒有文字紀錄，是史前時代。"], "parent": "長濱最早：舊石器、打製石器。"}, {"id": "HI-L1-E108", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "卑南文化的特色", "diff": "簡單", "type": "觀念辨識", "q": "以大量「石板棺」和精美「玉器」出土而聞名的是哪一個史前文化？", "o": ["卑南文化", "長濱文化", "十三行文化", "大坌坑文化"], "sol": "卑南文化出土大量石板棺和玉器。", "w": ["長濱文化屬舊石器時代，使用打製石器。", "十三行文化以鐵器、煉鐵遺跡聞名。", "大坌坑文化是早期新石器文化，以陶器聞名。"], "parent": "卑南＝石板棺＋玉器。"}, {"id": "HI-L1-E109", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "十三行文化的特色", "diff": "簡單", "type": "觀念辨識", "q": "十三行文化的人已經會使用下列哪一種器物？", "o": ["鐵器", "文字", "火藥武器", "紙張"], "sol": "十三行文化屬於金屬器時代，已會使用鐵器，遺址中還有煉鐵的遺跡。", "w": ["十三行文化仍是史前文化，沒有留下文字紀錄。", "遺址中沒有火藥武器。", "遺址中沒有紙張。"], "parent": "十三行＝金屬器時代＝鐵器。"}, {"id": "HI-L1-E110", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "貝塚的意義", "diff": "簡單", "type": "觀念辨識", "q": "圓山文化遺址中有「貝塚」。貝塚是什麼？", "o": ["古人吃完貝類後丟棄貝殼等，堆積形成的遺跡", "古人埋葬死者的墳墓", "古人祭拜神明的廟宇", "古人製作陶器的窯"], "sol": "貝塚是古人把吃剩的貝殼、骨頭等丟在一起，長期堆積形成的遺跡，可以看出當時的飲食。", "w": ["名字有「塚」，但貝塚不是墳墓。", "貝塚和祭拜無關。", "製作陶器的地方是窯，不是貝塚。"], "parent": "貝塚就像古人的垃圾堆，可以看出他們吃了什麼。"}, {"id": "HI-L1-E111", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "原住民族的族數", "diff": "簡單", "type": "觀念辨識", "q": "依照目前政府的官方認定，臺灣原住民族共有幾族？", "o": ["16 族", "9 族", "14 族", "20 族"], "sol": "目前政府官方認定的臺灣原住民族共有 16 族。", "w": ["9 族是較早期的認定數目，後來陸續增加。", "14 族是過去某段時間的數目，目前已增加到 16 族。", "目前官方認定沒有到 20 族。"], "parent": "現在官方認定是 16 族，各族有自己的語言和文化。"}, {"id": "HI-L1-E112", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "南島語族", "diff": "簡單", "type": "觀念辨識", "q": "臺灣原住民族在語言的分類上屬於哪一個語族？", "o": ["南島語族", "漢藏語族", "印歐語族", "阿爾泰語族"], "sol": "臺灣原住民族的語言屬於南島語族。", "w": ["漢藏語族包括漢語等。", "印歐語族包括英語等歐洲語言。", "阿爾泰語族分布在中亞、北亞一帶。"], "parent": "南島語族是依語言的親緣關係來分類的。"}, {"id": "HI-L1-E113", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "大坌坑文化的時代", "diff": "簡單", "type": "觀念辨識", "q": "大坌坑文化屬於哪一個時代？", "o": ["新石器時代早期", "舊石器時代", "金屬器時代", "歷史時代"], "sol": "大坌坑文化是臺灣早期的新石器文化，已會製作陶器。", "w": ["舊石器時代的代表是長濱文化。", "金屬器時代的代表是十三行文化。", "大坌坑文化沒有文字紀錄，是史前時代。"], "parent": "史前文化順序：長濱（舊石器）→大坌坑（新石器早期）→……→十三行（金屬器）。"}, {"id": "HI-L1-E114", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "舊石器時代的生活", "diff": "簡單", "type": "觀念辨識", "q": "舊石器時代長濱文化的人，主要用什麼方式取得食物？", "o": ["採集、狩獵與漁撈", "大規模種植稻米", "向外國商人購買", "以飼養牛羊為主"], "sol": "舊石器時代的人取用自然資源，以採集、狩獵與漁撈為生，還沒有發展農耕。", "w": ["種植作物（農耕）是新石器時代才逐漸發展的。", "舊石器時代沒有和外國商人貿易。", "舊石器時代還沒有以畜牧為主的生活。"], "parent": "舊石器時代：大自然有什麼就拿什麼。"}, {"id": "HI-L1-M101", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "民國換算西元", "diff": "中等", "type": "計算", "q": "民國 113 年是西元哪一年？", "o": ["2024 年", "2013 年", "2224 年", "1798 年"], "sol": "民國年＋1911＝西元年：113＋1911＝2024。", "w": ["只把 113 改成 2013，沒有真正換算。", "加的數字錯了。", "做成減法：1911－113＝1798；民國換西元要用加的。"], "parent": "民國換西元用加，西元換民國用減。"}, {"id": "HI-L1-M102", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "整百年的世紀", "diff": "中等", "type": "計算", "q": "西元 2000 年屬於第幾世紀？", "o": ["20 世紀", "21 世紀", "19 世紀", "2 世紀"], "sol": "每一百年是一個世紀，第 20 世紀是 1901～2000 年，所以 2000 年是 20 世紀的最後一年。", "w": ["整百年不要加 1：2000 年是 20 世紀，2001 年才是 21 世紀。", "2000 年在 1901～2000 年之間。", "只看千位數是錯的；要看百位以上的 20。"], "parent": "整百年是那個世紀的最後一年，不加 1。"}, {"id": "HI-L1-M103", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "世紀的年份範圍", "diff": "中等", "type": "觀念辨識", "q": "第 17 世紀包含哪些年份？", "o": ["1601～1700 年", "1600～1699 年", "1700～1799 年", "1701～1800 年"], "sol": "第 1 世紀是 1～100 年，所以第 17 世紀是 1601～1700 年。", "w": ["因為沒有西元 0 年，每個世紀從「01」年開始，到整百年結束。", "1700～1799 大部分是第 18 世紀。", "1701～1800 年是第 18 世紀。"], "parent": "每個世紀：從 01 年開始，到 00 年結束。"}, {"id": "HI-L1-M104", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "年代間隔", "diff": "中等", "type": "計算", "q": "荷蘭人在西元 1624 年來到大員。到民國 115 年，一共經過了幾年？", "o": ["402 年", "1509 年", "287 年", "1739 年"], "sol": "先把民國 115 年換成西元：115＋1911＝2026。再算 2026－1624＝402 年。", "w": ["直接用 1624－115，民國和西元沒有先統一。", "只算到民國元年前（1911－1624），忘了再加上民國的 115 年。", "把兩個數字相加，題目問的是相隔幾年。"], "parent": "不同紀年要先換成同一種，才能相減。"}, {"id": "HI-L1-M105", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "沒有西元 0 年", "diff": "中等", "type": "觀念辨識", "q": "下列關於西元紀年的敘述，何者正確？", "o": ["西元 1 年的前一年是西元前 1 年", "西元 0 年是耶穌誕生的那一年", "西元 1～99 年是第 1 世紀", "西元 1900 年屬於 20 世紀"], "sol": "西元紀年沒有 0 年，西元 1 年的前一年就是西元前 1 年。", "w": ["沒有西元 0 年，耶穌誕生傳統上定為西元元年（1 年）。", "第 1 世紀是 1～100 年，包含 100 年。", "1900 年是整百年，屬於 19 世紀。"], "parent": "數年份時沒有 0：前 1 年後面直接接 1 年。"}, {"id": "HI-L1-M106", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "由遺物做合理推論", "diff": "中等", "type": "史料判讀", "q": "某遺址出土一件精美的玉器。下列推論何者最恰當？", "o": ["當地的人可能具備加工玉器的技術", "當時全臺灣的人都會做玉器", "當時的人已經使用文字", "這件玉器一定是從外國買來的"], "sol": "一件玉器可以推論當地可能有人會加工玉器，但不能推論全臺灣都一樣，也不能證明有文字或一定來自外國。", "w": ["一件遺物不能代表全臺灣所有人的生活。", "玉器和文字無關。", "沒有其他證據，不能說「一定」來自外國。"], "parent": "推論要剛好：證據能說到哪裡，就說到哪裡。"}, {"id": "HI-L1-M107", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "陶器不等於文字", "diff": "中等", "type": "觀念辨識", "q": "某遺址出土大量陶器，有同學說：「這裡已經進入歷史時代了。」這個說法錯在哪裡？", "o": ["有陶器不代表有文字紀錄，史前、歷史的分界是文字", "陶器是舊石器時代才有的東西", "陶器出現代表進入金屬器時代", "歷史時代是看有沒有鐵器"], "sol": "史前時代和歷史時代的主要分界是有沒有文字紀錄。陶器代表技術進步，但不代表有文字。", "w": ["舊石器時代還沒有陶器；陶器是新石器時代的特徵。", "金屬器時代的特徵是鐵器，不是陶器。", "歷史時代看文字，不看鐵器。"], "parent": "時代的分法有兩種：看工具分舊石器、新石器、金屬器；看文字分史前、歷史。"}, {"id": "HI-L1-M108", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "由遺物推論生活方式", "diff": "中等", "type": "史料判讀", "q": "某遺址出土網墜（綁在漁網上的小石塊）和大量魚骨。最能推論當時的人做什麼？", "o": ["從事漁撈", "以種植稻米為主", "已使用鐵器", "已有文字"], "sol": "網墜是捕魚工具，加上大量魚骨，可推論當時的人從事漁撈。", "w": ["題目的遺物和種稻無關，沒有稻米或農具的證據。", "網墜是石頭做的，不能證明有鐵器。", "遺物中沒有文字。"], "parent": "看遺物的用途，推出當時的人做什麼。"}, {"id": "HI-L1-M109", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "考古文化與原住民族的區別", "diff": "中等", "type": "觀念辨識", "q": "有同學說：「卑南文化的人，就是今天的卑南族。」這個說法為什麼不恰當？", "o": ["考古文化是依遺址命名，不一定能直接對應現在的某一族", "卑南文化屬於歷史時代，不是史前時代", "卑南族不屬於臺灣原住民族", "卑南文化的人都住在臺灣北部"], "sol": "考古文化的名稱多是依遺址所在地命名，不一定能和現在的某個原住民族一對一對應。", "w": ["卑南文化沒有文字紀錄，是史前文化。", "卑南族是官方認定的原住民族之一。", "卑南遺址位在臺灣東部的臺東。"], "parent": "名字一樣不代表就是同一群人；考古文化名稱通常來自地名。"}, {"id": "HI-L1-M110", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "看待起源傳說", "diff": "中等", "type": "觀念辨識", "q": "有些原住民族流傳「祖先從石頭或高山出現」的起源傳說。下列看法何者最恰當？", "o": ["傳說反映族群的文化記憶，但不能直接當成已證實的遷徙路線", "傳說都是虛構的，沒有任何研究價值", "傳說都已經由考古證實是真的", "各族的起源傳說內容都一樣"], "sol": "起源傳說代表族群的文化記憶與信仰，很有價值；但要知道真正的遷徙歷史，還需要考古、語言等研究佐證。", "w": ["傳說能反映族群的文化和想法，有研究價值。", "傳說不等於考古證據。", "各族的起源傳說不同，例如有從高山、石頭、大地出現等。"], "parent": "傳說是寶貴的文化，但不等於證據。"}, {"id": "HI-L1-M111", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "原住民族的多樣性", "diff": "中等", "type": "觀念辨識", "q": "關於臺灣原住民族，下列敘述何者正確？", "o": ["各族有自己的語言、文化與傳統", "各族都說同一種語言", "原住民族都住在高山上", "原住民族就是史前的長濱文化人"], "sol": "臺灣原住民族包含多個族群，各族的語言、生活和傳統都不相同。", "w": ["各族的語言不同。", "原住民族分布在山地、平原、海岸、離島等不同地方。", "長濱文化是考古文化，不能直接等於現在的原住民族。"], "parent": "原住民族不是「一族」，而是很多族，各有特色。"}, {"id": "HI-L1-M112", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "工具演進的順序", "diff": "中等", "type": "排序", "q": "下列工具在臺灣出現的先後順序，何者正確？\n甲、鐵器　乙、打製石器　丙、磨製石器", "o": ["乙→丙→甲", "丙→乙→甲", "甲→丙→乙", "乙→甲→丙"], "sol": "舊石器時代用打製石器，新石器時代用磨製石器，金屬器時代用鐵器。", "w": ["先有打製（敲的），才發展出磨製（磨光的）。", "鐵器最晚出現。", "鐵器在磨製石器之後。"], "parent": "敲石頭→磨石頭→用鐵器。"}, {"id": "HI-L1-M113", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "由外來物品推論對外交流", "diff": "中等", "type": "史料判讀", "q": "十三行遺址出土了來自外地的金屬飾品、錢幣和玻璃珠。最能推論什麼？", "o": ["當時的人已經和外地有交流或交易", "當時已進入有文字的歷史時代", "當時已被荷蘭人統治", "當時的人只使用打製石器"], "sol": "外來物品出現在遺址，表示當時的人和外地有往來，可能透過交換或交易取得。", "w": ["有外來物品不代表有文字紀錄。", "十三行文化是史前文化，和 17 世紀的荷蘭人統治無關。", "十三行文化屬金屬器時代，已會使用鐵器。"], "parent": "外地的東西出現在這裡，表示有人帶來或交換來。"}, {"id": "HI-L1-M114", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "農耕帶來的生活改變", "diff": "中等", "type": "因果推論", "q": "新石器時代的人逐步發展農耕。這最可能帶來什麼改變？", "o": ["生活較穩定，較能定居並形成聚落", "必須更頻繁地遷徙", "不再需要任何工具", "開始使用鐵器"], "sol": "農作物需要照顧和等待收成，人們較能定居，逐漸形成聚落。", "w": ["農耕使人較能定居，不是更常遷徙。", "農耕需要工具，例如磨製的石鋤、石刀。", "鐵器是金屬器時代才出現。"], "parent": "種田要等收成，所以人會住下來。"}, {"id": "HI-L1-M115", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "文化與時代的配對", "diff": "中等", "type": "配對", "q": "下列史前文化與時代的配對，何者正確？", "o": ["長濱文化—舊石器時代", "卑南文化—金屬器時代", "十三行文化—舊石器時代", "大坌坑文化—金屬器時代"], "sol": "長濱文化屬舊石器時代。卑南、大坌坑屬新石器時代，十三行屬金屬器時代。", "w": ["卑南文化屬新石器時代。", "十三行文化屬金屬器時代。", "大坌坑文化屬新石器時代早期。"], "parent": "口訣：長濱舊、大坌坑和卑南新、十三行用鐵。"}, {"id": "HI-L1-M116", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "由貝塚推論飲食", "diff": "中等", "type": "史料判讀", "q": "圓山文化的貝塚中堆積了大量貝殼。這最能說明什麼？", "o": ["當時的人會採集貝類當作食物", "當時的人把貝殼當作錢幣", "貝塚是當時的墳墓", "當時的人還沒有陶器"], "sol": "貝塚是吃剩的貝殼等堆積而成，說明當時的人會採集貝類食用。", "w": ["沒有證據顯示貝殼當作錢幣使用。", "貝塚是食物殘渣的堆積，不是墳墓。", "圓山文化屬新石器時代，已有陶器。"], "parent": "貝塚像古人的廚餘堆，看得出他們吃什麼。"}, {"id": "HI-L1-M117", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "南島語族的分類依據", "diff": "中等", "type": "觀念辨識", "q": "「南島語族」主要是依據什麼來分類的？", "o": ["語言的親緣關係", "居住地的海拔高度", "宗教信仰", "使用的工具"], "sol": "南島語族是依語言之間的親緣關係所做的分類。", "w": ["分類依據是語言，不是居住的高度。", "分類依據不是宗教。", "工具是用來區分史前時代的，不是語族。"], "parent": "「語族」的「語」就是語言。"}, {"id": "HI-L1-M118", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "各地進入歷史時代的時間不同", "diff": "中等", "type": "觀念辨識", "q": "下列關於「歷史時代」的敘述，何者正確？", "o": ["不同地區開始有文字紀錄的時間不同，進入歷史時代的時間也不同", "全世界在同一年一起進入歷史時代", "只要會製作陶器，就算進入歷史時代", "臺灣是全世界最早進入歷史時代的地方"], "sol": "各地出現文字紀錄的時間不同，所以進入歷史時代的時間也不同。", "w": ["各地發展不同，不會同一年。", "陶器不等於文字。", "沒有根據說臺灣最早。"], "parent": "每個地方「開始寫下歷史」的時間不一樣。"}, {"id": "HI-L1-M119", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "民國年換算世紀", "diff": "中等", "type": "計算", "q": "民國 89 年屬於第幾世紀？", "o": ["20 世紀", "21 世紀", "19 世紀", "9 世紀"], "sol": "先換成西元：89＋1911＝2000 年。2000 年是整百年，屬於 20 世紀。", "w": ["2000 年是整百年，不加 1，仍是 20 世紀。", "2000 年不是 19 世紀。", "不能直接用民國年判斷世紀，要先換成西元。"], "parent": "先換西元，再判斷世紀；整百年不加 1。"}, {"id": "HI-L1-M120", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "生活中的紀年換算", "diff": "中等", "type": "計算", "q": "小芳在民國 103 年出生。到了西元 2026 年她過完生日後，是幾歲？", "o": ["12 歲", "11 歲", "13 歲", "103 歲"], "sol": "民國 103 年＝西元 2014 年。2026－2014＝12 歲。", "w": ["把民國 103 年換成 2015 年（多加了 1）。", "把民國 103 年換成 2013 年（少加了 1）。", "民國年不是年齡。"], "parent": "先統一紀年，再相減。"}, {"id": "HI-L1-M121", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "由墓葬推論習俗", "diff": "中等", "type": "史料判讀", "q": "卑南遺址出土大量石板棺，棺內常有玉器等陪葬品。最能推論什麼？", "o": ["當時的人有埋葬死者的習俗，並重視陪葬品", "當時的人不埋葬死者", "玉器是金屬器時代才有的東西", "這些石板棺是荷蘭人留下的"], "sol": "大量石板棺和陪葬品，可以推論當時已有埋葬習俗，並把珍貴的玉器放入棺中。", "w": ["石板棺本身就是埋葬的證據。", "卑南文化屬新石器時代，就有玉器。", "卑南文化是史前文化，比荷蘭人來臺早很多。"], "parent": "從墓葬可以看出古人怎麼對待死者。"}, {"id": "HI-L1-M122", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "史前與歷史時代的研究差異", "diff": "中等", "type": "觀念辨識", "q": "研究臺灣史前時代和研究荷蘭時期，最大的不同是什麼？", "o": ["研究荷蘭時期可以使用當時留下的文字資料", "研究史前時代的資料比較多", "研究荷蘭時期完全不需要考古", "研究史前時代可以讀當時的書信"], "sol": "荷蘭時期已有當時留下的文字資料（例如紀錄、文書），史前時代則沒有，主要靠考古。", "w": ["史前時代沒有文字資料，不能說資料比較多。", "有文字的時代仍可以使用考古資料互相補充。", "史前時代沒有文字，不會有書信。"], "parent": "有文字的時代多了一種線索，但考古也還用得上。"}, {"id": "HI-L1-M123", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "世紀的第一年", "diff": "中等", "type": "計算", "q": "第 21 世紀的第一年是西元哪一年？", "o": ["2001 年", "2000 年", "2100 年", "2101 年"], "sol": "第 21 世紀是 2001～2100 年，所以第一年是 2001 年。", "w": ["2000 年是第 20 世紀的最後一年。", "2100 年是第 21 世紀的最後一年。", "2101 年是第 22 世紀的第一年。"], "parent": "世紀從 01 年開始。"}, {"id": "HI-L1-H101", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "比較三個遺址的線索", "diff": "困難", "type": "史料判讀", "q": "根據上表，下列推論何者最合理？", "o": ["乙遺址最可能屬新石器時代，當時已開始農耕", "甲遺址已進入金屬器時代", "丙遺址的人只使用打製石器", "三個遺址一定屬於同一個族群"], "sol": "乙遺址有磨製石器、陶器和碳化稻米，是新石器時代的特徵，也顯示已有農耕。", "w": ["甲遺址只有打製石器，屬舊石器時代。", "丙遺址有鐵器和煉鐵遺跡，已進入金屬器時代。", "遺物只能推論時代和生活，不能斷定是同一個族群。"], "parent": "先看工具判斷時代，再看其他遺物推論生活；不要推過頭。", "fig": "<table class=\"fig\"><caption>三個遺址的出土情形（自編資料）</caption><tr><th>遺址</th><th>出土遺物</th></tr><tr><td>甲</td><td>打製石器、獸骨，沒有陶器</td></tr><tr><td>乙</td><td>磨製石器、陶器、碳化稻米</td></tr><tr><td>丙</td><td>鐵器、煉鐵遺跡、外來玻璃珠</td></tr></table>"}, {"id": "HI-L1-H102", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "找出不同世紀的年份", "diff": "困難", "type": "計算", "q": "下列四個年份中，哪一個和其他三個「不屬於同一個世紀」？", "o": ["1600 年", "1624 年", "1662 年", "1683 年"], "sol": "1624、1662、1683 年都在 1601～1700 年之間，屬於 17 世紀；1600 年是整百年，屬於 16 世紀。", "w": ["1624 年屬於 17 世紀。", "1662 年屬於 17 世紀。", "1683 年屬於 17 世紀。"], "parent": "整百年是上一個世紀的最後一年。"}, {"id": "HI-L1-H103", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "單一證據的推論限制", "diff": "困難", "type": "史料判讀", "q": "考古學家在一個遺址發現大量磨製石器和陶器，另外只有「一把」鐵刀。下列推論何者最恰當？", "o": ["鐵刀可能是從外地交換而來，不能只憑一把就斷定當地會煉鐵", "當地的人一定會煉鐵", "有鐵刀表示當時已有文字", "這個遺址一定屬於舊石器時代"], "sol": "大部分遺物是磨製石器和陶器，只有一把鐵刀，可能是外來的，不能直接斷定當地會煉鐵；要有煉鐵遺跡等更多證據。", "w": ["只有一把鐵刀、沒有煉鐵遺跡，不能說「一定」。", "鐵器和文字無關。", "有磨製石器和陶器，不是舊石器時代。"], "parent": "證據少的時候，結論要保守；「一定」通常太過頭。"}, {"id": "HI-L1-H104", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "世紀邊界與紀年換算", "diff": "困難", "type": "計算", "q": "某人說：「我出生在 20 世紀的最後一年。」他出生於民國幾年？", "o": ["民國 89 年", "民國 88 年", "民國 90 年", "民國 99 年"], "sol": "20 世紀是 1901～2000 年，最後一年是 2000 年。2000－1911＝民國 89 年。", "w": ["把 1999 年當成 20 世紀最後一年。", "把 2001 年當成 20 世紀最後一年。", "以為 20 世紀最後一年是 2010 年之類，換算錯誤。"], "parent": "先找出世紀的最後一年（整百年），再換成民國。"}, {"id": "HI-L1-H105", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "由地層推論時代", "diff": "困難", "type": "圖表判讀", "q": "一般來說，沒有被翻動過的地層，越下面的越早形成。根據上表，下列推論何者最合理？", "o": ["下層屬舊石器時代，上層屬金屬器時代", "上層屬舊石器時代，下層屬金屬器時代", "中層的人已經會煉鐵", "三層都屬於同一個時代"], "sol": "下層只有打製石器→舊石器時代；中層有磨製石器和陶器→新石器時代；上層有鐵器→金屬器時代。由下而上越來越晚，符合工具演進。", "w": ["上下弄反了：越下面越早。", "中層沒有鐵器，看不出會煉鐵。", "三層的工具不同，屬於不同時代。"], "parent": "題目給的規則要用上：越下面越早，再配合工具判斷時代。", "fig": "<table class=\"fig\"><caption>某遺址的地層與出土物（自編資料）</caption><tr><th>地層</th><th>出土物</th></tr><tr><td>上層</td><td>鐵器、煉鐵遺跡</td></tr><tr><td>中層</td><td>磨製石器、陶器</td></tr><tr><td>下層</td><td>打製石器</td></tr></table>"}, {"id": "HI-L1-H106", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "判斷證據是否直接", "diff": "困難", "type": "史料判讀", "q": "想證明「某地史前居民會種稻」，下列哪一項證據最直接？", "o": ["遺址中發現碳化的稻米和收割用的石刀", "遺址附近現在是一片稻田", "當地傳說祖先很會種稻", "遺址中有大量貝殼"], "sol": "碳化稻米和收割工具，是當時留下的直接證據。", "w": ["現在是稻田，不能證明史前就種稻。", "傳說有文化價值，但不是直接證據。", "貝殼說明採集貝類，和種稻無關。"], "parent": "最直接的證據，是「當時」留下、而且和問題「直接相關」的東西。"}, {"id": "HI-L1-H107", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "同一世紀且間隔超過 50 年", "diff": "困難", "type": "計算", "q": "下列哪一組年份「同屬 17 世紀」，而且「相隔超過 50 年」？", "o": ["1624 年與 1683 年", "1626 年與 1662 年", "1600 年與 1662 年", "1662 年與 1701 年"], "sol": "1624 和 1683 都在 1601～1700 年之間，屬 17 世紀，相隔 59 年。", "w": ["兩年都在 17 世紀，但只相隔 36 年。", "1600 年屬 16 世紀。", "1701 年屬 18 世紀。"], "parent": "兩個條件要一個一個檢查。"}, {"id": "HI-L1-H108", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "由玉料來源推論交流", "diff": "困難", "type": "史料判讀", "q": "卑南遺址出土許多玉器，研究發現其中不少玉料可能來自花蓮。下列推論何者最合理？", "o": ["卑南文化的人可能和其他地區有往來或交換", "卑南文化的人都住在花蓮", "卑南文化已經使用鐵器開採玉礦", "玉器都是荷蘭人帶來的"], "sol": "玉料可能來自外地，表示當時的人可能透過往來或交換取得原料。", "w": ["原料來自花蓮，不代表人都住在花蓮。", "卑南文化屬新石器時代，沒有證據顯示使用鐵器。", "卑南文化比荷蘭人來臺早很多。"], "parent": "東西的來源地和發現地不同，就表示有人移動或交換。"}, {"id": "HI-L2-E201", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "西班牙人的據點", "diff": "簡單", "type": "觀念辨識", "q": "1626 年，西班牙人在臺灣的哪裡建立據點？", "o": ["北部的雞籠（今基隆）", "南部的大員", "東部的花蓮", "澎湖"], "sol": "1626 年西班牙人占領臺灣北部的雞籠，後來也到淡水。", "w": ["大員在南部，是荷蘭人的據點。", "西班牙人沒有在花蓮建立統治據點。", "荷蘭人來臺前曾占據澎湖，不是西班牙。"], "parent": "荷蘭在南、西班牙在北。"}, {"id": "HI-L2-E202", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "荷蘭東印度公司的目的", "diff": "簡單", "type": "觀念辨識", "q": "荷蘭東印度公司來到臺灣，最主要的目的是什麼？", "o": ["經營貿易、賺取利益", "傳播佛教", "觀光旅遊", "躲避歐洲的寒冬"], "sol": "荷蘭東印度公司是商業公司，來臺灣主要是為了做生意、賺取貿易利益。", "w": ["荷蘭人信仰的是基督宗教，不是佛教。", "當時來臺不是為了觀光。", "和天氣無關，是為了貿易。"], "parent": "來臺灣不是旅行，是來做生意。"}, {"id": "HI-L2-E203", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "西班牙在雞籠的城堡", "diff": "簡單", "type": "觀念辨識", "q": "西班牙人在雞籠（今基隆和平島一帶）興建的城堡是哪一座？", "o": ["聖薩爾瓦多城", "熱蘭遮城", "億載金城", "紫禁城"], "sol": "西班牙人在雞籠興建聖薩爾瓦多城。", "w": ["熱蘭遮城是荷蘭人在大員興建的。", "億載金城是清朝時期興建的。", "紫禁城在北京，是中國皇帝的宮殿。"], "parent": "北部雞籠：西班牙的聖薩爾瓦多城；南部大員：荷蘭的熱蘭遮城。"}, {"id": "HI-L2-E204", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "迫使荷蘭人退出的勢力", "diff": "簡單", "type": "觀念辨識", "q": "1662 年迫使荷蘭人退出臺灣的是誰？", "o": ["鄭成功", "西班牙人", "清朝", "葡萄牙人"], "sol": "鄭成功在 1661 年攻臺，隔年（1662 年）荷蘭人投降退出臺灣。", "w": ["西班牙人在 1642 年就被荷蘭人趕出臺灣。", "清朝在 1683 年擊敗的是鄭氏政權。", "葡萄牙人沒有在臺灣建立統治。"], "parent": "口訣：荷逐西（1642）、鄭逐荷（1662）。"}, {"id": "HI-L2-E205", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "福爾摩沙的稱呼", "diff": "簡單", "type": "觀念辨識", "q": "「福爾摩沙」（Formosa，美麗島）這個稱呼，一般認為和哪一國的航海者有關？", "o": ["葡萄牙", "荷蘭", "西班牙", "日本"], "sol": "一般認為是葡萄牙航海者經過臺灣時，用「福爾摩沙」稱呼臺灣。", "w": ["荷蘭人後來在臺灣南部建立據點，但這個稱呼不是從荷蘭人開始。", "西班牙人後來在北部建立據點，這個稱呼不是他們開始的。", "日本人不是這個稱呼的由來。"], "parent": "葡萄牙人只是經過、取了名字，沒有在臺灣建立統治。"}, {"id": "HI-L2-E206", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "1642 年的事件", "diff": "簡單", "type": "觀念辨識", "q": "1642 年，臺灣發生了什麼事？", "o": ["荷蘭人把西班牙人趕出臺灣北部", "鄭成功攻打臺灣", "荷蘭人第一次來到大員", "清朝開始統治臺灣"], "sol": "1642 年荷蘭人北上，把西班牙人趕出臺灣北部。", "w": ["鄭成功攻臺是 1661 年。", "荷蘭人來到大員是 1624 年。", "清朝擊敗鄭氏是 1683 年。"], "parent": "1624 荷、1626 西、1642 荷逐西、1662 鄭逐荷。"}, {"id": "HI-L2-E207", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "鄭芝龍的身分", "diff": "簡單", "type": "觀念辨識", "q": "鄭芝龍在 17 世紀前期是什麼身分？", "o": ["活躍於東亞海上的海商（兼有武裝勢力）", "荷蘭東印度公司的總督", "西班牙的傳教士", "清朝的皇帝"], "sol": "鄭芝龍是活躍於臺灣和中國東南沿海一帶的海商，擁有武裝船隊。", "w": ["荷蘭東印度公司的官員是荷蘭人。", "西班牙傳教士是西班牙人。", "鄭芝龍不是皇帝。"], "parent": "鄭芝龍＝海上做生意的大商人，鄭成功的父親。"}, {"id": "HI-L2-E208", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "臺灣受重視的原因", "diff": "簡單", "type": "觀念辨識", "q": "大航海時代，臺灣受到各方勢力重視，最主要的原因是什麼？", "o": ["位在東亞海上貿易航路的重要位置", "是當時亞洲最大的工業中心", "人口是東亞最多的", "已經是世界最大的港口城市"], "sol": "臺灣位在中國、日本、東南亞之間的航路上，適合作為貿易的轉運站。", "w": ["當時臺灣沒有工業中心。", "當時臺灣人口並不多。", "當時臺灣還沒有大型港口城市。"], "parent": "臺灣的「位置」是最大的優勢。"}, {"id": "HI-L2-E209", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "西班牙在亞洲的基地", "diff": "簡單", "type": "觀念辨識", "q": "西班牙人在占領臺灣北部以前，已經在亞洲的哪裡建立殖民基地？", "o": ["菲律賓的馬尼拉", "印尼的巴達維亞", "日本的長崎", "臺灣的大員"], "sol": "西班牙人以菲律賓的馬尼拉為亞洲的重要基地。", "w": ["巴達維亞（今雅加達）是荷蘭東印度公司的基地。", "長崎是日本的港口，不是西班牙的殖民基地。", "大員是荷蘭人的據點。"], "parent": "西班牙→馬尼拉；荷蘭→巴達維亞。"}, {"id": "HI-L2-E210", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "荷蘭時期的外銷商品", "diff": "簡單", "type": "觀念辨識", "q": "荷蘭時期，臺灣出產、大量賣到日本的重要商品之一是什麼？", "o": ["鹿皮", "石油", "茶葉", "汽車"], "sol": "當時臺灣野生梅花鹿很多，鹿皮是賣到日本的重要商品。", "w": ["當時沒有開採石油出口。", "臺灣茶葉大量外銷是清朝後期的事。", "17 世紀還沒有汽車。"], "parent": "荷蘭時期：鹿皮賣日本。"}, {"id": "HI-L2-E211", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "1683 年的事件", "diff": "簡單", "type": "觀念辨識", "q": "1683 年，臺灣發生了什麼事？", "o": ["清朝擊敗鄭氏政權", "荷蘭人來到大員", "西班牙人占領雞籠", "鄭成功攻打熱蘭遮城"], "sol": "1683 年清軍擊敗鄭氏政權，鄭氏在臺灣的統治結束。", "w": ["荷蘭人來大員是 1624 年。", "西班牙人占雞籠是 1626 年。", "鄭成功攻打熱蘭遮城是 1661 年。"], "parent": "1683 是鄭氏時期結束的時間。"}, {"id": "HI-L2-E212", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "荷蘭在大員的城堡", "diff": "簡單", "type": "觀念辨識", "q": "荷蘭人在大員（今臺南安平一帶）興建的城堡是哪一座？", "o": ["熱蘭遮城", "聖薩爾瓦多城", "億載金城", "紫禁城"], "sol": "荷蘭人在大員興建熱蘭遮城。", "w": ["聖薩爾瓦多城是西班牙人在雞籠興建的。", "億載金城是清朝時期興建的。", "紫禁城在北京。"], "parent": "熱蘭遮城＝荷蘭＝南部大員。"}, {"id": "HI-L2-M201", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "勢力與據點配對", "diff": "中等", "type": "配對", "q": "下列勢力與在臺據點的配對，何者正確？", "o": ["西班牙—雞籠、淡水", "荷蘭—雞籠、淡水（1626 年起）", "西班牙—大員", "葡萄牙—大員"], "sol": "西班牙人在北部的雞籠、淡水建立據點；荷蘭人在南部的大員。", "w": ["1626 年起占雞籠、淡水的是西班牙，荷蘭要到 1642 年才取得北部。", "大員是荷蘭的據點。", "葡萄牙人沒有在臺灣建立據點。"], "parent": "荷南、西北。"}, {"id": "HI-L2-M202", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "1642 年後北部的控制者", "diff": "中等", "type": "推理", "q": "1642 年以後到 1662 年以前，臺灣北部主要由哪一個勢力控制？", "o": ["荷蘭", "西班牙", "鄭氏", "葡萄牙"], "sol": "1642 年荷蘭人趕走西班牙人，取得北部；一直到 1662 年才被鄭成功逼退。", "w": ["西班牙人在 1642 年已被趕走。", "鄭氏是 1662 年以後才取代荷蘭。", "葡萄牙人沒有統治臺灣。"], "parent": "把年代放在時間軸上看，就知道當時是誰。"}, {"id": "HI-L2-M203", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "1665 年的大員", "diff": "中等", "type": "推理", "q": "西元 1665 年時，大員一帶由哪一個勢力統治？", "o": ["鄭氏", "荷蘭", "西班牙", "清朝"], "sol": "1662 年荷蘭人退出後，由鄭氏統治，一直到 1683 年被清朝擊敗。1665 年在這段期間內。", "w": ["荷蘭人在 1662 年已退出。", "西班牙人從沒有統治大員。", "清朝在 1683 年才擊敗鄭氏。"], "parent": "1662～1683 是鄭氏時期。"}, {"id": "HI-L2-M204", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "轉口貿易的意思", "diff": "中等", "type": "觀念辨識", "q": "荷蘭人在大員經營「轉口貿易」。轉口貿易是指什麼？", "o": ["把甲地的商品運來，再轉賣到乙地", "只賣本地生產的商品", "禁止和外國做生意", "把商品全部留在本地使用"], "sol": "轉口貿易是把別處的商品運到據點，再轉賣到其他地方，賺取差價。", "w": ["只賣本地生產的，不是「轉」口。", "轉口貿易就是和外地做生意。", "轉口貿易的商品會再運出去。"], "parent": "「轉」就是轉手：從別處來，再賣到別處去。"}, {"id": "HI-L2-M205", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "荷蘭來大員以前", "diff": "中等", "type": "觀念辨識", "q": "荷蘭人在 1624 年到大員以前，曾經先占據哪裡，後來被明朝要求撤離？", "o": ["澎湖", "雞籠", "淡水", "鹿港"], "sol": "荷蘭人先占據澎湖，明朝要求他們撤離，荷蘭人便轉往大員。", "w": ["雞籠是後來西班牙人的據點。", "淡水是後來西班牙人的據點。", "鹿港和這件事無關。"], "parent": "先澎湖、後大員。"}, {"id": "HI-L2-M206", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "西班牙占北臺的原因", "diff": "中等", "type": "因果推論", "q": "西班牙人占領臺灣北部，主要考量是什麼？", "o": ["保護馬尼拉與中國、日本之間的貿易，並與荷蘭競爭", "在臺灣傳播佛教", "在臺灣開採石油", "幫助鄭成功對抗清朝"], "sol": "荷蘭人占據大員後，西班牙人擔心馬尼拉和中國、日本之間的貿易受威脅，因此北上占領臺灣北部，與荷蘭競爭。", "w": ["西班牙人信奉天主教，不是佛教。", "當時沒有開採石油。", "西班牙在 1642 年就離開了，鄭成功攻臺在 1661 年。"], "parent": "西班牙：為了貿易，也為了和荷蘭競爭。"}, {"id": "HI-L2-M207", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "鄭成功攻臺的原因", "diff": "中等", "type": "因果推論", "q": "鄭成功攻打臺灣的主要原因是什麼？", "o": ["在中國沿海對抗清朝失利，需要新的根據地", "想和荷蘭人合作做生意", "受到西班牙人的邀請", "想到臺灣開採金礦"], "sol": "鄭成功在中國沿海對抗清朝失利，需要新的據點，於是攻打荷蘭人在臺灣的據點。", "w": ["鄭成功是來攻打荷蘭人，不是合作。", "西班牙人早在 1642 年就離開臺灣了。", "攻臺的主要目的是取得根據地。"], "parent": "鄭成功需要一個新家（根據地）。"}, {"id": "HI-L2-M208", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "沒有建立統治的勢力", "diff": "中等", "type": "觀念辨識", "q": "下列哪一個勢力「沒有」在臺灣建立統治據點？", "o": ["葡萄牙", "荷蘭", "西班牙", "鄭氏"], "sol": "葡萄牙人雖然以「福爾摩沙」稱呼臺灣，但沒有在臺灣建立統治據點。", "w": ["荷蘭人在大員建立據點。", "西班牙人在雞籠、淡水建立據點。", "鄭氏在 1662 年後統治臺灣。"], "parent": "取名字不等於統治。"}, {"id": "HI-L2-M209", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "荷蘭在臺時間", "diff": "中等", "type": "計算", "q": "荷蘭人從 1624 年到 1662 年在臺灣，大約共幾年？", "o": ["38 年", "16 年", "21 年", "42 年"], "sol": "1662－1624＝38 年。", "w": ["16 年是西班牙在北部的時間（1626～1642）。", "21 年是鄭氏時期（1662～1683）。", "計算錯誤，1662－1624＝38。"], "parent": "後面的年份減前面的年份。"}, {"id": "HI-L2-M210", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "西班牙在臺時間", "diff": "中等", "type": "計算", "q": "西班牙人從 1626 年到 1642 年在臺灣北部，大約共幾年？", "o": ["16 年", "38 年", "26 年", "42 年"], "sol": "1642－1626＝16 年。", "w": ["38 年是荷蘭在臺的時間。", "計算錯誤，1642－1626＝16。", "26 是 1626 的末兩位，不是經過的年數。"], "parent": "後面的年份減前面的年份。"}, {"id": "HI-L2-M211", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "時間軸上的事件", "diff": "中等", "type": "圖表判讀", "q": "下圖時間軸上，「丙」這一年發生了什麼事？", "o": ["荷蘭人把西班牙人趕出臺灣北部", "西班牙人占領雞籠", "鄭成功使荷蘭人退出臺灣", "荷蘭人來到大員"], "sol": "丙是 1642 年，這一年荷蘭人把西班牙人趕出臺灣北部。", "w": ["西班牙人占領雞籠是乙（1626 年）。", "荷蘭人退出臺灣是丁（1662 年）。", "荷蘭人來到大員是甲（1624 年）。"], "parent": "先讀出年份，再想那一年發生的事。", "fig": "<svg class=\"fig\" viewBox=\"0 0 460 150\" role=\"img\" aria-label=\"大航海時代臺灣大事時間軸\"><title>大航海時代臺灣大事時間軸</title><line x1=\"30\" y1=\"90\" x2=\"430\" y2=\"90\" stroke=\"#13233A\" stroke-width=\"2\"/><path d=\"M430 84 L440 90 L430 96 Z\" fill=\"#13233A\"/><line x1=\"78.0\" y1=\"82\" x2=\"78.0\" y2=\"98\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"78.0\" y=\"118\" font-size=\"15\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">1624</text><text x=\"78.0\" y=\"72\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><line x1=\"94.0\" y1=\"82\" x2=\"94.0\" y2=\"98\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"94.0\" y=\"138\" font-size=\"15\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">1626</text><text x=\"94.0\" y=\"50\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><line x1=\"222.0\" y1=\"82\" x2=\"222.0\" y2=\"98\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"222.0\" y=\"118\" font-size=\"15\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">1642</text><text x=\"222.0\" y=\"72\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text><line x1=\"382.0\" y1=\"82\" x2=\"382.0\" y2=\"98\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"382.0\" y=\"138\" font-size=\"15\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">1662</text><text x=\"382.0\" y=\"50\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丁</text></svg>"}, {"id": "HI-L2-M212", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "由地點推論國籍", "diff": "中等", "type": "推理", "q": "1630 年，一位在淡水傳教的歐洲傳教士，最可能是哪一國人？", "o": ["西班牙", "荷蘭", "葡萄牙", "英國"], "sol": "1630 年時，臺灣北部的雞籠、淡水由西班牙人控制，所以最可能是西班牙傳教士。", "w": ["1630 年荷蘭人在南部，1642 年後才到北部。", "葡萄牙人沒有在臺灣建立據點。", "英國人不是這個時期在臺灣北部的勢力。"], "parent": "先看「時間」，再看「地點」，就知道是哪個勢力。"}, {"id": "HI-L2-M213", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "鄭芝龍與鄭成功的關係", "diff": "中等", "type": "觀念辨識", "q": "鄭芝龍和鄭成功是什麼關係？", "o": ["父子", "兄弟", "祖孫", "敵人"], "sol": "鄭芝龍是鄭成功的父親。", "w": ["兩人是父子，不是兄弟。", "兩人是父子，不是祖孫。", "兩人是家人，不是敵人。"], "parent": "鄭芝龍（爸爸）是海商，鄭成功（兒子）後來攻臺。"}, {"id": "HI-L2-M214", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "荷蘭時期的外銷商品", "diff": "中等", "type": "觀念辨識", "q": "荷蘭時期，臺灣生產並外銷的重要商品，除了鹿皮之外，還有下列哪一項？", "o": ["蔗糖", "茶葉", "樟腦", "石油"], "sol": "荷蘭時期，鹿皮與蔗糖都是臺灣重要的外銷商品。", "w": ["茶葉大量外銷是清朝後期的事。", "樟腦大量外銷也是清朝後期的事。", "當時沒有開採石油出口。"], "parent": "荷蘭時期：鹿皮、蔗糖；茶、糖、樟腦三寶是更晚的清朝。"}, {"id": "HI-L2-M215", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "臺灣成為競爭舞臺的原因", "diff": "中等", "type": "因果推論", "q": "為什麼說 17 世紀的臺灣成為各方勢力「競逐」的舞臺？", "o": ["多個勢力為了貿易利益，先後在臺灣建立據點並互相競爭", "臺灣當時是各國共同管理的殖民地", "臺灣當時是獨立國家，邀請各國來投資", "各國在臺灣合作開發，沒有衝突"], "sol": "荷蘭、西班牙、鄭氏等勢力，為了貿易或據點先後來到臺灣，彼此競爭，甚至發生戰爭。", "w": ["各勢力是互相競爭，不是共同管理。", "當時臺灣不是獨立國家。", "荷蘭與西班牙、鄭成功與荷蘭都發生過戰爭。"], "parent": "「競逐」就是大家搶同一個好位置。"}, {"id": "HI-L2-M216", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "鄭氏時期的結束", "diff": "中等", "type": "觀念辨識", "q": "鄭氏政權在臺灣的統治在哪一年結束？被誰擊敗？", "o": ["1683 年，清朝", "1662 年，荷蘭", "1642 年，西班牙", "1683 年，荷蘭"], "sol": "1683 年清軍擊敗鄭氏，鄭氏在臺灣的統治結束。", "w": ["1662 年是荷蘭人退出、鄭氏開始統治的年份。", "1642 年是荷蘭趕走西班牙。", "年份對，但擊敗鄭氏的是清朝，荷蘭早已離開。"], "parent": "1662 鄭氏開始，1683 鄭氏結束。"}, {"id": "HI-L2-M217", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "荷西同時在臺的期間", "diff": "中等", "type": "推理", "q": "荷蘭人和西班牙人「同時」在臺灣設有據點的期間是哪一段？", "o": ["1626～1642 年", "1624～1662 年", "1642～1662 年", "1662～1683 年"], "sol": "荷蘭 1624 年來，西班牙 1626 年來；1642 年西班牙被趕走。所以兩者同時在臺的期間是 1626～1642 年。", "w": ["1624～1626 年西班牙還沒來，1642 年後西班牙已離開。", "1642 年後只剩荷蘭。", "1662～1683 年是鄭氏時期。"], "parent": "畫兩條時間線，重疊的部分就是同時存在。"}, {"id": "HI-L2-M218", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "勢力活動的世紀", "diff": "中等", "type": "計算", "q": "荷蘭、西班牙、鄭氏在臺灣的活動，主要發生在第幾世紀？", "o": ["17 世紀", "16 世紀", "18 世紀", "15 世紀"], "sol": "1624～1683 年都在 1601～1700 年之間，屬於 17 世紀。", "w": ["16 世紀是 1501～1600 年。", "18 世紀是 1701～1800 年。", "15 世紀是 1401～1500 年。"], "parent": "16xx 年（不含 1600 年）都屬於 17 世紀。"}, {"id": "HI-L2-M219", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "大員據點的地理優勢", "diff": "中等", "type": "因果推論", "q": "荷蘭人選擇臺灣西南部的大員作為據點，最主要的好處是什麼？", "o": ["位在西南沿海，方便和中國沿海、日本等地進行貿易", "位於高山上，方便防守", "位在東部，方便到美洲", "附近有大量石油可以開採"], "sol": "大員在西南沿海，靠近中國東南沿海，又在通往日本、東南亞的航路上，方便貿易。", "w": ["大員在海邊，不在高山上。", "大員在臺灣西南部，不在東部。", "當時沒有開採石油。"], "parent": "做貿易的據點要靠海、靠航路。"}, {"id": "HI-L2-M220", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "西班牙的兩個據點", "diff": "中等", "type": "觀念辨識", "q": "西班牙人在臺灣北部的據點，包括下列哪兩個地方？", "o": ["雞籠與淡水", "大員與赤崁", "澎湖與金門", "花蓮與臺東"], "sol": "西班牙人先占雞籠（今基隆），後來也到淡水。", "w": ["大員、赤崁在南部，是荷蘭人的勢力範圍。", "澎湖、金門不是西班牙的據點。", "西班牙沒有在東部建立據點。"], "parent": "西班牙在北：雞籠、淡水。"}, {"id": "HI-L2-M221", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "鄭成功的對手", "diff": "中等", "type": "推理", "q": "1661 年鄭成功率軍來臺時，臺灣西南部是由誰控制？", "o": ["荷蘭", "西班牙", "清朝", "葡萄牙"], "sol": "1661 年時，臺灣西南部的大員一帶由荷蘭人控制，鄭成功攻打的是荷蘭人。", "w": ["西班牙人在 1642 年已離開。", "清朝在 1683 年才擊敗鄭氏。", "葡萄牙人沒有統治臺灣。"], "parent": "鄭逐荷：鄭成功的對手是荷蘭。"}, {"id": "HI-L2-M222", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "鄭芝龍的活動範圍", "diff": "中等", "type": "觀念辨識", "q": "鄭芝龍的海上勢力，主要活躍在哪些地區之間？", "o": ["臺灣與中國東南沿海的海域", "歐洲與美洲之間", "臺灣東部山區", "中亞的沙漠"], "sol": "鄭芝龍活躍於東亞海上，尤其是臺灣與中國東南沿海之間。", "w": ["歐洲與美洲之間不是他的活動範圍。", "他是海上勢力，不在山區。", "沙漠和海上勢力無關。"], "parent": "海商就是在海上做生意的人。"}, {"id": "HI-L2-M223", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "日本商人在 1640 年的交易對象", "diff": "中等", "type": "推理", "q": "1640 年，一位日本商人到大員買鹿皮，他最可能和哪一方交易？", "o": ["荷蘭東印度公司", "西班牙人", "鄭氏政權", "清朝官員"], "sol": "1640 年的大員由荷蘭人控制，鹿皮貿易也由荷蘭東印度公司經營。", "w": ["西班牙人在北部，不在大員。", "鄭氏要到 1662 年才統治臺灣。", "清朝在 1683 年後才統治臺灣。"], "parent": "先確認時間與地點，再找當時的掌控者。"}, {"id": "HI-L2-H201", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "時間與地點的雙重判斷", "diff": "困難", "type": "推理", "q": "下列四個「時間＋地點」，哪一個當時是由荷蘭人控制？", "o": ["1650 年的雞籠", "1630 年的淡水", "1670 年的大員", "1620 年的大員"], "sol": "1642 年荷蘭人趕走西班牙人，取得北部，所以 1650 年的雞籠由荷蘭控制。", "w": ["1630 年的淡水由西班牙控制。", "1670 年的大員已由鄭氏統治。", "1620 年荷蘭人還沒來到大員（1624 年才來）。"], "parent": "每個選項都要同時看「年份」和「地點」，在時間軸上找。"}, {"id": "HI-L2-H202", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "由史料推論作者與年代", "diff": "困難", "type": "史料判讀", "q": "根據上面這段自編的紀錄，寫這段話的最可能是哪一方？大約是哪一年？", "o": ["荷蘭東印度公司，1642 年", "西班牙人，1626 年", "鄭成功的部下，1662 年", "荷蘭東印度公司，1624 年"], "sol": "紀錄說「把北邊的西班牙人趕走了」，又說「我們在大員」，是荷蘭人的口吻；荷蘭趕走西班牙是 1642 年。", "w": ["西班牙人不會說「把西班牙人趕走」。", "鄭成功趕走的是荷蘭人，不是西班牙人。", "1624 年荷蘭人剛來大員，還沒和西班牙交戰。"], "parent": "從「我們」在哪裡、「趕走誰」找出說話的人和年份。", "fig": "<div class=\"fig passage\"><p>「我們從大員派出的船隊已經北上，把北邊的西班牙人趕走了。從今以後，北部的雞籠、淡水也歸我們管理。」</p><p style=\"font-size:.85em;color:#55667B\">（自編史料）</p></div>"}, {"id": "HI-L2-H203", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "因果事件排序", "diff": "困難", "type": "排序", "q": "下列事件依因果先後排列，何者正確？\n甲、荷蘭人投降，退出臺灣\n乙、鄭成功在中國沿海對抗清朝失利\n丙、鄭成功率軍渡海攻打大員\n丁、清軍擊敗鄭氏政權", "o": ["乙→丙→甲→丁", "丙→乙→甲→丁", "乙→甲→丙→丁", "甲→乙→丙→丁"], "sol": "先有鄭成功抗清失利（原因），才渡海攻打大員（行動），荷蘭人因此退出（結果）；最後 1683 年清軍擊敗鄭氏。", "w": ["先失利需要據點，才會渡海攻臺。", "荷蘭人退出是被攻打以後的結果。", "荷蘭退出不會發生在鄭成功攻臺之前。"], "parent": "用「原因→行動→結果」排順序。"}, {"id": "HI-L2-H204", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "時段內的正確敘述", "diff": "困難", "type": "推理", "q": "關於 1624～1662 年間的臺灣，下列敘述何者正確？", "o": ["這段期間荷蘭人一直在臺灣南部活動", "這段期間西班牙人一直控制臺灣北部", "鄭成功在 1624 年就已經攻打臺灣", "清朝在這段期間統治臺灣西部"], "sol": "荷蘭人 1624 年來到大員，1662 年才退出，整段期間都在南部。", "w": ["西班牙人 1626 年才來，1642 年就被趕走，不是整段期間。", "鄭成功是 1661 年才攻臺。", "清朝是 1683 年以後才統治臺灣。"], "parent": "題目問的是一整段時間，要檢查「整段」都成立嗎。"}, {"id": "HI-L2-H205", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "兩段統治時間的比較", "diff": "困難", "type": "計算", "q": "荷蘭人在臺灣的時間（1624～1662 年），比西班牙人在臺灣北部的時間（1626～1642 年）多幾年？", "o": ["22 年", "38 年", "16 年", "2 年"], "sol": "荷蘭：1662－1624＝38 年；西班牙：1642－1626＝16 年。38－16＝22 年。", "w": ["38 年只是荷蘭在臺的時間。", "16 年只是西班牙在臺的時間。", "只算了兩國來臺時間的差（1626－1624）。"], "parent": "先各自算出時間，再相減。"}, {"id": "HI-L2-H206", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "考慮史料的立場", "diff": "困難", "type": "史料判讀", "q": "荷蘭東印度公司的紀錄寫著：「當地人都很歡迎我們。」研究歷史時，看待這句話最恰當的態度是什麼？", "o": ["要考慮記錄者的立場，最好和其他資料互相比對", "這是當時的紀錄，一定完全正確", "這是外國人寫的，一定是假的", "史料沒有用，不需要閱讀"], "sol": "史料可能受記錄者立場影響。荷蘭人寫自己的事，可能偏向對自己有利，應和其他資料比對。", "w": ["當時的紀錄也可能有偏見，不一定完全正確。", "不能只因作者是外國人就說一定是假的。", "史料很重要，但要小心判讀。"], "parent": "看史料先問：誰寫的？為什麼寫？有沒有其他資料可以對照？"}, {"id": "HI-L2-H207", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "人物與行動配對", "diff": "困難", "type": "配對", "q": "請將人物或勢力與行動配對：\n甲、鄭芝龍　乙、鄭成功　丙、荷蘭東印度公司\n1、在大員興建城堡，經營轉口貿易\n2、活躍於東亞海上，招募漢人到臺灣開墾\n3、自中國沿海渡海攻臺，迫使荷蘭人退出\n下列配對何者正確？", "o": ["甲2、乙3、丙1", "甲3、乙2、丙1", "甲1、乙3、丙2", "甲2、乙1、丙3"], "sol": "鄭芝龍是海商，曾招募漢人來臺開墾；鄭成功渡海攻臺；荷蘭東印度公司在大員建城、經營貿易。", "w": ["攻臺的是鄭成功，不是他的父親鄭芝龍。", "在大員建城堡的是荷蘭人。", "鄭成功是來攻打大員，不是興建城堡。"], "parent": "父子兩人：爸爸做生意，兒子打仗攻臺。"}, {"id": "HI-L2-H208", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "17 世紀前半的事件", "diff": "困難", "type": "推理", "q": "下列事件中，哪一個發生在 17 世紀的「前半」（1601～1650 年）？", "o": ["荷蘭人趕走西班牙人", "鄭成功攻打臺灣", "荷蘭人退出臺灣", "清軍擊敗鄭氏政權"], "sol": "荷蘭人趕走西班牙人是 1642 年，在 1601～1650 年之間。", "w": ["鄭成功攻臺是 1661 年，屬 17 世紀後半。", "荷蘭退出是 1662 年，屬後半。", "清軍擊敗鄭氏是 1683 年，屬後半。"], "parent": "先把每個事件的年份想出來，再判斷是否在範圍內。"}, {"id": "CI-L1-E101", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "不因成績貶低他人", "diff": "簡單", "type": "情境判斷", "q": "小華數學考不好，有同學在班上大聲取笑他「笨蛋」。這種行為最違反哪一個觀念？", "o": ["尊重人性尊嚴", "遵守交通規則", "保護環境", "節約能源"], "sol": "每個人都有不可被任意貶低的價值，不能因為成績不好就羞辱別人，這違反尊重人性尊嚴。", "w": ["這件事和交通規則無關。", "這件事和環保無關。", "這件事和節約能源無關。"], "parent": "成績好不好，都不能被羞辱，因為每個人都值得被尊重。"}, {"id": "CI-L1-E102", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "人權的意義", "diff": "簡單", "type": "觀念辨識", "q": "「人權」指的是什麼？", "o": ["每個人因為身為人，就享有的基本權利", "只有年滿十八歲的成年人才能享有的權利", "只有繳得起稅的有錢人才能享有的權利", "由班長或老師決定可以給誰的權利"], "sol": "人權是每個人因為身為人就應享有的基本權利，不需要先有錢、成年或別人給予。", "w": ["人權不分年齡，兒童也享有。", "人權不分貧富。", "人權不是由某個人決定給誰。"], "parent": "只要是人，就有人權。"}, {"id": "CI-L1-E103", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "人權不因身分消失", "diff": "簡單", "type": "情境判斷", "q": "班上來了一位轉學生，有同學說：「他是新來的，排座位、分組都讓他最後選就好。」從人權的觀點，這種想法有什麼問題？", "o": ["轉學生也應該被公平對待", "轉學生剛來，本來就應該排在最後面選", "班上的老同學比較早來，所以權利比較多", "轉學生應該先表現好，證明自己以後才有權利"], "sol": "人權具有普遍性，不因身分、背景不同而消失；轉學生也應被公平對待。", "w": ["不能因為是新來的就給不公平的對待。", "權利不是老同學才有。", "人權不需要先證明才能擁有。"], "parent": "新同學和老同學，一樣值得被公平對待。"}, {"id": "CI-L1-E104", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "保障人權的制度", "diff": "簡單", "type": "觀念辨識", "q": "國家主要透過什麼方式來保障人民的權利？", "o": ["制定憲法、法律等制度", "讓人民自己用武力保護自己", "只靠每個人的運氣", "由鄰居決定誰的權利比較重要"], "sol": "國家以憲法、法律等制度保障權利，權利受到侵害時可依程序尋求救濟。", "w": ["用武力自己解決不是保障權利的正當方式。", "權利保障不能只靠運氣。", "權利不是由鄰居決定。"], "parent": "權利要有制度（法律）保護，才不會被隨便拿走。"}, {"id": "CI-L1-E105", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "權利的界線", "diff": "簡單", "type": "觀念辨識", "q": "關於「權利」，下列敘述何者正確？", "o": ["行使自己的權利時，也要尊重別人的權利", "有了權利就可以做任何想做的事", "權利只有自己有，別人沒有", "只要說是開玩笑，就不算侵害別人的權利"], "sol": "權利有界線，行使自己的權利時，不能侵害他人的權利。", "w": ["權利有界線，不能想做什麼就做什麼。", "每個人都有權利。", "開玩笑也可能傷害別人、侵害別人的權利。"], "parent": "我的自由，不能踩到別人的權利。"}, {"id": "CI-L1-E106", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "尊重隱私", "diff": "簡單", "type": "情境判斷", "q": "小美不想被拍照上傳到網路，但同學說「只是開玩笑」，還是上傳了。這種行為主要侵害了小美的什麼？", "o": ["隱私與自主決定的權利", "參加社團的權利", "選舉的權利", "擁有財產的權利"], "sol": "未經同意把別人的照片公開，可能侵害他的隱私，也沒有尊重他自己決定的權利。", "w": ["這件事和參加社團無關。", "這件事和選舉無關。", "這件事和財產無關。"], "parent": "別人的照片要先問：「可以上傳嗎？」"}, {"id": "CI-L1-E107", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "權利受侵害時的做法", "diff": "簡單", "type": "情境判斷", "q": "小安在網路上被同學惡意散播謠言。下列哪一個做法最恰當？", "o": ["保留證據，向師長或可信任的單位反映", "也去散播對方的謠言報復", "刪掉所有證據，假裝沒發生", "私下找人去打對方"], "sol": "權利受侵害時，應保留證據，向師長或可信任的單位反映，依正當程序處理。", "w": ["報復會讓事情更嚴重，也可能侵害別人的權利。", "刪掉證據會讓事情更難處理。", "用暴力解決是不正當的，也可能觸法。"], "parent": "被欺負時：先存證據，再找大人幫忙。"}, {"id": "CI-L1-E108", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "受教育的權利", "diff": "簡單", "type": "觀念辨識", "q": "每個孩子都可以到學校上課學習，這主要和哪一種權利有關？", "o": ["受教育的權利", "開車的權利", "投票的權利", "經營公司的權利"], "sol": "讓每個孩子都能接受教育，是受教育權的保障。", "w": ["開車有年齡等限制，和上學無關。", "投票是參與選舉的權利，和上學無關。", "經營公司和上學無關。"], "parent": "上學學習是每個孩子的權利。"}, {"id": "CI-L1-E109", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "人性尊嚴的平等", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一句話最符合「人性尊嚴」的觀念？", "o": ["每個人都值得被尊重，不看外表、成績或家境", "表現好、成績好的人，才值得被大家尊重", "家裡比較有錢的人，比較值得被大家尊重", "長得好看、受歡迎的人，比較值得被尊重"], "sol": "每個人都有同等的人格價值，不因外表、成績或家庭背景而不同。", "w": ["尊重不是看表現才給。", "尊重不看貧富。", "尊重不看外表。"], "parent": "尊重每個人，不需要條件。"}, {"id": "CI-L1-E110", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "政府照顧弱勢", "diff": "簡單", "type": "觀念辨識", "q": "政府為經濟困難的學生提供午餐補助。這種做法主要的目的是什麼？", "o": ["保障學生的基本生活，維護人性尊嚴", "讓領補助的學生以後可以不用念書", "讓學校可以向政府多申請一些收入", "讓學生吃飽以後，考試成績一定會變好"], "sol": "提供基本生活協助，可以讓弱勢學生安心學習，維護人性尊嚴。", "w": ["補助午餐是讓學生能好好學習，不是不用念書。", "補助是政府花錢，不是增加學校收入。", "補助的目的是保障基本生活。"], "parent": "先讓每個人吃得飽，才能好好學習。"}, {"id": "CI-L1-E111", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "言論自由的界線", "diff": "簡單", "type": "情境判斷", "q": "小明在班級群組裡造謠，說某位同學偷東西。下列敘述何者正確？", "o": ["發言有自由，但造謠傷人就越界了", "在班級群組裡說話是自由，說什麼都沒關係", "只要不是當面說，在網路上說就不算傷害", "造謠也是表達意見，應該受到言論自由保護"], "sol": "表達意見是自由，但造謠會傷害別人的名譽，超過了權利的界線。", "w": ["群組發言也要尊重別人。", "網路上說的話一樣會傷害人。", "造謠傷害他人，不受言論自由保護。"], "parent": "說話自由，但不能說謊害人。"}, {"id": "CI-L1-E112", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "規範的作用", "diff": "簡單", "type": "觀念辨識", "q": "班上規定「上課發言要先舉手」。這項規範主要的作用是什麼？", "o": ["維持秩序，讓每個人都有機會發言", "限制大家上課時不准說話，保持安靜", "讓老師可以找到理由處罰不舉手的學生", "讓反應最快、最常舉手的人可以一直發言"], "sol": "合理的規範可以維持秩序，保護每個人的權利，例如讓每個人都有機會發言。", "w": ["規定是要大家輪流說，不是不准說話。", "規範的目的不是處罰。", "先舉手反而讓更多人有機會發言。"], "parent": "好的規範，是為了保護大家的權利。"}, {"id": "CI-L1-E113", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "人權的普遍性", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一個例子最能說明人權的「普遍性」？", "o": ["不論男女、國籍或出身，每個人都享有", "只有具有本國國籍的人才能享有人權", "只有成年人才享有人權，兒童要長大才有", "只有遵守規矩、表現良好的人才享有人權"], "sol": "普遍性是指每個人都享有人權，不因性別、國籍、身分、出生背景而不同。", "w": ["外國人也有基本人權。", "兒童也有人權。", "人權不是表現好才有。"], "parent": "「普遍」＝每個人都有。"}, {"id": "CI-L1-M101", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "合理差別待遇的判斷", "diff": "中等", "type": "情境判斷", "q": "下列哪一種「差別待遇」最可能是合理的？", "o": ["腳受傷的同學可以搭電梯，不用跑操場", "成績差的同學不准參加校外教學", "家境不好的同學不能參加班級活動", "新來的同學打掃最髒的地方"], "sol": "腳受傷的同學需要協助，讓他搭電梯、不跑操場，是有正當理由的合理差別待遇，能讓他也好好上學。", "w": ["成績和校外教學沒有合理的關聯。", "因家境排除，可能是不合理的差別待遇。", "只因為是新同學就分配最髒的工作，沒有正當理由。"], "parent": "判斷差別待遇：有沒有正當、合理的理由。"}, {"id": "CI-L1-M102", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "公平不等於完全相同", "diff": "中等", "type": "觀念辨識", "q": "有同學說：「公平就是每個人都要被一模一樣地對待。」下列哪一個例子最能說明這句話不完全正確？", "o": ["視障同學考試時使用放大字體的試卷", "全班都用同一份試卷考試", "每個人分到一樣多的作業", "全班一起排隊領午餐"], "sol": "視障同學需要放大字體才能和大家一樣作答。給予合理協助，才能讓他真正享有平等的機會。", "w": ["這是完全相同的對待，不能說明這句話有問題。", "這也是相同的對待。", "這也是相同的對待。"], "parent": "公平有時要「多幫一點」，讓大家站在同一條起跑線。"}, {"id": "CI-L1-M103", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "規範是否合理的判斷", "diff": "中等", "type": "情境判斷", "q": "判斷一項班級規定是否合理，下列哪一組標準最恰當？", "o": ["目的是否正當、方式是否合理、是否公平適用", "是否讓班長和幹部管理起來最方便、最省事", "規定是否最嚴格，越嚴格越能讓大家遵守", "是否和別班的規定一模一樣，沒有任何不同"], "sol": "合理的規範要有正當目的、合理的方式，並且公平地適用在每個人身上。", "w": ["規範不是為了某個人方便。", "越嚴格不一定越合理。", "和別班一樣不代表合理。"], "parent": "問三個問題：為什麼要這樣規定？方式合理嗎？對大家都一樣嗎？"}, {"id": "CI-L1-M104", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "不合理的差別待遇", "diff": "中等", "type": "情境判斷", "q": "某社團規定：「家裡沒有汽車的同學，不能參加。」這項規定最可能有什麼問題？", "o": ["用和社團無關的條件排除同學，不合理", "社團可以自己決定規定，所以這樣很合理", "這是為了確保同學參加活動時的交通安全", "這是在照顧家裡沒有汽車的弱勢同學"], "sol": "家裡有沒有汽車和參加社團沒有合理關聯，用這個條件排除同學，是不合理的差別待遇。", "w": ["社團可以訂規定，但要有合理的理由。", "規定中看不出和安全有關。", "這項規定反而排除了某些同學，不是照顧。"], "parent": "問：這個條件和要做的事有關嗎？無關就不合理。"}, {"id": "CI-L1-M105", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "經濟困難與受教權", "diff": "中等", "type": "情境判斷", "q": "學校因為某位學生家裡經濟困難，就禁止他參加必修的戶外課程。下列評論何者最恰當？", "o": ["可能是不平等的對待，學校應該提供協助", "家裡沒錢本來就無法負擔，不能參加很合理", "學生應該自己想辦法籌錢，和學校無關", "這是為了避免學生被同學發現家境而保護他"], "sol": "必修課程是學習的一部分，因家境排除學生，可能侵害他的受教權；學校應設法協助。", "w": ["因經濟困難就排除，不是合理的理由。", "學校有責任保障學生的學習機會。", "排除不是保護，是剝奪學習機會。"], "parent": "有困難的人需要的是幫忙，不是被排除。"}, {"id": "CI-L1-M106", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "尊重差異", "diff": "中等", "type": "觀念辨識", "q": "「尊重差異」的意思，最接近下列哪一個？", "o": ["理解每個人不同，但人格價值同樣重要", "要求每個人都改成一樣，才不會有衝突", "和自己想法不一樣的人，最好不要往來", "只有多數人的想法和習慣才值得尊重"], "sol": "尊重差異是理解每個人的情況、想法不同，但每個人的人格價值是相同的。", "w": ["尊重差異不是要大家變得一樣。", "不同的人也應該被尊重、互相往來。", "少數人的想法也值得尊重。"], "parent": "每個人不一樣，但一樣重要。"}, {"id": "CI-L1-M107", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "公開資訊與人性尊嚴", "diff": "中等", "type": "情境判斷", "q": "老師把全班的考試成績連同姓名貼在教室外面的公布欄。下列評論何者最恰當？", "o": ["公開個人成績可能讓同學被嘲笑，應考量隱私與尊嚴", "公開成績可以激勵所有人，完全沒有問題", "成績是老師的，老師想怎麼公布都可以", "只要成績好的同學不介意就可以"], "sol": "公開個人成績可能讓表現不好的同學被取笑，應考慮隱私與人性尊嚴，改用較尊重的方式。", "w": ["激勵的目的不能忽略可能造成的傷害。", "成績是學生的個人資料。", "要考慮的是所有同學，不只成績好的人。"], "parent": "想鼓勵別人，也要用不傷人的方式。"}, {"id": "CI-L1-M108", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "保障基本生活的例子", "diff": "中等", "type": "觀念辨識", "q": "下列哪一項最符合「政府提供基本生活保障」？", "o": ["為失業的人提供職業訓練與補助", "在跨年夜舉辦大型的煙火晚會", "規定全國國中的上課時間", "在車多的路口設置紅綠燈"], "sol": "為失業者提供職業訓練與補助，是幫助人們維持基本生活。", "w": ["煙火晚會是娛樂活動，不是基本生活保障。", "上課時間是教育制度的安排。", "紅綠燈是交通安全措施。"], "parent": "基本生活保障＝幫人有飯吃、有工作、能生活。"}, {"id": "CI-L1-M109", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "開玩笑與尊重", "diff": "中等", "type": "情境判斷", "q": "小傑常常模仿一位口吃同學說話，還說：「我只是開玩笑，大家都覺得好笑。」下列評論何者最恰當？", "o": ["讓對方難堪的玩笑就是不尊重，應停止", "大家都覺得好笑，表示這個玩笑沒有問題", "口吃的同學應該學會接受別人的玩笑", "只要沒有動手打人，就不算是傷害別人"], "sol": "玩笑讓對方難堪，就是不尊重對方的人格，應該停止。", "w": ["多數人覺得好笑，不代表當事人不受傷。", "不能要求被嘲笑的人忍耐。", "言語也會造成傷害。"], "parent": "好笑不好笑，要看被開玩笑的人有沒有受傷。"}, {"id": "CI-L1-M110", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "權利的衝突", "diff": "中等", "type": "情境判斷", "q": "小芸半夜在家大聲唱歌，說：「這是我的自由。」鄰居被吵得睡不著。下列評論何者最恰當？", "o": ["唱歌是自由，但影響別人休息就要調整", "在自己家裡，想做什麼都是自己的自由", "鄰居嫌吵，應該自己戴耳塞或關緊窗戶", "只要白天不唱，晚上唱就不會影響別人"], "sol": "行使自由時不能妨礙別人的權利（例如休息），應該調整音量或時間。", "w": ["在家也要顧及別人的權利。", "不能要求別人承擔自己造成的影響。", "半夜大聲唱歌，更容易影響別人休息。"], "parent": "我的自由，到別人的權利為止。"}, {"id": "CI-L1-M111", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "向正確管道求助", "diff": "中等", "type": "情境判斷", "q": "小柔發現有人在網路上冒用她的名字發文。下列做法何者最恰當？", "o": ["截圖存證，告訴家長或師長，再走正式管道處理", "馬上在網路上回罵對方，讓大家知道是假的", "把自己的帳號刪掉，當作這件事沒有發生過", "也去冒用對方的名字發文，讓他知道感受"], "sol": "權利受侵害時，應保留證據，向家長、師長求助，並透過正當管道處理。", "w": ["回罵可能讓衝突擴大。", "刪掉不能解決問題，證據也可能消失。", "以牙還牙也是侵害別人的權利。"], "parent": "遇到問題：存證據→找大人→走正確管道。"}, {"id": "CI-L1-M112", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "合理協助的例子", "diff": "中等", "type": "情境判斷", "q": "下列哪一種做法，是為了讓弱勢者能平等參與而提供的合理協助？", "o": ["學校在樓梯旁設置無障礙坡道", "學校只讓成績好的人使用圖書館", "學校讓高年級先用操場", "學校只讓男生參加科展"], "sol": "無障礙坡道讓行動不便的人也能進出，是讓他們能平等參與的合理協助。", "w": ["依成績限制使用圖書館，沒有合理理由。", "依年級決定先後，和協助弱勢無關。", "只讓男生參加科展是性別歧視。"], "parent": "合理協助：幫有需要的人，讓他也能參加。"}, {"id": "CI-L1-M113", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "隱私與網路分享", "diff": "中等", "type": "情境判斷", "q": "小凱把同學在更衣的照片傳到群組裡，說「大家看看而已」。這最可能侵害了同學的什麼？", "o": ["隱私與人格尊嚴", "言論自由", "財產權", "受教育的權利"], "sol": "未經同意散播他人私密照片，侵害他人的隱私與人格尊嚴。", "w": ["被侵害的不是言論自由。", "這和財產無關。", "這和受教育無關。"], "parent": "別人的私密照片，絕對不能傳。"}, {"id": "CI-L1-M114", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "人權需要制度保障", "diff": "中等", "type": "觀念辨識", "q": "為什麼人權需要用法律等制度來保障？", "o": ["讓權利受侵害時，有程序可以尋求救濟", "因為有了法律，每個人都可以變得比較有錢", "因為只有法律有寫到的人，才享有人權", "因為有了法律制度，就不再需要任何道德"], "sol": "有了法律制度，權利受到侵害時，就有明確的方式和程序可以尋求協助與救濟。", "w": ["法律保障權利，不是讓人變有錢。", "人權是每個人都有的，法律是保障它。", "法律不能取代所有的道德。"], "parent": "法律就像防護網，權利被侵害時可以依靠。"}, {"id": "CI-L1-M115", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "尊重身心障礙者", "diff": "中等", "type": "情境判斷", "q": "班上有一位使用輪椅的同學。分組時，有同學說：「他動作慢，不要跟他同一組。」下列回應何者最恰當？", "o": ["大家應平等對待他，一起調整分工", "他動作確實比較慢，分到別組對大家都好", "讓他自己一組，就不會影響其他人的進度", "請老師讓他不用參加分組，比較不會累"], "sol": "使用輪椅不影響他的人格價值；可以依每個人的能力調整分工，讓大家一起參與。", "w": ["不能只因為行動不便就排除他。", "把他單獨排除，是不平等的對待。", "不參加分組，等於剝奪他學習的機會。"], "parent": "調整方法，讓每個人都能參加。"}, {"id": "CI-L1-M116", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "權利與責任", "diff": "中等", "type": "觀念辨識", "q": "學校圖書館規定「借書要按時歸還」。這項規定和權利有什麼關係？", "o": ["有借書的權利，也有按時歸還的責任", "借書是我的權利，所以想什麼時候還都可以", "這項規定限制了借書的權利，所以不合理", "只有圖書館員有權利決定書怎麼借、怎麼還"], "sol": "享有權利的同時，也要負起責任，尊重別人同樣使用的權利。", "w": ["借書的權利不包含不還書。", "按時歸還是讓更多人都能借到，規定合理。", "每位同學都有借書的權利。"], "parent": "有權利，也有責任。"}, {"id": "CI-L1-M117", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "貶低他人的言語", "diff": "中等", "type": "情境判斷", "q": "下列哪一句話最可能傷害他人的人性尊嚴？", "o": ["「你家那麼窮，不配跟我們一起玩。」", "「這題我不會，可以教我嗎？」", "「我覺得這個意見可以再討論。」", "「謝謝你幫我撿東西。」"], "sol": "因家庭經濟狀況貶低他人，否定了他的人格價值，傷害人性尊嚴。", "w": ["請教別人是尊重的表現。", "對意見提出討論，沒有貶低人。", "道謝是尊重的表現。"], "parent": "可以不同意意見，但不能看不起人。"}, {"id": "CI-L1-M118", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "受教權的保障", "diff": "中等", "type": "情境判斷", "q": "某位同學因為長期住院，學校安排老師到醫院為他上課。這主要保障了他的什麼權利？", "o": ["受教育的權利", "投票的權利", "言論自由", "財產權"], "sol": "讓長期住院的學生也能繼續學習，是保障受教育的權利。", "w": ["投票和上課無關。", "言論自由和這件事無關。", "財產權和這件事無關。"], "parent": "讓每個孩子都有機會學習，就是保障受教權。"}, {"id": "CI-L1-M119", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "規範要公平適用", "diff": "中等", "type": "情境判斷", "q": "班上規定「遲到要掃地」，但班長遲到卻不用掃。這項規定在執行上最主要的問題是什麼？", "o": ["沒有公平地適用在每個人身上", "規定的目的不正當", "規定太寬鬆", "班長本來就有特權"], "sol": "規範要公平適用；同樣遲到卻有人不用遵守，違反了公平原則。", "w": ["讓大家準時的目的是正當的，問題出在執行。", "問題不是寬鬆或嚴格，而是不公平。", "班長也應該遵守同樣的規定。"], "parent": "規定再好，也要對每個人都一樣。"}, {"id": "CI-L1-M120", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "尊重不同的生活方式", "diff": "中等", "type": "情境判斷", "q": "班上一位同學因為宗教信仰不吃某些食物，有同學笑他「很奇怪」。下列回應何者最恰當？", "o": ["每個人的生活方式不同，應該尊重他的選擇", "少數人的習慣本來就比較奇怪", "他應該改成和大家一樣", "只要大家覺得奇怪，就可以取笑"], "sol": "尊重差異：不同的生活方式、信仰，都應該被尊重，不能因此取笑別人。", "w": ["和多數人不同，不代表比較奇怪。", "不能要求別人放棄自己的信仰。", "多數人的看法不能成為取笑的理由。"], "parent": "不一樣不是奇怪，是不一樣而已。"}, {"id": "CI-L1-M121", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "合理差別待遇的判斷標準", "diff": "中等", "type": "觀念辨識", "q": "判斷一項差別待遇是否合理，最重要的是看什麼？", "o": ["是否有正當、合理的理由", "是否讓大多數人比較方便", "是否由大人決定", "是否對自己有利"], "sol": "差別待遇是否合理，要看它有沒有正當、合理的理由。", "w": ["多數人方便，不代表對少數人公平。", "由誰決定不是重點，理由才是。", "不能只看對自己有沒有好處。"], "parent": "不一樣的對待，要有「說得出來的好理由」。"}, {"id": "CI-L1-M122", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "人性尊嚴與外表", "diff": "中等", "type": "情境判斷", "q": "某店家在徵人廣告上寫：「長相不佳者勿來應徵。」這段文字最可能有什麼問題？", "o": ["用和工作無關的外表排除人，貶低人的價值", "店家可以自由決定要用什麼樣的員工，沒有問題", "這是為了保護應徵者，避免他們被客人批評", "服務業重視形象，所以這是合理的差別待遇"], "sol": "以外表作為排除的理由，和工作能力無關，也貶低了人的價值。", "w": ["用和工作無關的條件排除人，是不合理的。", "這段文字是排除，不是保護。", "沒有正當理由，不是合理的差別待遇。"], "parent": "看人要看能力和品格，不是看長相。"}, {"id": "CI-L1-M123", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "保留證據的重要", "diff": "中等", "type": "觀念辨識", "q": "遇到網路霸凌時，為什麼建議先「保留證據」？", "o": ["求助時可以清楚說明事情經過", "可以拿來公開，讓大家一起去罵對方", "可以作為報復對方時的武器和把柄", "只要保存證據，霸凌就會自己停止"], "sol": "保留證據（例如截圖），能在求助時清楚說明經過，幫助師長或相關單位處理。", "w": ["證據是用來求助，不是報復。", "公開罵人可能讓事情更糟，也可能侵害別人的權利。", "證據不會讓霸凌自動消失，還是要求助。"], "parent": "證據是求助時的幫手。"}, {"id": "CI-L1-H101", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "規定的目的與方式", "diff": "困難", "type": "情境判斷", "q": "某校為了防止手機被偷，規定：「老師可以隨時翻看學生手機裡的內容。」下列評論何者最恰當？", "o": ["目的正當，但翻看內容侵害隱私，可改用保管箱", "目的是防竊、保護大家的財物，所以這樣做很合理", "學生還未成年，手機內容本來就沒有隱私可言", "只要學生沒有做壞事，就不用害怕手機被翻看"], "sol": "目的（防竊）正當，但方式（翻看內容）和目的沒有必要關聯，又侵害隱私；應選擇侵害較小的方式。", "w": ["目的正當，不代表任何方式都合理。", "學生的手機內容也有隱私。", "沒做壞事，也有不被隨意翻看的權利。"], "parent": "好的規定：目的正當，方式也要合理、傷害最小。"}, {"id": "CI-L1-H102", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "區分合理差別待遇與歧視", "diff": "困難", "type": "情境判斷", "q": "下列四種做法，哪一個屬於「合理的差別待遇」？", "o": ["聽障學生考英聽時，改用書面題目作答", "只因為是外籍學生，就不能當班級幹部", "只因為成績差，就不能參加運動會", "只因為家住比較遠，就不能參加社團"], "sol": "聽障學生無法聽清楚英聽題目，改用書面作答，是為了讓他能公平受測，有正當理由。", "w": ["國籍和當幹部的能力無關。", "成績和參加運動會無關。", "家住遠近和參加社團沒有必要關聯。"], "parent": "問：這個不同的待遇，是不是為了讓他「能和大家一樣參與」？"}, {"id": "CI-L1-H103", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "多方權利的衡量", "diff": "困難", "type": "情境判斷", "q": "社區想在公園旁設置一間身心障礙者的日間照顧中心，部分居民反對，認為「會影響房價」。下列評論何者最恰當？", "o": ["擔憂可以溝通，但不能剝奪他們受照顧的權利", "房價關係到居民的財產，應該把中心設在偏遠地區", "多數居民反對，依照少數服從多數，就應該取消", "身心障礙者的家人應該自己想辦法，不要麻煩社區"], "sol": "居民的擔憂可以透過溝通處理，但不能以此為理由排除身心障礙者，否則會侵害他們的權利與尊嚴。", "w": ["把他們送到偏遠地方，是排除，不是尊重。", "多數人的意見不能剝奪少數人的基本權利。", "保障弱勢者的權利，是社會共同的責任。"], "parent": "大家的權利都要顧，但不能犧牲弱勢者的基本權利。"}, {"id": "CI-L1-H104", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "言論表達與人性尊嚴", "diff": "困難", "type": "情境判斷", "q": "小婷在校刊投稿批評學校午餐的口味，文中寫出「菜太鹹、青菜太老」。小傑則在網路上貼出廚房阿姨的照片，配上醜化的圖片。下列敘述何者最恰當？", "o": ["小婷批評事情；小傑醜化特定的人", "兩人都是在表達意見，都受言論自由保護", "兩人都在批評學校，所以都應該被禁止", "小傑只是開玩笑，比小婷公開批評更無害"], "sol": "小婷批評的是午餐（事情），小傑則醜化特定的人，貶低對方的人格，超過了言論自由的界線。", "w": ["言論自由有界線，醜化他人不受保護。", "對事情提出批評是正當的表達。", "醜化他人比批評事情更傷人。"], "parent": "可以批評「事情」，但不能醜化「人」。"}, {"id": "CI-L1-H105", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "表格資料與合理協助", "diff": "困難", "type": "資料判讀", "q": "根據上表，學校對甲、乙、丙三位學生的安排，何者「最合理」？", "o": ["三項安排都和學生的需要有關，都是合理協助", "只有甲的安排合理，乙、丙都是特權", "三項安排都不公平，應該全部取消", "只有成績好的學生才應該得到協助"], "sol": "甲需要放大試卷、乙需要搭電梯、丙需要補助午餐，三項協助都針對各自的需要，讓他們能平等參與學校生活。", "w": ["乙、丙的安排也有正當理由，不是特權。", "合理協助是為了讓大家能平等參與，不應取消。", "協助要看需要，不是看成績。"], "parent": "看每一項協助：是不是針對他真正的需要？", "fig": "<table class=\"fig\"><caption>學校的三項安排（自編資料）</caption><tr><th>學生</th><th>情況</th><th>學校的安排</th></tr><tr><td>甲</td><td>弱視</td><td>考試時提供放大字體的試卷</td></tr><tr><td>乙</td><td>腳骨折</td><td>暫時可以搭乘電梯</td></tr><tr><td>丙</td><td>家庭經濟困難</td><td>提供午餐補助</td></tr></table>"}, {"id": "CI-L1-H106", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "找出評論中的錯誤推論", "diff": "困難", "type": "推理", "q": "有人說：「人權是每個人都有的，所以我想做什麼都可以，別人不能管我。」這句話的推論錯在哪裡？", "o": ["別人也有人權，行使權利時要互相尊重", "人權並不是每個人都有，只有大人才有", "人權只有政府才能享有，個人沒有權利", "別人本來就可以隨便管你，因為你是學生"], "sol": "「每個人都有人權」，正表示別人也有權利；所以行使自己的權利時，不能侵害他人的權利。", "w": ["前半句「每個人都有人權」是正確的，錯在後半的推論。", "人權屬於每個人，不是政府。", "權利有界線，但不是別人可以隨便管你。"], "parent": "「每個人都有」包括你，也包括別人。"}, {"id": "CI-L1-H107", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "評估改善方案", "diff": "困難", "type": "情境判斷", "q": "某班常有同學因為成績被取笑。下列哪一個改善方案，最能從根本維護每個人的尊嚴？", "o": ["全班討論訂出不取笑他人的公約並遵守", "把常被取笑、成績較差的同學調到別的班", "取消所有考試，就不會有人因成績被取笑", "取笑別人的同學罰站一節課，以後就會改"], "sol": "透過討論訂出共同遵守的公約，能讓大家理解尊重的重要，從根本改善風氣。", "w": ["把被取笑的人分開，是排除受害者，不是解決問題。", "取消考試沒有改變取笑的心態。", "處罰只能暫時制止，沒有讓大家理解尊重。"], "parent": "真正的改善，是讓大家都懂得尊重。"}, {"id": "CI-L1-H108", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "目的正當但方式不當", "diff": "困難", "type": "情境判斷", "q": "為了督促學生交作業，某老師規定：「沒交作業的同學，名字要寫在黑板上一整天。」下列評論何者最恰當？", "o": ["目的正當，但公開點名可能讓人被嘲笑", "只要目的是督促大家用功，這樣做就沒有問題", "沒交作業本來就是自己的錯，應該讓全班知道", "寫在黑板上太溫和了，應該再加上其他處罰"], "sol": "目的正當，但公開點名可能貶低學生尊嚴；可以選擇私下提醒等更尊重的方式。", "w": ["目的好，方式也要合理。", "不需要讓全班都知道個人的狀況。", "問題不在輕重，而在是否尊重尊嚴。"], "parent": "先問目的對不對，再問方式有沒有傷害人。"}, {"id": "CI-L2-E101", "subj": "公民", "unit": "L2 性別平等", "point": "生理性別", "diff": "簡單", "type": "觀念辨識", "q": "依照身體的生理特徵所做的性別分類，稱為什麼？", "o": ["生理性別", "性別角色", "性別刻板印象", "性別歧視"], "sol": "依身體生理特徵所做的分類，是生理性別。", "w": ["性別角色是社會對不同性別的行為期待。", "刻板印象是把同性別的人都想成一樣。", "性別歧視是因性別給予不合理的差別待遇。"], "parent": "生理性別看身體；性別角色看社會期待。"}, {"id": "CI-L2-E102", "subj": "公民", "unit": "L2 性別平等", "point": "性別角色", "diff": "簡單", "type": "觀念辨識", "q": "「男生要勇敢、女生要溫柔」這類社會對不同性別的行為期待，稱為什麼？", "o": ["性別角色", "生理性別", "性別平等", "人性尊嚴"], "sol": "社會對不同性別的人該有什麼行為表現的期待，稱為性別角色。", "w": ["生理性別是依身體特徵的分類。", "性別平等是不因性別限制機會。", "人性尊嚴是每個人都有不可貶低的價值。"], "parent": "「應該怎樣」的期待，就是性別角色。"}, {"id": "CI-L2-E103", "subj": "公民", "unit": "L2 性別平等", "point": "性別歧視", "diff": "簡單", "type": "情境判斷", "q": "某社團規定：「只因為是女生，就不准報名機器人社。」這屬於什麼？", "o": ["性別歧視", "性別平等", "合理的差別待遇", "尊重差異"], "sol": "只因為性別就不准參加，是不合理的差別待遇，屬於性別歧視。", "w": ["限制女生參加，違反性別平等。", "性別和會不會做機器人無關，沒有合理理由。", "這是排除，不是尊重。"], "parent": "因為性別就不准做某件事，就是歧視。"}, {"id": "CI-L2-E104", "subj": "公民", "unit": "L2 性別平等", "point": "性別平等的意義", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一句話最符合「性別平等」？", "o": ["不因性別限制一個人的機會或權利", "男生女生做的事情要完全一樣", "女生的權利應該比男生多", "男生的權利應該比女生多"], "sol": "性別平等是不因性別而限制機會、剝奪權利，讓每個人都能依興趣與能力發展。", "w": ["平等不是做的事完全一樣，而是機會相同。", "平等不是某一性別的權利比較多。", "平等不是某一性別的權利比較多。"], "parent": "性別平等＝機會一樣，選擇自由。"}, {"id": "CI-L2-E105", "subj": "公民", "unit": "L2 性別平等", "point": "情緒表達的刻板印象", "diff": "簡單", "type": "情境判斷", "q": "有人說：「男生哭很丟臉。」這句話屬於什麼？", "o": ["性別刻板印象", "性別平等", "生理性別", "合理的規範"], "sol": "把「不能哭」套在所有男生身上，是用性別給人貼標籤，屬於性別刻板印象。", "w": ["這句話限制了男生表達情緒，不平等。", "生理性別是身體特徵的分類。", "這不是合理的規範。"], "parent": "每個人都可以表達難過，和性別無關。"}, {"id": "CI-L2-E106", "subj": "公民", "unit": "L2 性別平等", "point": "依興趣選擇活動", "diff": "簡單", "type": "情境判斷", "q": "小傑想參加舞蹈社，同學笑他「男生跳舞很奇怪」。從性別平等的觀點，下列何者正確？", "o": ["可以依興趣選擇活動，不受性別限制", "男生應該參加籃球、足球這類球類社團", "小傑應該聽同學的意見，換一個社團", "跳舞比較柔美，只適合女生參加"], "sol": "每個人都可以依自己的興趣和能力選擇活動，不應被性別限制。", "w": ["活動沒有規定只能哪個性別參加。", "選擇活動是小傑自己的權利。", "跳舞不分性別。"], "parent": "喜歡什麼就學什麼，和性別無關。"}, {"id": "CI-L2-E107", "subj": "公民", "unit": "L2 性別平等", "point": "刻板印象的意思", "diff": "簡單", "type": "觀念辨識", "q": "「性別刻板印象」指的是什麼？", "o": ["把同一性別的人都想成一樣", "依照每個人的實際能力來判斷一個人", "尊重每個人依自己興趣做出的選擇", "依照身體的生理特徵來區分性別"], "sol": "刻板印象是用簡化、概括的看法，把同一性別的人都當成一樣，忽略每個人的不同。", "w": ["依能力判斷，正好不是刻板印象。", "尊重個人選擇，不是刻板印象。", "依身體特徵分類是生理性別。"], "parent": "刻板印象＝一竿子打翻一船人。"}, {"id": "CI-L2-E108", "subj": "公民", "unit": "L2 性別平等", "point": "私密影像外流的處理", "diff": "簡單", "type": "情境判斷", "q": "小雅收到同學轉傳的他人私密照片。下列做法何者最恰當？", "o": ["不轉傳、保存證據，並告訴師長", "只轉傳給最好的朋友看，不讓別人知道", "在群組裡評論照片，提醒大家不要學", "自己留著，不告訴任何人比較安全"], "sol": "散播他人私密影像會侵害隱私與人格；應停止轉傳、保存證據，並向師長求助。", "w": ["轉傳會讓傷害擴大，也可能觸法。", "評論照片會讓當事人更受傷。", "不說出來，當事人可能持續受害。"], "parent": "收到別人的私密照片：不傳、存證、找大人。"}, {"id": "CI-L2-E109", "subj": "公民", "unit": "L2 性別平等", "point": "家務分工", "diff": "簡單", "type": "情境判斷", "q": "下列哪一種家務分工最符合性別平等？", "o": ["全家依時間和能力共同分擔", "媽媽比較細心，家務都由媽媽負責", "女兒長大了，家務都交給女兒做", "男生要專心讀書，所以不用做家務"], "sol": "家務應由家人依時間、能力共同分擔，不因性別決定誰做。", "w": ["家務不應只由媽媽負責。", "家務不應只由女兒負責。", "男生也是家庭的一分子，應該分擔。"], "parent": "家是大家的，家事一起做。"}, {"id": "CI-L2-E110", "subj": "公民", "unit": "L2 性別平等", "point": "職業選擇", "diff": "簡單", "type": "情境判斷", "q": "下列哪一句話符合性別平等的觀念？", "o": ["男生可以當護理師，女生也可以當工程師", "護理師需要細心照顧病人，只適合女生", "工程師需要操作機器，只適合男生來做", "職業應該依照性別分配，社會比較有秩序"], "sol": "職業選擇應依個人的興趣與能力，不應受性別限制。", "w": ["護理工作不分性別。", "工程工作不分性別。", "職業不應依性別分配。"], "parent": "想做什麼工作，看興趣和能力。"}, {"id": "CI-L2-E111", "subj": "公民", "unit": "L2 性別平等", "point": "性別偏見", "diff": "簡單", "type": "觀念辨識", "q": "因為刻板印象而對某一性別產生「負面、不公平的看法」，稱為什麼？", "o": ["性別偏見", "性別平等", "生理性別", "性別角色"], "sol": "由刻板印象形成的負面、不公平看法，稱為性別偏見。", "w": ["性別平等是不因性別限制機會。", "生理性別是身體特徵的分類。", "性別角色是社會的行為期待。"], "parent": "刻板印象→偏見（看不起）→歧視（不公平對待）。"}, {"id": "CI-L2-E112", "subj": "公民", "unit": "L2 性別平等", "point": "遭遇性別嘲笑時求助", "diff": "簡單", "type": "情境判斷", "q": "小美在學校常被同學用和性別有關的字眼嘲笑。她最適合的做法是什麼？", "o": ["向可信任的師長或學校正式管道求助", "一直忍耐，不告訴別人，等同學自己停止", "也用難聽的話嘲笑回去，讓對方不敢再說", "趕快轉學，換一個環境就不會再被嘲笑"], "sol": "遇到性別嘲笑或騷擾，應向可信任的師長或學校正式管道求助。", "w": ["忍耐可能讓情況持續。", "反擊可能讓衝突更嚴重。", "轉學沒有解決問題，學校應該處理。"], "parent": "被嘲笑不是你的錯，要找大人幫忙。"}, {"id": "CI-L2-E113", "subj": "公民", "unit": "L2 性別平等", "point": "性別平等的打掃分工", "diff": "簡單", "type": "情境判斷", "q": "班上大掃除時，下列哪一種分工最恰當？", "o": ["依照每個人的能力和意願分配工作", "男生搬桌椅，女生一律擦窗戶", "女生都不用搬東西", "依照座號隨便分，不考慮任何狀況"], "sol": "依每個人的能力與意願分配，才不會用性別限制每個人。", "w": ["只依性別分工，可能反映刻板印象。", "不是所有女生都搬不動東西。", "完全不考慮狀況，可能分給不適合的人。"], "parent": "分工看能力和意願，不看性別。"}, {"id": "CI-L2-M101", "subj": "公民", "unit": "L2 性別平等", "point": "刻板印象、偏見、歧視的區分", "diff": "中等", "type": "觀念辨識", "q": "下列哪一個例子屬於「性別歧視」？", "o": ["只因應徵者是男性，就不錄取他當幼兒園老師", "有人認為男生都比較粗心，不適合照顧小孩", "有人認為女生都比較愛哭，遇到事情就會哭", "有人因為男生當家庭主夫，就看不起他"], "sol": "「只因為性別就不錄取」是實際做出不公平的行為，屬於歧視。", "w": ["這是概括性的想法，屬於刻板印象。", "這也是刻板印象。", "這是負面的態度，屬於偏見，還沒有實際行動。"], "parent": "想法＝刻板印象，態度＝偏見，行動＝歧視。"}, {"id": "CI-L2-M102", "subj": "公民", "unit": "L2 性別平等", "point": "由刻板印象到歧視", "diff": "中等", "type": "觀念辨識", "q": "刻板印象、偏見、歧視三者的關係，下列何者正確？", "o": ["想法可能發展成負面態度，再變成不公平行動", "三者都是看不起某一性別，意思完全相同", "歧視一定先出現，之後才會產生刻板印象", "偏見是一種正面的看法，可以幫助認識別人"], "sol": "刻板印象（過度概括）可能形成偏見（負面態度），進而做出歧視（不公平行動）。", "w": ["三者是不同層次的概念。", "順序反了：通常是先有刻板印象。", "偏見是負面的看法。"], "parent": "想法→態度→行動，一步一步變嚴重。"}, {"id": "CI-L2-M103", "subj": "公民", "unit": "L2 性別平等", "point": "不同不等於歧視", "diff": "中等", "type": "觀念辨識", "q": "下列敘述何者正確？", "o": ["做不同的事不一定是歧視，要看有沒有不合理限制", "只要男女做的事情不一樣，就一定是性別歧視", "男女要做完全相同的事情，才算是性別平等", "只要有人對分工感到不滿意，就一定是歧視"], "sol": "分工不同不一定是歧視，要判斷是否「因性別」而有不合理的限制或差別待遇。", "w": ["不同的安排可能是依能力或意願，不一定是歧視。", "平等是機會相同，不是事情完全一樣。", "是否為歧視，要看有沒有不合理的性別限制。"], "parent": "看理由：是因為性別而限制，還是依能力、意願？"}, {"id": "CI-L2-M104", "subj": "公民", "unit": "L2 性別平等", "point": "媒體中的刻板印象", "diff": "中等", "type": "情境判斷", "q": "某清潔劑廣告中，總是由媽媽在打掃，爸爸在看報紙。這則廣告可能強化什麼？", "o": ["「家務是女性責任」的刻板印象", "鼓勵家人共同分擔家務的性別平等觀念", "依照家人的時間與能力所做的合理分工", "爸爸工作比較辛苦，比較會打掃的觀念"], "sol": "廣告一再呈現媽媽做家務，可能強化「家事是女性的事」這種刻板印象。", "w": ["這樣的畫面不符合性別平等。", "家務只由媽媽負責，不是合理的分工。", "廣告中爸爸沒有打掃。"], "parent": "看媒體時，想想它是不是在給性別貼標籤。"}, {"id": "CI-L2-M105", "subj": "公民", "unit": "L2 性別平等", "point": "興趣與性別", "diff": "中等", "type": "情境判斷", "q": "小芳數學很好，有人說：「女生數學好一定是運氣。」這句話反映了什麼？", "o": ["性別刻板印象", "合理的評價", "性別平等", "尊重差異"], "sol": "認為女生數學不好，是用性別概括每個人，屬於刻板印象。", "w": ["把成就歸給運氣，不是合理的評價。", "這句話貶低了女生的能力，不平等。", "這句話沒有尊重小芳的實力。"], "parent": "能力屬於個人，不屬於性別。"}, {"id": "CI-L2-M106", "subj": "公民", "unit": "L2 性別平等", "point": "尊重他人的界線", "diff": "中等", "type": "情境判斷", "q": "小明常常拍同學的肩膀、摸頭，同學說「不要這樣」，小明說：「只是好玩而已。」下列評論何者最恰當？", "o": ["對方拒絕了，就應停止並尊重界線", "只要大家都覺得好玩，就可以繼續這樣做", "是那位同學太敏感了，應該學著不在意", "只要沒有用力打人，輕輕碰一下就沒關係"], "sol": "別人表示不舒服、拒絕時，就應該停止，尊重對方的界線。", "w": ["好玩不能成為不尊重別人的理由。", "每個人的感受都要被尊重。", "有沒有用力不是重點，對方的意願才是。"], "parent": "別人說「不要」，就是不要。"}, {"id": "CI-L2-M107", "subj": "公民", "unit": "L2 性別平等", "point": "性別角色期待的影響", "diff": "中等", "type": "情境判斷", "q": "小軒很喜歡做甜點，家人卻說：「男生學什麼甜點，去學電機比較有前途。」這反映了什麼？", "o": ["性別角色期待限制了個人的選擇", "家人在尊重小軒的興趣", "學甜點本來就只適合女生", "這是性別平等的表現"], "sol": "家人用性別角色的期待決定小軒該學什麼，限制了他依興趣發展的機會。", "w": ["家人沒有尊重小軒的興趣。", "做甜點不分性別。", "用性別限制選擇，不是平等。"], "parent": "社會的期待，不該決定你的夢想。"}, {"id": "CI-L2-M108", "subj": "公民", "unit": "L2 性別平等", "point": "招募資料的性別平等", "diff": "中等", "type": "情境判斷", "q": "某公司徵求工程師，徵人啟事上寫「限男性」。這最可能有什麼問題？", "o": ["用和能力無關的性別限制，可能是歧視", "公司有權決定要錄取誰，所以沒有問題", "工程師要常加班，女生本來就不適合", "這是為了保護女性，避免工作太辛苦"], "sol": "工程師的工作能力和性別無關，用性別限制應徵，可能構成性別歧視。", "w": ["用和工作無關的條件限制，不合理。", "能力屬於個人，不是性別。", "限制應徵不是保護，而是排除。"], "parent": "徵人要看能力，不看性別。"}, {"id": "CI-L2-M109", "subj": "公民", "unit": "L2 性別平等", "point": "性別平等不是相同", "diff": "中等", "type": "觀念辨識", "q": "下列對「性別平等」的理解，何者最恰當？", "o": ["同等尊重與機會，分工可看能力和意願", "男生和女生所有的事情都要做得一模一樣", "只要女生得到比較多的照顧，就是平等", "性別平等就是完全不能分男生和女生"], "sol": "性別平等重視同等的尊重與機會，分工可以依能力、意願和實際條件，而不是用性別限制。", "w": ["平等不等於所有事都一模一樣。", "平等不是某一性別得到比較多。", "平等不是否認差異，而是不因性別限制機會。"], "parent": "平等是「機會一樣、互相尊重」，不是「所有事都一樣」。"}, {"id": "CI-L2-M110", "subj": "公民", "unit": "L2 性別平等", "point": "嘲笑性別特質", "diff": "中等", "type": "情境判斷", "q": "小偉說話比較輕柔，常被同學叫「娘娘腔」。下列評論何者最恰當？", "o": ["用性別特質嘲笑人是不尊重，可能是霸凌", "小偉應該改成大家期待的樣子，就不會被笑", "這只是同學之間取的綽號，沒有什麼關係", "這是在刺激小偉，幫他變得更勇敢、更陽剛"], "sol": "因為說話方式不符合性別刻板印象就嘲笑別人，是不尊重，可能構成霸凌。", "w": ["每個人都有自己的樣子，不需要配合刻板印象。", "帶有貶意的綽號會傷人。", "嘲笑不會讓人更勇敢，只會讓人受傷。"], "parent": "每個人都有自己的樣子，不該被嘲笑。"}, {"id": "CI-L2-M111", "subj": "公民", "unit": "L2 性別平等", "point": "辨識偏見", "diff": "中等", "type": "觀念辨識", "q": "下列哪一個屬於「性別偏見」？", "o": ["覺得男生帶不好小孩，因而看不起男保母", "某公司徵保母時，規定只錄取女性應徵者", "依照每個人的能力分配照顧小孩的工作", "認為男生和女生都可以從事保母的工作"], "sol": "因刻板印象而看不起當保母的男生，是負面、不公平的態度，屬於偏見。", "w": ["只錄取女性，是實際的不公平行動，屬於歧視。", "依能力分配，不是偏見。", "這是性別平等的觀念。"], "parent": "偏見是「看不起」的態度；歧視是「不公平」的行動。"}, {"id": "CI-L2-M112", "subj": "公民", "unit": "L2 性別平等", "point": "玩具的刻板印象", "diff": "中等", "type": "情境判斷", "q": "玩具店把玩具分成「男孩區：車子、機器人」和「女孩區：娃娃、廚房組」。這可能造成什麼影響？", "o": ["讓孩子以為某些玩具只屬於某個性別", "讓孩子更容易找到自己真正喜歡的玩具", "讓男孩和女孩都能得到相同的機會", "玩具只是遊戲用的，對想法沒有任何影響"], "sol": "依性別分區可能讓孩子認為某些興趣「不屬於」自己的性別，限制了探索與選擇。", "w": ["分區反而讓孩子不敢選「另一區」的玩具。", "這樣分區會強化刻板印象。", "從小接觸的環境，會影響對性別的想法。"], "parent": "玩具沒有性別，喜歡就可以玩。"}, {"id": "CI-L2-M113", "subj": "公民", "unit": "L2 性別平等", "point": "散播私密影像的後果", "diff": "中等", "type": "觀念辨識", "q": "散播他人的私密影像，最主要侵害了當事人的什麼？", "o": ["隱私與人格權", "財產權", "參政權", "受教育的權利"], "sol": "私密影像涉及個人隱私，散播會侵害當事人的隱私與人格權。", "w": ["這和財產無關。", "這和選舉、參政無關。", "這和受教育無關。"], "parent": "別人的私密影像不能傳，傳了就是傷害。"}, {"id": "CI-L2-M114", "subj": "公民", "unit": "L2 性別平等", "point": "運動與性別", "diff": "中等", "type": "情境判斷", "q": "學校籃球隊公告：「歡迎所有對籃球有興趣的同學參加選拔。」這種做法符合什麼觀念？", "o": ["性別平等", "性別歧視，因為選拔會淘汰人", "性別刻板印象，因為籃球是男生的運動", "性別偏見，因為選拔一定對女生不利"], "sol": "不限性別，讓有興趣的人都能參加選拔，依能力決定，符合性別平等。", "w": ["沒有因性別限制，不是歧視。", "沒有用性別貼標籤。", "沒有對某性別產生負面看法。"], "parent": "機會開放給所有人，就是平等。"}, {"id": "CI-L2-M115", "subj": "公民", "unit": "L2 性別平等", "point": "家長的性別期待", "diff": "中等", "type": "情境判斷", "q": "小玲想念理工科，爸爸說：「女生念文組比較適合。」下列回應何者最恰當？", "o": ["科系應依興趣與能力選，不以性別決定", "爸爸說得對，女生的頭腦比較不適合理工", "小玲應該放棄興趣，聽爸爸的安排比較好", "女生念理工科系，以後一定會很辛苦失敗"], "sol": "選擇科系應依個人的興趣和能力，不應受性別限制。", "w": ["這是刻板印象，不是事實。", "每個人都可以依興趣發展。", "能力屬於個人，不是性別。"], "parent": "想念什麼，看興趣和能力。"}, {"id": "CI-L2-M116", "subj": "公民", "unit": "L2 性別平等", "point": "性別平等的班級幹部選舉", "diff": "中等", "type": "情境判斷", "q": "選班長時，有同學說：「班長一定要選男生，比較有魄力。」這句話反映了什麼？", "o": ["性別刻板印象", "合理的選舉標準", "性別平等", "尊重個人選擇"], "sol": "認為只有男生有魄力，是用性別概括每個人，屬於刻板印象。", "w": ["選幹部應看能力與意願，不是性別。", "這句話限制了女生的機會。", "這句話沒有尊重每個人的能力。"], "parent": "領導能力屬於個人，不屬於性別。"}, {"id": "CI-L2-M117", "subj": "公民", "unit": "L2 性別平等", "point": "尊重他人拒絕", "diff": "中等", "type": "情境判斷", "q": "同學想看小美的手機相簿，小美說「不要」。同學說：「我們是好朋友，看一下又不會怎樣。」下列評論何者最恰當？", "o": ["即使是好朋友，也要尊重小美的拒絕", "好朋友之間不應該有秘密", "小美太小氣了", "只要偷偷看就沒關係"], "sol": "不管關係多好，別人拒絕時都要尊重，這是尊重他人的隱私與界線。", "w": ["好朋友也有各自的隱私。", "拒絕是她的權利，不是小氣。", "偷看更不尊重人，也侵害隱私。"], "parent": "再好的朋友，也要先問、也要聽對方說「不」。"}, {"id": "CI-L2-M118", "subj": "公民", "unit": "L2 性別平等", "point": "看待性別的差異", "diff": "中等", "type": "觀念辨識", "q": "下列哪一個說法最符合性別平等的精神？", "o": ["不應用性別預設一個人的特質與能力", "男生都比女生強壯，所以都應該做體力活", "女生都比較細心，所以都應該擔任記錄", "不同性別的人想法不同，最好不要一起合作"], "sol": "每個人都有不同的特質與能力，應該依個人判斷，而不是用性別預設。", "w": ["用「男生都」概括，是刻板印象。", "用「女生都」概括，也是刻板印象。", "不同性別的人可以一起合作。"], "parent": "看到「男生都」「女生都」，就要小心是不是刻板印象。"}, {"id": "CI-L2-M119", "subj": "公民", "unit": "L2 性別平等", "point": "察覺分工中的刻板印象", "diff": "中等", "type": "情境判斷", "q": "老師分配班級工作：「男生搬器材，女生整理教室。」下列評論何者最恰當？", "o": ["可能是刻板分工，應依能力與意願分配", "依性別分工最有效率，完全沒有問題", "女生力氣比較小，本來就不能搬器材", "男生比較粗心，本來就不會整理教室"], "sol": "只依性別分工，可能反映刻板印象；應依每個人的能力和意願公平分配。", "w": ["效率不能忽略刻板印象的問題。", "有些女生也能搬器材。", "有些男生也很會整理。"], "parent": "分工前先問：大家想做什麼？能做什麼？"}, {"id": "CI-L2-M120", "subj": "公民", "unit": "L2 性別平等", "point": "網路上的性別言論", "diff": "中等", "type": "情境判斷", "q": "某人在網路上留言：「女生開車都很危險。」下列回應何者最恰當？", "o": ["開車技術因人而異，不能用性別概括", "女生的反應比較慢，所以都不太會開車", "男生開車經驗多，所以開車一定比較安全", "網路上的留言大家都知道是開玩笑，不用在意"], "sol": "開車技術是個人的能力，用性別概括所有人，是刻板印象。", "w": ["用「都」概括全部女生，不符合事實。", "開車安全看個人，不看性別。", "網路上的刻板言論也會影響別人的看法。"], "parent": "技術屬於個人，不屬於性別。"}, {"id": "CI-L2-M121", "subj": "公民", "unit": "L2 性別平等", "point": "受害者不是錯的那一方", "diff": "中等", "type": "觀念辨識", "q": "小真的私密照片被前男友散播，有人說：「是她自己要拍的，活該。」下列評論何者最恰當？", "o": ["散播的人才是侵害者，不能責怪受害者", "她自己拍的，所以是她的錯", "只要拍了，別人就可以散播", "受害者應該保持沉默"], "sol": "未經同意散播他人私密影像的人，才是侵害者；不應責怪受害者，應協助她求助。", "w": ["錯的是散播的人，不是受害者。", "拍照不等於同意散播。", "受害者應該求助，而不是沉默。"], "parent": "錯的是散播的人，不是被散播的人。"}, {"id": "CI-L2-M122", "subj": "公民", "unit": "L2 性別平等", "point": "性別平等的教科書插圖", "diff": "中等", "type": "情境判斷", "q": "某課本插圖中，醫生都是男性，護理師都是女性。若要修改成較符合性別平等的插圖，下列做法何者最恰當？", "o": ["讓醫生和護理師都有不同性別的人", "把所有人都改成男性", "把所有人都改成女性", "把醫生和護理師都刪掉"], "sol": "呈現不同性別的人擔任各種職業，可以減少職業的性別刻板印象。", "w": ["全改成男性，仍然有刻板印象。", "全改成女性，也只是另一種偏向。", "刪掉不能解決刻板印象的問題。"], "parent": "讓每種職業都看得到不同的人。"}, {"id": "CI-L2-M123", "subj": "公民", "unit": "L2 性別平等", "point": "性別角色可以改變", "diff": "中等", "type": "觀念辨識", "q": "過去社會常認為「男主外、女主內」。現在越來越多家庭由夫妻共同負擔工作與家務。這說明了什麼？", "o": ["性別角色的期待會隨著社會改變", "性別角色永遠不會改變", "現在的家庭不需要做家務", "男生不需要工作了"], "sol": "性別角色是社會的期待，不是天生固定的，會隨著時代與社會觀念而改變。", "w": ["事實說明性別角色是會改變的。", "家務仍需要有人做，只是共同分擔。", "共同負擔，不是男生不工作。"], "parent": "性別角色是社會給的，可以改變。"}, {"id": "CI-L2-H101", "subj": "公民", "unit": "L2 性別平等", "point": "依序判斷三個階段", "diff": "困難", "type": "觀念辨識", "q": "小林認為「女生都不懂車子」（甲）；因此看不起在修車廠工作的女技師（乙）；當老闆時，只因為應徵者是女性就不錄取（丙）。甲、乙、丙依序屬於什麼？", "o": ["刻板印象、偏見、歧視", "偏見、刻板印象、歧視", "歧視、偏見、刻板印象", "刻板印象、歧視、偏見"], "sol": "甲是過度概括的想法（刻板印象）；乙是負面的態度（偏見）；丙是不公平的行動（歧視）。", "w": ["甲是「都」的概括想法，是刻板印象，不是偏見。", "丙是實際行動，才是歧視。", "乙是態度（看不起），丙才是行動（不錄取）。"], "parent": "想法→態度→行動，依序是刻板印象→偏見→歧視。"}, {"id": "CI-L2-H102", "subj": "公民", "unit": "L2 性別平等", "point": "表格資料的謹慎推論", "diff": "困難", "type": "資料判讀", "q": "根據上表（自編資料），下列推論何者最合理？", "o": ["人數差距可能和刻板印象有關，值得了解", "女生天生不擅長機械，所以不適合機器人社", "男生天生不擅長料理，所以不適合烹飪社", "人數差這麼多，學校一定有規定限制性別"], "sol": "表格只能看出人數差距；差距可能和刻板印象影響同學的選擇有關，但需要更多資料才能確定原因。", "w": ["人數少不代表天生不適合。", "人數少不代表天生不適合。", "表格看不出學校有任何規定。"], "parent": "資料只能說「有差距」，原因要謹慎推論。", "fig": "<table class=\"fig\"><caption>某校兩個社團的社員人數（自編資料）</caption><tr><th>社團</th><th>男生</th><th>女生</th></tr><tr><td>機器人社</td><td>26 人</td><td>4 人</td></tr><tr><td>烹飪社</td><td>3 人</td><td>25 人</td></tr></table>"}, {"id": "CI-L2-H103", "subj": "公民", "unit": "L2 性別平等", "point": "合理分工與刻板分工的區別", "diff": "困難", "type": "情境判斷", "q": "下列四種班級分工，哪一個最符合性別平等？", "o": ["先調查每個人的意願，再依能力分配，並定期輪替", "男生負責搬重物，女生負責布置，每學期固定不變", "讓女生全部擔任記錄，因為女生字比較漂亮", "讓男生全部擔任體育股長，因為男生比較會運動"], "sol": "先問意願、再看能力，並定期輪替，讓每個人都有機會嘗試，最符合性別平等。", "w": ["依性別固定分工，可能強化刻板印象。", "「女生字比較漂亮」是用性別概括。", "「男生比較會運動」是用性別概括。"], "parent": "好的分工：問意願、看能力、會輪流。"}, {"id": "CI-L2-H104", "subj": "公民", "unit": "L2 性別平等", "point": "改善刻板印象的方案", "diff": "困難", "type": "方案評估", "q": "某校發現很少男生報名家政社。下列哪一種做法，最能減少性別刻板印象，又不限制個人選擇？", "o": ["宣傳呈現不同性別的社員，歡迎有興趣的人", "規定每位男生都必須參加一學期的家政社", "把家政社改名為「男生家政社」，只收男生", "既然很少男生報名，就乾脆取消家政社"], "sol": "在宣傳中呈現不同性別的社員，能打破「家政是女生的事」的印象，又讓每個人自由選擇。", "w": ["強迫參加限制了個人的選擇。", "只限男生，又變成另一種性別限制。", "取消社團沒有解決問題，反而減少選擇。"], "parent": "改變印象，但不強迫；開放機會，讓人自己選。"}, {"id": "CI-L2-H105", "subj": "公民", "unit": "L2 性別平等", "point": "事件的處理順序", "diff": "困難", "type": "情境判斷", "q": "小凱發現同學在群組散播另一位同學的私密照片。下列處理順序何者最恰當？\n甲、告訴可信任的師長\n乙、不轉傳，並提醒別人停止轉傳\n丙、保存相關證據（如截圖對話紀錄）", "o": ["乙→丙→甲", "甲→乙→丙", "丙→甲→乙", "甲→丙→乙"], "sol": "先阻止傷害擴大（不轉傳、提醒停止），再保存證據，最後帶著證據向師長求助。", "w": ["先阻止擴散，才能減少傷害；證據也要在求助前準備好。", "應先停止轉傳，避免傷害擴大。", "保存證據之後要盡快求助，但更優先的是停止擴散。"], "parent": "先止血（停止擴散）→存證據→找大人。"}, {"id": "CI-L2-H106", "subj": "公民", "unit": "L2 性別平等", "point": "判斷是否為歧視", "diff
