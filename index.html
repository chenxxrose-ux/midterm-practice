\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text></svg>"}, {"id": "GE-L1-M119", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "依緯度判斷氣候帶", "diff": "中等", "type": "觀念應用", "q": "某地位在南緯 40°。依緯度劃分，它屬於哪一個氣候帶？", "o": ["南溫帶", "南寒帶", "熱帶", "北溫帶"], "sol": "40° 在 23.5° 和 66.5° 之間，屬於溫帶；在南半球，所以是南溫帶。", "w": ["寒帶要在 66.5° 以上。", "熱帶在 23.5° 以內。", "南緯在南半球，是南溫帶，不是北溫帶。"], "parent": "先看度數決定熱、溫、寒，再看南北決定是南溫帶還是北溫帶。"}, {"id": "GE-L1-M120", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "地球示意圖判讀氣候帶", "diff": "中等", "type": "圖表判讀", "q": "下圖中甲、乙、丙三點，哪一點位在熱帶？", "o": ["乙", "甲", "丙", "三點都不在熱帶"], "sol": "熱帶在南、北緯 23.5° 之間。圖中乙點在赤道和 23.5°N 之間，屬於熱帶；甲在 23.5°N 和 66.5°N 之間（溫帶），丙在 66.5°S 以南（寒帶）。", "w": ["甲在 23.5°N 和 66.5°N 之間，是北溫帶。", "丙在 66.5°S 以南，是南寒帶。", "乙點就在熱帶範圍內。"], "parent": "先找 23.5° 的兩條虛線，夾在中間的就是熱帶。", "fig": "<svg class=\"fig\" viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"地球的緯線與氣候帶示意圖\"><title>地球的緯線與氣候帶示意圖</title><circle cx=\"170\" cy=\"150\" r=\"120\" fill=\"#F4F8FB\" stroke=\"#13233A\" stroke-width=\"2\"/><line x1=\"122.2\" y1=\"40.0\" x2=\"217.8\" y2=\"40.0\" stroke=\"#55667B\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\"/><text x=\"225.8\" y=\"45.0\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">66.5°N</text><line x1=\"60.0\" y1=\"102.2\" x2=\"280.0\" y2=\"102.2\" stroke=\"#55667B\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\"/><text x=\"288.0\" y=\"107.2\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">23.5°N</text><line x1=\"50.0\" y1=\"150.0\" x2=\"290.0\" y2=\"150.0\" stroke=\"#55667B\" stroke-dasharray=\"\" stroke-width=\"2\"/><text x=\"298.0\" y=\"155.0\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0°（赤道）</text><line x1=\"60.0\" y1=\"197.8\" x2=\"280.0\" y2=\"197.8\" stroke=\"#55667B\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\"/><text x=\"288.0\" y=\"202.8\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">23.5°S</text><line x1=\"122.2\" y1=\"260.0\" x2=\"217.8\" y2=\"260.0\" stroke=\"#55667B\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\"/><text x=\"225.8\" y=\"265.0\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">66.5°S</text><circle cx=\"140.0\" cy=\"65.1\" r=\"6\" fill=\"#B42318\"/><text x=\"126.0\" y=\"71.1\" font-size=\"17\" font-weight=\"700\" text-anchor=\"end\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><circle cx=\"110.0\" cy=\"129.2\" r=\"6\" fill=\"#B42318\"/><text x=\"96.0\" y=\"135.2\" font-size=\"17\" font-weight=\"700\" text-anchor=\"end\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><circle cx=\"160.0\" cy=\"265.9\" r=\"6\" fill=\"#B42318\"/><text x=\"146.0\" y=\"271.9\" font-size=\"17\" font-weight=\"700\" text-anchor=\"end\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text></svg>"}, {"id": "GE-L1-M121", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "南北半球季節相反", "diff": "中等", "type": "推理", "q": "臺灣是夏天的 7 月時，位在南半球溫帶的澳洲雪梨，最可能是什麼季節？", "o": ["冬天", "夏天", "春天", "秋天"], "sol": "每年 3～9 月太陽直射北半球，北半球是夏季；這時南半球得到的陽光較斜，是冬季。所以 7 月的雪梨是冬天。", "w": ["南北半球季節相反，臺灣夏天時南半球是冬天。", "南北半球季節相反，7 月不會是南半球的春天。", "南北半球季節相反，7 月不會是南半球的秋天。"], "parent": "太陽直射哪一邊，哪一邊就是夏天，另一邊就是冬天。"}, {"id": "GE-L1-M122", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "緯度與氣溫的例外（海拔）", "diff": "中等", "type": "推理", "q": "玉山頂和高雄市區的緯度相近，但玉山頂的氣溫明顯比較低。最主要的原因是什麼？", "o": ["玉山頂的海拔比較高", "玉山頂的緯度比較低", "玉山頂比較靠近海洋", "玉山頂的經度比較大"], "sol": "緯度相近時，太陽照射角度差不多，氣溫差異主要來自海拔：海拔愈高，氣溫愈低。", "w": ["題目說兩地緯度相近，氣溫差異不是緯度造成的。", "玉山在內陸山區，離海比高雄遠。", "經度影響時間，不影響氣溫。"], "parent": "爬山時愈往上愈冷，所以高山即使在南部也很涼。"}, {"id": "GE-L1-M123", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "晝長與季節", "diff": "中等", "type": "推理", "q": "6 月時太陽直射北半球。這時北半球各地的白天長度，下列敘述何者正確？", "o": ["緯度愈高，白天愈長", "緯度愈高，白天愈短", "各地白天都一樣長", "赤道的白天最長"], "sol": "6 月太陽直射北半球，北半球是夏季，白天比夜晚長，而且緯度愈高白天愈長（北極圈附近甚至整天都是白天）。", "w": ["剛好弄反了：6 月時北半球緯度愈高白天愈長。", "季節不同時，各地白天長度不同。", "赤道附近全年白天長度變化不大，6 月時北半球高緯度的白天更長。"], "parent": "北半球的夏天，愈往北，太陽下山愈晚。"}, {"id": "GE-L1-H107", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "虛構地點的氣候、半球與時間整合", "diff": "困難", "type": "整合推理", "q": "一個虛構的國家位於（北緯 15°，東經 120°）。下列推論何者正確？", "o": ["屬於熱帶，和臺灣沒有時差", "屬於溫帶，和臺灣沒有時差", "屬於熱帶，比臺灣早 1 小時", "屬於溫帶，而且位在南半球"], "sol": "北緯 15° 在 23.5° 以內，屬於熱帶；北緯在北半球。經度和臺灣一樣是東經 120°，所以和臺灣沒有時差。", "w": ["15° 在 23.5° 以內，是熱帶，不是溫帶。", "經度相同，地方時相同，不會差 1 小時。", "15° 是熱帶；而且北緯在北半球。"], "parent": "分開判斷：緯度看氣候帶、看南北半球；經度看時間。"}, {"id": "GE-L1-H108", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "緯線長度與環繞地球時間", "diff": "困難", "type": "推理", "q": "甲沿著北緯 60° 的緯線、乙沿著赤道，各騎同樣速度的腳踏車繞地球一圈。誰比較快繞完一圈？為什麼？", "o": ["甲，因為北緯 60° 的緯線比赤道短", "乙，因為赤道是最長的緯線", "一樣快，因為每條緯線都一樣長", "甲，因為北緯 60° 的經度比較小"], "sol": "緯線是繞地球一圈的圓，赤道最長，愈靠近兩極愈短。北緯 60° 的緯線比赤道短，同樣速度下甲比較快繞完。", "w": ["赤道最長，所以乙要騎最遠，會比較慢。", "經線才一樣長，緯線長度不同。", "繞一圈經過所有經度，跟「經度比較小」無關。"], "parent": "在柳丁靠近頂端畫一圈，比中間那一圈短很多。"}, {"id": "GE-L2-E101", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣所在的半球", "diff": "簡單", "type": "觀念辨識", "q": "臺灣大約位於北緯 22°～25°、東經 120°～122°。臺灣位在哪兩個半球？", "o": ["北半球、東半球", "南半球、東半球", "北半球、西半球", "南半球、西半球"], "sol": "北緯在赤道以北，是北半球；東經在本初經線以東，是東半球。", "w": ["北緯在北半球。", "東經在東半球。", "南北和東西都弄反了。"], "parent": "「北」緯在北半球，「東」經在東半球。"}, {"id": "GE-L2-E102", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣東邊的海洋", "diff": "簡單", "type": "記憶辨識", "q": "臺灣本島的東邊緊鄰哪一個海洋？", "o": ["太平洋", "大西洋", "印度洋", "北極海"], "sol": "臺灣東臨太平洋，西邊隔著臺灣海峽和中國大陸相望。", "w": ["大西洋在歐洲、非洲和美洲之間，不在臺灣旁邊。", "印度洋在亞洲南方，不和臺灣相鄰。", "北極海在北極附近。"], "parent": "東邊是大大的太平洋，西邊是窄窄的臺灣海峽。"}, {"id": "GE-L2-E103", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣西邊的海峽", "diff": "簡單", "type": "記憶辨識", "q": "臺灣本島和中國大陸之間隔著哪一個海峽？", "o": ["臺灣海峽", "巴士海峽", "麻六甲海峽", "白令海峽"], "sol": "臺灣西邊隔著臺灣海峽和中國大陸相望。", "w": ["巴士海峽在臺灣南邊，介於臺灣和菲律賓之間。", "麻六甲海峽在東南亞的馬來半島附近。", "白令海峽在亞洲和北美洲之間。"], "parent": "名字就有「臺灣」：臺灣海峽在臺灣和中國大陸之間。"}, {"id": "GE-L2-E105", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "離島縣", "diff": "簡單", "type": "記憶辨識", "q": "下列哪一個縣不在臺灣本島上？", "o": ["澎湖縣", "南投縣", "苗栗縣", "臺東縣"], "sol": "澎湖縣由澎湖群島組成，在臺灣本島西邊的臺灣海峽上。", "w": ["南投縣在臺灣本島中部。", "苗栗縣在臺灣本島西北部。", "臺東縣在臺灣本島東南部。"], "parent": "澎湖、金門、連江（馬祖）是三個離島縣。"}, {"id": "GE-L2-E106", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "不靠海的縣", "diff": "簡單", "type": "記憶辨識", "q": "臺灣本島的縣市中，哪一個縣完全不靠海？", "o": ["南投縣", "雲林縣", "嘉義縣", "宜蘭縣"], "sol": "南投縣位在臺灣本島中央，四周都是其他縣市，是唯一不靠海的縣。", "w": ["雲林縣西邊靠臺灣海峽。", "嘉義縣西邊靠臺灣海峽。", "宜蘭縣東邊靠太平洋。"], "parent": "南投在臺灣的「肚臍」位置，四面都被其他縣市包圍。"}, {"id": "GE-L2-E107", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "北回歸線經過的縣", "diff": "簡單", "type": "記憶辨識", "q": "北回歸線通過臺灣的哪兩個縣？", "o": ["嘉義縣和花蓮縣", "臺南市和臺東縣", "雲林縣和南投縣", "屏東縣和臺東縣"], "sol": "北回歸線（約北緯 23.5°）通過臺灣的嘉義縣和花蓮縣。", "w": ["臺南市和臺東縣在北回歸線南邊。", "北回歸線沒有通過雲林縣和南投縣。", "屏東縣和臺東縣在北回歸線南邊。"], "parent": "西邊嘉義、東邊花蓮，都立有北回歸線的標誌。"}, {"id": "GE-L2-M101", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "行政區的數量", "diff": "中等", "type": "記憶辨識", "q": "臺灣目前的縣市共有 22 個。下列組合何者正確？", "o": ["6 個直轄市、13 個縣、3 個市", "5 個直轄市、14 個縣、3 個市", "6 個直轄市、12 個縣、4 個市", "6 個直轄市、16 個縣、0 個市"], "sol": "臺灣有 6 個直轄市、13 個縣、3 個市（基隆市、新竹市、嘉義市），合計 22 個。", "w": ["直轄市有 6 個，不是 5 個。", "「市」有基隆、新竹、嘉義 3 個，縣有 13 個。", "還有基隆市、新竹市、嘉義市這 3 個市。"], "parent": "6＋13＋3＝22。三個市是基隆、新竹、嘉義。"}, {"id": "GE-L2-M102", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "同名的縣與市", "diff": "中等", "type": "觀念辨識", "q": "下列關於「新竹縣」和「新竹市」的敘述，何者正確？", "o": ["是兩個不同的行政區", "是同一個行政區的兩種寫法", "新竹市是直轄市", "新竹縣是新竹市的一部分"], "sol": "新竹縣和新竹市是兩個不同的行政區；嘉義縣和嘉義市也是。新竹市是「市」，不是直轄市。", "w": ["兩者是不同的行政區，不是同一個。", "新竹市不在六個直轄市之中。", "新竹縣不屬於新竹市，兩者是平行的行政區。"], "parent": "名字很像的兩兄弟，其實是不同的人：新竹縣、新竹市各自有自己的政府。"}, {"id": "GE-L2-M103", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "離島的相對位置", "diff": "中等", "type": "推理", "q": "澎湖群島位在臺灣本島的西邊。下列敘述何者正確？", "o": ["臺灣本島位在澎湖群島的東方", "臺灣本島位在澎湖群島的西方", "澎湖群島位在臺灣本島的東方", "臺灣本島位在澎湖群島的北方"], "sol": "澎湖在臺灣本島西邊，反過來說，臺灣本島就在澎湖的東邊。", "w": ["方向反過來說時要相反：澎湖在西，臺灣就在東。", "澎湖在臺灣的西方，不是東方。", "題目只說澎湖在西邊，兩地主要是東西關係。"], "parent": "「A 在 B 的西邊」反過來就是「B 在 A 的東邊」。"}, {"id": "GE-L2-M104", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣的相對位置", "diff": "中等", "type": "觀念辨識", "q": "下列何者最適合描述臺灣的「相對位置」？", "o": ["位在日本的西南方、菲律賓的北方", "位在北緯 22°～25°", "位在東經 120°～122°", "位在東半球"], "sol": "相對位置要用其他地方當參考點。「日本的西南方、菲律賓的北方」用日本和菲律賓當參考點，是相對位置。", "w": ["用緯度範圍表示，是絕對位置。", "用經度範圍表示，是絕對位置。", "這是用經度判斷所在的半球，不是以鄰近地區說明的相對位置。"], "parent": "相對位置一定要「拿別人來比」。"}, {"id": "GE-L2-M105", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "颱風路徑與最先受影響的縣市", "diff": "中等", "type": "推理", "q": "一個颱風從巴士海峽往正北方移動。臺灣本島哪一個縣市最先進入暴風圈的可能性最高？", "o": ["屏東縣", "基隆市", "宜蘭縣", "新竹縣"], "sol": "巴士海峽在臺灣南邊。颱風從南往北走，最先接近的是臺灣最南端的屏東縣。", "w": ["基隆市在臺灣最北端，會比較晚受影響。", "宜蘭縣在東北部，離巴士海峽較遠。", "新竹縣在西北部，離巴士海峽較遠。"], "parent": "先找巴士海峽在哪（臺灣南邊），颱風往北走，第一站就是最南邊的縣。"}, {"id": "GE-L2-M106", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "經緯格線判讀臺灣附近的颱風位置", "diff": "中等", "type": "圖表判讀", "q": "下圖是臺灣附近的經緯線格線圖。颱風中心位於甲點（北緯 20°、東經 126°）。颱風在臺灣的哪個方位？（臺灣約在北緯 22°～25°、東經 120°～122°）", "o": ["東南方", "西南方", "東北方", "西北方"], "sol": "甲的緯度 20° 比臺灣小，在臺灣南邊；經度 126° 比臺灣大，在臺灣東邊。合起來是東南方。", "w": ["東經數字愈大愈東，126° 在臺灣東邊，不是西邊。", "北緯數字愈小愈南，20° 在臺灣南邊，不是北邊。", "南北和東西都弄反了。"], "parent": "北緯數字小＝南邊，東經數字大＝東邊。", "fig": "<svg class=\"fig\" viewBox=\"0 0 480 300\" role=\"img\" aria-label=\"臺灣附近經緯線格線圖\"><title>臺灣附近經緯線格線圖</title><rect x=\"70\" y=\"30\" width=\"380\" height=\"220\" fill=\"#F4F8FB\" stroke=\"#9AA9B8\"/><line x1=\"70\" y1=\"30.0\" x2=\"450\" y2=\"30.0\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"62\" y=\"35.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">26°N</text><line x1=\"70\" y1=\"140.0\" x2=\"450\" y2=\"140.0\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"62\" y=\"145.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">23°N</text><line x1=\"70\" y1=\"250.0\" x2=\"450\" y2=\"250.0\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"62\" y=\"255.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">20°N</text><line x1=\"70.0\" y1=\"30\" x2=\"70.0\" y2=\"250\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"70.0\" y=\"272\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">118°E</text><line x1=\"260.0\" y1=\"30\" x2=\"260.0\" y2=\"250\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"260.0\" y=\"272\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">122°E</text><line x1=\"450.0\" y1=\"30\" x2=\"450.0\" y2=\"250\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"450.0\" y=\"272\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">126°E</text><text x=\"468\" y=\"20\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">北↑</text><circle cx=\"450.0\" cy=\"250.0\" r=\"6\" fill=\"#B42318\"/><text x=\"459.0\" y=\"241.0\" font-size=\"17\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text></svg>"}, {"id": "GE-L2-H101", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "由經緯度範圍判斷是否在臺灣本島", "diff": "困難", "type": "整合推理", "q": "臺灣本島約在北緯 22°～25°、東經 120°～122°之間。下列四個座標中，哪一個最可能在臺灣本島上？", "o": ["（23.5°N，121°E）", "（23.5°N，125°E）", "（23.5°S，121°E）", "（23.5°N，121°W）"], "sol": "要同時符合三個條件：北緯、東經，而且數字在範圍內。（23.5°N，121°E）都符合。", "w": ["經度 125°E 超出 122°E，在臺灣東邊的太平洋上。", "南緯在南半球，不可能在臺灣。", "西經在西半球，不可能在臺灣。"], "parent": "一次檢查三件事：是北緯嗎？是東經嗎？數字在範圍內嗎？"}, {"id": "GE-L2-E108", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "地表海陸比例", "diff": "簡單", "type": "記憶辨識", "q": "地球表面大約有多少比例是海洋？", "o": ["約 71%", "約 29%", "約 50%", "約 90%"], "sol": "地球表面海洋約占 71%，陸地約占 29%。", "w": ["29% 是陸地的比例。", "海洋明顯比陸地多，不是各一半。", "海洋約占七成，不到九成。"], "parent": "地球是「水球」：大約十分之七是海。"}, {"id": "GE-L2-E109", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "七大洲辨識", "diff": "簡單", "type": "記憶辨識", "q": "下列哪一個「不是」七大洲之一？", "o": ["北極洲", "南極洲", "大洋洲", "非洲"], "sol": "七大洲是亞洲、非洲、北美洲、南美洲、南極洲、歐洲、大洋洲。北極是一片海洋（北極海），沒有「北極洲」。", "w": ["南極洲是七大洲之一。", "大洋洲是七大洲之一。", "非洲是七大洲之一。"], "parent": "南極有陸地（南極洲），北極是海（北極海）。"}, {"id": "GE-L2-M107", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "陸地的分布", "diff": "中等", "type": "觀念辨識", "q": "關於全球陸地的分布，下列敘述何者正確？", "o": ["陸地集中在北半球較多", "陸地集中在南半球較多", "南北半球的陸地一樣多", "陸地都集中在赤道附近"], "sol": "全球陸地分布不平均，北半球的陸地比南半球多。", "w": ["南半球海洋比較多，陸地比較少。", "南北半球的陸地並不相等。", "陸地分布在各緯度，不是都集中在赤道。"], "parent": "看地球儀：上半部大陸多，下半部大多是海。"}, {"id": "GE-L2-M108", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "南極洲的位置特徵", "diff": "中等", "type": "推理", "q": "某洲「位置偏遠、緯度很高、被三大洋包圍」。這個洲是哪一洲？", "o": ["南極洲", "歐洲", "非洲", "大洋洲"], "sol": "南極洲位在地球最南端，緯度高、位置偏遠，四周被太平洋、大西洋、印度洋包圍。", "w": ["歐洲在北半球中高緯度，和亞洲相連。", "非洲跨赤道，大部分在低緯度。", "大洋洲大部分在南半球中低緯度。"], "parent": "「緯度很高」就是靠近極地，七大洲中只有南極洲在極地。"}, {"id": "GE-L2-M109", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣的海陸位置", "diff": "中等", "type": "觀念辨識", "q": "下列哪一項最適合描述臺灣的「海陸位置」？", "o": ["位在亞洲大陸東部、太平洋西側", "位在北緯 22°～25° 之間", "位在日本的西南方、菲律賓北方", "位在東半球與北半球"], "sol": "海陸位置是說明一地和大陸、海洋之間的關係。臺灣位在亞洲大陸東部的邊緣、太平洋的西側。", "w": ["用緯度範圍描述，是絕對位置，沒有說明和海陸的關係。", "以日本、菲律賓為參考點，是相對位置，沒有說明和大陸、海洋的關係。", "只說明所在的半球。"], "parent": "海陸位置＝「靠哪塊大陸、靠哪片大海」。"}, {"id": "GE-L2-H103", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣作為海陸之間的門戶", "diff": "困難", "type": "推理", "q": "臺灣位在亞洲大陸與太平洋之間。下列哪一個說法最能說明這個海陸位置的意義？", "o": ["可成為太平洋進入亞洲大陸的門戶", "臺灣的氣候因此和大陸內陸一樣乾燥", "臺灣因此冬季完全不受季風影響", "臺灣因此主要只和南半球國家往來"], "sol": "位在大陸和大洋的交界，往來於太平洋和亞洲大陸之間的船隻、貿易常經過臺灣附近，使臺灣成為重要的門戶。", "w": ["臺灣四面環海，氣候溫暖潮濕，和大陸內陸不同。", "臺灣位在大陸邊緣，冬季仍受季風影響。", "臺灣位在東亞，主要往來對象也在北半球。"], "parent": "臺灣像大樓的大門口：從海上要進到亞洲大陸，常常會經過這裡。"}, {"id": "GE-L2-E110", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "海洋生物豐富的原因", "diff": "簡單", "type": "觀念辨識", "q": "臺灣附近海域的海洋生物種類很多，主要原因之一是什麼？", "o": ["位在寒流與暖流交會的地方", "四周的海水全年都很冰冷", "只有暖流經過臺灣附近", "臺灣附近海域都很淺"], "sol": "臺灣附近有寒流和暖流交會，帶來不同的海洋生物，使海洋生物種類豐富。", "w": ["臺灣附近有暖流經過，海水並不是全年冰冷。", "臺灣附近不只有暖流，還有寒流，兩者交會才讓魚種豐富。", "海水深淺不是課本說的主要原因；主因是寒暖流交會。"], "parent": "冷水的魚和暖水的魚都游到臺灣附近，種類就變多了。"}, {"id": "GE-L2-E111", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "特有種的意義", "diff": "簡單", "type": "觀念辨識", "q": "「臺灣特有種」指的是什麼樣的生物？", "o": ["只在臺灣自然分布的生物", "所有在臺灣看得到的生物", "從國外引進臺灣的生物", "冬天才飛來臺灣的候鳥"], "sol": "特有種是指只在某個地區自然生長、其他地方的野外找不到的生物。臺灣特有種就是只在臺灣自然分布的生物。", "w": ["在臺灣看得到的生物，很多在其他地方也有，不一定是特有種。", "從國外引進的生物，原本就不只分布在臺灣。", "候鳥會在不同地方遷徙，不是只在臺灣分布。"], "parent": "「特有」就是「只有這裡有」。"}, {"id": "GE-L2-E112", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "生態多樣性的影響因素", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一項「不是」造成臺灣生態多樣的主要因素？", "o": ["地震", "高山多、地形高低差大", "南北跨過不同的氣候帶", "四面環海的島嶼環境"], "sol": "臺灣生態多樣，和地形高低差大、跨過不同氣候帶、海島環境有關。地震不是造成生態多樣的原因。", "w": ["地形高低差大，從平地到高山有不同的溫度，生物種類多。", "北回歸線通過臺灣，南北氣候不同，生物也不同。", "海島和大陸隔開，演化出許多特有種。"], "parent": "想想看：什麼會讓不同的生物住在不同的地方？高低、冷熱、海島。地震不會。"}, {"id": "GE-L2-M110", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "特有種形成的原因", "diff": "中等", "type": "因果推理", "q": "臺灣特有生物的比例偏高，最主要的原因是什麼？", "o": ["曾和大陸相連，後來又被海洋隔離", "臺灣從來沒有和大陸相連過", "臺灣的生物都是從海上漂流過來的", "臺灣比大陸更早形成，生物先出現在這裡"], "sol": "冰河時期海平面較低，臺灣和亞洲大陸相連，生物可以遷移過來；冰河期結束後海平面上升，臺灣被海隔開，生物在島上各自演化，形成許多特有種。", "w": ["冰河時期臺灣曾和大陸相連，生物才能遷入。", "大多數陸地生物是在臺灣和大陸相連時走過來的，不是漂流來的。", "特有種的形成和「先相連、後隔離」有關，不是因為臺灣比較早形成。"], "parent": "先「連起來」讓生物過來，再「被隔開」讓它們在島上慢慢變得不一樣。"}, {"id": "GE-L2-M111", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "冰河期的陸橋", "diff": "中等", "type": "因果推理", "q": "冰河時期，亞洲大陸的生物能夠移動到臺灣，主要是因為什麼？", "o": ["海平面較低，臺灣和大陸之間露出陸地", "海平面較高，海水把生物沖到臺灣", "冰河把生物冰凍後帶到臺灣", "當時臺灣海峽更寬"], "sol": "冰河時期大量的水變成冰，海平面下降，臺灣海峽的海底露出成為陸地，生物可以走過去。", "w": ["海平面是下降，不是上升。", "生物不是被冰河運送過來的；是海平面下降露出陸地，生物走過去。", "海平面下降時，海峽反而露出陸地，不會更寬。"], "parent": "水都結成冰了，海就變淺，海底露出來變成一條路。"}, {"id": "GE-L2-M112", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "位置與候鳥", "diff": "中等", "type": "觀念應用", "q": "每年秋冬，有許多候鳥經過或停留在臺灣。這和臺灣的哪一項位置特色最有關？", "o": ["位在東亞候鳥遷徙的路線上", "臺灣冬天比北方的繁殖地更冷", "臺灣是全世界最大的島嶼", "候鳥都在臺灣出生，長大後才離開"], "sol": "臺灣位在東亞南北往來的路線上，冬天又比北方溫暖，候鳥在秋冬南下時常經過或停留在臺灣。", "w": ["臺灣冬天比北方溫暖，候鳥才會南下過冬或經過。", "臺灣不是最大的島嶼，面積大小不是原因。", "候鳥大多在北方繁殖，秋冬才南下經過臺灣。"], "parent": "臺灣像高速公路上的休息站，候鳥南來北往都會在這裡停一下。"}, {"id": "GE-L2-M113", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "空運轉運的位置優勢", "diff": "中等", "type": "因果推理", "q": "臺灣適合發展成為航空轉運的地點，主要和哪一項位置特色有關？", "o": ["位在東北亞與東南亞之間的樞紐", "臺灣的面積廣大，機場很多", "臺灣是距離歐洲最近的亞洲國家", "臺灣全年都沒有颱風，飛機不受影響"], "sol": "臺灣位在東北亞（日本、韓國）和東南亞之間，往來兩地的航線經過臺灣很方便，適合轉運。", "w": ["臺灣面積不大，轉運優勢來自位置。", "臺灣離歐洲並不是最近。", "臺灣夏秋常有颱風。"], "parent": "臺灣在東亞的「中間站」：往北到日本、往南到菲律賓都很近。"}, {"id": "GE-L2-M114", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "十七世紀荷蘭選臺灣為據點", "diff": "中等", "type": "跨科推理", "q": "十七世紀時，荷蘭人選擇臺灣作為東亞的貿易據點。從地理位置來看，最主要的原因是什麼？", "o": ["臺灣鄰近中國大陸，方便和中國貿易", "臺灣當時已經有很多大型港口城市", "臺灣當時是東亞人口最多的地區", "臺灣是歐洲船隻最早抵達的亞洲地區"], "sol": "臺灣靠近中國大陸，又位在東亞海上航線上，方便取得中國的商品再轉賣到日本等地，適合當貿易據點。", "w": ["十七世紀的臺灣還沒有很多大型港口城市，關鍵是位置。", "臺灣當時人口不多，不是選為據點的原因。", "歐洲人來臺灣前已到過亞洲其他地方；關鍵是臺灣靠近中國大陸。"], "parent": "做生意要靠近貨源：臺灣離中國大陸很近，又在海上航線旁。"}, {"id": "GE-L2-H104", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "生態多樣性原因的整合判斷", "diff": "困難", "type": "資料推論", "q": "下面是同學整理的臺灣生物觀察紀錄（自編）。哪一項推論最合理？", "o": ["不同海拔生物不同，地形高低差是生態多樣的原因之一", "高山上的生物和平地一樣，所以海拔對生物沒有影響", "南部和北部的生物一樣，表示緯度對生物沒有影響", "特有種只出現在海邊，所以海岸環境最重要"], "sol": "紀錄顯示平地、中海拔、高山的代表生物不同，表示海拔高低造成不同的環境，是臺灣生態多樣的原因之一。", "w": ["紀錄中高山和平地的代表生物不同，不是一樣。", "紀錄沒有比較南部和北部，無法得到這個結論。", "紀錄中的特有種出現在山區，不是只有海邊。"], "parent": "看資料說什麼就推什麼：不同高度、不同生物，所以高度有影響。", "fig": "<table class=\"fig\"><caption>臺灣不同海拔的代表生物（自編整理）</caption><tr><th>海拔</th><th>環境</th><th>代表生物</th></tr><tr><td>0～500 公尺</td><td>平地、丘陵</td><td>白頭翁、榕樹</td></tr><tr><td>1,000～2,500 公尺</td><td>山地森林</td><td>紅檜（特有種）</td></tr><tr><td>3,000 公尺以上</td><td>高山</td><td>臺灣冷杉（特有種）</td></tr></table>"}, {"id": "GE-L2-H105", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "位置影響與原因的配對", "diff": "困難", "type": "整合推理", "q": "下列「臺灣的現象」和「原因」的配對，何者正確？", "o": ["海域魚類種類豐富——位在寒流與暖流交會處", "適合發展國際貿易——臺灣的面積非常廣大", "每年有許多候鳥經過——臺灣冬天比北方寒冷", "特有種比例高——臺灣從來沒有和大陸相連"], "sol": "寒流和暖流在臺灣附近交會，帶來不同的海洋生物，使魚類種類豐富，配對正確。", "w": ["臺灣適合發展貿易，是因為位在東亞海上交通要道，不是因為面積大（臺灣面積並不大）。", "臺灣冬天比北方溫暖；候鳥經過是因為位在東亞候鳥遷徙路線上。", "剛好相反：冰河時期臺灣曾和大陸相連，生物遷入後又被海隔離，才形成許多特有種。"], "parent": "每個現象都要配上「真正的原因」：魚多是寒暖流、貿易是交通要道、候鳥是遷徙路線、特有種是先相連再隔離。"}, {"id": "GE-L1-E118", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "緯度的最大值", "diff": "簡單", "type": "觀念辨識", "q": "北極點的緯度是多少？", "o": ["北緯 90°", "北緯 180°", "北緯 0°", "東經 90°"], "sol": "緯度從赤道 0° 往兩極算，最大到 90°。北極點是北緯 90°。", "w": ["180° 是經度的最大值，緯度最大只有 90°。", "北緯 0° 是赤道。", "北極點是用緯度表示，不是經度。"], "parent": "緯度：赤道 0°，兩極 90°。經度：本初經線 0°，最大 180°。"}, {"id": "GE-L1-M125", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "相對位置隨參考點改變", "diff": "中等", "type": "觀念辨識", "q": "「臺灣在日本的西南方」和「臺灣在菲律賓的北方」這兩句話，下列說明何者正確？", "o": ["兩句都是相對位置，只是參考點不同", "兩句都是絕對位置", "前一句是絕對位置，後一句是相對位置", "兩句互相矛盾，一定有一句是錯的"], "sol": "兩句都用別的地方（日本、菲律賓）當參考點，都是相對位置。參考點不同，說出的方向就不同，但兩句可以同時正確。", "w": ["兩句都拿別的國家當參考點，不是絕對位置。", "兩句都用參考點描述，都是相對位置。", "參考點不同，方向本來就會不同，兩句可以同時正確。"], "parent": "站在不同人旁邊，你在他的「哪一邊」就會不同，但你的位置沒變。"}, {"id": "GE-L1-M126", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "東西半球的時間早晚", "diff": "中等", "type": "觀念辨識", "q": "下列關於東、西半球時間的敘述，何者正確？（以本初經線兩側比較）", "o": ["本初經線兩側，東邊的時間比西邊早", "西半球的時間一定比東半球早", "東、西半球的時間都完全相同", "時間早晚只和緯度有關，和經度無關"], "sol": "地球由西向東自轉，東邊先日出，時間比較早。在本初經線兩側比較時，東經的地方比西經的地方早。", "w": ["剛好弄反了：東邊比較早。", "經度不同，時間就不同。", "時間早晚和經度有關，和緯度無關。"], "parent": "東早西晚：太陽先照到東邊。"}, {"id": "GE-L1-H109", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "比例尺與實際距離的逆推", "diff": "困難", "type": "推理", "q": "小英要把學校附近一條實際長 800 公尺的街道，畫在長 20 公分的紙上，而且要畫得剛好占滿紙的長度。她應該使用哪一個比例尺？", "o": ["1：4,000", "1：40,000", "1：400", "1：16,000"], "sol": "800 公尺＝80,000 公分。圖上 20 公分代表 80,000 公分，80,000÷20＝4,000，比例尺是 1：4,000。", "w": ["單位換算多了一個 0：800 公尺是 80,000 公分，不是 800,000 公分。", "單位換算少了一個 0：800 公尺是 80,000 公分。", "用 800×20 算錯了，要用實際距離除以圖上距離。"], "parent": "比例尺＝圖上距離：實際距離，先把單位換成一樣，再化成 1：多少。"}, {"id": "GE-L2-M115", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣的南方鄰國", "diff": "中等", "type": "記憶辨識", "q": "臺灣南方隔著巴士海峽，最近的國家是哪一國？", "o": ["菲律賓", "日本", "越南", "韓國"], "sol": "臺灣南方隔著巴士海峽與菲律賓相望。", "w": ["日本在臺灣的東北方。", "越南在臺灣的西南方，不是隔著巴士海峽。", "韓國在臺灣的北方。"], "parent": "北邊日本、南邊菲律賓、西邊中國大陸、東邊太平洋。"}, {"id": "GE-L2-H106", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺北飛往馬祖的方向", "diff": "困難", "type": "空間推理", "q": "馬祖（連江縣）位在臺灣本島的西北方、靠近中國大陸沿海。一架飛機從臺北飛往馬祖，主要往哪個方向飛？回程從馬祖飛回臺北，又是往哪個方向？", "o": ["去程往西北，回程往東南", "去程往東南，回程往西北", "去程和回程都往西北", "去程往西南，回程往東北"], "sol": "馬祖在臺北的西北方，去程往西北飛；回程方向相反，往東南飛。", "w": ["方向弄反了：馬祖在臺灣本島的西北方。", "回程要往相反方向，不會也是西北。", "馬祖在西北方，不是西南方。"], "parent": "去程和回程方向剛好相反：西北的反方向是東南。"}, {"id": "GE-L2-E113", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣北方的鄰近地區", "diff": "簡單", "type": "記憶辨識", "q": "臺灣的北方（東北方）鄰近哪一個國家？", "o": ["日本", "菲律賓", "印尼", "泰國"], "sol": "臺灣北方鄰近日本的琉球群島，南方隔巴士海峽與菲律賓相望。", "w": ["菲律賓在臺灣南方。", "印尼在臺灣南方很遠的地方。", "泰國在臺灣西南方。"], "parent": "北日本、南菲律賓。"}, {"id": "GE-L1-H110", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "由氣候帶與半球反推位置", "diff": "困難", "type": "逆向推理", "q": "某地屬於溫帶，而且那裡 1 月時正是夏天。這個地方最可能位在哪裡？", "o": ["南緯 35°", "北緯 35°", "南緯 10°", "北緯 70°"], "sol": "1 月是夏天，表示在南半球（季節和北半球相反）；屬於溫帶，緯度在 23.5°～66.5° 之間。南緯 35° 同時符合。", "w": ["北緯 35° 是溫帶，但在北半球，1 月是冬天。", "南緯 10° 在南半球，但屬於熱帶。", "北緯 70° 在北半球，而且屬於寒帶。"], "parent": "先用季節判斷南北半球，再用氣候帶判斷緯度範圍。"}, {"id": "GE-L2-M118", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣東西兩側的海洋", "diff": "中等", "type": "觀念整合", "q": "關於臺灣四周的海洋，下列敘述何者正確？", "o": ["東臨太平洋，西隔臺灣海峽", "東隔臺灣海峽，西臨太平洋", "東臨大西洋，西隔臺灣海峽", "東臨太平洋，西隔巴士海峽"], "sol": "臺灣東邊是太平洋，西邊隔著臺灣海峽和中國大陸相望；南邊則是巴士海峽。", "w": ["東西弄反了：太平洋在東，臺灣海峽在西。", "大西洋不在臺灣附近。", "巴士海峽在臺灣南邊，西邊是臺灣海峽。"], "parent": "畫一個臺灣，東邊寫太平洋，西邊寫臺灣海峽，南邊寫巴士海峽。"}, {"id": "GE-L1-M129", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "由經緯格線找兩點經度差", "diff": "中等", "type": "圖表判讀", "q": "根據下面的格線圖，甲、乙兩點的經度相差多少？", "o": ["30°", "15°", "60°", "0°"], "sol": "甲在東經 105°，乙在東經 135°，經度相差 135－105＝30°。", "w": ["只算到中間那條 120° 的經線，少了一半。", "經度差是 30°，不是 60°。", "兩點不在同一條經線上，經度不同。"], "parent": "找出兩點各在哪一條直的經線上，再相減。", "fig": "<svg class=\"fig\" viewBox=\"0 0 480 300\" role=\"img\" aria-label=\"經緯線格線圖\"><title>經緯線格線圖</title><rect x=\"70\" y=\"30\" width=\"380\" height=\"220\" fill=\"#F4F8FB\" stroke=\"#9AA9B8\"/><line x1=\"70\" y1=\"30.0\" x2=\"450\" y2=\"30.0\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"62\" y=\"35.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">30°N</text><line x1=\"70\" y1=\"140.0\" x2=\"450\" y2=\"140.0\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"62\" y=\"145.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">20°N</text><line x1=\"70\" y1=\"250.0\" x2=\"450\" y2=\"250.0\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"62\" y=\"255.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">10°N</text><line x1=\"70.0\" y1=\"30\" x2=\"70.0\" y2=\"250\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"70.0\" y=\"272\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">105°E</text><line x1=\"260.0\" y1=\"30\" x2=\"260.0\" y2=\"250\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"260.0\" y=\"272\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">120°E</text><line x1=\"450.0\" y1=\"30\" x2=\"450.0\" y2=\"250\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"450.0\" y=\"272\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">135°E</text><text x=\"468\" y=\"20\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">北↑</text><circle cx=\"70.0\" cy=\"30.0\" r=\"6\" fill=\"#B42318\"/><text x=\"79.0\" y=\"21.0\" font-size=\"17\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><circle cx=\"450.0\" cy=\"250.0\" r=\"6\" fill=\"#B42318\"/><text x=\"459.0\" y=\"241.0\" font-size=\"17\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text></svg>"}, {"id": "GE-L2-M119", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣位置帶來的氣候特色", "diff": "中等", "type": "因果推理", "q": "臺灣位在低緯度，四周又被海洋包圍。這樣的位置使臺灣的氣候大致有什麼特色？", "o": ["溫暖潮濕", "炎熱乾燥，很少下雨", "冬季寒冷，平地常常下雪", "全年氣溫都一樣，沒有季節變化"], "sol": "低緯度太陽照射較直接，氣溫較高；四周環海，水氣充足。所以臺灣氣候大致溫暖潮濕。", "w": ["四周環海，水氣充足，雨量多，不是乾燥。", "臺灣平地冬季不會常常下雪。", "臺灣仍有季節變化。"], "parent": "低緯度＝暖，環海＝濕。"}, {"id": "GE-L1-M130", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "同經度不同緯度的比較", "diff": "中等", "type": "整合判斷", "q": "甲地（北緯 10°，東經 100°）和乙地（北緯 60°，東經 100°）比較，下列何者正確？", "o": ["兩地時間相同，甲地通常比較熱", "兩地時間不同，甲地比較熱", "兩地時間相同，乙地通常比較熱", "兩地時間不同，乙地比較熱"], "sol": "兩地經度相同，地方時相同；甲地緯度低，太陽照射較直接，通常比較熱。", "w": ["經度相同，時間相同。", "緯度愈高通常愈冷，乙地緯度高，通常比較冷。", "經度相同時間相同；而且乙地緯度高，通常比較冷。"], "parent": "經度管時間，緯度管冷熱。"}, {"id": "GE-L2-M120", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "生物多樣性：由氣候帶推論", "diff": "中等", "type": "因果推理", "q": "北回歸線通過臺灣，使臺灣南北兼有熱帶和溫帶的環境。這對臺灣的生物有什麼影響？", "o": ["熱帶和溫帶的生物都可能在臺灣生活", "臺灣全島都只適合熱帶的生物生活", "臺灣全島都只適合溫帶的生物生活", "氣候帶不同，但對生物沒有任何影響"], "sol": "臺灣跨過兩個氣候帶，環境多樣，適合熱帶和溫帶的生物都可能在臺灣找到合適的地方生活，使生物種類更多。", "w": ["北部屬溫帶，也有溫帶的生物。", "南部屬熱帶，也有熱帶的生物。", "氣候環境不同，生活的生物就會不同。"], "parent": "一座島同時有「熱」和「溫」兩種環境，就能住更多種生物。"}, {"id": "GE-L1-H112", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "街區圖：方向、道路與距離的整合", "diff": "困難", "type": "圖表整合", "q": "下面的街區圖中，相鄰兩條道路之間的距離是 250 公尺，指北針指向圖的上方。小明從車站沿著道路走到公園，最短要走多少公尺？公園大致在車站的哪個方位？", "o": ["1,000 公尺；東北方", "1,000 公尺；西南方", "500 公尺；東北方", "2,000 公尺；東北方"], "sol": "公園在車站右邊 2 格、上面 2 格。沿道路要走 2＋2＝4 格，4×250＝1,000 公尺。圖的上方是北、右方是東，所以公園在車站的東北方。", "w": ["方向弄反了：公園在車站的右上方，是東北方。", "只算了往右（或往上）的 2 格，沿道路還要轉彎再走 2 格。", "把每格當成 500 公尺；題目說相鄰道路相距 250 公尺。"], "parent": "一格一格數：右 2、上 2，共 4 格；再看指北針決定方向。", "fig": "<svg class=\"fig\" viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"街區圖（相鄰道路相距 250 公尺）\"><title>街區圖（相鄰道路相距 250 公尺）</title><rect x=\"20\" y=\"20\" width=\"280\" height=\"240\" fill=\"#F4F8FB\" stroke=\"#9AA9B8\"/><line x1=\"90.0\" y1=\"20\" x2=\"90.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"80.0\" x2=\"300\" y2=\"80.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"160.0\" y1=\"20\" x2=\"160.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"140.0\" x2=\"300\" y2=\"140.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"230.0\" y1=\"20\" x2=\"230.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"200.0\" x2=\"300\" y2=\"200.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><rect x=\"81.0\" y=\"191.0\" width=\"18\" height=\"18\" fill=\"#1F5FAD\"/><text x=\"103.0\" y=\"206.0\" font-size=\"16\" font-weight=\"700\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">車站</text><polygon points=\"230.0,69.0 220.0,88.0 240.0,88.0\" fill=\"#14703F\"/><text x=\"243.0\" y=\"86.0\" font-size=\"16\" font-weight=\"700\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">公園</text><g transform=\"rotate(0 360 55)\"><line x1=\"360\" y1=\"83\" x2=\"360\" y2=\"33\" stroke=\"#13233A\" stroke-width=\"3\"/><polygon points=\"360,21 352,37 368,37\" fill=\"#13233A\"/><text x=\"360\" y=\"15\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">N</text></g><rect x=\"310\" y=\"98\" width=\"14\" height=\"14\" fill=\"#1F5FAD\"/><text x=\"330\" y=\"110\" font-size=\"13\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">車站</text><polygon points=\"317,121 309,136 325,136\" fill=\"#14703F\"/><text x=\"330\" y=\"134\" font-size=\"13\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">公園</text></svg>"}, {"id": "GE-L1-H113", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "6 月不同緯度的白天長短", "diff": "困難", "type": "推理", "q": "6 月時太陽直射北半球。下圖中甲（約 60°N）、乙（赤道）、丙（約 60°S）三地，白天由長到短排列，何者正確？", "o": ["甲→乙→丙", "丙→乙→甲", "三地一樣長", "乙→甲→丙"], "sol": "6 月北半球是夏季，北半球白天比夜晚長，而且緯度愈高白天愈長；南半球是冬季，緯度愈高白天愈短。赤道附近白天長度變化不大，約 12 小時。所以甲最長、乙居中、丙最短。", "w": ["南北弄反了：6 月是北半球的夏天，北半球的白天比較長。", "季節不同時，各地白天長度不同。", "赤道全年白天約 12 小時，6 月時北半球高緯度的甲白天更長。"], "parent": "6 月：北邊愈北白天愈長，南邊愈南白天愈短，赤道在中間。", "fig": "<svg class=\"fig\" viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"地球的緯線與氣候帶示意圖\"><title>地球的緯線與氣候帶示意圖</title><circle cx=\"170\" cy=\"150\" r=\"120\" fill=\"#F4F8FB\" stroke=\"#13233A\" stroke-width=\"2\"/><line x1=\"122.2\" y1=\"40.0\" x2=\"217.8\" y2=\"40.0\" stroke=\"#55667B\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\"/><text x=\"225.8\" y=\"45.0\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">66.5°N</text><line x1=\"60.0\" y1=\"102.2\" x2=\"280.0\" y2=\"102.2\" stroke=\"#55667B\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\"/><text x=\"288.0\" y=\"107.2\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">23.5°N</text><line x1=\"50.0\" y1=\"150.0\" x2=\"290.0\" y2=\"150.0\" stroke=\"#55667B\" stroke-dasharray=\"\" stroke-width=\"2\"/><text x=\"298.0\" y=\"155.0\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0°（赤道）</text><line x1=\"60.0\" y1=\"197.8\" x2=\"280.0\" y2=\"197.8\" stroke=\"#55667B\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\"/><text x=\"288.0\" y=\"202.8\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">23.5°S</text><line x1=\"122.2\" y1=\"260.0\" x2=\"217.8\" y2=\"260.0\" stroke=\"#55667B\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\"/><text x=\"225.8\" y=\"265.0\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">66.5°S</text><circle cx=\"150.0\" cy=\"46.1\" r=\"6\" fill=\"#B42318\"/><text x=\"136.0\" y=\"52.1\" font-size=\"17\" font-weight=\"700\" text-anchor=\"end\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><circle cx=\"130.0\" cy=\"150.0\" r=\"6\" fill=\"#B42318\"/><text x=\"116.0\" y=\"156.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"end\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><circle cx=\"150.0\" cy=\"253.9\" r=\"6\" fill=\"#B42318\"/><text x=\"136.0\" y=\"259.9\" font-size=\"17\" font-weight=\"700\" text-anchor=\"end\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text></svg>"}, {"id": "GE-L1-H114", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "求臺灣的對蹠點座標", "diff": "困難", "type": "推理", "q": "從地球中心穿過臺灣中部（北緯 23.5°，東經 121°）畫一條直線，到地球另一面的那一點（對蹠點），座標是哪一個？", "o": ["（南緯 23.5°，西經 59°）", "（南緯 23.5°，西經 121°）", "（北緯 23.5°，西經 59°）", "（南緯 66.5°，西經 59°）"], "sol": "對蹠點的緯度：數字相同、南北相反，所以是南緯 23.5°。經度：東西相反，數字是 180°－121°＝59°，所以是西經 59°。", "w": ["經度不能只把東改成西，數字要用 180°－121°＝59°。", "緯度的南北也要相反，北緯要變成南緯。", "緯度的數字不變，只是南北相反；66.5° 是 90°－23.5° 的結果，不是對蹠點的緯度。"], "parent": "穿過地球中心：南北相反（數字不變），東西相反（數字變成 180 減原來的數）。"}, {"id": "GE-L1-M131", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "依圖例與指北針判斷方位", "diff": "中等", "type": "圖表判讀", "q": "下面的地圖中，指北針指向圖的左方。依照圖例，醫院在學校的哪個方位？", "o": ["東方", "西方", "北方", "南方"], "sol": "指北針指向左方，所以左方是北、右方是南、上方是東、下方是西。醫院畫在學校的上方，所以醫院在學校的東方。", "w": ["如果用「上北下南」來看，會以為上方是北；但這張圖的上方是東。", "西方在圖的下方，醫院不在學校下方。", "北方在圖的左方，醫院不在學校左邊。"], "parent": "先找指北針，把北放對位置，再順時針排出東、南、西。", "fig": "<svg class=\"fig\" viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"地圖（指北針指向左方）\"><title>地圖（指北針指向左方）</title><rect x=\"20\" y=\"20\" width=\"280\" height=\"240\" fill=\"#F4F8FB\" stroke=\"#9AA9B8\"/><line x1=\"90.0\" y1=\"20\" x2=\"90.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"80.0\" x2=\"300\" y2=\"80.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"160.0\" y1=\"20\" x2=\"160.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"140.0\" x2=\"300\" y2=\"140.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"230.0\" y1=\"20\" x2=\"230.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"200.0\" x2=\"300\" y2=\"200.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><rect x=\"151.0\" y=\"191.0\" width=\"18\" height=\"18\" fill=\"#1F5FAD\"/><text x=\"173.0\" y=\"206.0\" font-size=\"16\" font-weight=\"700\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">學校</text><circle cx=\"160.0\" cy=\"80.0\" r=\"8\" fill=\"#B42318\"/><text x=\"173.0\" y=\"86.0\" font-size=\"16\" font-weight=\"700\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">醫院</text><g transform=\"rotate(-90 360 55)\"><line x1=\"360\" y1=\"83\" x2=\"360\" y2=\"33\" stroke=\"#13233A\" stroke-width=\"3\"/><polygon points=\"360,21 352,37 368,37\" fill=\"#13233A\"/><text x=\"360\" y=\"15\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">N</text></g><rect x=\"310\" y=\"98\" width=\"14\" height=\"14\" fill=\"#1F5FAD\"/><text x=\"330\" y=\"110\" font-size=\"13\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">學校</text><circle cx=\"317\" cy=\"129\" r=\"7\" fill=\"#B42318\"/><text x=\"330\" y=\"134\" font-size=\"13\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">醫院</text></svg>"}, {"id": "SC-0-E101", "subj": "自然", "unit": "緒論 科學方法", "point": "科學方法的步驟", "diff": "簡單", "type": "觀念辨識", "q": "科學探究時，「根據已有的知識，對問題提出一個可以檢驗的解釋」是哪一個步驟？", "o": ["提出假說", "得到結論", "蒐集資料", "設計實驗"], "sol": "提出假說是先對問題提出可能的答案，之後再用實驗檢驗它對不對。", "w": ["結論是實驗做完、分析資料後才得到的。", "蒐集資料是實驗進行時的記錄工作。", "設計實驗是規劃怎麼檢驗假說。"], "parent": "假說像先猜答案，實驗是去驗證猜得對不對。"}, {"id": "SC-0-E103", "subj": "自然", "unit": "緒論 科學方法", "point": "控制變因", "diff": "簡單", "type": "觀念辨識", "q": "研究「光照時間對綠豆發芽的影響」時，下列哪一項應該保持相同？", "o": ["每組綠豆的數量", "每組的光照時間", "每組綠豆發芽的數量", "每組發芽所需的天數"], "sol": "除了要研究的光照時間之外，其他條件都要相同，綠豆的數量就是要保持相同的控制變因。", "w": ["光照時間是要刻意改變的操縱變因。", "發芽數量是測量的結果（應變變因）。", "發芽天數也是測量的結果。"], "parent": "公平比較：只改一個，其他通通一樣。"}, {"id": "SC-0-E104", "subj": "自然", "unit": "緒論 科學方法", "point": "實驗室安全：酒精燈", "diff": "簡單", "type": "觀念辨識", "q": "使用酒精燈後要熄滅火焰，正確的做法是什麼？", "o": ["蓋上燈罩", "用嘴巴吹熄", "用手搧熄", "倒水澆熄"], "sol": "熄滅酒精燈要蓋上燈罩，隔絕空氣讓火熄滅。", "w": ["用嘴吹可能把火焰吹進燈內，造成危險。", "用手搧熄可能燙傷，也不容易熄滅。", "倒水可能使燈罩或燈體破裂，酒精四濺。"], "parent": "酒精燈要「蓋」熄，不能「吹」熄。"}, {"id": "SC-0-M101", "subj": "自然", "unit": "緒論 科學方法", "point": "微米換算", "diff": "中等", "type": "計算", "q": "某種細胞的長度約 0.05 毫米（mm），相當於多少微米（μm）？", "o": ["50 微米", "5 微米", "500 微米", "0.00005 微米"], "sol": "1 毫米＝1,000 微米，0.05×1,000＝50 微米。", "w": ["少乘了 10：0.05×1,000＝50。", "多乘了 10：0.05×1,000＝50。", "方向弄反了：換成較小的單位，數字要變大。"], "parent": "換成更小的單位，數字要變大：mm→μm 乘以 1,000。"}, {"id": "SC-0-M102", "subj": "自然", "unit": "緒論 科學方法", "point": "實驗設計：對照組", "diff": "中等", "type": "觀念辨識", "q": "要證明「唾液能分解澱粉」，實驗組在澱粉液中加入唾液。對照組最適合怎麼設計？", "o": ["在等量澱粉液中加入等量的清水", "在等量澱粉液中加入更多唾液", "不放澱粉液，只放唾液", "在澱粉液中加入唾液並放進冰箱"], "sol": "對照組要和實驗組只差一個條件。實驗組加唾液，對照組就加等量清水，其他條件相同，才能看出唾液的作用。", "w": ["加入更多唾液，兩組都有唾液，無法比較有沒有唾液的差別。", "沒有澱粉液，就看不出澱粉有沒有被分解。", "同時改變了「放冰箱」這個條件，兩組差了不只一個條件。"], "parent": "對照組就是「少了要研究的那樣東西」，其他都一樣。"}, {"id": "SC-0-M103", "subj": "自然", "unit": "緒論 科學方法", "point": "重複實驗與平均值", "diff": "中等", "type": "觀念辨識", "q": "小明量同一株植物的高度，三次分別得到 12.1 公分、12.3 公分、12.2 公分。下列做法何者最恰當？", "o": ["取三次的平均值 12.2 公分作為結果", "只採用最大的 12.3 公分", "只採用第一次的 12.1 公分", "三次不一樣，表示實驗失敗，應該全部丟掉"], "sol": "多次測量取平均值，可以減少誤差。(12.1＋12.3＋12.2)÷3＝12.2 公分。", "w": ["只挑最大的數字，會讓結果偏大。", "只用一次的數據，誤差比較大。", "測量本來就會有小誤差，取平均就好，不是實驗失敗。"], "parent": "量三次取平均，比只量一次更可靠。"}, {"id": "SC-0-M104", "subj": "自然", "unit": "緒論 科學方法", "point": "假說與結論的關係", "diff": "中等", "type": "觀念辨識", "q": "實驗結果不支持原本的假說時，下列做法何者正確？", "o": ["如實記錄，修正假說後再設計實驗", "修改部分數據，讓結果符合假說", "不記錄這次結果，重做到符合為止", "改寫結論，說假說大致上正確"], "sol": "科學重視證據。結果不支持假說，也是有價值的發現，應如實記錄，再修正假說、重新實驗。", "w": ["修改數據是造假，違反科學精神。", "只留下符合的結果、丟掉不符合的，也是扭曲證據。", "證據不支持時，不能說假說正確。"], "parent": "實驗結果不如預期也沒關係，誠實記錄，再想想原因。"}, {"id": "SC-0-M105", "subj": "自然", "unit": "緒論 科學方法", "point": "找出操縱變因（表格）", "diff": "中等", "type": "資料判讀", "q": "下表是小華的實驗設計。這個實驗想研究的是什麼？", "o": ["水溫對方糖溶解時間的影響", "水量對方糖溶解時間的影響", "方糖大小對溶解時間的影響", "攪拌對方糖溶解時間的影響"], "sol": "三組只有水溫不同（20°C、40°C、60°C），水量、方糖大小、攪拌方式都相同，所以研究的是水溫的影響。", "w": ["三組水量都是 100 mL，沒有改變。", "三組都用 1 顆方糖，大小相同。", "三組都不攪拌，沒有改變。"], "parent": "找表格中「唯一不一樣」的那一列，那就是操縱變因。", "fig": "<table class=\"fig\"><caption>小華的實驗設計</caption><tr><th>組別</th><th>水溫</th><th>水量</th><th>方糖</th><th>攪拌</th></tr><tr><td>甲</td><td>20°C</td><td>100 mL</td><td>1 顆</td><td>不攪拌</td></tr><tr><td>乙</td><td>40°C</td><td>100 mL</td><td>1 顆</td><td>不攪拌</td></tr><tr><td>丙</td><td>60°C</td><td>100 mL</td><td>1 顆</td><td>不攪拌</td></tr></table>"}, {"id": "SC-0-H101", "subj": "自然", "unit": "緒論 科學方法", "point": "由實驗結果判斷結論是否可靠", "diff": "困難", "type": "資料推論", "q": "小英想知道「施肥會不會讓植物長得比較高」。她只種了甲、乙各 1 株，甲施肥、乙不施肥，兩週後甲比乙高 2 公分。下列評論何者最恰當？", "o": ["每組只有 1 株，應增加株數再比較", "結果已經證明施肥一定能讓所有植物長高", "乙應該也要施肥，兩組才公平", "應該讓甲多澆水，才能看出施肥的效果"], "sol": "每組只有 1 株，結果可能受個別植物差異影響。增加每組株數、取平均，結論才比較可靠。", "w": ["只有 1 株的結果，不能推論到「所有植物」，也不能說「一定」。", "乙是對照組，不施肥才能和甲比較出施肥的效果。", "多澆水會多一個不同的條件，反而無法判斷是施肥還是澆水造成的。"], "parent": "一株植物可能剛好比較會長，多種幾株再比較才準。"}, {"id": "SC-0-H102", "subj": "自然", "unit": "緒論 科學方法", "point": "由數據表判斷變因與結論", "diff": "困難", "type": "資料推論", "q": "下表是不同水溫下，1 顆方糖完全溶解所需的時間（自編資料，其他條件相同）。下列推論何者最合理？", "o": ["在這個實驗範圍內，水溫愈高，方糖溶解得愈快", "水溫愈高，方糖溶解所需時間愈長", "水溫和溶解時間沒有關係", "100°C 時溶解時間一定是 0 秒"], "sol": "水溫從 20°C 升到 60°C，溶解時間從 180 秒減少到 60 秒，表示在這個範圍內，水溫愈高溶解愈快。", "w": ["時間是愈來愈短，不是愈來愈長；時間短代表溶解快。", "時間隨水溫改變，兩者有關係。", "表格只測到 60°C，不能推論 100°C 的結果，更不可能是 0 秒。"], "parent": "看表格的趨勢：溫度上升、時間變短＝溶解變快。結論只說到資料範圍內。", "fig": "<table class=\"fig\"><caption>水溫與方糖溶解時間（自編資料）</caption><tr><th>水溫</th><th>20°C</th><th>40°C</th><th>60°C</th></tr><tr><td>溶解時間</td><td>180 秒</td><td>110 秒</td><td>60 秒</td></tr></table>"}, {"id": "SC-1-1-E101", "subj": "自然", "unit": "1-1 生命現象", "point": "生命現象：感應", "diff": "簡單", "type": "觀念辨識", "q": "手碰到很燙的鍋子會立刻縮回來。這是哪一種生命現象？", "o": ["感應", "生殖", "生長", "代謝"], "sol": "生物對環境的刺激（燙）做出反應（縮手），叫做感應。", "w": ["生殖是產生下一代。", "生長是身體長大。", "代謝是攝取、轉換、排出物質與能量。"], "parent": "刺激→反應，就是感應。"}, {"id": "SC-1-1-E102", "subj": "自然", "unit": "1-1 生命現象", "point": "生命現象：生殖", "diff": "簡單", "type": "觀念辨識", "q": "母貓生下小貓，這屬於哪一種生命現象？", "o": ["生殖", "感應", "代謝", "生長"], "sol": "生物產生下一代，叫做生殖。", "w": ["感應是對刺激產生反應。", "代謝是攝取、轉換和排出物質。", "生長是個體長大，不是產生新的個體。"], "parent": "生出下一代＝生殖。"}, {"id": "SC-1-1-E103", "subj": "自然", "unit": "1-1 生命現象", "point": "生物與非生物", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一個是生物？", "o": ["蘑菇", "機器人", "汽車", "岩石"], "sol": "蘑菇會吸收養分、生長、產生孢子繁殖，具有生命現象，是生物。", "w": ["機器人會動，但不會生長、生殖，不是生物。", "汽車需要燃料，但不會生長和生殖。", "岩石沒有任何生命現象。"], "parent": "判斷生物要看「一整組生命現象」，不是看會不會動。"}, {"id": "SC-1-1-E104", "subj": "自然", "unit": "1-1 生命現象", "point": "代謝的例子", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一項屬於「代謝」？", "o": ["吃下食物，消化吸收後提供能量", "含羞草被碰到葉子合起來", "小狗長成大狗", "植物開花結出種子"], "sol": "代謝是生物攝取物質、在體內轉換並排出廢物的過程，吃東西、消化、呼吸、排泄都是代謝。", "w": ["含羞草葉子合起來是對刺激的反應，屬於感應。", "小狗長大是生長。", "開花結種子是生殖。"], "parent": "吃進去→轉換→排出來，就是代謝。"}, {"id": "SC-1-1-M101", "subj": "自然", "unit": "1-1 生命現象", "point": "判斷生物需看多項生命現象", "diff": "中等", "type": "推理", "q": "火會「長大」、會「移動」，也需要「氧氣」。為什麼火仍然不是生物？", "o": ["火不是由細胞構成，也不會生殖", "火不需要攝取任何物質", "火不會對環境產生任何變化", "火燃燒的時間太短"], "sol": "生物由細胞構成，並具有代謝、生長、感應、生殖等一整組生命現象。火不是由細胞構成，也不會產生下一代，所以不是生物。", "w": ["火需要燃料和氧氣，這不能用來說明火不是生物。", "火遇到風會改變方向，但這不是判斷生物的關鍵；關鍵是有沒有細胞與完整的生命現象。", "存在時間長短不是判斷生物的標準。"], "parent": "只像其中一兩項不夠，要看是不是有細胞、有完整的生命現象。"}, {"id": "SC-1-1-M102", "subj": "自然", "unit": "1-1 生命現象", "point": "細胞學說", "diff": "中等", "type": "觀念辨識", "q": "下列哪一句最符合「細胞學說」的內容？", "o": ["細胞是生物體構造和功能的基本單位", "所有生物都只由一個細胞構成", "細胞只存在於動物體內", "細胞可以從非生物中直接產生"], "sol": "細胞學說指出：生物都由細胞構成，細胞是生物體構造和功能的基本單位，而且細胞由原本存在的細胞產生。", "w": ["生物有單細胞的，也有多細胞的。", "植物、真菌等生物也由細胞構成。", "細胞是由原本存在的細胞分裂產生的。"], "parent": "細胞像房子的磚塊，所有生物都由它組成。"}, {"id": "SC-1-1-M103", "subj": "自然", "unit": "1-1 生命現象", "point": "植物的感應", "diff": "中等", "type": "觀念應用", "q": "把盆栽放在窗邊，過幾天發現莖往窗外的方向彎曲生長。這是植物對什麼刺激產生的感應？", "o": ["光線", "聲音", "土壤中的水分", "溫度降低"], "sol": "窗外光線較強，莖會向光的方向彎曲生長，這是植物對光的感應。", "w": ["植物不會因聲音而改變生長方向。", "澆水的情況沒有改變；莖彎曲的方向是朝向光。", "題目中改變的是光的方向，不是溫度。"], "parent": "植物也會「感應」，只是動作很慢，要幾天才看得出來。"}, {"id": "SC-1-1-E105", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "顯微鏡構造：目鏡", "diff": "簡單", "type": "圖表判讀", "q": "下圖的複式顯微鏡中，眼睛貼近觀察的「目鏡」是哪一個代號？", "o": ["甲", "乙", "丙", "戊"], "sol": "目鏡在鏡筒最上方，是眼睛貼近觀察的地方，圖中是甲。", "w": ["乙是物鏡，靠近玻片。", "丙是載物臺，用來放玻片。", "戊是反光鏡，用來反射光線。"], "parent": "從上往下：目鏡→鏡筒→物鏡→載物臺→光圈→反光鏡。", "fig": "<svg class=\"fig\" viewBox=\"0 0 360 380\" role=\"img\" aria-label=\"複式顯微鏡構造示意圖\"><title>複式顯微鏡構造示意圖</title><g fill=\"#E6EDF5\" stroke=\"#13233A\" stroke-width=\"2\"><rect x=\"60\" y=\"340\" width=\"180\" height=\"26\" rx=\"6\"/><path d=\"M200 340 L200 120 Q200 100 180 100 L162 100 L162 116 L178 116 Q184 116 184 124 L184 340 Z\"/><rect x=\"122\" y=\"40\" width=\"36\" height=\"112\"/><rect x=\"126\" y=\"14\" width=\"28\" height=\"28\"/><rect x=\"106\" y=\"150\" width=\"68\" height=\"14\" rx=\"5\"/><rect x=\"118\" y=\"164\" width=\"16\" height=\"34\"/><rect x=\"146\" y=\"164\" width=\"14\" height=\"24\"/><rect x=\"60\" y=\"210\" width=\"140\" height=\"12\"/><rect x=\"74\" y=\"203\" width=\"22\" height=\"7\"/><rect x=\"164\" y=\"203\" width=\"22\" height=\"7\"/><ellipse cx=\"140\" cy=\"231\" rx=\"20\" ry=\"5\"/><line x1=\"140\" y1=\"236\" x2=\"140\" y2=\"272\"/><ellipse cx=\"140\" cy=\"290\" rx=\"24\" ry=\"12\" transform=\"rotate(-20 140 290)\"/><circle cx=\"198\" cy=\"170\" r=\"14\"/><circle cx=\"198\" cy=\"205\" r=\"9\"/></g><line x1=\"140\" y1=\"28\" x2=\"40\" y2=\"28\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><line x1=\"128\" y1=\"182\" x2=\"40\" y2=\"182\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"188\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><line x1=\"95\" y1=\"216\" x2=\"40\" y2=\"216\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"222\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text><line x1=\"160\" y1=\"231\" x2=\"296\" y2=\"231\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"237\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丁</text><line x1=\"140\" y1=\"290\" x2=\"40\" y2=\"290\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"296\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">戊</text><line x1=\"212\" y1=\"170\" x2=\"296\" y2=\"170\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"176\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">己</text><line x1=\"208\" y1=\"205\" x2=\"296\" y2=\"205\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"211\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">庚</text></svg>"}, {"id": "SC-1-1-E106", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "顯微鏡構造：反光鏡的功能", "diff": "簡單", "type": "圖表判讀", "q": "下圖中戊的構造，主要功能是什麼？", "o": ["把光線反射到玻片上", "放大物體的影像", "固定玻片", "調整焦距"], "sol": "戊是反光鏡，能把光線反射向上，穿過玻片和鏡頭進入眼睛。", "w": ["放大影像的是目鏡和物鏡。", "固定玻片的是載物臺上的壓片夾。", "調整焦距的是粗、細調節輪。"], "parent": "反光鏡像小鏡子，把光往上送。", "fig": "<svg class=\"fig\" viewBox=\"0 0 360 380\" role=\"img\" aria-label=\"複式顯微鏡構造示意圖\"><title>複式顯微鏡構造示意圖</title><g fill=\"#E6EDF5\" stroke=\"#13233A\" stroke-width=\"2\"><rect x=\"60\" y=\"340\" width=\"180\" height=\"26\" rx=\"6\"/><path d=\"M200 340 L200 120 Q200 100 180 100 L162 100 L162 116 L178 116 Q184 116 184 124 L184 340 Z\"/><rect x=\"122\" y=\"40\" width=\"36\" height=\"112\"/><rect x=\"126\" y=\"14\" width=\"28\" height=\"28\"/><rect x=\"106\" y=\"150\" width=\"68\" height=\"14\" rx=\"5\"/><rect x=\"118\" y=\"164\" width=\"16\" height=\"34\"/><rect x=\"146\" y=\"164\" width=\"14\" height=\"24\"/><rect x=\"60\" y=\"210\" width=\"140\" height=\"12\"/><rect x=\"74\" y=\"203\" width=\"22\" height=\"7\"/><rect x=\"164\" y=\"203\" width=\"22\" height=\"7\"/><ellipse cx=\"140\" cy=\"231\" rx=\"20\" ry=\"5\"/><line x1=\"140\" y1=\"236\" x2=\"140\" y2=\"272\"/><ellipse cx=\"140\" cy=\"290\" rx=\"24\" ry=\"12\" transform=\"rotate(-20 140 290)\"/><circle cx=\"198\" cy=\"170\" r=\"14\"/><circle cx=\"198\" cy=\"205\" r=\"9\"/></g><line x1=\"140\" y1=\"28\" x2=\"40\" y2=\"28\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><line x1=\"128\" y1=\"182\" x2=\"40\" y2=\"182\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"188\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><line x1=\"95\" y1=\"216\" x2=\"40\" y2=\"216\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"222\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text><line x1=\"160\" y1=\"231\" x2=\"296\" y2=\"231\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"237\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丁</text><line x1=\"140\" y1=\"290\" x2=\"40\" y2=\"290\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"296\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">戊</text><line x1=\"212\" y1=\"170\" x2=\"296\" y2=\"170\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"176\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">己</text><line x1=\"208\" y1=\"205\" x2=\"296\" y2=\"205\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"211\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">庚</text></svg>"}, {"id": "SC-1-1-M104", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "高倍時使用細調節輪", "diff": "中等", "type": "圖表判讀", "q": "使用高倍物鏡觀察時，若影像稍微模糊，應轉動下圖中的哪一個構造來調整？", "o": ["庚", "己", "丁", "戊"], "sol": "高倍時物鏡很靠近玻片，只能用細調節輪（庚）微調，避免物鏡壓破玻片。", "w": ["己是粗調節輪，調整幅度大，高倍時使用容易壓破玻片。", "丁是光圈，調整的是亮度，不是清晰度。", "戊是反光鏡，調整的是光線來源。"], "parent": "低倍用粗調、高倍用細調。", "fig": "<svg class=\"fig\" viewBox=\"0 0 360 380\" role=\"img\" aria-label=\"複式顯微鏡構造示意圖\"><title>複式顯微鏡構造示意圖</title><g fill=\"#E6EDF5\" stroke=\"#13233A\" stroke-width=\"2\"><rect x=\"60\" y=\"340\" width=\"180\" height=\"26\" rx=\"6\"/><path d=\"M200 340 L200 120 Q200 100 180 100 L162 100 L162 116 L178 116 Q184 116 184 124 L184 340 Z\"/><rect x=\"122\" y=\"40\" width=\"36\" height=\"112\"/><rect x=\"126\" y=\"14\" width=\"28\" height=\"28\"/><rect x=\"106\" y=\"150\" width=\"68\" height=\"14\" rx=\"5\"/><rect x=\"118\" y=\"164\" width=\"16\" height=\"34\"/><rect x=\"146\" y=\"164\" width=\"14\" height=\"24\"/><rect x=\"60\" y=\"210\" width=\"140\" height=\"12\"/><rect x=\"74\" y=\"203\" width=\"22\" height=\"7\"/><rect x=\"164\" y=\"203\" width=\"22\" height=\"7\"/><ellipse cx=\"140\" cy=\"231\" rx=\"20\" ry=\"5\"/><line x1=\"140\" y1=\"236\" x2=\"140\" y2=\"272\"/><ellipse cx=\"140\" cy=\"290\" rx=\"24\" ry=\"12\" transform=\"rotate(-20 140 290)\"/><circle cx=\"198\" cy=\"170\" r=\"14\"/><circle cx=\"198\" cy=\"205\" r=\"9\"/></g><line x1=\"140\" y1=\"28\" x2=\"40\" y2=\"28\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><line x1=\"128\" y1=\"182\" x2=\"40\" y2=\"182\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"188\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><line x1=\"95\" y1=\"216\" x2=\"40\" y2=\"216\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"222\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text><line x1=\"160\" y1=\"231\" x2=\"296\" y2=\"231\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"237\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丁</text><line x1=\"140\" y1=\"290\" x2=\"40\" y2=\"290\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"296\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">戊</text><line x1=\"212\" y1=\"170\" x2=\"296\" y2=\"170\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"176\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">己</text><line x1=\"208\" y1=\"205\" x2=\"296\" y2=\"205\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"211\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">庚</text></svg>"}, {"id": "SC-1-1-M105", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "視野太暗時的調整", "diff": "中等", "type": "圖表判讀", "q": "換成高倍物鏡後視野變暗。下列哪一種做法可以讓視野變亮？", "o": ["把丁（光圈）調大", "轉動己（粗調節輪）", "把玻片往右移", "換成倍率更高的物鏡"], "sol": "光圈能控制進光量，把光圈調大，進入的光變多，視野變亮。也可以調整反光鏡。", "w": ["粗調節輪是調焦距，不會讓視野變亮；高倍時也不該用粗調。", "移動玻片只改變觀察的位置，不改變亮度。", "倍率愈高，視野通常愈暗。"], "parent": "暗了就把「門」（光圈）開大，讓更多光進來。", "fig": "<svg class=\"fig\" viewBox=\"0 0 360 380\" role=\"img\" aria-label=\"複式顯微鏡構造示意圖\"><title>複式顯微鏡構造示意圖</title><g fill=\"#E6EDF5\" stroke=\"#13233A\" stroke-width=\"2\"><rect x=\"60\" y=\"340\" width=\"180\" height=\"26\" rx=\"6\"/><path d=\"M200 340 L200 120 Q200 100 180 100 L162 100 L162 116 L178 116 Q184 116 184 124 L184 340 Z\"/><rect x=\"122\" y=\"40\" width=\"36\" height=\"112\"/><rect x=\"126\" y=\"14\" width=\"28\" height=\"28\"/><rect x=\"106\" y=\"150\" width=\"68\" height=\"14\" rx=\"5\"/><rect x=\"118\" y=\"164\" width=\"16\" height=\"34\"/><rect x=\"146\" y=\"164\" width=\"14\" height=\"24\"/><rect x=\"60\" y=\"210\" width=\"140\" height=\"12\"/><rect x=\"74\" y=\"203\" width=\"22\" height=\"7\"/><rect x=\"164\" y=\"203\" width=\"22\" height=\"7\"/><ellipse cx=\"140\" cy=\"231\" rx=\"20\" ry=\"5\"/><line x1=\"140\" y1=\"236\" x2=\"140\" y2=\"272\"/><ellipse cx=\"140\" cy=\"290\" rx=\"24\" ry=\"12\" transform=\"rotate(-20 140 290)\"/><circle cx=\"198\" cy=\"170\" r=\"14\"/><circle cx=\"198\" cy=\"205\" r=\"9\"/></g><line x1=\"140\" y1=\"28\" x2=\"40\" y2=\"28\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><line x1=\"128\" y1=\"182\" x2=\"40\" y2=\"182\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"188\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><line x1=\"95\" y1=\"216\" x2=\"40\" y2=\"216\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"222\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text><line x1=\"160\" y1=\"231\" x2=\"296\" y2=\"231\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"237\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丁</text><line x1=\"140\" y1=\"290\" x2=\"40\" y2=\"290\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"296\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">戊</text><line x1=\"212\" y1=\"170\" x2=\"296\" y2=\"170\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"176\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">己</text><line x1=\"208\" y1=\"205\" x2=\"296\" y2=\"205\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"211\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">庚</text></svg>"}, {"id": "SC-1-1-M106", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "複式與解剖顯微鏡的比較", "diff": "中等", "type": "比較判斷", "q": "關於解剖顯微鏡和複式顯微鏡，下列敘述何者正確？", "o": ["解剖顯微鏡影像正立，適合看較大的物體", "解剖顯微鏡的倍率比複式顯微鏡高很多", "複式顯微鏡看到的影像是正立而立體的", "複式顯微鏡最適合觀察整隻螞蟻的外形"], "sol": "解剖顯微鏡倍率較低，影像正立而且有立體感，適合觀察較大的物體（如昆蟲、花）。複式顯微鏡倍率較高，影像上下左右顛倒，適合觀察很薄、能透光的玻片。", "w": ["解剖顯微鏡倍率較低。", "複式顯微鏡的影像是上下左右顛倒的。", "整隻螞蟻較厚、不透光，適合用解剖顯微鏡。"], "parent": "解剖顯微鏡：看大東西、正立；複式顯微鏡：看細胞、顛倒。"}, {"id": "SC-1-1-M107", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "觀察的正確順序", "diff": "中等", "type": "排序", "q": "使用複式顯微鏡由低倍換到高倍觀察，下列步驟的正確順序為何？\n甲、轉動旋轉盤換成高倍物鏡\n乙、用低倍物鏡找到要觀察的物體\n丙、把物體移到視野中央\n丁、用細調節輪調整清晰", "o": ["乙→丙→甲→丁", "甲→乙→丙→丁", "乙→甲→丙→丁", "丙→乙→丁→甲"], "sol": "先用低倍找到物體（乙），移到中央（丙），再換高倍（甲），最後用細調節輪對焦（丁）。", "w": ["要先在低倍下找到物體，不能一開始就用高倍。", "換高倍前要先把物體移到中央，否則換了高倍可能看不到。", "要先找到物體才能移到中央。"], "parent": "先找→移中間→換高倍→微調。"}, {"id": "SC-1-1-M108", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "影像移動方向", "diff": "中等", "type": "推理", "q": "在複式顯微鏡下，影像位在視野的左下方。要把它移到中央，玻片應該往哪個方向移動？", "o": ["左下方", "右上方", "左上方", "右下方"], "sol": "複式顯微鏡的影像和玻片移動方向相反。影像在左下方，玻片也往左下方移，影像就會往右上方移回中央。", "w": ["玻片往右上移，影像會往左下跑，離中央更遠。", "方向只對了一半。", "方向只對了一半。"], "parent": "影像在哪裡，玻片就往哪裡推。"}, {"id": "SC-1-1-M109", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "放大倍率與看到的面積", "diff": "中等", "type": "計算", "q": "目鏡 10×、物鏡 10× 時，視野中佈滿了 64 個細胞。若換成物鏡 40×（目鏡不變），視野中大約能看到幾個細胞？", "o": ["4 個", "16 個", "256 個", "64 個"], "sol": "倍率變成 4 倍，長和寬各放大 4 倍，看到的面積變成原來的 1/16。64÷16＝4 個。", "w": ["只除以 4；佈滿視野時要除以倍數的平方 16。", "倍率變大，看到的細胞會變少，不會變多。", "倍率改變，看到的細胞數會改變。"], "parent": "佈滿視野：長、寬都縮小 4 倍，面積縮小 16 倍。"}, {"id": "SC-1-1-H101", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "由多組鏡頭判斷看到最多細胞的組合", "diff": "困難", "type": "整合推理", "q": "有下列四組鏡頭組合。哪一組看到的細胞「數目最多」、而且「視野最亮」？", "o": ["目鏡 5×、物鏡 10×", "目鏡 10×、物鏡 10×", "目鏡 10×、物鏡 40×", "目鏡 15×、物鏡 40×"], "sol": "總倍率分別是 50、100、400、600 倍。倍率愈低，看到的範圍愈大、細胞數愈多，而且視野愈亮。50 倍最低。", "w": ["總倍率 100 倍，比 50 倍高，看到的細胞較少。", "總倍率 400 倍，看到的細胞更少、視野更暗。", "總倍率 600 倍最高，看到的細胞最少、最暗。"], "parent": "先算總倍率，再記住：倍率低＝看得多、比較亮。"}, {"id": "SC-1-1-H102", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "物鏡長短與倍率、工作距離", "diff": "困難", "type": "推理", "q": "下圖的乙是物鏡，有長、短兩支。一般來說，較長的物鏡倍率較高。用較長的物鏡對焦清楚時，和用較短的物鏡相比，下列敘述何者正確？", "o": ["物鏡離玻片較近，視野較暗", "物鏡離玻片較遠，視野較亮", "看到的細胞數目較多", "看到的細胞看起來較小"], "sol": "較長的物鏡倍率較高，對焦時物鏡離玻片較近；倍率高時，看到的範圍小、細胞數少、細胞看起來大，視野也較暗。", "w": ["倍率高時物鏡離玻片較近，而且視野較暗。", "倍率高時看到的範圍較小，細胞數目較少。", "倍率高時細胞看起來較大。"], "parent": "高倍物鏡：長、近、暗、少、大。", "fig": "<svg class=\"fig\" viewBox=\"0 0 360 380\" role=\"img\" aria-label=\"複式顯微鏡構造示意圖\"><title>複式顯微鏡構造示意圖</title><g fill=\"#E6EDF5\" stroke=\"#13233A\" stroke-width=\"2\"><rect x=\"60\" y=\"340\" width=\"180\" height=\"26\" rx=\"6\"/><path d=\"M200 340 L200 120 Q200 100 180 100 L162 100 L162 116 L178 116 Q184 116 184 124 L184 340 Z\"/><rect x=\"122\" y=\"40\" width=\"36\" height=\"112\"/><rect x=\"126\" y=\"14\" width=\"28\" height=\"28\"/><rect x=\"106\" y=\"150\" width=\"68\" height=\"14\" rx=\"5\"/><rect x=\"118\" y=\"164\" width=\"16\" height=\"34\"/><rect x=\"146\" y=\"164\" width=\"14\" height=\"24\"/><rect x=\"60\" y=\"210\" width=\"140\" height=\"12\"/><rect x=\"74\" y=\"203\" width=\"22\" height=\"7\"/><rect x=\"164\" y=\"203\" width=\"22\" height=\"7\"/><ellipse cx=\"140\" cy=\"231\" rx=\"20\" ry=\"5\"/><line x1=\"140\" y1=\"236\" x2=\"140\" y2=\"272\"/><ellipse cx=\"140\" cy=\"290\" rx=\"24\" ry=\"12\" transform=\"rotate(-20 140 290)\"/><circle cx=\"198\" cy=\"170\" r=\"14\"/><circle cx=\"198\" cy=\"205\" r=\"9\"/></g><line x1=\"140\" y1=\"28\" x2=\"40\" y2=\"28\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><line x1=\"128\" y1=\"182\" x2=\"40\" y2=\"182\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"188\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><line x1=\"95\" y1=\"216\" x2=\"40\" y2=\"216\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"222\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text><line x1=\"160\" y1=\"231\" x2=\"296\" y2=\"231\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"237\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丁</text><line x1=\"140\" y1=\"290\" x2=\"40\" y2=\"290\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"8\" y=\"296\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">戊</text><line x1=\"212\" y1=\"170\" x2=\"296\" y2=\"170\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"176\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">己</text><line x1=\"208\" y1=\"205\" x2=\"296\" y2=\"205\" stroke=\"#B42318\" stroke-width=\"1.5\"/><text x=\"300\" y=\"211\" font-size=\"18\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">庚</text></svg>"}, {"id": "SC-1-2-E101", "subj": "自然", "unit": "1-2 細胞", "point": "細胞核的功能", "diff": "簡單", "type": "觀念辨識", "q": "細胞中含有遺傳物質、控制細胞生命活動的構造是什麼？", "o": ["細胞核", "細胞壁", "液泡", "細胞膜"], "sol": "細胞核含有遺傳物質，控制細胞的生命活動。", "w": ["細胞壁支持和保護植物細胞。", "液泡主要儲存水分和物質。", "細胞膜控制物質進出細胞。"], "parent": "細胞核像學校的校長室，負責指揮。"}, {"id": "SC-1-2-E104", "subj": "自然", "unit": "1-2 細胞", "point": "植物細胞特有構造（圖）", "diff": "簡單", "type": "圖表判讀", "q": "下圖中甲是植物細胞、乙是動物細胞。圖中標示的哪一個構造，只有甲有、乙沒有？", "o": ["1（細胞壁）", "4（細胞核）", "7（細胞核）", "8（細胞質）"], "sol": "細胞壁只存在植物細胞，動物細胞沒有。圖中 1 是甲的細胞壁。", "w": ["4 是植物細胞的細胞核，動物細胞也有細胞核（7）。", "7 是動物細胞的細胞核，兩種細胞都有。", "8 是動物細胞的細胞質，兩種細胞都有。"], "parent": "植物細胞外面多一層「外牆」（細胞壁），動物沒有。", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 260\" role=\"img\" aria-label=\"植物細胞與動物細胞示意圖\"><title>植物細胞與動物細胞示意圖</title><rect x=\"20\" y=\"30\" width=\"220\" height=\"180\" fill=\"#EAF6E9\" stroke=\"#14703F\" stroke-width=\"7\"/><rect x=\"30\" y=\"40\" width=\"200\" height=\"160\" fill=\"none\" stroke=\"#2F6E3A\" stroke-width=\"1.5\"/><rect x=\"70\" y=\"70\" width=\"120\" height=\"100\" rx=\"20\" fill=\"#D7E9F7\" stroke=\"#1F5FAD\" stroke-width=\"1.5\"/><circle cx=\"205\" cy=\"70\" r=\"16\" fill=\"#C9B8E0\" stroke=\"#6B3FA0\" stroke-width=\"1.5\"/><ellipse cx=\"50\" cy=\"60\" rx=\"12\" ry=\"7\" fill=\"#3E9B4F\"/><ellipse cx=\"55\" cy=\"185\" rx=\"12\" ry=\"7\" fill=\"#3E9B4F\"/><ellipse cx=\"210\" cy=\"180\" rx=\"12\" ry=\"7\" fill=\"#3E9B4F\"/><ellipse cx=\"45\" cy=\"125\" rx=\"7\" ry=\"12\" fill=\"#3E9B4F\"/><text x=\"130\" y=\"240\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">甲</text><ellipse cx=\"390\" cy=\"120\" rx=\"95\" ry=\"80\" fill=\"#FBEFE9\" stroke=\"#B4462B\" stroke-width=\"1.5\"/><circle cx=\"390\" cy=\"120\" r=\"22\" fill=\"#C9B8E0\" stroke=\"#6B3FA0\" stroke-width=\"1.5\"/><text x=\"390\" y=\"240\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">乙</text><circle cx=\"20\" cy=\"120\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"20\" y=\"125\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">1</text><circle cx=\"130\" cy=\"120\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"130\" y=\"125\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">3</text><circle cx=\"205\" cy=\"70\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"205\" y=\"75\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">4</text><circle cx=\"50\" cy=\"60\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"50\" y=\"65\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">5</text><circle cx=\"480\" cy=\"120\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"480\" y=\"125\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">6</text><circle cx=\"390\" cy=\"120\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"390\" y=\"125\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">7</text><circle cx=\"330\" cy=\"160\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"330\" y=\"165\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">8</text></svg>"}, {"id": "SC-1-2-M101", "subj": "自然", "unit": "1-2 細胞", "point": "液泡的特徵（圖）", "diff": "中等", "type": "圖表判讀", "q": "下圖甲中標示 3 的構造，在成熟植物細胞中常常很大。它主要的功能是什麼？", "o": ["儲存水分和其他物質", "進行光合作用", "控制物質進出", "支持細胞的形狀，像外牆"], "sol": "3 是液泡，成熟植物細胞常有大液泡，用來儲存水分和其他物質。", "w": ["進行光合作用的是葉綠體（5）。", "控制物質進出的是細胞膜。", "像外牆支持形狀的是細胞壁（1）。"], "parent": "液泡像細胞裡的水袋。", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 260\" role=\"img\" aria-label=\"植物細胞與動物細胞示意圖\"><title>植物細胞與動物細胞示意圖</title><rect x=\"20\" y=\"30\" width=\"220\" height=\"180\" fill=\"#EAF6E9\" stroke=\"#14703F\" stroke-width=\"7\"/><rect x=\"30\" y=\"40\" width=\"200\" height=\"160\" fill=\"none\" stroke=\"#2F6E3A\" stroke-width=\"1.5\"/><rect x=\"70\" y=\"70\" width=\"120\" height=\"100\" rx=\"20\" fill=\"#D7E9F7\" stroke=\"#1F5FAD\" stroke-width=\"1.5\"/><circle cx=\"205\" cy=\"70\" r=\"16\" fill=\"#C9B8E0\" stroke=\"#6B3FA0\" stroke-width=\"1.5\"/><ellipse cx=\"50\" cy=\"60\" rx=\"12\" ry=\"7\" fill=\"#3E9B4F\"/><ellipse cx=\"55\" cy=\"185\" rx=\"12\" ry=\"7\" fill=\"#3E9B4F\"/><ellipse cx=\"210\" cy=\"180\" rx=\"12\" ry=\"7\" fill=\"#3E9B4F\"/><ellipse cx=\"45\" cy=\"125\" rx=\"7\" ry=\"12\" fill=\"#3E9B4F\"/><text x=\"130\" y=\"240\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">甲</text><ellipse cx=\"390\" cy=\"120\" rx=\"95\" ry=\"80\" fill=\"#FBEFE9\" stroke=\"#B4462B\" stroke-width=\"1.5\"/><circle cx=\"390\" cy=\"120\" r=\"22\" fill=\"#C9B8E0\" stroke=\"#6B3FA0\" stroke-width=\"1.5\"/><text x=\"390\" y=\"240\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">乙</text><circle cx=\"20\" cy=\"120\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"20\" y=\"125\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">1</text><circle cx=\"130\" cy=\"120\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"130\" y=\"125\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">3</text><circle cx=\"205\" cy=\"70\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"205\" y=\"75\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">4</text><circle cx=\"50\" cy=\"60\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"50\" y=\"65\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">5</text><circle cx=\"480\" cy=\"120\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"480\" y=\"125\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">6</text><circle cx=\"390\" cy=\"120\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"390\" y=\"125\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">7</text><circle cx=\"330\" cy=\"160\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#B42318\" stroke-width=\"2\"/><text x=\"330\" y=\"165\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">8</text></svg>"}, {"id": "SC-1-2-M102", "subj": "自然", "unit": "1-2 細胞", "point": "口腔皮膜細胞觀察需染色", "diff": "中等", "type": "觀念應用", "q": "觀察口腔皮膜細胞時，通常會滴加亞甲藍液。主要目的是什麼？", "o": ["使細胞核等構造染色，較易看清", "讓細胞保持活著，可以觀察比較久", "讓細胞膨脹變大，比較容易看到", "把細胞裡的細菌殺死，避免汙染"], "sol": "口腔皮膜細胞幾乎透明，滴加亞甲藍液可以把細胞核染色，觀察時比較清楚。", "w": ["染色的目的不是讓細胞活得久。", "染色不會讓細胞變大；放大要靠鏡頭。", "染色是為了觀察，不是殺菌。"], "parent": "細胞像透明玻璃，染上顏色才看得清楚。"}, {"id": "SC-1-2-M103", "subj": "自然", "unit": "1-2 細胞", "point": "保衛細胞有葉綠體", "diff": "中等", "type": "觀念辨識", "q": "觀察鴨跖草葉片的下表皮，下列哪一種細胞可以看到葉綠體？", "o": ["保衛細胞", "一般的表皮細胞", "兩者都看不到", "兩者都很多"], "sol": "鴨跖草下表皮的一般表皮細胞看不到葉綠體；組成氣孔的保衛細胞含有葉綠體。", "w": ["一般表皮細胞看不到葉綠體。", "保衛細胞看得到葉綠體。", "一般表皮細胞看不到葉綠體。"], "parent": "氣孔旁邊那兩個像豆子的細胞（保衛細胞）是綠色的。"}, {"id": "SC-1-2-M104", "subj": "自然", "unit": "1-2 細胞", "point": "動植物細胞的共同構造", "diff": "中等", "type": "比較判斷", "q": "下列哪一組構造，是植物細胞和動物細胞「都有」的？", "o": ["細胞膜、細胞質、細胞核", "細胞壁、細胞膜、細胞核", "葉綠體、細胞膜、細胞核", "細胞壁、葉綠體、液泡"], "sol": "常見的動植物細胞都有細胞膜、細胞質和細胞核。細胞壁和葉綠體是植物細胞才有。", "w": ["動物細胞沒有細胞壁。", "動物細胞沒有葉綠體。", "動物細胞沒有細胞壁和葉綠體。"], "parent": "動植物都有「膜、質、核」三樣；植物多了「壁」和「葉綠體」。"}, {"id": "SC-1-2-M105", "subj": "自然", "unit": "1-2 細胞", "point": "根細胞沒有葉綠體", "diff": "中等", "type": "推理", "q": "洋蔥鱗葉表皮細胞和植物的根部細胞，觀察時都看不到葉綠體。最可能的原因是什麼？", "o": ["這些部位照不到光，細胞不含葉綠體", "它們其實是動物細胞，所以沒有葉綠體", "葉綠體被厚厚的細胞壁擋住而看不到", "顯微鏡倍率太高，所以看不到葉綠體"], "sol": "葉綠體多存在於綠色、照得到光的部位（例如葉肉）。鱗葉表皮和根部細胞通常照不到光，細胞中沒有葉綠體。這兩種細胞仍有細胞壁，是植物細胞。", "w": ["它們有細胞壁，仍是植物細胞。", "細胞壁不會擋住葉綠體；葉肉細胞也有細胞壁，卻看得到葉綠體。", "葉綠體在適當倍率下看得到，這裡是本來就沒有。"], "parent": "綠色的部位才有葉綠體；長在土裡的根、包在裡面的鱗葉，通常沒有。"}, {"id": "SC-1-2-H101", "subj": "自然", "unit": "1-2 細胞", "point": "由觀察紀錄判斷細胞種類", "diff": "困難", "type": "資料推論", "q": "下表是三種細胞的觀察紀錄（自編）。哪一種細胞「最可能是動物細胞」？", "o": ["丙", "甲", "乙", "三種都是植物細胞"], "sol": "丙沒有細胞壁，也沒有葉綠體，但有細胞核和細胞膜，最符合動物細胞。甲有葉綠體和細胞壁；乙有細胞壁，都是植物細胞的特徵。", "w": ["甲有細胞壁和葉綠體，是植物細胞。", "乙雖然沒有葉綠體，但有細胞壁，仍是植物細胞（例如根部細胞）。", "丙沒有細胞壁，不是植物細胞。"], "parent": "判斷動植物細胞，關鍵看「細胞壁」：有＝植物，沒有＝動物。葉綠體只能當輔助線索。", "fig": "<table class=\"fig\"><caption>三種細胞的觀察紀錄（自編）</caption><tr><th>細胞</th><th>細胞壁</th><th>葉綠體</th><th>細胞核</th></tr><tr><td>甲</td><td>有</td><td>有</td><td>有</td></tr><tr><td>乙</td><td>有</td><td>沒有</td><td>有</td></tr><tr><td>丙</td><td>沒有</td><td>沒有</td><td>有</td></tr></table>"}, {"id": "SC-1-2-H102", "subj": "自然", "unit": "1-2 細胞", "point": "細胞構造與功能的整合判斷", "diff": "困難", "type": "整合推理", "q": "某種細胞能利用光製造養分，也需要分解養分釋放能量。這種細胞中「一定」需要有哪兩種構造？", "o": ["葉綠體和粒線體", "葉綠體和細胞壁", "粒線體和液泡", "細胞壁和液泡"], "sol": "利用光製造養分要靠葉綠體；分解養分釋放能量要靠粒線體。題目描述的兩個功能，分別對應這兩種胞器。", "w": ["細胞壁負責支持保護，不負責題目說的兩種功能。", "液泡負責儲存，不負責釋放能量。", "細胞壁和液泡都不負責製造養分或釋放能量。"], "parent": "一個功能配一個構造：製造養分→葉綠體；釋放能量→粒線體。"}, {"id": "SC-1-3-E101", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "細胞中含量最多的物質", "diff": "簡單", "type": "觀念辨識", "q": "細胞中含量最多的物質是什麼？", "o": ["水", "蛋白質", "醣類", "脂質"], "sol": "水是細胞中含量最多的物質，許多生命活動都要在水中進行。", "w": ["蛋白質很重要，但含量比水少。", "醣類的含量比水少。", "脂質的含量比水少。"], "parent": "人體大部分是水，細胞也一樣。"}, {"id": "SC-1-3-E102", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "擴散的例子", "diff": "簡單", "type": "觀念辨識", "q": "在房間一角噴香水，過一會兒整個房間都聞得到。這是哪一種現象？", "o": ["擴散", "滲透", "光合作用", "呼吸作用"], "sol": "香水的粒子從濃度高的地方散到濃度低的地方，叫做擴散。", "w": ["滲透專指水通過膜的移動。", "光合作用是植物製造養分。", "呼吸作用是分解養分釋放能量。"], "parent": "擴散像香味從濃的地方慢慢散開。"}, {"id": "SC-1-3-E103", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "滲透的定義", "diff": "簡單", "type": "觀念辨識", "q": "「水通過細胞膜這類薄膜移動」的現象叫做什麼？", "o": ["滲透", "擴散", "蒸發", "代謝"], "sol": "滲透是水通過選擇性通透的膜移動的現象。", "w": ["擴散泛指粒子由濃度高處往低處散開，不限於水，也不一定要通過膜。", "蒸發是液體變成氣體。", "代謝是生物體內物質與能量的轉換。"], "parent": "滲透只講「水」穿過「膜」。"}, {"id": "SC-1-3-E104", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "組成生物的主要元素", "diff": "簡單", "type": "記憶辨識", "q": "組成生物體的物質，主要由哪幾種元素構成？", "o": ["碳、氫、氧、氮", "鈣、鐵、鈉、鉀", "碳、鐵、鈣、氧", "氫、氦、鈉、氯"], "sol": "生物體中的醣類、蛋白質、脂質等，主要由碳（C）、氫（H）、氧（O）、氮（N）等元素構成。", "w": ["鈣、鐵、鈉、鉀是礦物質，身體需要，但含量少，不是主要元素。", "鐵、鈣在生物體中含量少，不是主要組成元素。", "氦是不太會形成化合物的氣體，鈉、氯也不是主要組成元素。"], "parent": "記「CHON」：碳氫氧氮。"}, {"id": "SC-1-3-M101", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "紅血球放入清水", "diff": "中等", "type": "推理", "q": "把紅血球放進清水中，一段時間後最可能發生什麼事？", "o": ["水進入細胞，細胞膨脹甚至破裂", "水離開細胞，細胞縮小", "細胞完全不變", "水進入細胞，但因為有細胞壁而不會破"], "sol": "清水比紅血球內淡，水滲透進入細胞。動物細胞沒有細胞壁保護，可能膨脹到破裂。", "w": ["水往比較濃的一側移動；清水比細胞內淡，水會進入細胞。", "細胞內外濃度不同，水會移動。", "紅血球是動物細胞，沒有細胞壁保護，可能脹破。"], "parent": "紅血球像沒有外殼的水球，水一直灌進去就會破。"}, {"id": "SC-1-3-M102", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "植物細胞放入清水不破裂", "diff": "中等", "type": "比較判斷", "q": "把動物細胞和植物細胞都放進清水中。為什麼動物細胞可能破裂，植物細胞卻不會？", "o": ["植物細胞有細胞壁支持", "植物細胞沒有細胞膜", "植物細胞不吸水", "植物細胞有葉綠體保護"], "sol": "兩種細胞都會吸水膨脹，但植物細胞外有細胞壁支撐，限制細胞繼續膨脹，所以不會破裂。", "w": ["植物細胞也有細胞膜，在細胞壁內側。", "植物細胞也會吸水，液泡會膨大。", "葉綠體負責光合作用，不負責防止破裂。"], "parent": "細胞壁像氣球外面的網子，氣球再脹也撐得住。"}, {"id": "SC-1-3-M104", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "擴散與溫度", "diff": "中等", "type": "推理", "q": "在熱水和冷水中各滴一滴紅墨水，哪一杯的紅色比較快散開？", "o": ["熱水", "冷水", "一樣快", "都不會散開"], "sol": "溫度較高時粒子運動較快，擴散也較快，所以熱水中的紅墨水比較快散開。", "w": ["冷水中粒子運動較慢，擴散較慢。", "溫度不同，擴散速度不同。", "墨水會擴散，只是快慢不同。"], "parent": "熱的時候粒子跑得快，散得也快。"}, {"id": "SC-1-3-M105", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "細胞膜具有選擇性", "diff": "中等", "type": "觀念辨識", "q": "「細胞膜具有選擇性」的意思是什麼？", "o": ["某些物質能通過，某些物質不容易通過", "所有物質都可以自由通過細胞膜", "只有分子很大的物質才能通過細胞膜", "所有物質都完全不能通過細胞膜"], "sol": "細胞膜像門禁，會控制哪些物質可以進出，不是全部都能通過，也不是全部擋住。", "w": ["細胞膜會控制進出，不是所有物質都能自由通過。", "剛好相反：大分子通常比較不容易通過。", "細胞需要的水和養分可以通過，不是全部擋住。"], "parent": "像捷運閘門：有票的進得去，沒票的進不去。"}, {"id": "SC-1-3-H101", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "由實驗結果推論半透膜（自製膜袋）", "diff": "困難", "type": "資料推論", "q": "把裝有澱粉液和葡萄糖液的膜袋放入清水中（膜袋相當於選擇性通透的膜）。30 分鐘後檢驗袋外的水：滴碘液不變藍黑色；加本氏液加熱後出現橙紅色。下列推論何者最合理？", "o": ["葡萄糖能通過這層膜，澱粉不能通過", "澱粉能通過這層膜，葡萄糖不能通過", "兩種物質都能通過這層膜", "兩種物質都不能通過這層膜"], "sol": "袋外滴碘液不變藍黑，表示袋外沒有澱粉，澱粉沒有通過；袋外本氏液呈橙紅色，表示袋外有葡萄糖，葡萄糖通過了膜。", "w": ["碘液沒有變藍黑，表示澱粉沒有出來。", "碘液沒有變藍黑，表示澱粉沒有通過。", "本氏液出現橙紅色，表示葡萄糖出來了。"], "parent": "先把兩個檢驗結果翻譯成「有沒有澱粉」「有沒有葡萄糖」，再推論誰通過了膜。"}, {"id": "SC-1-4-E101", "subj": "自然", "unit": "1-4 從細胞到個體", "point": "組織的定義", "diff": "簡單", "type": "觀念辨識", "q": "「一群形態相似、功能相同的細胞聚集在一起」稱為什麼？", "o": ["組織", "器官", "器官系統", "個體"], "sol": "形態相似、功能相同的細胞聚在一起，就是組織，例如肌肉組織。", "w": ["器官是由多種組織組成。", "器官系統是由多個器官組成。", "個體是完整的生物。"], "parent": "同一種細胞一群＝組織。"}, {"id": "SC-1-4-E102", "subj": "自然", "unit": "1-4 從細胞到個體", "point": "植物的生殖器官", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一個是植物的「生殖器官」？", "o": ["花", "根", "莖", "葉"], "sol": "花、果實、種子和植物產生下一代有關，屬於生殖器官；根、莖、葉屬於營養器官。", "w": ["根負責吸收水分和固定植物，是營養器官。", "莖負責支持和運輸，是營養器官。", "葉主要進行光合作用，是營養器官。"], "parent": "和「下一代」有關的是花、果實、種子。"}, {"id": "SC-1-4-E103", "subj": "自然", "unit": "1-4 從細胞到個體", "point": "器官的例子", "diff": "簡單", "type": "觀念辨識", "q": "下列何者屬於「器官」？", "o": ["心臟", "血液中的紅血球", "肌肉組織", "循環系統"], "sol": "心臟由肌肉組織、結締組織等多種組織組成，能完成特定功能，是器官。", "w": ["紅血球是細胞。", "肌肉組織是組織。", "循環系統是器官系統。"], "parent": "器官是「多種組織合作完成一件工作」。"}, {"id": "SC-1-4-M101", "subj": "自然", "unit": "1-4 從細胞到個體", "point": "植物的組成層次", "diff": "中等", "type": "排序", "q": "下列哪一組是依照植物體「由小到大」的組成層次排列？", "o": ["細胞→組織→器官→個體", "細胞→器官→組織→個體", "組織→細胞→器官→個體", "細胞→組織→器官系統→個體"], "sol": "植物體的組成層次是細胞→組織→器官→個體，通常不再區分器官系統。", "w": ["組織要在器官之前。", "細胞要在組織之前。", "植物通常不以器官系統來分，器官直接組成個體。"], "parent": "植物比動物少一層：沒有器官系統。"}, {"id": "SC-1-4-M102", "subj": "自然", "unit": "1-4 從細胞到個體", "point": "葉是器官", "diff": "中等", "type": "觀念辨識", "q": "一片葉子屬於哪一個組成層次？", "o": ["器官", "組織", "細胞", "器官系統"], "sol": "葉子由表皮組織、葉肉組織、輸導組織等多種組織組成，能進行光合作用，是器官。", "w": ["葉子包含好幾種組織，不只一種。", "葉子由許多細胞組成，不是單一細胞。", "植物通常不分器官系統。"], "parent": "一片葉子裡有好幾種組織，所以它是器官。"}, {"id": "SC-1-4-M103", "subj": "自然", "unit": "1-4 從細胞到個體", "point": "單細胞生物完成生命活動", "diff": "中等", "type": "推理", "q": "草履蟲只有一個細胞，卻能攝食、運動、排泄和生殖。這說明了什麼？", "o": ["一個細胞就能完成各種生命活動", "草履蟲體內也有許多器官分工", "單細胞生物只能進行一種生命活動", "草履蟲其實是由很多細胞組成"], "sol": "草履蟲是單細胞生物，一個細胞就能完成所有生命活動。", "w": ["草履蟲只有一個細胞，沒有器官。", "草履蟲能攝食、運動、排泄、生殖，不只一種。", "草履蟲是單細胞生物。"], "parent": "一個細胞就是一個完整的生物，什麼工作都自己做。"}, {"id": "SC-1-4-M104", "subj": "自然", "unit": "1-4 從細胞到個體", "point": "消化系統的組成", "diff": "中等", "type": "觀念辨識", "q": "胃、小腸、大腸、肝臟一起合作完成食物的消化與吸收。它們共同組成的是什麼？", "o": ["器官系統", "組織", "器官", "個體"], "sol": "多個器官合作完成一類生理功能，就是器官系統，這裡是消化系統。", "w": ["它們是多個器官，不是一種組織。", "單一個胃才是一個器官；多個器官合作是器官系統。", "個體是完整的生物，不只消化。"], "parent": "多個器官一起做一件大事＝器官系統。"}, {"id": "SC-2-1-E101", "subj": "自然", "unit": "2-1 食物中的養分", "point": "六大類養分的組成", "diff": "簡單", "type": "記憶辨識", "q": "下列哪一組所列的，全部都屬於六大類養分？", "o": ["醣類、蛋白質、水", "醣類、酵素、水", "維生素、碘液、脂質", "礦物質、氧氣、蛋白質"], "sol": "六大類養分是醣類、蛋白質、脂質、維生素、礦物質和水。第一組三項都屬於六大類養分。", "w": ["酵素是幫助反應進行的物質，不是六大類養分之一。", "碘液是檢驗澱粉的試劑，不是養分。", "氧氣是呼吸需要的氣體，不屬於六大類養分。"], "parent": "六大類：醣、蛋白質、脂質、維生素、礦物質、水。一個一個對照看看。"}, {"id": "SC-2-1-E102", "subj": "自然", "unit": "2-1 食物中的養分", "point": "提供能量的養分", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一類養分「不能」提供身體能量？", "o": ["維生素", "醣類", "蛋白質", "脂質"], "sol": "醣類、蛋白質、脂質都能提供能量；維生素主要調節生理作用，不直接提供能量。", "w": ["醣類是主要的能量來源。", "蛋白質也能提供能量。", "脂質能提供並儲存能量。"], "parent": "能給電的只有醣、蛋白質、脂質三種。"}, {"id": "SC-2-1-E103", "subj": "自然", "unit": "2-1 食物中的養分", "point": "碘液的原本顏色", "diff": "簡單", "type": "觀念辨識", "q": "碘液遇到不含澱粉的物質時，會呈現什麼顏色？", "o": ["原本的黃褐色", "藍黑色", "磚紅色", "綠色"], "sol": "碘液原本是黃褐色，遇到澱粉才變藍黑色；沒有澱粉時保持原色。", "w": ["藍黑色表示有澱粉。", "磚紅色是本氏液檢驗出較多還原糖的顏色。", "綠色是本氏液檢驗出少量還原糖時可能出現的顏色。"], "parent": "碘液：有澱粉變藍黑，沒有就維持黃褐色。"}, {"id": "SC-2-1-E104", "subj": "自然", "unit": "2-1 食物中的養分", "point": "蛋白質的功能", "diff": "簡單", "type": "觀念辨識", "q": "能幫助身體生長和修補組織的主要養分是哪一類？", "o": ["蛋白質", "醣類", "維生素", "水"], "sol": "蛋白質是構成和修補身體組織的重要材料，蛋、魚、豆類都富含蛋白質。", "w": ["醣類主要提供能量。", "維生素主要調節生理作用。", "水負責運輸物質和調節體溫。"], "parent": "受傷要好得快、身體要長大，就要多吃蛋白質。"}, {"id": "SC-2-1-M101", "subj": "自然", "unit": "2-1 食物中的養分", "point": "本氏液的使用條件", "diff": "中等", "type": "觀念辨識", "q": "用本氏液檢驗葡萄糖時，必須怎麼做才會出現顏色變化？", "o": ["加入本氏液後隔水加熱", "加入本氏液後放進冰箱", "直接滴在食物上，不用加熱", "加入碘液一起混合"], "sol": "本氏液要和樣品混合後隔水加熱，含有葡萄糖等還原糖時，顏色才會改變。", "w": ["冷藏不會產生反應。", "不加熱就看不出顏色變化。", "碘液是檢驗澱粉的，和本氏液用途不同。"], "parent": "本氏液一定要「加熱」才有反應。"}, {"id": "SC-2-1-M102", "subj": "自然", "unit": "2-1 食物中的養分", "point": "本氏液顏色與糖量", "diff": "中等", "type": "資料判讀", "q": "甲、乙、丙三支試管各加入本氏液並隔水加熱後，顏色分別為綠色、磚紅色、藍色（原色）。三支試管中的葡萄糖含量，由多到少排列為何？", "o": ["乙→甲→丙", "甲→乙→丙", "丙→甲→乙", "乙→丙→甲"], "sol": "本氏液原本是藍色，糖量愈多，顏色愈往綠、黃、橙、磚紅色變化。磚紅色（乙）最多，綠色（甲）次之，藍色（丙）表示沒有。", "w": ["綠色的糖量比磚紅色少。", "藍色是本氏液的原色，表示沒有糖，最少。", "藍色表示沒有糖，應該排在最後。"], "parent": "本氏液像紅綠燈：藍（沒有）→綠→黃→橙→紅（最多）。"}, {"id": "SC-2-1-M103", "subj": "自然", "unit": "2-1 食物中的養分", "point": "檢驗結果判讀（表格）", "diff": "中等", "type": "資料判讀", "q": "對甲、乙兩種食物進行檢驗，結果如下表（自編）。下列推論何者正確？", "o": ["甲含有澱粉，乙含有葡萄糖", "甲含有葡萄糖，乙含有澱粉", "甲、乙都含有澱粉", "甲、乙都不含醣類"], "sol": "甲滴碘液變藍黑色，含有澱粉；乙加本氏液加熱後變磚紅色，含有葡萄糖等還原糖。", "w": ["兩種試劑的檢驗對象弄反了。", "乙滴碘液沒有變色，不含澱粉。", "兩種食物都檢驗出醣類（澱粉或葡萄糖）。"], "parent": "碘液→澱粉；本氏液→葡萄糖。一個試劑對一種物質。", "fig": "<table class=\"fig\"><caption>兩種食物的檢驗結果（自編）</caption><tr><th>食物</th><th>滴碘液</th><th>加本氏液並加熱</th></tr><tr><td>甲</td><td>藍黑色</td><td>藍色（不變）</td></tr><tr><td>乙</td><td>黃褐色（不變）</td><td>磚紅色</td></tr></table>"}, {"id": "SC-2-1-M104", "subj": "自然", "unit": "2-1 食物中的養分", "point": "實驗的對照組（養分檢驗）", "diff": "中等", "type": "觀念應用", "q": "用本氏液檢驗果汁是否含有葡萄糖時，另外準備一支只加清水和本氏液、一起加熱的試管。這支試管的作用是什麼？", "o": ["作為對照，確認變色是果汁造成的", "讓果汁裡的糖分變得更多更明顯", "讓本氏液加熱後不會再變色", "代替果汁試管，節省果汁的用量"], "sol": "只有清水的試管是對照組，可以確認本氏液本身加熱不會變色，果汁試管的顏色變化才能歸因於果汁中的糖。", "w": ["對照組不會改變果汁的糖量。", "對照組是用來比較，不是讓本氏液不變色。", "對照組不能代替樣品檢驗。"], "parent": "有一支「沒有糖」的試管做比較，才能確定變色是糖造成的。"}, {"id": "SC-2-1-M105", "subj": "自然", "unit": "2-1 食物中的養分", "point": "水的功能", "diff": "中等", "type": "觀念辨識", "q": "關於水在人體中的功能，下列何者正確？", "o": ["運送物質、協助代謝、調節體溫", "提供身體大部分的能量", "構成骨骼的主要成分", "只是解渴，沒有其他功能"], "sol": "水能運送養分和廢物、協助代謝，流汗蒸發時也能調節體溫。", "w": ["水不能提供能量。", "骨骼主要和鈣等礦物質有關。", "水有運送、代謝、調節體溫等重要功能。"], "parent": "水是身體的運輸工人，也是冷氣機（流汗散熱）。"}, {"id": "SC-2-1-H101", "subj": "自然", "unit": "2-1 食物中的養分", "point": "整合檢驗結果判斷食物成分", "diff": "困難", "type": "資料推論", "q": "某食物磨碎加水後分成兩份：一份滴碘液呈藍黑色；另一份加本氏液隔水加熱後呈綠色。下列推論何者最合理？", "o": ["含有澱粉，也含有少量還原糖", "只含澱粉，本氏液的綠色不代表有糖", "含有大量葡萄糖，但沒有澱粉", "綠色表示含有葉綠素，與糖無關"], "sol": "碘液呈藍黑色，表示有澱粉；本氏液呈綠色（比原本的藍色多了變化，但還沒到磚紅色），表示含有少量還原糖。", "w": ["本氏液由藍變綠，就表示有少量還原糖。", "碘液呈藍黑色，表示有澱粉；而且綠色只代表少量糖。", "綠色是本氏液和糖反應的顏色，和葉綠素無關。"], "parent": "兩個檢驗分開看，再合起來：碘液說有澱粉，本氏液的綠色說有一點點糖。"}, {"id": "SC-2-1-H102", "subj": "自然", "unit": "2-1 食物中的養分", "point": "檢驗實驗的設計錯誤", "diff": "困難", "type": "實驗設計推理", "q": "小明想比較甲、乙兩種果汁的含糖量。他在甲試管加 2 mL 甲果汁和 1 mL 本氏液，在乙試管加 5 mL 乙果汁和 1 mL 本氏液，一起隔水加熱後比較顏色。這個設計最需要修改的地方是什麼？", "o": ["兩支試管的果汁量應該相同", "兩支試管都不應該加熱", "本氏液應該改用碘液", "乙試管應該多加本氏液"], "sol": "要比較兩種果汁的含糖量，除了果汁種類，其他條件（果汁量、本氏液量、加熱時間）都要相同。果汁量不同，顏色差異可能是果汁量造成的。", "w": ["本氏液需要加熱才會反應。", "碘液檢驗澱粉，不能檢驗葡萄糖。", "本氏液的量應該相同，乙多加會讓條件更不一致。"], "parent": "比較兩種東西時，只能讓「種類」不同，量要一樣。"}, {"id": "SC-2-2-E101", "subj": "自然", "unit": "2-2 酵素", "point": "酵素的本質", "diff": "簡單", "type": "觀念辨識", "q": "生物體內的酵素，大多是由哪一類物質構成？", "o": ["蛋白質", "醣類", "脂質", "礦物質"], "sol": "酵素大多是蛋白質，所以溫度、酸鹼度會影響它的作用。", "w": ["醣類主要提供能量。", "脂質主要儲存能量。", "礦物質不是酵素的主要成分。"], "parent": "酵素是一種特別的蛋白質，像身體裡的小工具。"}, {"id": "SC-2-2-E102", "subj": "自然", "unit": "2-2 酵素", "point": "酵素的專一性", "diff": "簡單", "type": "觀念辨識", "q": "「澱粉酶只能分解澱粉，不能分解蛋白質」說明了酵素的哪一種特性？", "o": ["專一性", "可以重複使用", "不受溫度影響", "會被完全消耗"], "sol": "一種酵素通常只作用在特定的物質上，這叫專一性，像一把鑰匙開一把鎖。", "w": ["可以重複使用是另一個特性，和「只分解澱粉」無關。", "酵素會受溫度影響。", "酵素反應後可以繼續作用，不會被完全消耗。"], "parent": "一把鑰匙開一把鎖＝專一性。"}, {"id": "SC-2-2-E103", "subj": "自然", "unit": "2-2 酵素", "point": "酵素可重複使用", "diff": "簡單", "type": "觀念辨識", "q": "關於酵素，下列敘述何者正確？", "o": ["反應後酵素本身不變，可以繼續作用", "反應一次後酵素就消失了", "酵素只存在於人體", "酵素在任何溫度下作用都一樣快"], "sol": "酵素能加速反應，反應後本身沒有被消耗，可以重複使用。", "w": ["酵素反應後不會消失。", "動物、植物、微生物都有酵素。", "溫度會影響酵素的作用。"], "parent": "酵素像剪刀，剪完還可以再剪。"}, {"id": "SC-2-2-M101", "subj": "自然", "unit": "2-2 酵素", "point": "酵素活性與溫度（折線圖）", "diff": "中等", "type": "圖表判讀", "q": "下圖是某種酵素在不同溫度下的相對活性（自編資料）。這種酵素作用最好的溫度約是多少？", "o": ["約 37°C", "約 0°C", "約 60°C", "約 80°C"], "sol": "折線圖的最高點約在 37°C，表示這個溫度下酵素的活性最高。", "w": ["0°C 時活性很低。", "60°C 時活性已經下降很多。", "80°C 時活性幾乎為 0。"], "parent": "找圖上最高的那一點。", "fig": "<svg class=\"fig\" viewBox=\"0 0 480 280\" role=\"img\" aria-label=\"某種酵素的活性與溫度（自編資料）\"><title>某種酵素的活性與溫度（自編資料）</title><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"230\" stroke=\"#13233A\" stroke-width=\"2\"/><line x1=\"60\" y1=\"230\" x2=\"460\" y2=\"230\" stroke=\"#13233A\" stroke-width=\"2\"/><line x1=\"60.0\" y1=\"230\" x2=\"60.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"60.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0</text><line x1=\"160.0\" y1=\"230\" x2=\"160.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"160.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">20</text><line x1=\"260.0\" y1=\"230\" x2=\"260.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"260.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">40</text><line x1=\"360.0\" y1=\"230\" x2=\"360.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"360.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">60</text><line x1=\"460.0\" y1=\"230\" x2=\"460.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"460.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">80</text><line x1=\"54\" y1=\"230.0\" x2=\"460\" y2=\"230.0\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"234.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0</text><line x1=\"54\" y1=\"177.5\" x2=\"460\" y2=\"177.5\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"181.5\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">25</text><line x1=\"54\" y1=\"125.0\" x2=\"460\" y2=\"125.0\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"129.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">50</text><line x1=\"54\" y1=\"72.5\" x2=\"460\" y2=\"72.5\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"76.5\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">75</text><line x1=\"54\" y1=\"20.0\" x2=\"460\" y2=\"20.0\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"24.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">100</text><polyline points=\"60.0,219.5 110.0,188.0 160.0,135.5 210.0,62.0 245.0,20.0 285.0,83.0 335.0,177.5 385.0,219.5 460.0,230.0\" fill=\"none\" stroke=\"#1F5FAD\" stroke-width=\"3\"/><circle cx=\"60.0\" cy=\"219.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"110.0\" cy=\"188.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"160.0\" cy=\"135.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"210.0\" cy=\"62.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"245.0\" cy=\"20.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"285.0\" cy=\"83.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"335.0\" cy=\"177.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"385.0\" cy=\"219.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"460.0\" cy=\"230.0\" r=\"4\" fill=\"#1F5FAD\"/><text x=\"260.0\" y=\"274\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">溫度（°C）</text><text x=\"14\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" transform=\"rotate(-90 14 125.0)\" font-family=\"Noto Sans TC, sans-serif\">相對活性</text></svg>"}, {"id": "SC-2-2-M102", "subj": "自然", "unit": "2-2 酵素", "point": "高溫使酵素失去活性（圖）", "diff": "中等", "type": "圖表判讀", "q": "根據下圖的折線圖（自編資料），溫度從 37°C 升高到 65°C 時，酵素活性如何變化？", "o": ["明顯下降", "明顯上升", "完全不變", "先下降再上升"], "sol": "圖中 37°C 時活
