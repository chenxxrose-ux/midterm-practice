": "困難", "type": "情境判斷", "q": "下列四種情形，哪一個「不屬於」性別歧視？", "o": ["游泳課依性別安排不同的更衣室", "只因為是女性，就不讓她升任主管", "只因為是男性，就不准他請育嬰假", "只因為是女生，就不准參加籃球比賽"], "sol": "依性別安排不同的更衣室，是為了保護隱私，有合理的理由，不是歧視。", "w": ["不讓女性升主管，是因性別而不公平對待。", "不准男性請育嬰假，是因性別而不公平對待。", "不准女生參加比賽，是因性別而不公平對待。"], "parent": "性別不同的安排，要問：有沒有合理理由？是不是限制機會？"}, {"id": "CI-L2-H107", "subj": "公民", "unit": "L2 性別平等", "point": "找出說法中的刻板印象", "diff": "困難", "type": "推理", "q": "下列哪一個說法「沒有」性別刻板印象？", "o": ["小華很會做菜，因為她常幫家人煮飯、練習很多", "小華很會做菜，因為她是女生", "小明不會哭，因為他是男生", "小美數學不好，因為女生都不擅長數學"], "sol": "把會做菜的原因歸於「練習很多」，是依個人經驗判斷，沒有用性別概括。", "w": ["把會做菜歸因於「女生」，是刻板印象。", "把不會哭歸因於「男生」，是刻板印象。", "「女生都不擅長數學」是刻板印象。"], "parent": "看理由：是個人的努力和經驗，還是「因為他是男生／女生」？"}, {"id": "CI-L2-H108", "subj": "公民", "unit": "L2 性別平等", "point": "結合兩課的判斷", "diff": "困難", "type": "情境判斷", "q": "某公司規定：「懷孕的員工必須自動離職。」下列評論何者最恰當？", "o": ["因懷孕強迫離職，是不合理的差別待遇", "公司可以自由訂定員工規則，沒有問題", "這是在保護懷孕的員工，讓她好好休息", "只要在錄取前事先說好，就不算是歧視"], "sol": "懷孕不代表不能工作，強迫離職是因性別而不合理的差別待遇，也侵害了員工的權利與尊嚴。", "w": ["公司的規定也不能違反平等與尊重。", "強迫離職不是保護。", "事先說好，也不能讓不合理的規定變合理。"], "parent": "保護應該是「提供協助」，不是「強迫離開」。"}, {"id": "CH-ZY-E101", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：樹「梢」的「梢」", "diff": "簡單", "type": "字音字形", "q": "樹「梢」的「梢」的正確讀音是哪一個？", "o": ["ㄕㄠ", "ㄒㄧㄠ", "ㄕㄠˋ", "ㄒㄧㄠˋ"], "sol": "「梢」讀ㄕㄠ，指樹枝的末端。", "w": ["右邊是「肖」，但「梢」不讀ㄒㄧㄠ，不能有邊讀邊。", "聲調錯了，是一聲。", "聲母和聲調都錯了。"], "parent": "樹梢、稍微的「梢、稍」都讀ㄕㄠ。"}, {"id": "CH-ZY-E102", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：「闔」上眼睛的「闔」", "diff": "簡單", "type": "字音字形", "q": "「闔」上眼睛的「闔」的正確讀音是哪一個？", "o": ["ㄏㄜˊ", "ㄍㄞˋ", "ㄏㄜˋ", "ㄜˋ"], "sol": "「闔」讀ㄏㄜˊ，是閉合的意思。", "w": ["「闔」不是「蓋」，不讀ㄍㄞˋ。", "聲調錯了，是二聲。", "聲母錯了。"], "parent": "闔上眼睛＝閉上眼睛，讀ㄏㄜˊ。"}, {"id": "CH-ZY-E103", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字形：螢", "diff": "簡單", "type": "字音字形", "q": "「ㄧㄥˊ火蟲」的「ㄧㄥˊ」，正確的寫法是哪一個？", "o": ["螢", "營", "瑩", "縈"], "sol": "螢火蟲是一種昆蟲，所以下面是「虫」：螢。", "w": ["「營」是營業、軍營的營，下面是「呂」。", "「瑩」是晶瑩的瑩，下面是「玉」。", "「縈」是縈繞的縈，下面是「糸」。"], "parent": "看部首：蟲類就用「虫」字底的「螢」。"}, {"id": "CH-ZY-E104", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：靜「謐」的「謐」", "diff": "簡單", "type": "字音字形", "q": "靜「謐」的「謐」的正確讀音是哪一個？", "o": ["ㄇㄧˋ", "ㄅㄧˋ", "ㄇㄧˊ", "ㄇㄧˇ"], "sol": "「謐」讀ㄇㄧˋ，靜謐是安靜、寧靜。", "w": ["裡面有「必」，但不讀ㄅㄧˋ。", "聲調錯了，是四聲。", "聲調錯了，是四聲。"], "parent": "謐、蜜、密都讀ㄇㄧˋ。"}, {"id": "CH-ZY-E105", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：「罹」患的「罹」", "diff": "簡單", "type": "字音字形", "q": "「罹」患的「罹」的正確讀音是哪一個？", "o": ["ㄌㄧˊ", "ㄌㄨㄛˊ", "ㄌㄧˋ", "ㄋㄧˊ"], "sol": "「罹」讀ㄌㄧˊ，罹患是生了某種病。", "w": ["和「羅」長得像，但讀ㄌㄧˊ。", "聲調錯了，是二聲。", "聲母錯了，是ㄌ。"], "parent": "罹患疾病，「罹」讀ㄌㄧˊ。"}, {"id": "CH-ZY-E106", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：休「憩」的「憩」", "diff": "簡單", "type": "字音字形", "q": "休「憩」的「憩」的正確讀音是哪一個？", "o": ["ㄑㄧˋ", "ㄒㄧˋ", "ㄑㄧ", "ㄗˋ"], "sol": "「憩」讀ㄑㄧˋ，休憩是休息。", "w": ["聲母錯了，是ㄑ，不是ㄒ。", "聲調錯了，是四聲。", "上面有「自」，但不讀ㄗˋ。"], "parent": "休憩、憩歇的「憩」都讀ㄑㄧˋ。"}, {"id": "CH-ZY-E107", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：洗「滌」的「滌」", "diff": "簡單", "type": "字音字形", "q": "洗「滌」的「滌」的正確讀音是哪一個？", "o": ["ㄉㄧˊ", "ㄊㄧㄠˊ", "ㄉㄧˋ", "ㄧㄡˊ"], "sol": "「滌」讀ㄉㄧˊ，洗滌是清洗。", "w": ["右邊像「條」，但不讀ㄊㄧㄠˊ。", "聲調錯了，是二聲。", "和「攸」無關，不讀ㄧㄡˊ。"], "parent": "洗滌，「滌」讀ㄉㄧˊ，不是ㄊㄧㄠˊ。"}, {"id": "CH-ZY-E108", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字形：沮", "diff": "簡單", "type": "字音字形", "q": "「ㄐㄩˇ喪」的「ㄐㄩˇ」，正確的寫法是哪一個？", "o": ["沮", "阻", "詛", "咀"], "sol": "沮喪是灰心失望，寫作「沮」。", "w": ["「阻」是阻擋，意思不同。", "「詛」是詛咒。", "「咀」是咀嚼。"], "parent": "沮喪的「沮」是三點水。"}, {"id": "CH-ZY-E109", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：「刨」冰的「刨」", "diff": "簡單", "type": "字音字形", "q": "「刨」冰的「刨」的正確讀音是哪一個？", "o": ["ㄅㄠˋ", "ㄆㄠˊ", "ㄅㄠ", "ㄅㄠˇ"], "sol": "刨冰的「刨」讀ㄅㄠˋ，指用器具刨削冰塊。", "w": ["「刨」讀ㄆㄠˊ時是挖掘的意思，例如刨土；刨冰要讀ㄅㄠˋ。", "聲調錯了，是四聲。", "聲調錯了，是四聲。"], "parent": "刨冰讀ㄅㄠˋ ㄅㄧㄥ。"}, {"id": "CH-ZY-E110", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：童「叟」無欺的「叟」", "diff": "簡單", "type": "字音字形", "q": "童「叟」無欺的「叟」的正確讀音是哪一個？", "o": ["ㄙㄡˇ", "ㄙㄡ", "ㄕㄡˇ", "ㄙㄨˇ"], "sol": "「叟」讀ㄙㄡˇ，指老人。", "w": ["聲調錯了，是三聲。", "聲母錯了，是ㄙ不是ㄕ。", "韻母錯了。"], "parent": "童叟無欺：童是小孩，叟是老人。"}, {"id": "CH-ZY-M101", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "同音字辨別", "diff": "中等", "type": "字音字形", "q": "下列各組「」中的字，哪一組讀音相同？", "o": ["樹「梢」／「稍」微", "「撒」滿／「撒」嬌", "鑲「嵌」／「坎」坷", "垂「涎」／「延」長"], "sol": "「梢」和「稍」都讀ㄕㄠ。", "w": ["「撒」滿讀ㄙㄚˇ，「撒」嬌讀ㄙㄚ。", "「嵌」讀ㄑㄧㄢ，「坎」讀ㄎㄢˇ。", "「涎」讀ㄒㄧㄢˊ，「延」讀ㄧㄢˊ。"], "parent": "形近字不一定同音，要一個一個確認。"}, {"id": "CH-ZY-M102", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "一字多音：撒", "diff": "中等", "type": "字音字形", "q": "「撒」滿天空和「撒」嬌，兩個「撒」的讀音依序是？", "o": ["ㄙㄚˇ；ㄙㄚ", "ㄙㄚ；ㄙㄚˇ", "ㄙㄚˇ；ㄙㄚˇ", "ㄙㄚ；ㄙㄚ"], "sol": "散布、散開的「撒」讀ㄙㄚˇ；撒嬌的「撒」讀ㄙㄚ。", "w": ["兩個讀音弄反了。", "撒嬌的「撒」讀一聲。", "撒滿的「撒」讀三聲。"], "parent": "把東西撒出去（三聲）；撒嬌（一聲）。"}, {"id": "CH-ZY-M103", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "辨別錯字", "diff": "中等", "type": "字音字形", "q": "下列詞語，哪一個「沒有」錯字？", "o": ["黯然神傷", "心情阻喪", "動作笨絀", "洗條衣物"], "sol": "「黯然神傷」正確。其他應寫作：沮喪、笨拙、洗滌。", "w": ["「阻喪」應寫作「沮喪」。", "「笨絀」應寫作「笨拙」。", "「洗條」應寫作「洗滌」。"], "parent": "記字形要連著詞義一起記。"}, {"id": "CH-ZY-M104", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "同音字：拙、茁", "diff": "中等", "type": "字音字形", "q": "「笨拙」的「拙」，和下列哪一個字讀音相同？", "o": ["茁", "出", "屈", "絀"], "sol": "「拙」和「茁」都讀ㄓㄨㄛˊ。", "w": ["「出」讀ㄔㄨ。", "「屈」讀ㄑㄩ。", "「絀」讀ㄔㄨˋ。"], "parent": "笨拙、茁壯，都是ㄓㄨㄛˊ。"}, {"id": "CH-ZY-M105", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：名聞「遐邇」的「遐邇」", "diff": "中等", "type": "字音字形", "q": "名聞「遐邇」的「遐邇」的正確讀音是哪一個？", "o": ["ㄒㄧㄚˊ ㄦˇ", "ㄐㄧㄚˇ ㄦˇ", "ㄒㄧㄚ ㄦˋ", "ㄒㄧㄚˊ ㄋㄧˇ"], "sol": "「遐」讀ㄒㄧㄚˊ，「邇」讀ㄦˇ，遐邇是遠近。", "w": ["「遐」不讀「假」的ㄐㄧㄚˇ。", "兩個字的聲調都錯了。", "「邇」裡面有「爾」，讀ㄦˇ，不是ㄋㄧˇ。"], "parent": "名聞遐邇＝名聲傳遍遠近。"}, {"id": "CH-ZY-M106", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：「俄頃」的「頃」", "diff": "中等", "type": "字音字形", "q": "「俄頃」的「頃」的正確讀音是哪一個？", "o": ["ㄑㄧㄥˇ", "ㄑㄧㄥ", "ㄑㄧㄥˋ", "ㄐㄧㄥˇ"], "sol": "「頃」讀ㄑㄧㄥˇ，俄頃是很短的時間。", "w": ["聲調錯了，是三聲。", "聲調錯了，是三聲。", "聲母錯了，是ㄑ。"], "parent": "俄頃、頃刻的「頃」都讀ㄑㄧㄥˇ。"}, {"id": "CH-ZY-M107", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字形：渾", "diff": "中等", "type": "字音字形", "q": "「這顆玻璃球十分ㄏㄨㄣˊ圓。」「ㄏㄨㄣˊ」的正確寫法是？", "o": ["渾", "混", "昏", "魂"], "sol": "渾圓是十分圓潤，寫作「渾」。", "w": ["「混」是混合、混亂，不用在「渾圓」。", "「昏」是昏暗，意思不同。", "「魂」是靈魂，意思不同。"], "parent": "渾圓、渾厚的「渾」是三點水加「軍」。"}, {"id": "CH-ZY-M108", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "字音：中「輟」的「輟」", "diff": "中等", "type": "字音字形", "q": "中「輟」的「輟」的正確讀音是哪一個？", "o": ["ㄔㄨㄛˋ", "ㄓㄨㄟˋ", "ㄔㄨㄛ", "ㄉㄨㄛˊ"], "sol": "「輟」讀ㄔㄨㄛˋ，中輟是中途停止。", "w": ["「綴」讀ㄓㄨㄟˋ，和「輟」不同音。", "聲調錯了，是四聲。", "聲母和聲調都錯了。"], "parent": "中輟、輟學的「輟」讀ㄔㄨㄛˋ。"}, {"id": "CH-ZY-H101", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "同音字依字義辨別", "diff": "困難", "type": "字音字形", "q": "「麻雀停在樹ㄕㄠ上」「請你ㄕㄠ微等一下」「請幫我ㄕㄠ個信給他」，三個「ㄕㄠ」依序應寫作？", "o": ["梢；稍；捎", "稍；梢；捎", "捎；稍；梢", "梢；捎；稍"], "sol": "樹枝的末端是「梢」（木部）；稍微是「稍」（禾部）；順便帶東西、帶話是「捎」（手部）。", "w": ["樹枝末端和樹木有關，要用木部的「梢」。", "帶信要用手，是手部的「捎」。", "稍微要用「稍」，捎是帶東西。"], "parent": "同音字看部首猜意思：木→樹，手→動作。"}, {"id": "CH-RH-E101", "subj": "國文", "unit": "修辭（L1～L3）", "point": "譬喻", "diff": "簡單", "type": "修辭判斷", "q": "下列哪一句使用了「譬喻」？", "o": ["彎彎的月亮像一艘小船。", "月亮對著我微笑。", "好熱好熱的夏天。", "熱得我快要融化了。"], "sol": "把月亮比成小船，有「像」連接兩樣東西，是譬喻。", "w": ["月亮會微笑，是把物寫成人，屬於擬人。", "重複「好熱」，是類疊。", "故意放大熱的感覺，是誇飾。"], "parent": "有「像、好像、彷彿」把兩樣東西相比，通常是譬喻。"}, {"id": "CH-RH-E102", "subj": "國文", "unit": "修辭（L1～L3）", "point": "類疊", "diff": "簡單", "type": "修辭判斷", "q": "〈夏夜〉中重複出現「只有……還醒著」的句式，這屬於哪一種修辭？", "o": ["類疊", "譬喻", "誇飾", "映襯"], "sol": "重複相同或相近的詞語、句式，是類疊。", "w": ["譬喻是把兩樣東西相比。", "誇飾是故意放大或縮小。", "映襯是把相反的事物放在一起對照。"], "parent": "重複出現就是類疊。"}, {"id": "CH-RH-E103", "subj": "國文", "unit": "修辭（L1～L3）", "point": "誇飾", "diff": "簡單", "type": "修辭判斷", "q": "「熱得我快要融化了。」這句話使用了哪一種修辭？", "o": ["誇飾", "譬喻", "類疊", "擬人"], "sol": "人不會真的融化，這是故意誇大熱的感覺，屬於誇飾。", "w": ["句子裡沒有把兩樣東西相比。", "句子裡沒有重複詞語。", "「我」本來就是人，不是擬人。"], "parent": "不可能真的發生、故意說得很誇張，就是誇飾。"}, {"id": "CH-RH-E104", "subj": "國文", "unit": "修辭（L1～L3）", "point": "摹寫", "diff": "簡單", "type": "修辭判斷", "q": "「刨冰機嘎啦嘎啦地轉著。」這句話主要摹寫了哪一種感官？", "o": ["聽覺", "視覺", "味覺", "嗅覺"], "sol": "「嘎啦嘎啦」是聲音，屬於聽覺摹寫。", "w": ["句中沒有描寫顏色、形狀。", "句中沒有描寫味道。", "句中沒有描寫氣味。"], "parent": "聲音→聽覺；顏色形狀→視覺；味道→味覺。"}, {"id": "CH-RH-M101", "subj": "國文", "unit": "修辭（L1～L3）", "point": "映襯", "diff": "中等", "type": "修辭判斷", "q": "「店面雖然小，生意卻好得不得了。」這句話主要使用了哪一種修辭？", "o": ["映襯", "譬喻", "擬人", "摹寫"], "sol": "把「店面小」和「生意好」兩個相反的情況放在一起對照，凸顯差異，是映襯。", "w": ["句中沒有把兩樣東西相比喻。", "句中沒有把物寫成人。", "句中沒有具體描寫感官。"], "parent": "「雖然……卻……」把相反的放一起，常是映襯。"}, {"id": "CH-RH-M102", "subj": "國文", "unit": "修辭（L1～L3）", "point": "擬人的陷阱", "diff": "中等", "type": "修辭判斷", "q": "下列哪一句「沒有」使用擬人？", "o": ["美麗的夏夜真涼爽。", "星星眨著眼睛。", "風在竹林裡唱歌。", "小河低聲說著話。"], "sol": "「美麗的夏夜真涼爽」只是形容，沒有讓夏夜做人的動作，不是擬人。", "w": ["星星會眨眼睛，是擬人。", "風會唱歌，是擬人。", "小河會說話，是擬人。"], "parent": "擬人要讓物「做人的事」，只是形容很美不算。"}, {"id": "CH-RH-M103", "subj": "國文", "unit": "修辭（L1～L3）", "point": "摹寫：觸覺", "diff": "中等", "type": "修辭判斷", "q": "「冰一入口，一陣沁涼直透心底。」主要摹寫了哪一種感覺？", "o": ["觸覺（冷熱的感覺）", "聽覺", "視覺", "嗅覺"], "sol": "「沁涼」是涼意透入的感覺，屬於觸覺（冷熱）的摹寫。", "w": ["句中沒有描寫聲音。", "句中沒有描寫顏色、形狀。", "句中沒有描寫氣味。"], "parent": "冷、熱、軟、硬，都是觸覺。"}, {"id": "CH-RH-M104", "subj": "國文", "unit": "修辭（L1～L3）", "point": "譬喻與擬人的區分", "diff": "中等", "type": "修辭判斷", "q": "「冰屑像雪花一樣落下」和「雪花在空中跳舞」，分別使用了什麼修辭？", "o": ["譬喻；擬人", "擬人；譬喻", "譬喻；譬喻", "擬人；擬人"], "sol": "第一句用「像」把冰屑比成雪花，是譬喻；第二句讓雪花「跳舞」，是擬人。", "w": ["兩句弄反了。", "第二句沒有比喻，是讓雪花做人的動作。", "第一句有「像」，是譬喻。"], "parent": "有「像」→譬喻；會做人的事→擬人。"}, {"id": "CH-RH-M105", "subj": "國文", "unit": "修辭（L1～L3）", "point": "摹寫：視覺", "diff": "中等", "type": "修辭判斷", "q": "「紅的、黃的、綠的配料，鋪滿了雪白的冰山。」主要摹寫了哪一種感官？", "o": ["視覺", "聽覺", "味覺", "觸覺"], "sol": "描寫顏色，屬於視覺摹寫。", "w": ["句中沒有聲音。", "句中沒有寫味道。", "句中沒有寫冷熱、軟硬。"], "parent": "顏色、形狀、大小，都是眼睛看到的。"}, {"id": "CH-RH-M106", "subj": "國文", "unit": "修辭（L1～L3）", "point": "辨識誇飾", "diff": "中等", "type": "修辭判斷", "q": "下列哪一句使用了「誇飾」？", "o": ["他餓得能吞下一頭牛。", "他今天吃了兩碗飯。", "他像小豬一樣吃得很香。", "他吃飯吃得好快好快。"], "sol": "人不可能吞下一頭牛，是故意誇大飢餓的程度，屬於誇飾。", "w": ["這是真實的敘述。", "用「像」比喻，是譬喻。", "重複「好快」，是類疊。"], "parent": "誇飾：說得比事實誇張很多。"}, {"id": "CH-RH-M107", "subj": "國文", "unit": "修辭（L1～L3）", "point": "辨識類疊", "diff": "中等", "type": "修辭判斷", "q": "下列哪一句使用了「類疊」？", "o": ["走啊走，走啊走，終於走到山頂。", "山頂的風像一把刀。", "山頂的雲朵在睡午覺。", "山頂高得碰到天。"], "sol": "重複「走啊走」，是類疊。", "w": ["用「像」比喻，是譬喻。", "雲朵睡午覺，是擬人。", "碰到天是誇大，是誇飾。"], "parent": "同一個詞或句子重複出現，就是類疊。"}, {"id": "CH-RH-H101", "subj": "國文", "unit": "修辭（L1～L3）", "point": "一句中的兩種修辭", "diff": "困難", "type": "修辭判斷", "q": "「月亮像一盞燈，靜靜地守著熟睡的村莊。」這句話使用了哪些修辭？", "o": ["譬喻和擬人", "只有譬喻", "只有擬人", "誇飾和類疊"], "sol": "「月亮像一盞燈」是譬喻；月亮「守著」村莊、村莊「熟睡」，是擬人。", "w": ["後半句讓月亮守護、村莊睡覺，也用了擬人。", "前半句「像一盞燈」是譬喻。", "句中沒有誇大，也沒有重複。"], "parent": "一句話可能有不只一種修辭，要從頭到尾看完。"}, {"id": "CH-RH-H102", "subj": "國文", "unit": "修辭（L1～L3）", "point": "修辭判斷是否正確", "diff": "困難", "type": "修辭判斷", "q": "下列句子與修辭的配對，何者正確？", "o": ["「熱得像在烤箱裡」—譬喻", "「蟬聲大得快把耳朵震破」—擬人", "「風輕輕地唱著歌」—譬喻", "「好甜好甜的冰」—映襯"], "sol": "「熱得像在烤箱裡」用「像」把天氣比成烤箱，是譬喻。", "w": ["把聲音誇大到震破耳朵，是誇飾。", "風會唱歌，是擬人。", "重複「好甜」，是類疊。"], "parent": "每一組都要自己判斷一次，再和配對比較。"}, {"id": "CH-RH-H103", "subj": "國文", "unit": "修辭（L1～L3）", "point": "多種感官摹寫", "diff": "困難", "type": "修辭判斷", "q": "「嘎啦嘎啦的刨冰聲中，雪白的冰屑堆成小山；一入口，甜甜的味道和冰涼的感覺一起化開。」這段文字包含哪些感官摹寫？", "o": ["聽覺、視覺、味覺、觸覺", "只有視覺和味覺", "只有聽覺和視覺", "視覺、嗅覺、味覺"], "sol": "嘎啦嘎啦（聽覺）、雪白的冰屑（視覺）、甜甜的味道（味覺）、冰涼的感覺（觸覺）。", "w": ["漏了聲音（聽覺）和冰涼（觸覺）。", "漏了味道（味覺）和冰涼（觸覺）。", "文中沒有描寫氣味（嗅覺），也漏了聽覺和觸覺。"], "parent": "一句一句找：聲音、顏色、味道、冷熱，各是什麼感官。"}, {"id": "CH-RH-H104", "subj": "國文", "unit": "修辭（L1～L3）", "point": "改寫成映襯", "diff": "困難", "type": "修辭應用", "q": "把「這間冰店很小。這間冰店的冰很好吃。」改寫成使用「映襯」的句子，哪一個最恰當？", "o": ["店面雖然小小的，冰的滋味卻一點也不小。", "這間冰店像一個小小的寶盒。", "這間冰店小小的、小小的。", "這間冰店的冰好吃得讓人流淚一百次。"], "sol": "把「店小」和「滋味不小」放在一起對照，凸顯反差，是映襯。", "w": ["把冰店比成寶盒，是譬喻。", "重複「小小的」，是類疊。", "流淚一百次是誇大，是誇飾。"], "parent": "映襯要把兩個相反的東西放在一起比。"}, {"id": "CH-YT-E101", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "頓號", "diff": "簡單", "type": "標點", "q": "「我買了牛奶①麵包①雞蛋。」①應填入哪一個標點？", "o": ["、", "，", "；", "："], "sol": "並列的詞語之間用頓號：牛奶、麵包、雞蛋。", "w": ["逗號用在句子中的停頓，並列的詞語用頓號。", "分號用在並列的「句子」之間。", "冒號用來提示下文。"], "parent": "一樣一樣列出東西，中間用頓號。"}, {"id": "CH-YT-E102", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "問號", "diff": "簡單", "type": "標點", "q": "「你寫完功課了嗎①」①應填入哪一個標點？", "o": ["？", "。", "！", "，"], "sol": "這是直接問別人的問句，句尾用問號。", "w": ["句號用在陳述句。", "驚嘆號用在感嘆或強烈語氣。", "逗號不能放在句尾。"], "parent": "直接問別人問題，結尾用問號。"}, {"id": "CH-YT-E103", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "書名號", "diff": "簡單", "type": "標點", "q": "「我正在讀①生之歌②。」①②應填入？", "o": ["《　》", "〈　〉", "「　」", "（　）"], "sol": "《生之歌》是一本書，書名用書名號《　》。", "w": ["〈　〉是篇名號，用在單篇文章或詩。", "「　」是引號，用在引用的話。", "（　）是夾注號，用來補充說明。"], "parent": "整本書用《　》，單篇文章用〈　〉。"}, {"id": "CH-YT-E104", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "驚嘆號", "diff": "簡單", "type": "標點", "q": "「哇，終於考完了①」①最適合填入哪一個標點？", "o": ["！", "？", "、", "；"], "sol": "「哇」表示強烈的感受，句尾用驚嘆號。", "w": ["這句話不是在問問題。", "頓號用在並列的詞語之間。", "分號用在並列的句子之間。"], "parent": "開心、驚訝等強烈感受，用驚嘆號。"}, {"id": "CH-YT-M101", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "書名號與篇名號", "diff": "中等", "type": "標點", "q": "下列哪一句的標點正確？", "o": ["〈一顆珍珠〉選自《生之歌》。", "《一顆珍珠》選自〈生之歌〉。", "〈一顆珍珠〉選自〈生之歌〉。", "「一顆珍珠」選自「生之歌」。"], "sol": "單篇文章〈一顆珍珠〉用篇名號，書《生之歌》用書名號。", "w": ["兩個符號用反了。", "《生之歌》是書，要用書名號。", "篇名和書名不用引號。"], "parent": "書是大的《　》，裡面的一篇是小的〈　〉。"}, {"id": "CH-YT-M102", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "冒號", "diff": "中等", "type": "標點", "q": "「通知①明天校外教學，請準時到校。」①應填入？", "o": ["：", "，", "；", "、"], "sol": "冒號用來提示下文，「通知」後面接著說明內容，用冒號。", "w": ["逗號只是停頓，沒有提示下文的作用。", "分號用在並列的句子之間。", "頓號用在並列的詞語之間。"], "parent": "後面要「公布內容」，用冒號。"}, {"id": "CH-YT-M103", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "分號", "diff": "中等", "type": "標點", "q": "「有的同學在操場上打球，玩得滿身大汗①有的同學在教室裡看書，看得津津有味。」①最適合填入？", "o": ["；", "、", "：", "？"], "sol": "前後是兩個並列、而且內部已有逗號的長句子，中間用分號隔開。", "w": ["頓號用在並列的「詞語」之間，不是句子之間。", "冒號用來提示下文，這兩句是並列關係。", "這句話不是問句。"], "parent": "兩個並列的長句子，中間用分號。"}, {"id": "CH-YT-M104", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "間接問句用句號", "diff": "中等", "type": "標點", "q": "「我不知道他去哪裡①」①應填入哪一個標點？", "o": ["。", "？", "！", "，"], "sol": "這句話是在「陳述」我不知道一件事，不是直接問人，所以用句號。", "w": ["句子裡有「哪裡」，但不是在問對方問題。", "這句話沒有強烈的感嘆語氣。", "逗號不能放在句尾。"], "parent": "有疑問詞不一定是問句，要看是不是在問人。"}, {"id": "CH-YT-M105", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "破折號", "diff": "中等", "type": "標點", "q": "「我最想去的地方①圖書館，今天休館了。」①最適合填入？", "o": ["——", "……", "、", "；"], "sol": "破折號可以引出說明：最想去的地方，就是圖書館。", "w": ["刪節號表示話沒說完或省略。", "頓號用在並列的詞語之間。", "分號用在並列的句子之間。"], "parent": "後面要補充說明「是什麼」，可以用破折號。"}, {"id": "CH-YT-M106", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "刪節號", "diff": "中等", "type": "標點", "q": "「他猶豫地說：『我①忘記了。』」①最適合填入？", "o": ["……", "——", "；", "、"], "sol": "刪節號表示說話斷斷續續、猶豫，正好表現他的猶豫。", "w": ["破折號用來引出說明或轉折，這裡是說話斷續。", "分號用在並列的句子之間。", "頓號用在並列的詞語之間。"], "parent": "說話吞吞吐吐、沒說完，用刪節號。"}, {"id": "CH-YT-M107", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "夾注號", "diff": "中等", "type": "標點", "q": "「楊喚①詩人②寫過〈夏夜〉。」①②應填入？", "o": ["（　）", "《　》", "「　」", "〈　〉"], "sol": "「詩人」是補充說明楊喚的身分，用夾注號（　）。", "w": ["《　》是書名號。", "「　」是引號，用在引用的話或特定詞語。", "〈　〉是篇名號。"], "parent": "補充說明，用括號（夾注號）。"}, {"id": "CH-YT-M108", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "標點影響語氣", "diff": "中等", "type": "標點", "q": "媽媽看到你回家，想表達「疑問、不確定」的語氣，應該說哪一句？", "o": ["你回來了？", "你回來了。", "你回來了！", "你回來了，"], "sol": "問號表示疑問、不確定。", "w": ["句號表示平常的陳述。", "驚嘆號表示驚喜、強烈的語氣。", "逗號不能放在句尾。"], "parent": "同一句話，換一個標點，語氣就不一樣。"}, {"id": "CH-YT-M109", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "頓號使用正確", "diff": "中等", "type": "標點", "q": "下列哪一句的頓號使用正確？", "o": ["我喜歡國文、英文和數學。", "下課後、我去圖書館。", "我吃了早餐、然後去上學。", "天氣很好、我們去爬山。"], "sol": "國文、英文是並列的科目，用頓號正確。", "w": ["「下課後」是句子的停頓，要用逗號。", "前後是先後發生的事，要用逗號。", "前後是兩個句子，要用逗號。"], "parent": "並列的「詞語」用頓號；句子的停頓用逗號。"}, {"id": "CH-YT-H101", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "多個標點的綜合判斷", "diff": "困難", "type": "標點", "q": "「這學期我讀了〈夏夜〉①〈一顆珍珠〉和〈吃冰的滋味〉②其中我最喜歡③夏夜④。」①②③④依序應填入？", "o": ["、　，　〈　〉", "，　，　《　》", "、　、　〈　〉", "、　，　《　》"], "sol": "① 並列的篇名用頓號；② 句子停頓用逗號；③④〈夏夜〉是詩，單篇作品用篇名號。", "w": ["① 並列的篇名之間要用頓號；③④〈夏夜〉是單篇，不用書名號。", "② 是句子的停頓，要用逗號，不用頓號。", "③④〈夏夜〉是單篇詩，要用篇名號〈　〉。"], "parent": "每一格都要問：並列還是停頓？書還是篇？"}, {"id": "CH-YT-H102", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "整句標點完全正確", "diff": "困難", "type": "標點", "q": "下列哪一句的標點「完全」正確？", "o": ["哥哥問我：「你知道《生之歌》的作者是誰嗎？」", "哥哥問我：「你知道〈生之歌〉的作者是誰嗎？」", "哥哥問我：「你知道《生之歌》的作者是誰嗎。」", "哥哥問我，「你知道《生之歌》的作者是誰嗎？」"], "sol": "「問我」後用冒號引出話語；《生之歌》是書，用書名號；引號內是問句，用問號。", "w": ["《生之歌》是一本書，要用書名號《　》。", "引號內是問句，要用問號。", "引出直接說的話，前面要用冒號。"], "parent": "檢查順序：冒號→引號→書名號→句尾標點。"}, {"id": "CH-YT-H103", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "直接引語改成間接引語", "diff": "困難", "type": "標點", "q": "把「老師說：『明天要小考。』」改成不用引號、轉述的說法，哪一個標點最正確？", "o": ["老師說明天要小考。", "老師說：明天要小考？", "老師說，「明天要小考。」", "老師說：「明天要小考」。"], "sol": "轉述別人的話（間接引語）時，不用冒號和引號，直接寫成一句陳述句，用句號結束。", "w": ["轉述不用冒號，而且不是問句。", "題目要求不用引號。", "題目要求不用引號，而且句號位置也不對。"], "parent": "直接說的話用冒號加引號；轉述的話直接寫成一句。"}, {"id": "CH-L1-E101", "subj": "國文", "unit": "L1 夏夜", "point": "文體", "diff": "簡單", "type": "課文理解", "q": "〈夏夜〉屬於哪一種文體？", "o": ["新詩", "古詩", "散文", "小說"], "sol": "〈夏夜〉是新詩（現代詩、白話詩），不強制固定字數、句數或押韻。", "w": ["古詩通常有固定的字數，〈夏夜〉沒有。", "〈夏夜〉分行書寫，是詩，不是散文。", "〈夏夜〉不是小說。"], "parent": "分行、用白話寫、句子長短自由，就是新詩。"}, {"id": "CH-L1-E102", "subj": "國文", "unit": "L1 夏夜", "point": "新詩的特色", "diff": "簡單", "type": "課文理解", "q": "下列關於「新詩」的敘述，何者正確？", "o": ["不強制固定字數、句數或押韻", "每一句一定要五個字", "一定要每句押韻", "只能用文言文寫"], "sol": "新詩形式自由，不強制固定字數、句數或押韻。", "w": ["新詩的句子可長可短。", "新詩不一定押韻。", "新詩是用白話寫的。"], "parent": "新詩＝形式自由的白話詩。"}, {"id": "CH-L1-E103", "subj": "國文", "unit": "L1 夏夜", "point": "描寫的地點", "diff": "簡單", "type": "課文理解", "q": "〈夏夜〉描寫的主要是哪裡的夏夜景象？", "o": ["鄉村", "大城市", "海上的船", "沙漠"], "sol": "詩中有牛羊、田野、山巒、小河、竹林等，描寫的是鄉村的夏夜。", "w": ["詩中沒有高樓、車子等城市景象。", "詩中寫的是陸地上的鄉村。", "詩中有小河、竹林，不是沙漠。"], "parent": "從景物推地點：牛羊、田野＝鄉村。"}, {"id": "CH-L1-M101", "subj": "國文", "unit": "L1 夏夜", "point": "景物順序", "diff": "中等", "type": "課文理解", "q": "依照〈夏夜〉的內容，下列景象出現的先後順序何者正確？\n甲、萬物漸漸入睡\n乙、蜜蜂、蝴蝶與牛羊回家\n丙、街燈亮起\n丁、夜風、小河還醒著", "o": ["乙→丙→甲→丁", "丙→乙→甲→丁", "乙→甲→丙→丁", "甲→乙→丙→丁"], "sol": "先寫傍晚動物回家，接著街燈亮起、夜晚到來，然後萬物入睡，最後寫仍醒著的夜風、小河。", "w": ["街燈亮起是在動物回家之後。", "街燈亮起（天黑）在萬物入睡之前。", "萬物入睡不是最先發生的。"], "parent": "口訣：回家→燈亮→睡覺→還醒著。"}, {"id": "CH-L1-M102", "subj": "國文", "unit": "L1 夏夜", "point": "時間線索", "diff": "中等", "type": "課文理解", "q": "〈夏夜〉中，哪一個景象是「白天轉為黑夜」的重要提示？", "o": ["街燈亮起", "牛羊回家", "小河唱歌", "螢火蟲提燈"], "sol": "街燈亮起，表示天色變暗、夜晚來臨，是白晝轉成黑夜的重要提示。", "w": ["牛羊回家表示傍晚，但「天黑了」的關鍵提示是街燈亮起。", "小河唱歌是夜裡仍醒著的景象。", "螢火蟲是夜裡的景象，已經是夜晚了。"], "parent": "燈亮了，就是天黑了。"}, {"id": "CH-L1-M103", "subj": "國文", "unit": "L1 夏夜", "point": "主旨", "diff": "中等", "type": "課文理解", "q": "〈夏夜〉主要呈現了什麼？", "o": ["鄉村夏夜的安詳、童趣與生機", "城市夜生活的熱鬧繁華", "作者離鄉在外的思鄉之情", "夏天太熱讓人睡不著的煩惱"], "sol": "〈夏夜〉以擬人和鮮明的畫面，呈現鄉村夏夜的安詳、童趣與生機。", "w": ["詩中寫的是鄉村，不是城市。", "詩中沒有寫作者思鄉。", "詩中夏夜是涼爽、安詳的，沒有寫熱得睡不著。"], "parent": "主旨：安靜的鄉村夏夜，充滿童趣與生命力。"}, {"id": "CH-L1-M104", "subj": "國文", "unit": "L1 夏夜", "point": "靜中有動", "diff": "中等", "type": "課文理解", "q": "〈夏夜〉的「靜中有動」，指的是什麼？", "o": ["在萬物入睡的寧靜中，仍有事物在活動", "夜晚完全沒有任何聲音", "白天很安靜，晚上很熱鬧", "詩人一邊安靜地坐著，一邊寫詩"], "sol": "萬物都睡了（靜），卻還有小河、夜風等仍醒著在活動（動），這就是靜中有動。", "w": ["詩中還有小河的歌聲等，不是完全沒有聲音。", "詩寫的是夜晚的寧靜，不是夜晚熱鬧。", "「靜中有動」說的是詩中的景物，不是詩人。"], "parent": "全世界都睡了，卻還有東西在動。"}, {"id": "CH-L1-M105", "subj": "國文", "unit": "L1 夏夜", "point": "重複句式的作用", "diff": "中等", "type": "課文理解", "q": "〈夏夜〉重複使用「只有……還醒著」的句式，最主要的作用是什麼？", "o": ["使詩有節奏，也突出夜裡仍在活動的事物", "說明作者自己也睡不著", "強調夜晚非常危險", "表示天就要亮了"], "sol": "重複句式（類疊）讓詩有節奏感，並把焦點放在夜裡仍醒著、活動的事物上。", "w": ["這個句式寫的是景物，不是作者。", "詩中的夜晚是安詳的，不是危險。", "詩寫的是夜晚，沒有寫天亮。"], "parent": "重複＝節奏感＋強調。"}, {"id": "CH-L1-M106", "subj": "國文", "unit": "L1 夏夜", "point": "童趣與想像", "diff": "中等", "type": "課文理解", "q": "〈夏夜〉把自然景物想像成會旅行、會睡覺的朋友，最主要表現了什麼？", "o": ["童趣與想像力", "科學知識", "對大自然的恐懼", "對城市生活的批評"], "sol": "把景物想像成會做人的事的朋友，充滿童趣和想像力。", "w": ["詩中不是在說明科學知識。", "詩中的景物親切可愛，不是可怕。", "詩中沒有批評城市。"], "parent": "用孩子的眼光看世界，就是童趣。"}, {"id": "CH-L1-M107", "subj": "國文", "unit": "L1 夏夜", "point": "詞義：闔、朦朧", "diff": "中等", "type": "詞義", "q": "〈夏夜〉寫小弟弟、小妹妹「闔上眼睛」，又寫山巒「朦朧地」睡了。「闔」和「朦朧」的意思依序是？", "o": ["閉合；模糊不清的樣子", "打開；清楚明亮的樣子", "閉合；高大雄偉的樣子", "打開；模糊不清的樣子"], "sol": "「闔」是閉合；「朦朧」是模糊不清的樣子，寫夜色中山巒看不清楚。", "w": ["「闔」是閉合，「朦朧」是模糊，兩個都相反了。", "「朦朧」是模糊不清，不是高大雄偉。", "「闔」是閉合，不是打開。"], "parent": "闔上眼睛＝閉上眼睛；朦朧＝看不清楚。"}, {"id": "CH-L1-H101", "subj": "國文", "unit": "L1 夏夜", "point": "仿照結構排序", "diff": "困難", "type": "寫作遷移", "q": "仿照〈夏夜〉「回家→入夜→睡去→還醒著」的結構，寫「放學後的教室」。下列順序何者最恰當？\n甲、同學們背著書包回家了\n乙、走廊的燈一盞一盞熄了\n丙、桌椅們靜靜地睡著了\n丁、只有窗外的風鈴還醒著，輕輕地唱歌", "o": ["甲→乙→丙→丁", "乙→甲→丙→丁", "甲→丙→乙→丁", "丁→甲→乙→丙"], "sol": "甲對應「回家」，乙對應「入夜（燈的變化）」，丙對應「睡去」，丁對應「還醒著」，順序和〈夏夜〉的結構相同。", "w": ["先有同學回家，燈才熄。", "燈熄（入夜）應在桌椅睡去之前。", "「還醒著」要放在最後，才能襯托寧靜。"], "parent": "先找出原文的結構，再把新句子一一對應。"}, {"id": "CH-L1-H102", "subj": "國文", "unit": "L1 夏夜", "point": "寫法的雙重條件", "diff": "困難", "type": "寫作遷移", "q": "〈夏夜〉寫萬物睡了以後，夜風還醒著，從竹林裡跑出來旅行；這樣寫把夜風寫成會做人的動作，也寫出夜裡仍在活動。下列哪一句「同時」具有這兩個特點？", "o": ["深夜裡，只有路燈還睜著眼睛，守著空蕩蕩的街道。", "深夜裡，路燈像一顆顆明亮的星星。", "深夜裡，四周安靜得沒有一點聲音。", "清晨，太陽伸了個懶腰，爬上山頭。"], "sol": "路燈「睜著眼睛」「守著」是擬人，而且寫的是深夜裡仍醒著的事物，同時符合兩個特點。", "w": ["這是譬喻，而且沒有寫出「仍在活動」。", "只寫安靜，沒有擬人，也沒有活動的事物。", "有擬人，但寫的是清晨，不是夜裡仍醒著。"], "parent": "題目有兩個條件，要兩個都符合。"}, {"id": "CH-L1-H103", "subj": "國文", "unit": "L1 夏夜", "point": "結構安排的效果", "diff": "困難", "type": "課文理解", "q": "〈夏夜〉前段寫蜜蜂、牛羊回家的熱鬧，後段寫萬物入睡的安靜。這樣安排最主要的效果是什麼？", "o": ["由熱鬧到寧靜，表現時間推移與夜晚的來臨", "說明動物比人更早睡覺", "強調白天比晚上更重要", "表示作者不喜歡熱鬧"], "sol": "從傍晚的熱鬧寫到夜晚的寧靜，讓讀者感受時間慢慢推移、夏夜悄悄來臨。", "w": ["詩中小弟弟、小妹妹也睡了，不是在比較誰先睡。", "詩的重點是夏夜，不是白天。", "詩中沒有表達作者討厭熱鬧。"], "parent": "想想：前後的變化，讓讀者感覺到什麼？"}, {"id": "CH-L2-E101", "subj": "國文", "unit": "L2 生之歌選", "point": "作者本名", "diff": "簡單", "type": "作者", "q": "〈生之歌選〉的作者杏林子，本名是什麼？", "o": ["劉俠", "楊喚", "古蒙仁", "杜瑞"], "sol": "杏林子本名劉俠。", "w": ["楊喚是〈夏夜〉的作者。", "古蒙仁是〈吃冰的滋味〉的作者。", "杜瑞是〈手的故事〉中提到的畫家。"], "parent": "杏林子＝劉俠。"}, {"id": "CH-L2-E102", "subj": "國文", "unit": "L2 生之歌選", "point": "選文出處", "diff": "簡單", "type": "課文理解", "q": "〈一顆珍珠〉和〈手的故事〉都選自哪一本書？", "o": ["《生之歌》", "《夏夜》", "《吃冰的滋味》", "《一顆珍珠》"], "sol": "兩篇都選自杏林子的《生之歌》。", "w": ["〈夏夜〉是楊喚的詩。", "〈吃冰的滋味〉是古蒙仁的文章。", "〈一顆珍珠〉是其中一篇，不是書名。"], "parent": "課名「生之歌選」就是從《生之歌》選出來的。"}, {"id": "CH-L2-E103", "subj": "國文", "unit": "L2 生之歌選", "point": "沙礫的象徵", "diff": "簡單", "type": "課文理解", "q": "〈一顆珍珠〉中，跑進蚌殼裡、讓蚌很痛苦的「沙礫」，象徵什麼？", "o": ["人生中的磨難、痛苦", "人生中的快樂", "財富與名聲", "朋友的陪伴"], "sol": "沙礫讓蚌痛苦，象徵人生中的磨難與痛苦。", "w": ["沙礫讓蚌痛苦，不是快樂。", "沙礫不代表財富。", "沙礫不代表朋友。"], "parent": "沙礫＝困難；珍珠＝克服困難後的成長。"}, {"id": "CH-L2-M101", "subj": "國文", "unit": "L2 生之歌選", "point": "珍珠的象徵", "diff": "中等", "type": "課文理解", "q": "〈一顆珍珠〉中，蚌把沙礫包覆成「珍珠」，珍珠象徵什麼？", "o": ["把苦難轉化後得到的成長與價值", "天生就擁有的美麗外表", "不需要努力就能得到的成功", "逃避困難後的輕鬆"], "sol": "蚌忍受痛苦，慢慢把沙礫包覆成珍珠，象徵人面對磨難、轉化困境後得到的成長與價值。", "w": ["珍珠是經過痛苦才形成的，不是天生的。", "珍珠需要長時間包覆，不是不用努力。", "蚌沒有逃避沙礫，而是面對它。"], "parent": "口訣：沙子變珍珠，困難變成長。"}, {"id": "CH-L2-M102", "subj": "國文", "unit": "L2 生之歌選", "point": "勃萊爾的例子", "diff": "中等", "type": "課文理解", "q": "作者在〈一顆珍珠〉中提到路易斯・勃萊爾失明後研發點字法，想說明什麼？", "o": ["挫折不一定能阻止一個人發揮價值", "失明的人什麼事都做不了", "只有天才才能發明東西", "點字法是最重要的發明"], "sol": "勃萊爾失明後仍研發點字法，說明挫折不一定能阻止一個人發揮價值，和珍珠的道理相同。", "w": ["勃萊爾的例子正好說明相反的道理。", "重點不是天分，而是面對挫折的態度。", "重點不在比較發明的重要性。"], "parent": "舉例是為了說道理：困難也能變成創造的力量。"}, {"id": "CH-L2-M103", "subj": "國文", "unit": "L2 生之歌選", "point": "藉事說理", "diff": "中等", "type": "寫作手法", "q": "〈生之歌選〉透過蚌和珍珠的故事說明人生的道理，這種寫法稱為什麼？", "o": ["藉事說理", "純粹記敘", "摹寫", "誇飾"], "sol": "藉著故事、事例來說明道理，稱為藉事說理。", "w": ["文章不只說故事，還要說明道理。", "摹寫是描寫感官感受。", "誇飾是故意誇大。"], "parent": "故事是例子，道理才是重點。"}, {"id": "CH-L2-M104", "subj": "國文", "unit": "L2 生之歌選", "point": "作者生平與課文呼應", "diff": "中等", "type": "課文理解", "q": "杏林子長期受疾病所苦，仍持續創作、關懷社會。她的經歷和〈一顆珍珠〉的哪一個道理最相呼應？", "o": ["把苦難轉化為成長和對社會的貢獻", "生病的人應該好好休息，不要工作", "只有健康的人才能成功", "遇到困難最好放棄"], "sol": "杏林子面對病痛仍創作、助人，就像蚌把沙礫轉化成珍珠，把苦難轉化為價值。", "w": ["杏林子正是在病痛中持續創作。", "杏林子的經歷證明病痛不能決定成就。", "杏林子沒有放棄。"], "parent": "作者自己就是一顆珍珠。"}, {"id": "CH-L2-M105", "subj": "國文", "unit": "L2 生之歌選", "point": "詞義：十指纖纖", "diff": "中等", "type": "詞義", "q": "「十指纖纖」的意思是什麼？", "o": ["形容手指柔細", "形容手指粗糙", "形容有十根手指", "形容手很靈巧"], "sol": "「纖纖」是柔細的樣子，十指纖纖形容手指柔細。", "w": ["粗糙正好相反。", "重點在「纖纖」，不是手指數量。", "纖纖是柔細，不是靈巧。"], "parent": "纖＝細，纖纖＝柔細。"}, {"id": "CH-L2-M106", "subj": "國文", "unit": "L2 生之歌選", "point": "詞義：黯然神傷", "diff": "中等", "type": "詞義", "q": "「失去比賽冠軍後，他黯然神傷。」「黯然神傷」的意思是？", "o": ["心情沮喪，神色憂傷", "精神很好，充滿鬥志", "生氣得想打人", "身體受了傷"], "sol": "黯然神傷是心情沮喪、神色憂傷。", "w": ["意思正好相反。", "是難過，不是生氣。", "「神傷」是心裡難過，不是身體受傷。"], "parent": "黯然＝心情灰暗；神傷＝心裡難過。"}, {"id": "CH-L2-M107", "subj": "國文", "unit": "L2 生之歌選", "point": "詞義：試煉、抱負", "diff": "中等", "type": "詞義", "q": "「初次上台演講是她的試煉；她的抱負是成為醫師。」「試煉」和「抱負」的意思依序是？", "o": ["考驗；心中懷抱的志向", "考試；背負的東西", "考驗；沉重的負擔", "練習；抱在懷裡的東西"], "sol": "「試煉」是考驗；「抱負」是心中懷抱的志向。", "w": ["「抱負」不是背的東西。", "「抱負」是志向，不是負擔。", "「試煉」是考驗；「抱負」不是指實際抱著的東西。"], "parent": "詞義要放在句子裡理解。"}, {"id": "CH-L2-H101", "subj": "國文", "unit": "L2 生之歌選", "point": "〈手的故事〉的觀點遷移", "diff": "困難", "type": "閱讀理解", "q": "下列哪一個人的想法，最符合〈手的故事〉的觀點？", "o": ["阿姨的手因長年做粗活而變得粗糙，但她用這雙手照顧全家，這雙手很美。", "手要保養得白白嫩嫩，才是最美的手。", "手要很靈巧、會彈琴畫畫，才有價值。", "手的價值在於能不能幫自己賺很多錢。"], "sol": "〈手的故事〉認為生命的價值在於為別人付出，而不在外表；阿姨的手雖粗糙，卻因付出而美。", "w": ["把外表當成最高價值，正是課文要提醒的錯誤。", "課文看重的是付出的心，不是技巧。", "課文看重為別人付出，不是為自己賺錢。"], "parent": "手美不美，要看它為別人做了什麼。"}, {"id": "CH-L2-H102", "subj": "國文", "unit": "L2 生之歌選", "point": "兩篇道理的辨別", "diff": "困難", "type": "閱讀理解", "q": "下列兩則自編故事，分別較接近哪一篇的道理？\n甲：小明腳受傷不能跑步，改練游泳，後來在游泳比賽得獎。\n乙：清潔隊員每天清掃街道，讓大家有乾淨的環境。", "o": ["甲〈一顆珍珠〉；乙〈手的故事〉", "甲〈手的故事〉；乙〈一顆珍珠〉", "甲、乙都是〈一顆珍珠〉", "甲、乙都是〈手的故事〉"], "sol": "甲是遇到挫折後轉化成成長，接近〈一顆珍珠〉；乙是為別人付出，接近〈手的故事〉。", "w": ["兩篇弄反了。", "乙是在為別人付出，比較接近〈手的故事〉。", "甲是面對挫折後的成長，比較接近〈一顆珍珠〉。"], "parent": "珍珠重磨難，手重付出。"}, {"id": "CH-L3-E101", "subj": "國文", "unit": "L3 吃冰的滋味", "point": "作者", "diff": "簡單", "type": "作者", "q": "〈吃冰的滋味〉的作者是誰？", "o": ["古蒙仁", "楊喚", "杏林子", "劉俠"], "sol": "〈吃冰的滋味〉的作者是古蒙仁。", "w": ["楊喚寫〈夏夜〉。", "杏林子寫〈生之歌選〉。", "劉俠就是杏林子。"], "parent": "吃冰→古蒙仁。"}, {"id": "CH-L3-E102", "subj": "國文", "unit": "L3 吃冰的滋味", "point": "文體", "diff": "簡單", "type": "課文理解", "q": "〈吃冰的滋味〉屬於哪一種文體？", "o": ["記敘兼抒情的散文", "新詩", "小說", "說明文"], "sol": "本文從吃冰回想童年與早期生活，有記敘也有抒情，是散文。", "w": ["新詩是分行的詩，例如〈夏夜〉。", "本文寫的是作者的經驗，不是虛構故事。", "本文不是在說明知識，而是抒發情感。"], "parent": "寫自己的經驗和感受，是記敘兼抒情的散文。"}, {"id": "CH-L3-M101", "subj": "國文", "unit": "L3 吃冰的滋味", "point": "主旨", "diff": "中等", "type": "課文理解", "q": "〈吃冰的滋味〉主要想表達什麼？", "o": ["懷念兒時吃冰的純真樂趣", "介紹哪一種冰最好吃", "批評現代冰品太貴", "說明製作刨冰的方法"], "sol": "作者藉吃冰回憶童年，懷念當時吃冰的純真快樂。", "w": ["文章不是冰品評比。", "文章沒有批評價格。", "文章不是在教做刨冰。"], "parent": "作者懷念的是「童年的快樂」，不是冰本身。"}, {"id": "CH-L3-M102", "subj": "國文", "unit": "L3 吃冰的滋味", "point": "今昔對比", "diff": "中等", "type": "課文理解", "q": "〈吃冰的滋味〉比較早年與現代的冰品，下列敘述何者最符合文意？", "o": ["早年的冰品樸實，現代冰品種類和包裝更多樣", "早年的冰品種類比現代多", "現代的冰品都比早年好吃", "早年和現代的冰品完全一樣"], "sol": "文中提到早年冰品貨真價實、純樸；現代冰品種類、包裝更多。", "w": ["早年的選擇比較少。", "文中沒有說現代冰品都比較好吃。", "文章正是在比較兩者的不同。"], "parent": "早年：簡單樸實；現在：多樣華麗。"}, {"id": "CH-L3-M103", "subj": "國文", "unit": "L3 吃冰的滋味", "point": "詞義：誠然", "diff": "中等", "type": "詞義", "q": "「這做法誠然方便，但成本不低。 ent": "推論要有根據，不要把「懷念」推成「否定」。"}, {"id": "CH-L3-H102", "subj": "國文", "unit": "L3 吃冰的滋味", "point": "成語在語境中的運用", "diff": "困難", "type": "詞語運用", "q": "「這家老店做生意①，所以②，連外地人都慕名而來。」①②最適合依序填入？", "o": ["童叟無欺；名聞遐邇", "名聞遐邇；童叟無欺", "障眼法；名聞遐邇", "童叟無欺；黯然失色"], "sol": "① 做生意誠實是「童叟無欺」；② 因此名聲傳遍遠近，是「名聞遐邇」，所以外地人也慕名而來。", "w": ["兩個成語的位置弄反了：誠實是原因，有名是結果。", "「障眼法」是遮掩真相，和誠實做生意相反。", "「黯然失色」是失去光彩，和「慕名而來」矛盾。"], "parent": "先懂每個成語的意思，再看句子的因果關係。"}, {"id": "CH-L3-H103", "subj": "國文", "unit": "L3 吃冰的滋味", "point": "感官描寫的目的", "diff": "困難", "type": "寫作手法", "q": "作者細細描寫刨冰機的聲音、冰屑的樣子和入口的沁涼，最主要的目的是什麼？", "o": ["讓讀者如身歷其境，也帶出對童年吃冰的懷念", "介紹刨冰機的構造和使用方法", "說明冰品的價格變化", "批評現代冰品不夠衛生"], "sol": "感官摹寫讓畫面生動，讀者彷彿身歷其境，也把作者對童年的懷念帶出來。", "w": ["文章不是在介紹機器。", "感官描寫和價格無關。", "文中沒有批評衛生。"], "parent": "寫作手法要和文章的情感連在一起想。"}];
// ===== 樂樂的段考模擬練習 v3（題庫：樣本第二版修訂 v2.1）=====
const BANK_VER = 'v3-2.1';  // 練習紀錄欄位沿用，題庫擴充時新題目會自動排在前面
const SUBJ = [
  {id:'國文', c:'#B4462B'}, {id:'英語', c:'#1F5FAD'}, {id:'數學', c:'#6B3FA0'}, {id:'自然', c:'#14703F'},
  {id:'歷史', c:'#8A5A00'}, {id:'地理', c:'#0E7490'}, {id:'公民', c:'#9D2A6B'}
];
const perQuiz = s => BYSUBJ[s].length >= 60 ? 20 : 6;   // 題庫擴充完成的科目一次 20 題，其餘 6 題
const RATIO = {簡單:0.3, 中等:0.5, 困難:0.2};
const MIX_PER_SUBJ = 2;                   // 全科綜合：每科 2 題，共 14 題
const L = ['A','B','C','D'];
const DIFFS = ['簡單','中等','困難'];
const app = document.getElementById('app');
let st = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const colorOf = s => (SUBJ.find(x => x.id === s) || {}).c;
const BYSUBJ = {}; for (const x of BANK) (BYSUBJ[x.subj] = BYSUBJ[x.subj] || []).push(x);
const BYID = {}; for (const x of BANK) BYID[x.id] = x;

// ---- 練習紀錄：新題庫用新的欄位，舊題庫的紀錄（lele_used_v2-…）完全不動 ----
const KEY = s => `lele_seen_${BANK_VER}_${s}`;
const MEM = {};
function seen(s){
  if (MEM[s]) return MEM[s];
  let v = {round:1, ids:[]};
  try { const raw = JSON.parse(localStorage.getItem(KEY(s)) || 'null'); if (raw && Array.isArray(raw.ids)) v = {round: raw.round || 1, ids: raw.ids.filter(id => BYID[id])}; } catch(e) {}
  return MEM[s] = {round: v.round, ids: new Set(v.ids)};
}
function saveSeen(s){ const u = seen(s); try { localStorage.setItem(KEY(s), JSON.stringify({round:u.round, ids:[...u.ids]})); } catch(e) {} }
function markSeen(s, id){ const u = seen(s); u.ids.add(id); if (u.ids.size >= BYSUBJ[s].length) { u.ids = new Set(); u.round++; } saveSeen(s); }


// ---- 學習紀錄（理解程度、進步、要記得的重點）：只存在這台裝置 ----
const HKEY = 'lele_hist_v3';
let HIST = {quizzes: [], items: {}};
try { const h = JSON.parse(localStorage.getItem(HKEY) || 'null'); if (h && h.items) HIST = {quizzes: h.quizzes || [], items: h.items}; } catch(e) {}
function saveHist(){ try { localStorage.setItem(HKEY, JSON.stringify(HIST)); } catch(e) {} }
function logAnswer(id, ok){
  const r = HIST.items[id] || (HIST.items[id] = {n:0, ok:0, last:[]});
  r.n++; if (ok) r.ok++; r.last = (r.last || []).concat(ok ? 1 : 0).slice(-3); r.t = Date.now();
  saveHist();
}
function logQuiz(mode, n, score){
  HIST.quizzes.push({t: Date.now(), mode, n, score}); HIST.quizzes = HIST.quizzes.slice(-300); saveHist();
}
const pctTxt = v => v == null ? '—' : Math.round(v * 100) + '%';
function unitStats(s){
  const m = {};
  for (const x of BYSUBJ[s]) { const u = m[x.unit] || (m[x.unit] = {n:0, ok:0, done:0, total:0}); u.total++; const r = HIST.items[x.id]; if (r) { u.done++; u.n += r.last.length; u.ok += r.last.reduce((a, b) => a + b, 0); } }
  return m;
}
function level(rate, n){ if (!n) return ['還沒練', 'lv0']; if (rate >= 0.85) return ['熟練', 'lv3']; if (rate >= 0.6) return ['還可以', 'lv2']; return ['要加強', 'lv1']; }
function lastTwo(mode){ const q = HIST.quizzes.filter(z => z.mode === mode); return [q[q.length - 1], q[q.length - 2]]; }
function needReview(s){
  // 最近一次答錯（還沒在之後答對）的題目
  return BYSUBJ[s].filter(x => { const r = HIST.items[x.id]; return r && r.last.length && r.last[r.last.length - 1] === 0; });
}
function progress(){
  st = null;
  const rows = SUBJ.map(s => {
    const all = BYSUBJ[s.id]; let n = 0, ok = 0, done = 0;
    for (const x of all) { const r = HIST.items[x.id]; if (r) { done++; n += r.last.length; ok += r.last.reduce((a, b) => a + b, 0); } }
    const [a, b] = lastTwo(s.id);
    const d = a && b ? Math.round((a.score / a.n - b.score / b.n) * 100) : null;
    const [lv, cls] = level(n ? ok / n : null, n);
    return `<button class="pg" data-s="${s.id}"><span class="seal" style="--c:${s.c}">${s.id[0]}</span><span class="pgt"><b>${s.id}</b><small>練過 ${done}／${all.length} 題　最近答對率 ${pctTxt(n ? ok / n : null)}</small></span><span class="lv ${cls}">${lv}</span><span class="dl">${d == null ? (a ? `這次 ${Math.round(a.score / a.n * 100)} 分` : '') : (d > 0 ? `比上次進步 ${d} 分` : d < 0 ? `比上次少 ${-d} 分` : '和上次一樣')}</span></button>`;
  }).join('');
  app.innerHTML = `
    <div class="bar"><button class="ghost" id="home">科目選單</button><span class="where">我的進度</span></div>
    <p class="tips">「最近答對率」看的是每題最近三次的作答。點科目可以看各單元的理解程度和要記得的重點。紀錄只存在這台裝置。</p>
    <div class="pglist">${rows}</div>`;
  app.querySelector('#home').onclick = menu;
  app.querySelectorAll('.pg').forEach(b => b.onclick = () => subjProgress(b.dataset.s));
  window.scrollTo(0, 0);
}
function subjProgress(s){
  const us = unitStats(s);
  const units = Object.entries(us).map(([u, v]) => { const [lv, cls] = level(v.n ? v.ok / v.n : null, v.n); const w = v.n ? Math.round(v.ok / v.n * 100) : 0;
    return `<div class="ur"><div class="un"><b>${esc(u)}</b><small>練過 ${v.done}／${v.total} 題</small></div><div class="ubar"><i style="width:${w}%"></i></div><span class="lv ${cls}">${lv}${v.n ? ' ' + w + '%' : ''}</span></div>`; }).join('');
  const q = HIST.quizzes.filter(z => z.mode === s).slice(-6);
  const trend = q.length ? `<div class="trend">${q.map((z, i) => `<span><b>${Math.round(z.score / z.n * 100)}</b><small>第 ${HIST.quizzes.filter(y => y.mode === s).length - q.length + i + 1} 次</small></span>`).join('<em>→</em>')}</div>` : '<p class="tips">還沒有完成過這一科的練習。</p>';
  const rv = needReview(s);
  const memo = rv.length ? `<div class="memo">${rv.map(x => `<div class="mi"><p class="mp"><span class="tag">${esc(x.unit)}</span>${esc(x.point)}</p><p>${esc(x.parent)}</p><p class="ma">正確答案：${esc(x.o[0])}</p></div>`).join('')}</div>
      <div class="acts"><button class="pri" id="redoall">把這 ${rv.length} 題再練一次</button></div>` : '<p class="tips">目前沒有待加強的題目，很棒！</p>';
  app.innerHTML = `
    <div class="bar"><button class="ghost" id="back">我的進度</button><span class="where">${s}｜理解程度</span></div>
    <h2>最近幾次成績</h2>${trend}
    <h2>各單元理解程度</h2><div class="units">${units}</div>
    <h2>需要重點記得的地方（${rv.length} 題）</h2><p class="tips">這些是最近一次答錯、還沒訂正的題目。再練一次答對，就會從這裡消失。</p>${memo}`;
  app.querySelector('#back').onclick = progress;
  const r = app.querySelector('#redoall'); if (r) r.onclick = () => start('錯題', rv.map(x => ({d: x})));
  window.scrollTo(0, 0);
}

// ---- 抽題：依難度比例、單元平衡、優先未練過、題組一起出 ----
function targets(n){
  const t = {}; let sum = 0;
  for (const d of DIFFS) { t[d] = Math.floor(n * RATIO[d]); sum += t[d]; }
  const rest = DIFFS.map(d => [d, n * RATIO[d] - Math.floor(n * RATIO[d])]).sort((a, b) => b[1] - a[1]);
  for (let i = 0; sum < n; i++, sum++) t[rest[i % 3][0]]++;
  return t;
}
function pickBalanced(pool, k, usedUnits){
  // 依單元輪流挑：先挑這次還沒出現過的單元
  const out = []; let cand = shuffle(pool);
  while (out.length < k && cand.length) {
    cand.sort((a, b) => (usedUnits[a.unit] || 0) - (usedUnits[b.unit] || 0));
    const minU = usedUnits[cand[0].unit] || 0;
    const same = cand.filter(x => (usedUnits[x.unit] || 0) === minU);
    const x = same[Math.floor(Math.random() * same.length)];
    out.push(x); usedUnits[x.unit] = (usedUnits[x.unit] || 0) + 1;
    cand = cand.filter(y => y !== x);
  }
  return out;
}
function drawSubject(s, n, t){
  const all = BYSUBJ[s], u = seen(s), units = {}; t = t || targets(n);
  let picked = [];
  for (const d of DIFFS) {
    const fresh = all.filter(x => x.diff === d && !u.ids.has(x.id));
    const old = all.filter(x => x.diff === d && u.ids.has(x.id));
    let got = pickBalanced(fresh, t[d], units);
    if (got.length < t[d]) got = got.concat(pickBalanced(old, t[d] - got.length, units));
    picked = picked.concat(got);
  }
  if (picked.length < n) { // 某個難度題目不夠時，用其他未練過的題目補
    const left = all.filter(x => !picked.includes(x));
    const fresh = left.filter(x => !u.ids.has(x.id)), old = left.filter(x => u.ids.has(x.id));
    picked = picked.concat(pickBalanced(fresh, n - picked.length, units));
    if (picked.length < n) picked = picked.concat(pickBalanced(old, n - picked.length, units));
  }
  // 題組：抽到其中一題，同組其他題一起出，依組內順序排在一起
  const withGroups = [];
  for (const x of picked) {
    if (withGroups.includes(x)) continue;
    if (x.group) all.filter(y => y.group === x.group).sort((a, b) => a.id < b.id ? -1 : 1).forEach(y => { if (!withGroups.includes(y)) withGroups.push(y); });
    else withGroups.push(x);
  }
  // 由易到難排列，同難度內隨機
  const order = {簡單:0, 中等:1, 困難:2};
  return withGroups.map(x => ({x, r: Math.random()})).sort((a, b) => order[a.x.diff] - order[b.x.diff] || a.r - b.r).map(o => o.x);
}
const makeQ = x => ({s: x.subj, id: x.id, d: x, perm: x.noShuffle ? [0,1,2,3] : shuffle([0,1,2,3])});

// ---- 畫面 ----
function menu(){
  st = null;
  app.innerHTML = `
    <header class="brand"><h1>樂樂的段考模擬練習</h1><p>康軒版　第一次段考　10/13－10/14</p></header>
    <p class="note-top">新題庫：每題都查證過來源，難度約為簡單 3、中等 5、困難 2 的比例。${SUBJ.map(x=>x.id).filter(s=>BYSUBJ[s].length>=60).join('、')}已擴充到約 100 題（一次 20 題）${SUBJ.map(x=>x.id).some(s=>BYSUBJ[s].length<60)?'；'+SUBJ.map(x=>x.id).filter(s=>BYSUBJ[s].length<60).join('、')+'擴充中（目前 12 題，一次 6 題）':''}。同一科要把題目都練過一輪，才會再出現練過的題目。</p>
    <div class="subjects">
      ${SUBJ.map(s => { const u = seen(s.id), n = BYSUBJ[s.id].length; return `<button class="subj" data-s="${s.id}"><span class="seal" style="--c:${s.c}">${s.id[0]}</span><span><b>${s.id}</b><small>${u.round > 1 ? `第 ${u.round} 輪　` : ''}已練 ${u.ids.size}／${n} 題</small></span></button>`; }).join('')}
      <button class="subj mix" data-s="全科"><span class="seal">全</span><span><b>全科綜合</b><small>七科各 ${MIX_PER_SUBJ} 題，共 ${MIX_PER_SUBJ * SUBJ.length} 題</small></span></button>
    </div>
    <p class="tips">點選科目開始。練過的題目會記在這台裝置上，同一科全部練過一輪以後，才會再出現練過的題目。作答後會出現解析，按「下一題」繼續。用鍵盤也可以：按 1～4 選答案，按 Enter 下一題。</p>
    <div class="acts"><button id="prog" class="pri">我的進度與要記得的重點</button><button id="reset" class="ghost">清除新題庫的練習紀錄</button></div>`;
  app.querySelector('#prog').onclick = progress;
  app.querySelectorAll('.subj').forEach(b => b.onclick = () => start(b.dataset.s));
  const rb = app.querySelector('#reset');
  rb.onclick = () => {
    if (rb.dataset.armed) { SUBJ.forEach(s => { MEM[s.id] = {round:1, ids:new Set()}; saveSeen(s.id); }); HIST = {quizzes: [], items: {}}; saveHist(); menu(); }
    else { rb.dataset.armed = '1'; rb.textContent = '確定要清除練習與進度紀錄嗎？再按一次'; }
  };
  window.scrollTo(0, 0);
}

function start(mode, items){
  let list;
  if (items) list = items.map(q => makeQ(q.d));
  else if (mode === '全科') {
    // 全科綜合也照比例：先算 14 題的難度配額，再隨機分給七科（每科 2 題）
    const N = MIX_PER_SUBJ * SUBJ.length, T = targets(N), slots = shuffle(DIFFS.flatMap(d => Array(T[d]).fill(d)));
    list = shuffle(SUBJ.flatMap((s, i) => { const t = {簡單:0, 中等:0, 困難:0}; slots.slice(i * MIX_PER_SUBJ, (i + 1) * MIX_PER_SUBJ).forEach(d => t[d]++); return drawSubject(s.id, MIX_PER_SUBJ, t); })).map(makeQ);
  }
  else list = drawSubject(mode, perQuiz(mode)).map(makeQ);
  st = {mode, qs: list, i: 0, score: 0, answered: false, wrong: []};
  show();
}
const multi = () => st.mode === '全科' || st.mode === '錯題';

function figHTML(d){ return d.fig ? `<div class="figwrap">${d.fig}</div>` : ''; }

function show(){
  const q = st.qs[st.i], d = q.d, n = st.qs.length;
  app.innerHTML = `
    <div class="bar">
      <button class="ghost" id="home">科目選單</button>
      <span class="where">${multi() ? `${st.mode === '錯題' ? '錯題再練' : '全科綜合'}｜` : ''}${q.s}｜第 ${st.i + 1} 題／共 ${n} 題</span>
      <span class="score">答對 ${st.score}</span>
    </div>
    <div class="prog"><i style="width:${st.i / n * 100}%"></i></div>
    <div class="qmeta"><span class="tag" style="color:${colorOf(q.s)};border-color:${colorOf(q.s)}">${multi() ? q.s + '　' : ''}${esc(d.unit)}</span><span class="dtag d-${d.diff}">${d.diff}</span></div>
    ${figHTML(d)}
    <h2 class="q">${esc(d.q)}</h2>
    <div class="opts">${q.perm.map((o, k) => `<button class="opt" data-o="${o}" id="opt${k}"><span class="k">${L[k]}</span><span class="t">${esc(d.o[o])}</span></button>`).join('')}</div>
    <div id="after"></div>`;
  app.querySelector('#home').onclick = menu;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.o));
  window.scrollTo(0, 0);
}

function exHTML(q, chosen){
  const d = q.d, ck = L[q.perm.indexOf(0)];
  let h = `<p class="r"><span class="lb">正確答案</span><span><b>(${ck}) ${esc(d.o[0])}</b><br>${esc(d.sol)}</span></p>`;
  if (chosen !== 0 && chosen != null) h += `<p class="w"><span class="lb">你選的錯在哪</span><span><b>(${L[q.perm.indexOf(chosen)]}) ${esc(d.o[chosen])}</b>：${esc(d.w[chosen - 1])}</span></p>`;
  if (d.ex) h += `<p class="e"><span class="lb">例句</span><span>${esc(d.ex)}</span></p>`;
  h += `<p class="m"><span class="lb">簡單記</span><span>${esc(d.parent)}</span></p>`;
  const others = [1,2,3].filter(i => i !== chosen);
  h += `<details class="more"><summary>其他選項為什麼錯</summary>${others.map(i => `<p class="w"><span class="lb">(${L[q.perm.indexOf(i)]})</span><span><b>${esc(d.o[i])}</b>：${esc(d.w[i - 1])}</span></p>`).join('')}</details>`;
  return h;
}

function answer(o){
  if (st.answered) return;
  st.answered = true;
  const q = st.qs[st.i], ok = o === 0;
  if (st.mode !== '錯題') markSeen(q.s, q.id);
  logAnswer(q.id, ok);
  if (ok) st.score++; else st.wrong.push({...q, chosen: o});
  app.querySelectorAll('.opt').forEach(b => {
    const v = +b.dataset.o; b.disabled = true;
    if (v === 0) b.classList.add('right'); else if (v === o) b.classList.add('wrong'); else b.classList.add('dim');
  });
  app.querySelector('.score').textContent = `答對 ${st.score}`;
  const last = st.i === st.qs.length - 1;
  const after = app.querySelector('#after');
  after.className = 'after';
  after.innerHTML = `<div class="verdict ${ok ? 'good' : 'no'}">${ok ? '答對了！' : '差一點！'}</div><div class="ex">${exHTML(q, o)}</div><button class="next" id="next">${last ? '看成績' : '下一題'}</button>`;
  const nb = after.querySelector('#next');
  nb.onclick = next;
  try { after.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'}); } catch(e) {}
  nb.focus({preventScroll: true});
}

function next(){
  if (!st || !st.answered) return;
  st.answered = false;
  if (st.i < st.qs.length - 1) { st.i++; show(); } else result();
}

function result(){
  const n = st.qs.length, pct = Math.round(st.score / n * 100);
  if (st.mode !== '錯題') logQuiz(st.mode, n, st.score);
  const [cur, prev] = st.mode !== '錯題' ? lastTwo(st.mode) : [null, null];
  const cmp = prev ? (() => { const d = pct - Math.round(prev.score / prev.n * 100); return `<p class="msg cmp">${d > 0 ? `比上一次進步 ${d} 分！` : d < 0 ? `比上一次少 ${-d} 分，看看下面的錯題。` : '和上一次一樣。'}（上一次 ${Math.round(prev.score / prev.n * 100)} 分）</p>`; })() : '';
  const msg = pct === 100 ? '全對！這個範圍你已經很熟了。' : pct >= 80 ? '很棒！把下面的錯題再看一次就更穩了。' : pct >= 60 ? '有基礎了，先看錯題的「簡單記」，再練一次。' : '沒關係，先看錯題解析，再回去讀重點本，然後再練一次。';
  const label = st.mode === '全科' ? '全科綜合' : st.mode === '錯題' ? '錯題再練' : st.mode;
  const prog = (st.mode !== '全科' && st.mode !== '錯題') ? `<p class="msg">${st.mode}：已練 ${seen(st.mode).ids.size}／${BYSUBJ[st.mode].length} 題${seen(st.mode).round > 1 ? `（第 ${seen(st.mode).round} 輪）` : ''}。再按「下一組」會優先出還沒練過的題目。</p>` : '';
  app.innerHTML = `
    <div class="bar"><button class="ghost" id="home">科目選單</button><span class="where">${label}｜成績</span></div>
    <p class="big">${st.score}<small> ／ ${n} 題　${pct} 分</small></p>
    <p class="msg">${msg}</p>${cmp}${prog}
    <div class="acts">
      ${st.wrong.length ? '<button class="pri" id="redo">錯題再練一次</button>' : ''}
      ${st.mode !== '錯題' ? `<button id="again">${st.mode === '全科' ? '再來一組全科' : `下一組 ${perQuiz(st.mode)} 題`}</button>` : ''}
      <button id="back">回到科目選單</button>
    </div>
    ${st.wrong.length ? `<h2>答錯的題目（${st.wrong.length} 題）</h2><div class="review">${st.wrong.map(w => `
      <div class="rv"><p class="rq"><span class="tag" style="color:${colorOf(w.s)};border-color:${colorOf(w.s)}">${w.s}　${esc(w.d.unit)}</span>${esc(w.d.q)}</p>
      ${figHTML(w.d)}
      <p class="ans">你選：<span class="bad">${esc(w.d.o[w.chosen])}</span>　正確：<span class="ok">${esc(w.d.o[0])}</span></p>
      <div class="ex">${exHTML(w, w.chosen)}</div></div>`).join('')}</div>` : ''}`;
  const mode = st.mode, wrong = st.wrong;
  app.querySelector('#home').onclick = menu;
  app.querySelector('#back').onclick = menu;
  const r = app.querySelector('#redo'); if (r) r.onclick = () => start('錯題', wrong);
  const a = app.querySelector('#again'); if (a) a.onclick = () => start(mode);
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (!st || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const idx = ['1','2','3','4'].indexOf(k) >= 0 ? ['1','2','3','4'].indexOf(k) : ['a','b','c','d'].indexOf(k);
  if (!st.answered && idx >= 0) { const b = document.getElementById('opt' + idx); if (b) { e.preventDefault(); b.click(); } }
  else if (st.answered && (k === 'enter' || k === 'arrowright' || k === ' ')) { e.preventDefault(); next(); }
});
(async () => { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e) {} })();
menu();

</script>
