性約 100，65°C 時約 5，活性明顯下降。溫度過高會使酵素失去原有的功能。", "w": ["37°C 之後曲線是往下的，不是往上。", "曲線有明顯的變化。", "37°C 到 65°C 之間曲線一路下降，沒有再上升。"], "parent": "過了最高點，溫度再升高，酵素反而做不好。", "fig": "<svg class=\"fig\" viewBox=\"0 0 480 280\" role=\"img\" aria-label=\"某種酵素的活性與溫度（自編資料）\"><title>某種酵素的活性與溫度（自編資料）</title><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"230\" stroke=\"#13233A\" stroke-width=\"2\"/><line x1=\"60\" y1=\"230\" x2=\"460\" y2=\"230\" stroke=\"#13233A\" stroke-width=\"2\"/><line x1=\"60.0\" y1=\"230\" x2=\"60.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"60.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0</text><line x1=\"160.0\" y1=\"230\" x2=\"160.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"160.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">20</text><line x1=\"260.0\" y1=\"230\" x2=\"260.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"260.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">40</text><line x1=\"360.0\" y1=\"230\" x2=\"360.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"360.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">60</text><line x1=\"460.0\" y1=\"230\" x2=\"460.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"460.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">80</text><line x1=\"54\" y1=\"230.0\" x2=\"460\" y2=\"230.0\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"234.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0</text><line x1=\"54\" y1=\"177.5\" x2=\"460\" y2=\"177.5\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"181.5\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">25</text><line x1=\"54\" y1=\"125.0\" x2=\"460\" y2=\"125.0\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"129.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">50</text><line x1=\"54\" y1=\"72.5\" x2=\"460\" y2=\"72.5\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"76.5\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">75</text><line x1=\"54\" y1=\"20.0\" x2=\"460\" y2=\"20.0\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"24.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">100</text><polyline points=\"60.0,219.5 110.0,188.0 160.0,135.5 210.0,62.0 245.0,20.0 285.0,83.0 335.0,177.5 385.0,219.5 460.0,230.0\" fill=\"none\" stroke=\"#1F5FAD\" stroke-width=\"3\"/><circle cx=\"60.0\" cy=\"219.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"110.0\" cy=\"188.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"160.0\" cy=\"135.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"210.0\" cy=\"62.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"245.0\" cy=\"20.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"285.0\" cy=\"83.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"335.0\" cy=\"177.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"385.0\" cy=\"219.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"460.0\" cy=\"230.0\" r=\"4\" fill=\"#1F5FAD\"/><text x=\"260.0\" y=\"274\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">溫度（°C）</text><text x=\"14\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" transform=\"rotate(-90 14 125.0)\" font-family=\"Noto Sans TC, sans-serif\">相對活性</text></svg>"}, {"id": "SC-2-2-M103", "subj": "自然", "unit": "2-2 酵素", "point": "唾液分解澱粉的產物檢驗", "diff": "中等", "type": "觀念應用", "q": "把唾液加入澱粉液中，在 37°C 放置 10 分鐘後加入本氏液隔水加熱，出現橙紅色。這表示什麼？", "o": ["澱粉被分解成能讓本氏液變色的糖", "澱粉沒有變化", "唾液中含有大量澱粉", "本氏液和唾液直接反應變色"], "sol": "唾液中的澱粉酶把澱粉分解成麥芽糖等還原糖，所以本氏液加熱後變成橙紅色。", "w": ["本氏液變色表示產生了糖，澱粉有被分解。", "唾液中主要是酵素，不是澱粉。", "本氏液是和糖反應，不是和唾液本身反應。"], "parent": "本氏液變色＝有糖產生＝澱粉被唾液分解了。"}, {"id": "SC-2-2-M104", "subj": "自然", "unit": "2-2 酵素", "point": "酸鹼度影響酵素", "diff": "中等", "type": "觀念辨識", "q": "關於酸鹼度和酵素，下列敘述何者最正確？", "o": ["不同酵素有各自適合的酸鹼度", "所有酵素都在相同的酸鹼度下作用最好", "酸鹼度不會影響酵素", "酵素只在中性環境作用"], "sol": "不同的酵素有各自適合的酸鹼度範圍，例如口腔和胃中的酵素，適合的環境就不同。", "w": ["各種酵素適合的酸鹼度不一定相同。", "酸鹼度會影響酵素的作用。", "有些酵素適合在偏酸或偏鹼的環境中作用。"], "parent": "每種酵素都有自己最喜歡的「溫度」和「酸鹼」。"}, {"id": "SC-2-2-M105", "subj": "自然", "unit": "2-2 酵素", "point": "煮過的唾液", "diff": "中等", "type": "推理", "q": "把唾液先煮沸再冷卻到 37°C，加入澱粉液放置 10 分鐘後滴碘液，結果呈藍黑色。最可能的原因是什麼？", "o": ["高溫使唾液中的酵素失去活性，冷卻後也無法恢復", "冷卻到 37°C 是最適合的溫度，所以澱粉被分解完了", "碘液遇到唾液會變藍黑色", "澱粉在煮沸時被分解了"], "sol": "滴碘液呈藍黑色，表示澱粉還在，沒有被分解。煮沸使唾液中的酵素失去活性，即使冷卻到 37°C 也無法恢復作用。", "w": ["如果澱粉被分解完，碘液就不會變藍黑色。", "碘液是遇到澱粉才變藍黑色，不是遇到唾液。", "煮沸的是唾液，不是澱粉液；而且碘液顯示澱粉還在。"], "parent": "酵素被煮壞了就像蛋被煮熟，冷掉也變不回生蛋。"}, {"id": "SC-2-2-M106", "subj": "自然", "unit": "2-2 酵素", "point": "酵素的日常例子", "diff": "中等", "type": "觀念應用", "q": "有些洗衣精添加了酵素，可以把衣服上的蛋白質汙漬分解掉。下列敘述何者最合理？", "o": ["洗衣精中的酵素對蛋白質汙漬有專一性", "這種酵素可以分解所有種類的汙漬", "用滾燙的熱水一定洗得最乾淨", "酵素洗衣精完全不受水溫影響"], "sol": "這種酵素能分解蛋白質汙漬，表現出專一性。酵素受溫度影響，太燙的水可能讓酵素失去作用。", "w": ["酵素有專一性，不能分解所有汙漬。", "太燙的水可能讓酵素失去活性，不一定洗得最乾淨。", "酵素會受溫度影響。"], "parent": "洗衣精的酵素也是「一把鑰匙開一把鎖」，而且怕燙。"}, {"id": "SC-2-2-H101", "subj": "自然", "unit": "2-2 酵素", "point": "由折線圖比較兩個溫度", "diff": "困難", "type": "圖表推理", "q": "根據下圖的酵素折線圖（自編資料），下列敘述何者正確？", "o": ["20°C 和 50°C 都能作用，但都不如 37°C", "20°C 時酵素已經永久失去活性，不能作用", "50°C 時的活性比 37°C 還要高一些", "溫度愈高，這種酵素的活性一定愈高"], "sol": "圖中 20°C 時活性約 45、50°C 時約介於 70 和 25 之間，兩者都比 37°C 的 100 低，但都還有作用。", "w": ["20°C 時活性約 45，仍能作用；低溫通常只是讓作用變慢。", "50°C 時活性比 37°C 低。", "超過 37°C 後活性下降，不是一直上升。"], "parent": "在圖上分別找 20°C、37°C、50°C 的位置比高低。", "fig": "<svg class=\"fig\" viewBox=\"0 0 480 280\" role=\"img\" aria-label=\"某種酵素的活性與溫度（自編資料）\"><title>某種酵素的活性與溫度（自編資料）</title><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"230\" stroke=\"#13233A\" stroke-width=\"2\"/><line x1=\"60\" y1=\"230\" x2=\"460\" y2=\"230\" stroke=\"#13233A\" stroke-width=\"2\"/><line x1=\"60.0\" y1=\"230\" x2=\"60.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"60.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0</text><line x1=\"160.0\" y1=\"230\" x2=\"160.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"160.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">20</text><line x1=\"260.0\" y1=\"230\" x2=\"260.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"260.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">40</text><line x1=\"360.0\" y1=\"230\" x2=\"360.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"360.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">60</text><line x1=\"460.0\" y1=\"230\" x2=\"460.0\" y2=\"236\" stroke=\"#13233A\"/><text x=\"460.0\" y=\"252\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">80</text><line x1=\"54\" y1=\"230.0\" x2=\"460\" y2=\"230.0\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"234.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0</text><line x1=\"54\" y1=\"177.5\" x2=\"460\" y2=\"177.5\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"181.5\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">25</text><line x1=\"54\" y1=\"125.0\" x2=\"460\" y2=\"125.0\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"129.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">50</text><line x1=\"54\" y1=\"72.5\" x2=\"460\" y2=\"72.5\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"76.5\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">75</text><line x1=\"54\" y1=\"20.0\" x2=\"460\" y2=\"20.0\" stroke=\"#E2E8F0\"/><text x=\"50\" y=\"24.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">100</text><polyline points=\"60.0,219.5 110.0,188.0 160.0,135.5 210.0,62.0 245.0,20.0 285.0,83.0 335.0,177.5 385.0,219.5 460.0,230.0\" fill=\"none\" stroke=\"#1F5FAD\" stroke-width=\"3\"/><circle cx=\"60.0\" cy=\"219.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"110.0\" cy=\"188.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"160.0\" cy=\"135.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"210.0\" cy=\"62.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"245.0\" cy=\"20.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"285.0\" cy=\"83.0\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"335.0\" cy=\"177.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"385.0\" cy=\"219.5\" r=\"4\" fill=\"#1F5FAD\"/><circle cx=\"460.0\" cy=\"230.0\" r=\"4\" fill=\"#1F5FAD\"/><text x=\"260.0\" y=\"274\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">溫度（°C）</text><text x=\"14\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" transform=\"rotate(-90 14 125.0)\" font-family=\"Noto Sans TC, sans-serif\">相對活性</text></svg>"}, {"id": "SC-2-2-H102", "subj": "自然", "unit": "2-2 酵素", "point": "設計實驗驗證酵素專一性", "diff": "困難", "type": "實驗設計推理", "q": "小英想證明「唾液澱粉酶只能分解澱粉，不能分解蛋白質」。下列哪一種設計最恰當？", "o": ["甲：澱粉液＋唾液；乙：蛋白質液＋唾液，其他條件相同", "甲：澱粉液＋唾液；乙：澱粉液＋清水，其他條件相同", "甲：澱粉液＋唾液，放 37°C；乙：澱粉液＋唾液，放 100°C", "甲：蛋白質液＋唾液；乙：蛋白質液＋清水，其他條件相同"], "sol": "要證明專一性，必須讓同一種酵素分別作用在不同的物質上（澱粉、蛋白質），其他條件相同，比較哪一種被分解。", "w": ["這個設計只能證明唾液能分解澱粉，不能證明它不能分解蛋白質。", "這個設計研究的是溫度的影響，不是專一性。", "這個設計只測蛋白質，沒有和澱粉比較，無法說明「只能」分解澱粉。"], "parent": "專一性要比較「同一種酵素，對不同東西」的效果。"}, {"id": "SC-1-3-M107", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "擴散的方向", "diff": "中等", "type": "觀念辨識", "q": "關於擴散，下列敘述何者正確？", "o": ["粒子由濃度高的地方往濃度低的地方移動", "粒子由濃度低的地方往濃度高的地方移動", "只有水會擴散", "擴散一定要通過細胞膜"], "sol": "擴散是粒子由濃度較高處往濃度較低處散開，直到分布均勻。", "w": ["方向弄反了。", "香水、墨水等各種粒子都會擴散。", "擴散不一定要通過膜；房間裡的香味擴散就不用。"], "parent": "擴散：從「擠」的地方散到「空」的地方。"}, {"id": "SC-2-2-E104", "subj": "自然", "unit": "2-2 酵素", "point": "酵素的作用", "diff": "簡單", "type": "觀念辨識", "q": "酵素在生物體內主要的作用是什麼？", "o": ["加快化學反應的速率", "提供身體能量", "構成細胞壁", "儲存遺傳物質"], "sol": "酵素是生物催化劑，可以加快生物體內化學反應的速率，例如消化食物。", "w": ["提供能量的是醣類、脂質、蛋白質等養分。", "細胞壁主要由纖維素等構成，和酵素功能無關。", "儲存遺傳物質的是細胞核。"], "parent": "酵素像加速器，讓反應變快。"}, {"id": "SC-1-3-M108", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "養分需溶於水才能進入細胞", "diff": "中等", "type": "推理", "q": "食物中的大分子澱粉，需要先被分解成葡萄糖等小分子，才能被細胞吸收利用。下列推論何者最合理？", "o": ["分子太大的物質不容易通過細胞膜", "細胞膜會讓所有物質自由通過", "澱粉比葡萄糖更容易進入細胞", "細胞不需要醣類"], "sol": "細胞膜具有選擇性，大分子的澱粉不容易通過；分解成小分子的葡萄糖後，才容易進入細胞被利用。", "w": ["細胞膜有選擇性，不是所有物質都能自由通過。", "澱粉是大分子，比葡萄糖更難進入細胞。", "醣類是細胞重要的能量來源。"], "parent": "大塊的東西要先切小，才能從小門進去。"}, {"id": "SC-0-M107", "subj": "自然", "unit": "緒論 科學方法", "point": "實驗室安全：加熱試管", "diff": "中等", "type": "觀念應用", "q": "加熱試管中的液體時，下列做法何者正確？", "o": ["試管口不要朝向自己或別人", "試管口要朝向自己，方便觀察", "加熱時用手直接拿試管", "液體裝滿整支試管再加熱"], "sol": "加熱時液體可能噴出，試管口不要對著任何人；要用試管夾夾住，液體約裝三分之一以下。", "w": ["試管口對著自己，液體噴出會燙傷。", "直接用手拿會燙傷，要用試管夾。", "裝太滿加熱時容易噴出。"], "parent": "試管口朝向沒有人的方向。"}, {"id": "SC-1-3-M109", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "植物細胞放在濃鹽水", "diff": "中等", "type": "推理", "q": "把植物細胞放在很濃的鹽水中一段時間後，用顯微鏡觀察，最可能看到什麼現象？", "o": ["液泡變小，細胞膜離開細胞壁", "細胞吸水膨脹，最後脹破", "細胞壁被鹽溶解而消失", "液泡變大，細胞變得比原來大"], "sol": "濃鹽水比細胞內濃，水從細胞滲透出來，液泡縮小，細胞膜和細胞質向內收縮，和細胞壁分開；細胞壁仍維持形狀。", "w": ["濃鹽水中細胞是失水，不是吸水；而且植物細胞有細胞壁。", "細胞壁不會被鹽溶解。", "失水時液泡會變小，不會變大。"], "parent": "水跑掉了，裡面縮起來，外牆（細胞壁）還在。"}, {"id": "SC-1-1-M111", "subj": "自然", "unit": "1-1 生命現象", "point": "生長與發育", "diff": "中等", "type": "觀念應用", "q": "毛毛蟲變成蛹，再變成蝴蝶。這個過程最主要說明哪一種生命現象？", "o": ["生長與發育", "感應", "代謝", "擴散"], "sol": "個體的構造和形態隨時間改變，從幼蟲變成蛹再變成成蟲，屬於生長與發育。", "w": ["感應是對刺激的立即反應。", "代謝是物質和能量的轉換。", "擴散是粒子的移動現象，不是生命現象。"], "parent": "從小長大、樣子改變，就是生長與發育。"}, {"id": "SC-1-4-M105", "subj": "自然", "unit": "1-4 從細胞到個體", "point": "個體的層次", "diff": "中等", "type": "觀念辨識", "q": "一棵完整的芒果樹，屬於哪一個組成層次？", "o": ["個體", "器官", "器官系統", "組織"], "sol": "能獨立生活的完整生物是個體。一棵完整的芒果樹就是一個個體。", "w": ["芒果樹的葉、果實才是器官。", "植物通常不分器官系統。", "組織只是一群相似的細胞。"], "parent": "一整棵樹、一整隻貓＝個體。"}, {"id": "SC-2-2-M107", "subj": "自然", "unit": "2-2 酵素", "point": "低溫下的酵素", "diff": "中等", "type": "推理", "q": "把唾液和澱粉液混合後放在 0°C 的冰水中 10 分鐘，滴碘液仍呈藍黑色；再把同一支試管移到 37°C 放置 10 分鐘，滴碘液就不呈藍黑色了。這說明什麼？", "o": ["低溫只使作用變慢，回溫後又能作用", "低溫使酵素永久失去活性，無法恢復", "碘液在 37°C 時會失效而無法變色", "澱粉在 37°C 下會自己慢慢消失"], "sol": "0°C 時澱粉沒被分解，回到 37°C 後被分解了，表示低溫只是讓酵素作用變慢，溫度回升後仍能作用。", "w": ["如果永久失活，回到 37°C 也無法分解澱粉。", "碘液在 37°C 仍能檢驗澱粉。", "澱粉不會自己消失，是被唾液中的酵素分解。"], "parent": "冷的時候酵素「睡著」，暖起來又「醒來」；太熱才會「壞掉」。"}, {"id": "SC-1-2-M107", "subj": "自然", "unit": "1-2 細胞", "point": "多細胞生物的細胞形態", "diff": "中等", "type": "推理", "q": "人體的神經細胞細長、紅血球呈圓盤狀，形狀差異很大。這最能說明什麼？", "o": ["細胞的形態和它的功能有關", "人體的細胞都一模一樣", "形狀不同的細胞不是同一種生物", "細胞的形態不會影響功能"], "sol": "多細胞生物中，不同細胞負責不同工作，形態也不同，例如神經細胞細長，適合傳遞訊息。", "w": ["人體細胞形態各不相同。", "它們都屬於人體，只是功能不同。", "形態和功能密切相關。"], "parent": "工具長什麼樣子，跟它要做的工作有關，細胞也是。"}, {"id": "SC-0-H103", "subj": "自然", "unit": "緒論 科學方法", "point": "實驗結果與變因判斷（兩變因混雜）", "diff": "困難", "type": "實驗設計推理", "q": "小傑比較兩種肥料：甲組用 A 肥料、放在窗邊；乙組用 B 肥料、放在室內角落。結果甲組長得比較高，他認為 A 肥料比較好。下列評論何者最恰當？", "o": ["不能下這個結論，因為兩組的光照也不同", "可以下這個結論，因為甲組比較高", "不能下這個結論，因為肥料不應該是操縱變因", "可以下這個結論，只要再多量幾次高度"], "sol": "兩組同時有肥料和光照兩個條件不同，甲組長得高可能是光照比較充足，不一定是肥料比較好。", "w": ["兩組有兩個條件不同，不能只歸因於肥料。", "研究肥料的效果時，肥料本來就是操縱變因。", "多量幾次高度，仍無法分開光照和肥料的影響。"], "parent": "同時改兩個條件，就分不出是誰造成的。"}, {"id": "SC-1-1-H103", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "倍率換算與細胞實際大小", "diff": "困難", "type": "計算推理", "q": "用總放大倍率 400 倍觀察時，某細胞在視野中看起來長 20 毫米。這個細胞的實際長度約為多少微米（μm）？", "o": ["50 微米", "8,000 微米", "0.05 微米", "5 微米"], "sol": "實際長度＝看起來的長度÷倍率＝20÷400＝0.05 毫米。0.05 毫米×1,000＝50 微米。", "w": ["用乘的算成 20×400，放大後的長度要除以倍率才是實際長度。", "0.05 是毫米，還要換成微米（乘以 1,000）。", "換算時少乘了 10：0.05 毫米＝50 微米。"], "parent": "先用除的求實際長度，再把毫米換成微米。"}, {"id": "SC-2-2-H103", "subj": "自然", "unit": "2-2 酵素", "point": "預測唾液實驗的兩種檢驗結果", "diff": "困難", "type": "整合推理", "q": "甲試管：澱粉液＋唾液；乙試管：澱粉液＋等量清水。兩管都在 37°C 放置 10 分鐘，再各分成兩份，分別滴碘液、加本氏液隔水加熱。下列預期結果何者最合理？", "o": ["甲：碘液不呈藍黑、本氏液呈橙紅；乙：碘液呈藍黑、本氏液維持藍色", "甲：碘液呈藍黑、本氏液維持藍色；乙：碘液不呈藍黑、本氏液呈橙紅", "甲、乙：碘液都呈藍黑、本氏液都呈橙紅", "甲、乙：碘液都不呈藍黑、本氏液都維持藍色"], "sol": "甲管的唾液澱粉酶把澱粉分解成糖：澱粉變少，碘液不呈藍黑；糖變多，本氏液呈橙紅。乙管只有清水，澱粉沒被分解：碘液呈藍黑，本氏液維持藍色。", "w": ["甲、乙的結果弄反了：有唾液的甲管澱粉才會被分解。", "乙管沒有唾液，澱粉不會變成糖，本氏液不會變色；甲管的澱粉被分解，碘液不會呈藍黑。", "乙管的澱粉沒被分解，碘液應呈藍黑；甲管產生了糖，本氏液應變色。"], "parent": "有唾液：澱粉少了、糖多了；沒唾液：澱粉還在、沒有糖。兩種試劑各看一樣。"}, {"id": "SC-1-3-H103", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "施肥過多使植物枯萎的原因", "diff": "困難", "type": "觀念遷移", "q": "在植物根部周圍一次施加太多肥料，植物反而容易枯萎。用滲透作用來解釋，最合理的是哪一項？", "o": ["土壤溶液比根細胞內濃，水從根滲透出去", "肥料太營養，細胞長得太快而脹破", "肥料把細胞壁溶解，細胞失去支撐", "肥料讓根部進行過多的光合作用而耗盡能量"], "sol": "肥料溶在土壤水中，使土壤溶液變濃。當外面比根部細胞內濃時，水會從細胞滲透到外面，植物缺水而枯萎。", "w": ["植物細胞有細胞壁，不會因吸水脹破；而且這裡細胞是失水。", "肥料不會溶解細胞壁；問題在於水的移動方向。", "根部在土裡照不到光，不進行光合作用。"], "parent": "和醃黃瓜一樣：外面太濃，裡面的水就跑出去。"}, {"id": "SC-1-1-H104", "subj": "自然", "unit": "1-1 生命現象", "point": "綜合多項觀察判斷是否為生物", "diff": "困難", "type": "整合推理", "q": "小美在水中發現一種很小、會動的東西，記錄如下：①會吸收周圍的養分，並排出廢物；②照光時會游向亮的地方；③一段時間後，由一個分裂成兩個。下列判斷何者最恰當？", "o": ["三項分別是代謝、感應、生殖，都可作為證據", "只要觀察到「會動」，就足以判斷它是生物", "只有③能證明它是生物，①、②都不是生命現象", "這些都不是生命現象，因為它太小了"], "sol": "①是代謝、②是感應、③是生殖，都是生命現象。綜合多項生命現象，才能判斷它是生物。", "w": ["會動的不一定是生物（例如被風吹動的紙）；要看完整的生命現象。", "①是代謝、②是感應，也都是生命現象。", "生物大小和是不是生物無關，很多生物要用顯微鏡才看得到。"], "parent": "把每一項觀察對應到一個生命現象，越多項符合，越能確定是生物。"}, {"id": "MA-1-1-E101", "subj": "數學", "unit": "1-1 負數與數線", "point": "用正負數表示相對的量", "diff": "簡單", "type": "觀念應用", "q": "如果把「收入 500 元」記作 ＋500 元，那麼「支出 300 元」應記作什麼？", "o": ["−300 元", "＋300 元", "−500 元", "＋800 元"], "sol": "收入和支出是相反的量。收入記為正，支出就記為負，所以支出 300 元記作 −300 元。", "w": ["收入才記正數；支出要記負數。", "支出的金額是 300 元，不是 500 元。", "800 是把兩個數相加，題目只問支出怎麼記。"], "parent": "相反的事情用相反的符號：收入是＋，支出就是−。"}, {"id": "MA-1-1-E102", "subj": "數學", "unit": "1-1 負數與數線", "point": "0 的正負", "diff": "簡單", "type": "觀念辨識", "q": "關於 0，下列敘述何者正確？", "o": ["0 既不是正數，也不是負數", "0 是最小的正數", "0 是最大的負數", "0 是負數"], "sol": "數線上 0 是正數和負數的分界點，0 本身既不是正數也不是負數。", "w": ["0 不是正數；正數要比 0 大。", "0 不是負數；負數要比 0 小。", "0 不是負數。"], "parent": "0 站在正數和負數的中間，兩邊都不屬於。"}, {"id": "MA-1-1-E103", "subj": "數學", "unit": "1-1 負數與數線", "point": "相反數", "diff": "簡單", "type": "計算", "q": "−8 的相反數是多少？", "o": ["8", "−8", "0", "−1/8"], "sol": "相反數在數線上和原數到 0 的距離相同、方向相反。−8 的相反數是 8。", "w": ["−8 是原來的數，不是它的相反數。", "只有 0 的相反數是 0。", "相反數只改變正負號，數字大小不變，不是取倒數。"], "parent": "相反數就是「變號」：−8 變 8，5 變 −5。"}, {"id": "MA-1-1-E104", "subj": "數學", "unit": "1-1 負數與數線", "point": "讀出數線上的點", "diff": "簡單", "type": "圖表判讀", "q": "下圖數線上，P 點代表的數是多少？", "o": ["−4", "4", "−3", "−5"], "sol": "P 點在 0 的左邊第 4 格，每格是 1，所以 P 代表 −4。", "w": ["P 在 0 的左邊，是負數，不是 4。", "往左數要數到第 4 格，−3 少數了一格。", "往左數到第 4 格是 −4，−5 多數了一格。"], "parent": "0 的右邊是正數、左邊是負數，從 0 開始數格子。", "fig": "<svg class=\"fig\" viewBox=\"0 0 600 120\" role=\"img\" aria-label=\"數線\"><title>數線</title><line x1=\"20\" y1=\"60\" x2=\"580\" y2=\"60\" stroke=\"#13233A\" stroke-width=\"2\"/><polygon points=\"588,60 576,54 576,66\" fill=\"#13233A\"/><line x1=\"40.0\" y1=\"52\" x2=\"40.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"40.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−5</text><line x1=\"92.0\" y1=\"52\" x2=\"92.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"92.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−4</text><line x1=\"144.0\" y1=\"52\" x2=\"144.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"144.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−3</text><line x1=\"196.0\" y1=\"52\" x2=\"196.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"196.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−2</text><line x1=\"248.0\" y1=\"52\" x2=\"248.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"248.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−1</text><line x1=\"300.0\" y1=\"52\" x2=\"300.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"300.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0</text><line x1=\"352.0\" y1=\"52\" x2=\"352.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"352.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">1</text><line x1=\"404.0\" y1=\"52\" x2=\"404.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"404.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">2</text><line x1=\"456.0\" y1=\"52\" x2=\"456.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"456.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">3</text><line x1=\"508.0\" y1=\"52\" x2=\"508.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"508.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">4</text><line x1=\"560.0\" y1=\"52\" x2=\"560.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"560.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">5</text><circle cx=\"92.0\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"92.0\" y=\"38\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">P</text></svg>"}, {"id": "MA-1-1-E105", "subj": "數學", "unit": "1-1 負數與數線", "point": "兩個負小數比大小", "diff": "簡單", "type": "比較判斷", "q": "−0.5 和 −2 比較，下列何者正確？", "o": ["−0.5＞−2", "−0.5＜−2", "−0.5＝−2", "兩數無法比較大小"], "sol": "在數線上，−0.5 在 −2 的右邊，愈右邊的數愈大，所以 −0.5＞−2。", "w": ["兩個負數比較時，離 0 愈近的愈大；−0.5 離 0 比較近。", "兩數位置不同，不相等。", "任何兩個數都可以在數線上比較大小。"], "parent": "欠 0.5 元比欠 2 元好，所以 −0.5 比較大。"}, {"id": "MA-1-1-E106", "subj": "數學", "unit": "1-1 負數與數線", "point": "絕對值的意義", "diff": "簡單", "type": "觀念辨識", "q": "一個數的「絕對值」在數線上代表什麼？", "o": ["這個數和原點（0）之間的距離", "這個數的相反數", "這個數加上 1", "這個數本身"], "sol": "絕對值是數線上這個點到原點的距離，所以絕對值不會是負的。", "w": ["相反數是變號後的數，例如 −3 的相反數是 3；絕對值則一定不是負數，意思不同。", "絕對值和加 1 沒有關係。", "負數的絕對值不等於它本身，例如 |−3|＝3。"], "parent": "絕對值＝離 0 有多遠。距離不會是負的。"}, {"id": "MA-1-1-E107", "subj": "數學", "unit": "1-1 負數與數線", "point": "辨識負整數", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一個數是負整數？", "o": ["−3", "−0.5", "0", "3"], "sol": "負整數是比 0 小的整數，例如 −1、−2、−3。−3 是負整數。", "w": ["−0.5 是負數，但不是整數。", "0 不是負數。", "3 是正整數。"], "parent": "負整數：要「負」，也要是「整數」，兩個條件都要符合。"}, {"id": "MA-1-1-M101", "subj": "數學", "unit": "1-1 負數與數線", "point": "絕對值相同的數", "diff": "中等", "type": "推理", "q": "絕對值等於 7 的數有哪些？", "o": ["7 和 −7", "只有 7", "只有 −7", "0 和 7"], "sol": "數線上離原點 7 個單位的點有兩個：右邊的 7 和左邊的 −7。", "w": ["離原點 7 的點，左邊還有 −7。", "右邊的 7 也離原點 7。", "0 的絕對值是 0，不是 7。"], "parent": "從 0 往右走 7 步和往左走 7 步，都離 0 有 7 步。"}, {"id": "MA-1-1-M102", "subj": "數學", "unit": "1-1 負數與數線", "point": "離原點最遠的數", "diff": "中等", "type": "比較判斷", "q": "在數線上，下列哪一個數離原點最遠？", "o": ["−9", "8", "6", "−3"], "sol": "離原點的距離就是絕對值：|−9|＝9、|8|＝8、|6|＝6、|−3|＝3。−9 最遠。", "w": ["8 離原點 8，比 9 近。", "6 離原點 6。", "−3 離原點 3。"], "parent": "比「離 0 多遠」要看絕對值，不看正負。"}, {"id": "MA-1-1-M103", "subj": "數學", "unit": "1-1 負數與數線", "point": "相反數的相反數", "diff": "中等", "type": "計算", "q": "−(−6) 的值是多少？", "o": ["6", "−6", "0", "−12"], "sol": "−(−6) 表示「−6 的相反數」，−6 的相反數是 6。", "w": ["兩個負號表示「相反數的相反數」，會變回正的。", "−(−6) 是相反數，不是相減。", "這裡沒有做減法，不會是 −12。"], "parent": "負負得正：相反數再取一次相反數，就變回原來的樣子。"}, {"id": "MA-1-1-M104", "subj": "數學", "unit": "1-1 負數與數線", "point": "區間內的整數個數", "diff": "中等", "type": "計算", "q": "介於 −3.5 和 2.5 之間的整數共有幾個？", "o": ["6 個", "5 個", "7 個", "4 個"], "sol": "介於 −3.5 和 2.5 之間的整數有 −3、−2、−1、0、1、2，共 6 個。", "w": ["忘了算 0。", "多算了一個；−4 和 3 都不在範圍內。", "漏算了兩個，例如 0 和 −3。"], "parent": "在數線上畫出範圍，再一個一個數整數，別忘了 0。"}, {"id": "MA-1-1-M105", "subj": "數學", "unit": "1-1 負數與數線", "point": "絕對值小於某數的整數", "diff": "中等", "type": "推理", "q": "絕對值小於 3 的整數共有幾個？", "o": ["5 個", "7 個", "4 個", "2 個"], "sol": "絕對值小於 3，表示離原點不到 3：−2、−1、0、1、2，共 5 個。", "w": ["把 3 和 −3 也算進去了；它們的絕對值等於 3，不是小於 3。", "漏掉了 0。", "只算了正的 1 和 2。"], "parent": "在數線上把離 0 不到 3 格的整數圈起來：左右各兩個，加上 0。"}, {"id": "MA-1-1-M106", "subj": "數學", "unit": "1-1 負數與數線", "point": "含絕對值與相反數的比大小", "diff": "中等", "type": "比較判斷", "q": "下列四個數中，哪一個最大？", "o": ["|−5|", "−|−7|", "−(−3)", "−4"], "sol": "先化簡：|−5|＝5，−|−7|＝−7，−(−3)＝3，−4。最大的是 5，也就是 |−5|。", "w": ["−|−7| 是 7 的相反數，等於 −7，是最小的。", "−(−3)＝3，比 5 小。", "−4 是負數，比 5 小。"], "parent": "先把每個數化成最簡單的樣子，再比大小。"}, {"id": "MA-1-1-M107", "subj": "數學", "unit": "1-1 負數與數線", "point": "數線上向左移動", "diff": "中等", "type": "計算", "q": "數線上 A 點的坐標是 −2，向左移動 5 個單位到 B 點。B 點的坐標是多少？", "o": ["−7", "3", "−3", "7"], "sol": "向左移動，數會變小：−2－5＝−7。", "w": ["向右移動才會變成 3；題目是向左。", "−2 往左 5 格是 −7，不是 −3。", "往左移不會變成正數。"], "parent": "向右加、向左減。從 −2 往左數 5 格。"}, {"id": "MA-1-1-M108", "subj": "數學", "unit": "1-1 負數與數線", "point": "在數線上找相反數", "diff": "中等", "type": "圖表判讀", "q": "下圖數線上，哪兩個點代表的數互為相反數？", "o": ["甲和丙", "甲和乙", "乙和丁", "丙和丁"], "sol": "甲是 −3、乙是 −1、丙是 3、丁是 2。甲（−3）和丙（3）到 0 的距離相同、方向相反，互為相反數。", "w": ["甲是 −3、乙是 −1，兩個都是負數，不是相反數。", "乙是 −1、丁是 2，到 0 的距離不同。", "丙是 3、丁是 2，兩個都是正數。"], "parent": "相反數就像照鏡子：以 0 為鏡子，左右對稱的兩點。", "fig": "<svg class=\"fig\" viewBox=\"0 0 600 120\" role=\"img\" aria-label=\"數線\"><title>數線</title><line x1=\"20\" y1=\"60\" x2=\"580\" y2=\"60\" stroke=\"#13233A\" stroke-width=\"2\"/><polygon points=\"588,60 576,54 576,66\" fill=\"#13233A\"/><line x1=\"40.0\" y1=\"52\" x2=\"40.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"40.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−4</text><line x1=\"105.0\" y1=\"52\" x2=\"105.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"105.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−3</text><line x1=\"170.0\" y1=\"52\" x2=\"170.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"170.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−2</text><line x1=\"235.0\" y1=\"52\" x2=\"235.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"235.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−1</text><line x1=\"300.0\" y1=\"52\" x2=\"300.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"300.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0</text><line x1=\"365.0\" y1=\"52\" x2=\"365.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"365.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">1</text><line x1=\"430.0\" y1=\"52\" x2=\"430.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"430.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">2</text><line x1=\"495.0\" y1=\"52\" x2=\"495.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"495.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">3</text><line x1=\"560.0\" y1=\"52\" x2=\"560.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"560.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">4</text><circle cx=\"105.0\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"105.0\" y=\"38\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><circle cx=\"235.0\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"235.0\" y=\"38\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><circle cx=\"495.0\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"495.0\" y=\"38\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text><circle cx=\"430.0\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"430.0\" y=\"38\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丁</text></svg>"}, {"id": "MA-1-1-M109", "subj": "數學", "unit": "1-1 負數與數線", "point": "由小到大排列", "diff": "中等", "type": "排序", "q": "把 −|−4|、−2、|−1|、0 由小到大排列，何者正確？", "o": ["−|−4|＜−2＜0＜|−1|", "−2＜−|−4|＜0＜|−1|", "0＜|−1|＜−2＜−|−4|", "|−1|＜0＜−2＜−|−4|"], "sol": "化簡：−|−4|＝−4，|−1|＝1。所以 −4＜−2＜0＜1。", "w": ["−|−4| 是 −4，比 −2 小。", "這是由大到小反過來的錯誤順序，而且正負弄反。", "|−1|＝1 比 0 大。"], "parent": "先化簡、再放到數線上，由左到右就是由小到大。"}, {"id": "MA-1-1-M110", "subj": "數學", "unit": "1-1 負數與數線", "point": "相反數比原數大的數", "diff": "中等", "type": "推理", "q": "下列哪一個數，它的相反數比它本身大？", "o": ["−5", "0", "3", "7"], "sol": "負數的相反數是正數，正數一定比負數大。−5 的相反數是 5，比 −5 大。", "w": ["0 的相反數是 0，兩者相等。", "3 的相反數是 −3，比 3 小。", "7 的相反數是 −7，比 7 小。"], "parent": "只有負數「變號」後會變大。"}, {"id": "MA-1-1-M111", "subj": "數學", "unit": "1-1 負數與數線", "point": "負數的性質", "diff": "中等", "type": "推理", "q": "已知 a 是負數。下列敘述何者正確？", "o": ["−a 是正數", "|a|＝a", "a＞0", "−a＜a"], "sol": "a 是負數，−a 是 a 的相反數，負數的相反數是正數，所以 −a 是正數。", "w": ["負數的絕對值等於它的相反數，|a|＝−a，不等於 a。", "a 是負數，a＜0。", "−a 是正數，比負數 a 大，所以 −a＞a。"], "parent": "可以代一個數試試看：a＝−3，−a＝3，是正數。"}, {"id": "MA-1-1-M112", "subj": "數學", "unit": "1-1 負數與數線", "point": "絕對值相等的兩數", "diff": "中等", "type": "推理", "q": "已知 |a|＝|b|，而且 a≠b。a 和 b 有什麼關係？", "o": ["互為相反數", "兩數相等", "兩數都是正數", "兩數都是 0"], "sol": "絕對值相等表示離原點一樣遠。如果 a 和 b 不相等，就只能是一正一負、在 0 的兩邊，互為相反數。", "w": ["題目說 a≠b，兩數不相等。", "兩數都是正數又離 0 一樣遠，就會相等，與 a≠b 矛盾。", "兩數都是 0 就相等，與 a≠b 矛盾。"], "parent": "離 0 一樣遠又不一樣，只能一個在左、一個在右。"}, {"id": "MA-1-1-H101", "subj": "數學", "unit": "1-1 負數與數線", "point": "符合絕對值條件的整數", "diff": "困難", "type": "分類推理", "q": "整數 x 滿足 |x|≦2，而且 x≠0。這樣的 x 共有幾個？它們的總和是多少？", "o": ["4 個，總和 0", "5 個，總和 0", "4 個，總和 6", "2 個，總和 3"], "sol": "|x|≦2 的整數有 −2、−1、0、1、2，再去掉 0，剩 −2、−1、1、2，共 4 個。正負成對抵銷，總和是 0。", "w": ["沒有排除 0；題目說 x≠0。", "把負數的總和也當成正的加上去了：(−2)＋(−1)＋1＋2＝0。", "只算了正的 1、2，漏掉 −1、−2。"], "parent": "先列出全部，再刪掉不符合的；相反數兩兩相加是 0。"}, {"id": "MA-1-1-H102", "subj": "數學", "unit": "1-1 負數與數線", "point": "相反數與距離的條件", "diff": "困難", "type": "推理", "q": "數線上 A、B 兩點代表的數互為相反數，而且 B 在 A 的右邊 6 個單位。A 點代表的數是多少？", "o": ["−3", "3", "−6", "6"], "sol": "互為相反數的兩點以原點為中心左右對稱，兩點相距 6，所以各離原點 3。B 在右邊，所以 B＝3、A＝−3。", "w": ["3 是 B 點；A 在 B 的左邊。", "如果 A 是 −6，B 要是 6，兩點相距 12，不是 6。", "A 在左邊，不會是正的 6。"], "parent": "相反數一左一右、離 0 一樣遠：距離 6 平分成左右各 3。"}, {"id": "MA-1-1-H103", "subj": "數學", "unit": "1-1 負數與數線", "point": "絕對值等於本身的數", "diff": "困難", "type": "推理", "q": "下列哪一個描述了「所有」滿足 |a|＝a 的數 a？", "o": ["a 是正數或 0", "只有正數", "只有 0", "只有負數"], "sol": "正數的絕對值等於它本身，0 的絕對值也是 0，等於它本身；負數的絕對值等於它的相反數，不等於它本身。所以 a 是正數或 0。", "w": ["漏了 0：|0|＝0，也滿足條件。", "正數也滿足條件，例如 |5|＝5。", "負數的絕對值是正的，例如 |−5|＝5≠−5。"], "parent": "分成正數、0、負數三種情況，一種一種代數字檢查。"}, {"id": "MA-1-1-H104", "subj": "數學", "unit": "1-1 負數與數線", "point": "用字母比大小", "diff": "困難", "type": "推理", "q": "已知 a＜0＜b，而且 |a|＜|b|。把 a、b、−a、−b 由小到大排列，何者正確？", "o": ["−b＜a＜−a＜b", "a＜−b＜−a＜b", "−b＜a＜b＜−a", "a＜−b＜b＜−a"], "sol": "可以代數字：a＝−2、b＝5，則 −a＝2、−b＝−5。由小到大：−5＜−2＜2＜5，也就是 −b＜a＜−a＜b。", "w": ["|a|＜|b|，表示 a 離 0 比 b 近，所以 −b 比 a 更左邊、更小。", "−a 的絕對值等於 |a|，比 |b| 小，所以 −a＜b。", "a 和 −b 的位置、b 和 −a 的位置都弄反了。"], "parent": "代一組符合條件的數字，再畫在數線上。"}, {"id": "MA-1-2-E101", "subj": "數學", "unit": "1-2 整數的加減", "point": "同號負數相加", "diff": "簡單", "type": "計算", "q": "(−7)＋(−5) 的值是多少？", "o": ["−12", "−2", "12", "2"], "sol": "兩個負數相加，數字相加、符號不變：7＋5＝12，答案是 −12。", "w": ["同號相加要把數字加起來，不是相減。", "兩個負數相加，結果還是負的。", "同號相加要相加，而且結果是負的。"], "parent": "欠 7 元又欠 5 元，總共欠 12 元。"}, {"id": "MA-1-2-E102", "subj": "數學", "unit": "1-2 整數的加減", "point": "小數減大數", "diff": "簡單", "type": "計算", "q": "3－8 的值是多少？", "o": ["−5", "5", "11", "−11"], "sol": "3－8＝3＋(−8)＝−5。小的數減大的數，結果是負的。", "w": ["小的數減大的數，結果是負的。", "減法不是加法：3＋8 才是 11。", "數字差是 5，不是 11。"], "parent": "從 3 往左走 8 格，會走到 −5。"}, {"id": "MA-1-2-E103", "subj": "數學", "unit": "1-2 整數的加減", "point": "帳戶餘額", "diff": "簡單", "type": "生活應用", "q": "小華的儲值卡原本欠款 200 元（記作 −200 元），他再存入 500 元。卡內餘額是多少？", "o": ["300 元", "−700 元", "700 元", "−300 元"], "sol": "−200＋500＝300，餘額是 300 元。", "w": ["存入是加上 500，不是減去 500。", "欠款要先還掉，不能把 200 和 500 直接加起來。", "欠 200、存 500，還清後還剩 300 元，是正的。"], "parent": "先把欠的 200 還掉，剩下的 300 就是餘額。"}, {"id": "MA-1-2-E104", "subj": "數學", "unit": "1-2 整數的加減", "point": "加法交換律", "diff": "簡單", "type": "觀念辨識", "q": "(−3)＋5＝5＋(−3) 這個等式，用到了哪一種運算規則？", "o": ["加法交換律", "加法結合律", "分配律", "減法交換律"], "sol": "兩個數相加，交換前後位置，和不變，這是加法交換律。", "w": ["結合律是改變三個數相加時「先加哪兩個」。", "分配律和乘法有關。", "減法沒有交換律，例如 5－3≠3－5。"], "parent": "交換律＝換位置，結合律＝換括號。"}, {"id": "MA-1-2-E105", "subj": "數學", "unit": "1-2 整數的加減", "point": "減去負數", "diff": "簡單", "type": "計算", "q": "7－(−2) 的值是多少？", "o": ["9", "5", "−9", "−5"], "sol": "減去一個數等於加上它的相反數：7－(−2)＝7＋2＝9。", "w": ["忘了變號：減去 −2 要變成加 2。", "結果是正的 9，不是負的。", "把兩個符號都弄錯了。"], "parent": "減掉一筆欠款，等於多了錢。"}, {"id": "MA-1-2-E106", "subj": "數學", "unit": "1-2 整數的加減", "point": "數線上兩點的距離", "diff": "簡單", "type": "計算", "q": "數線上 −4 和 3 兩點之間的距離是多少？", "o": ["7", "1", "−7", "−1"], "sol": "距離＝大的數－小的數＝3－(−4)＝7，也可以寫成 |3－(−4)|＝7。", "w": ["直接把 4 和 3 相減，忘了 −4 在 0 的另一邊。", "距離不會是負的。", "距離不會是負的，而且算法也錯了。"], "parent": "從 −4 走到 0 要 4 格，再從 0 走到 3 要 3 格，共 7 格。"}, {"id": "MA-1-2-E107", "subj": "數學", "unit": "1-2 整數的加減", "point": "海平面以下的高度", "diff": "簡單", "type": "生活應用", "q": "把海平面以下 18 公尺記作 −18 公尺。潛水員在 −18 公尺處往上游 7 公尺，他現在的位置是多少？", "o": ["−11 公尺", "−25 公尺", "11 公尺", "25 公尺"], "sol": "往上游，高度增加：−18＋7＝−11 公尺。", "w": ["往上游要加 7，不是減 7。", "還在海平面以下，不會是正的。", "還在海平面以下，而且是 −18＋7。"], "parent": "往上是加、往下是減。還沒浮出水面，就還是負的。"}, {"id": "MA-1-2-M101", "subj": "數學", "unit": "1-2 整數的加減", "point": "多項加減混合", "diff": "中等", "type": "計算", "q": "−23＋15－(−8)＋(−10) 的值是多少？", "o": ["−10", "−26", "10", "−6"], "sol": "−23＋15＝−8；−8－(−8)＝−8＋8＝0；0＋(−10)＝−10。", "w": ["把 －(−8) 當成 －8：−23＋15－8－10＝−26。", "把 ＋(−10) 當成 ＋10：−23＋15＋8＋10＝10。", "兩處都弄錯：−23＋15－8＋10＝−6。"], "parent": "一步一步來，遇到「減負數」記得變成加。"}, {"id": "MA-1-2-M102", "subj": "數學", "unit": "1-2 整數的加減", "point": "用結合律簡化計算", "diff": "中等", "type": "計算", "q": "(−37)＋18＋(−63) 的值是多少？", "o": ["−82", "−118", "82", "−44"], "sol": "先把 (−37)＋(−63)＝−100，再加 18：−100＋18＝−82。", "w": ["把 18 也當成負數加進去了。", "正負號錯了：負數加起來比 18 大很多，結果是負的。", "(−37)＋(−63) 是 −100，不是 −62。"], "parent": "先找能湊成整百的數一起加，比較好算。"}, {"id": "MA-1-2-M103", "subj": "數學", "unit": "1-2 整數的加減", "point": "絕對值表示距離", "diff": "中等", "type": "計算", "q": "|(−5)－7| 的值是多少？", "o": ["12", "2", "−12", "−2"], "sol": "(−5)－7＝−12，再取絕對值，|−12|＝12。這也是數線上 −5 和 7 的距離。", "w": ["把 −5 當成 5：5－7 的絕對值是 2。", "絕對值不會是負的。", "絕對值不會是負的。"], "parent": "先算括號裡面，最後再取絕對值。"}, {"id": "MA-1-2-M104", "subj": "數學", "unit": "1-2 整數的加減", "point": "兩點的中點坐標", "diff": "中等", "type": "計算", "q": "數線上 A（−8）和 B（2）的中點坐標是多少？", "o": ["−3", "−5", "5", "3"], "sol": "中點坐標＝兩點坐標相加除以 2：(−8＋2)÷2＝−6÷2＝−3。", "w": ["−5 是兩點距離 10 的一半，不是中點的坐標；要從 A 往右走 5 格才是中點。", "距離的一半是 5，但中點坐標不是 5。", "正負號錯了。"], "parent": "中點＝兩數相加再除以 2。也可以從 A 往右走「距離的一半」。"}, {"id": "MA-1-2-M105", "subj": "數學", "unit": "1-2 整數的加減", "point": "一天的氣溫變化", "diff": "中等", "type": "生活應用", "q": "某地早上氣溫 −4°C，到中午上升 9°C，晚上又比中午下降 7°C。晚上的氣溫是多少？", "o": ["−2°C", "−20°C", "2°C", "12°C"], "sol": "中午：−4＋9＝5°C；晚上：5－7＝−2°C。", "w": ["上升要加，不是減：−4－9－7＝−20 是錯的。", "正負號錯了：5－7＝−2。", "把下降也當成上升了。"], "parent": "上升加、下降減，一步一步算。"}, {"id": "MA-1-2-M106", "subj": "數學", "unit": "1-2 整數的加減", "point": "找出計算錯誤", "diff": "中等", "type": "錯誤分析", "q": "小明計算 −6－(−4) 時寫出：−6－(−4)＝−6－4＝−10。他錯在哪裡？正確答案是多少？", "o": ["減去 −4 應變成加 4，正確答案是 −2", "−6－4 應該是 −2，正確答案是 −2", "應該先算 6－4＝2，正確答案是 2", "他沒有錯，答案是 −10"], "sol": "減去一個數，等於加上它的相反數：−6－(−4)＝−6＋4＝−2。小明把「減負數」寫成「減正數」。", "w": ["−6－4 確實是 −10，錯不在這一步，而是前一步沒有變號。", "不能忽略負號，−6＋4＝−2，不是 2。", "減去 −4 要變成加 4，−10 是錯的。"], "parent": "檢查「減號後面是負數」的地方，要變成加號。"}, {"id": "MA-1-2-M107", "subj": "數學", "unit": "1-2 整數的加減", "point": "距離的兩種可能", "diff": "中等", "type": "推理", "q": "數線上 A 點的坐標是 −3，B 點和 A 點的距離是 4。B 點的坐標可能是多少？", "o": ["1 或 −7", "只有 1", "只有 −7", "4 或 −4"], "sol": "從 −3 往右走 4 是 1，往左走 4 是 −7，兩個都可能。", "w": ["往左也可以走 4 格，−7 也可以。", "往右也可以走 4 格，1 也可以。", "4 是距離，不是 B 點的坐標。"], "parent": "距離只說多遠，沒說方向，所以左右兩邊都要考慮。"}, {"id": "MA-1-2-M108", "subj": "數學", "unit": "1-2 整數的加減", "point": "收支表的累計", "diff": "中等", "type": "資料判讀", "q": "下表是小美一週的零用錢收支（收入記正、支出記負，自編資料）。週一開始時她有 50 元，週五結束時她有多少元？", "o": ["20 元", "−30 元", "80 元", "50 元"], "sol": "50＋(−35)＋20＋(−40)＋(−15)＋40＝20 元。", "w": ["只把表中的收支加起來（−30），忘了加上原本的 50 元。", "把支出也當成收入加了一部分；要照正負號計算。", "收支合計是 −30，餘額會變少，不會維持 50 元。"], "parent": "先寫出起點，再一筆一筆加上表中的數。", "fig": "<table class=\"fig\"><caption>小美的零用錢收支（自編資料）</caption><tr><th>日</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr><tr><td>收支（元）</td><td>−35</td><td>＋20</td><td>−40</td><td>−15</td><td>＋40</td></tr></table>"}, {"id": "MA-1-2-M109", "subj": "數學", "unit": "1-2 整數的加減", "point": "代入求值", "diff": "中等", "type": "計算", "q": "當 a＝−3、b＝5 時，a－b 的值是多少？", "o": ["−8", "2", "8", "−2"], "sol": "a－b＝(−3)－5＝−8。", "w": ["把減法當成加法：(−3)＋5＝2。", "把 a、b 的符號都弄錯：3－(−5)＝8。", "代入時漏掉 a 的負號：3－5＝−2。"], "parent": "代入時把負數加上括號：(−3)－5。"}, {"id": "MA-1-2-M110", "subj": "數學", "unit": "1-2 整數的加減", "point": "連續整數的和", "diff": "中等", "type": "推理", "q": "從 −10 到 12 的所有整數相加，總和是多少？", "o": ["23", "0", "2", "−23"], "sol": "−10 到 10 的整數，正負兩兩抵銷，和是 0；再加上 11 和 12，總和是 23。", "w": ["−10 到 10 的和是 0，但還有 11 和 12。", "只算到 11 和 12 的差，正確要把兩數相加。", "正負號錯了。"], "parent": "相反數兩兩一組抵銷，再看多出哪些數。"}, {"id": "MA-1-2-M111", "subj": "數學", "unit": "1-2 整數的加減", "point": "由數線圖求距離", "diff": "中等", "type": "圖表判讀", "q": "下圖數線上 A、B 兩點之間的距離是多少？", "o": ["8", "2", "−8", "5"], "sol": "A 是 −5、B 是 3，距離＝3－(−5)＝8。", "w": ["把 −5 當成 5，直接相減得 2。", "距離不會是負的。", "只算了 A 到 0 的距離。"], "parent": "在圖上數格子：從 A 數到 B 一共 8 格。", "fig": "<svg class=\"fig\" viewBox=\"0 0 600 120\" role=\"img\" aria-label=\"數線\"><title>數線</title><line x1=\"20\" y1=\"60\" x2=\"580\" y2=\"60\" stroke=\"#13233A\" stroke-width=\"2\"/><polygon points=\"588,60 576,54 576,66\" fill=\"#13233A\"/><line x1=\"40.0\" y1=\"52\" x2=\"40.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"40.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−6</text><line x1=\"83.3\" y1=\"52\" x2=\"83.3\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"83.3\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−5</text><line x1=\"126.7\" y1=\"52\" x2=\"126.7\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"126.7\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−4</text><line x1=\"170.0\" y1=\"52\" x2=\"170.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"170.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−3</text><line x1=\"213.3\" y1=\"52\" x2=\"213.3\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"213.3\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−2</text><line x1=\"256.7\" y1=\"52\" x2=\"256.7\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"256.7\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">−1</text><line x1=\"300.0\" y1=\"52\" x2=\"300.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"300.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0</text><line x1=\"343.3\" y1=\"52\" x2=\"343.3\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"343.3\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">1</text><line x1=\"386.7\" y1=\"52\" x2=\"386.7\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"386.7\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">2</text><line x1=\"430.0\" y1=\"52\" x2=\"430.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"430.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">3</text><line x1=\"473.3\" y1=\"52\" x2=\"473.3\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"473.3\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">4</text><line x1=\"516.7\" y1=\"52\" x2=\"516.7\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"516.7\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">5</text><line x1=\"560.0\" y1=\"52\" x2=\"560.0\" y2=\"68\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"560.0\" y=\"92\" font-size=\"16\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">6</text><circle cx=\"83.3\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"83.3\" y=\"38\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">A</text><circle cx=\"430.0\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"430.0\" y=\"38\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">B</text></svg>"}, {"id": "MA-1-2-M112", "subj": "數學", "unit": "1-2 整數的加減", "point": "相反數、絕對值與加減混合", "diff": "中等", "type": "計算", "q": "−(−3)－|−4|＋(−2) 的值是多少？", "o": ["−3", "5", "−9", "9"], "sol": "−(−3)＝3，|−4|＝4。所以 3－4＋(−2)＝−3。", "w": ["把 －|−4| 當成 ＋4：3＋4－2＝5。", "把 −(−3) 當成 −3：−3－4－2＝−9。", "正負號全部弄成正的。"], "parent": "先把相反數、絕對值化簡，再由左到右加減。"}, {"id": "MA-1-2-H101", "subj": "數學", "unit": "1-2 整數的加減", "point": "由條件判斷和差的正負", "diff": "困難", "type": "推理", "q": "已知 a＜0＜b，而且 |a|＞|b|。下列哪一個敘述一定正確？", "o": ["a＋b＜0", "a＋b＞0", "a－b＞0", "b－a＜0"], "sol": "|a|＞|b| 表示負數 a 離 0 比較遠，a＋b 時負的部分比較多，結果是負的。可以代 a＝−5、b＝2：a＋b＝−3＜0。", "w": ["負數 a 的絕對值比較大，a＋b 是負的。", "a 是負數、b 是正數，a－b 一定是負的。", "b－a＝b＋|a|，一定是正的。"], "parent": "代一組符合條件的數驗證，再想想為什麼一定成立。"}, {"id": "MA-1-2-H102", "subj": "數學", "unit": "1-2 整數的加減", "point": "三個連續整數的和", "diff": "困難", "type": "推理", "q": "三個連續整數的和是 −12。其中最小的數是多少？", "o": ["−5", "−4", "−3", "−6"], "sol": "三個連續整數的和＝中間的數×3，所以中間的數是 −12÷3＝−4，三個數是 −5、−4、−3，最小的是 −5。", "w": ["−4 是中間的數。", "−3 是最大的數。", "−6、−5、−4 的和是 −15，不是 −12。"], "parent": "連續三個數，中間那個就是平均。先找中間，再往左右各走一步。"}, {"id": "MA-1-2-H103", "subj": "數學", "unit": "1-2 整數的加減", "point": "把線段三等分", "diff": "困難", "type": "推理", "q": "數線上 A 點是 −7，B 點是 5。把線段 AB 平均分成三等分，兩個分點的坐標是多少？", "o": ["−3 和 1", "−4 和 2", "−3 和 2", "−5 和 3"], "sol": "AB 的長度是 5－(−7)＝12，每一段 12÷3＝4。從 A 往右走 4 是 −3，再走 4 是 1。", "w": ["每段長度算成 3（12÷4），分成了四等分。", "第二個分點算錯：−3＋4＝1，不是 2。", "每段長度算成 2，而且從兩端各走 2 格。"], "parent": "先求全長，再除以段數，從左端一段一段往右數。"}, {"id": "MA-1-2-H104", "subj": "數學", "unit": "1-2 整數的加減", "point": "由變化量推算最後數值", "diff": "困難", "type": "資料判讀", "q": "下表是某地週一的最低氣溫，以及之後每天「比前一天」的變化量（自編資料）。週五的最低氣溫是多少？", "o": ["−7°C", "−9°C", "−5°C", "7°C"], "sol": "週二：−2＋3＝1；週三：1－5＝−4；週四：−4＋1＝−3；週五：−3－4＝−7°C。也可以一次算：−2＋3－5＋1－4＝−7。", "w": ["把週四的 ＋1 當成 −1：−2＋3－5－1－4＝−9。", "忘了從週一的 −2 開始，只把變化量加起來：3－5＋1－4＝−5。", "正負號弄反了。"], "parent": "表上給的是「變化量」，要從週一的氣溫開始一天一天加上去。", "fig": "<table class=\"fig\"><caption>最低氣溫與每日變化（自編資料）</caption><tr><th></th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr><tr><td>最低氣溫</td><td>−2°C</td><td>?</td><td>?</td><td>?</td><td>?</td></tr><tr><td>比前一天</td><td>—</td><td>＋3°C</td><td>−5°C</td><td>＋1°C</td><td>−4°C</td></tr></table>"}, {"id": "MA-1-3-E101", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "異號相乘", "diff": "簡單", "type": "計算", "q": "(−6)×4 的值是多少？", "o": ["−24", "24", "−10", "−2"], "sol": "異號相乘，結果是負的：6×4＝24，答案 −24。", "w": ["一正一負相乘，結果是負的。", "這是乘法，不是加法。", "這是乘法，不是加法或減法。"], "parent": "同號相乘得正，異號相乘得負。"}, {"id": "MA-1-3-E102", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "同號相除", "diff": "簡單", "type": "計算", "q": "(−48)÷(−6) 的值是多少？", "o": ["8", "−8", "42", "−54"], "sol": "兩個負數相除，結果是正的：48÷6＝8。", "w": ["同號相除，結果是正的。", "這是除法，不是減法。", "這是除法，不是加法。"], "parent": "除法的正負規則和乘法一樣：同號正、異號負。"}, {"id": "MA-1-3-E103", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "三個負數相乘", "diff": "簡單", "type": "計算", "q": "(−2)×(−3)×(−1) 的值是多少？", "o": ["−6", "6", "−5", "5"], "sol": "先算 (−2)×(−3)＝6，再乘 (−1)，得 −6。三個負數相乘，結果是負的。", "w": ["奇數個負數相乘，結果是負的。", "這是乘法，不是加法。", "這是乘法，而且結果是負的。"], "parent": "數負號的個數：奇數個是負、偶數個是正。"}, {"id": "MA-1-3-E104", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "0 除以負數", "diff": "簡單", "type": "計算", "q": "0÷(−5) 的值是多少？", "o": ["0", "−5", "5", "無法計算"], "sol": "0 除以任何不是 0 的數，結果都是 0。", "w": ["0 除以 −5 不會等於 −5。", "0 除以任何非零數都是 0。", "只有「除以 0」才無法計算；0 被除是可以的。"], "parent": "0 個東西分給幾個人，每個人都分到 0 個。"}, {"id": "MA-1-3-E105", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "乘法交換律", "diff": "簡單", "type": "觀念辨識", "q": "(−4)×7＝7×(−4) 這個等式，用到了哪一種運算規則？", "o": ["乘法交換律", "乘法結合律", "分配律", "除法交換律"], "sol": "兩個數相乘，交換前後順序，積不變，這是乘法交換律。", "w": ["結合律是三個數相乘時改變先乘哪兩個。", "分配律是乘法和加法（減法）一起出現時用的。", "除法沒有交換律。"], "parent": "交換律＝換位置。"}, {"id": "MA-1-3-E106", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "乘以 −1", "diff": "簡單", "type": "觀念辨識", "q": "任何一個數乘以 −1，結果會是什麼？", "o": ["它的相反數", "它的絕對值", "0", "它本身"], "sol": "乘以 −1 會改變正負號，結果是原來那個數的相反數，例如 5×(−1)＝−5。", "w": ["乘以 −1 只改變正負號；負數乘以 −1 才會得到它的絕對值，正數不會。", "只有乘以 0 才會得到 0。", "乘以 1 才是它本身。"], "parent": "乘 −1 就像「變號開關」。"}, {"id": "MA-1-3-M101", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "用分配律簡化計算", "diff": "中等", "type": "計算", "q": "99×(−7) 的值是多少？（提示：99＝100－1）", "o": ["−693", "−700", "693", "−707"], "sol": "99×(−7)＝(100－1)×(−7)＝−700＋7＝−693。", "w": ["只算了 100×(−7)，忘了減去 1×(−7)。", "正負號錯了。", "把 −1×(−7) 算成 −7；負負得正是 ＋7。"], "parent": "拆成好算的數，再用分配律展開，注意每一項的符號。"}, {"id": "MA-1-3-M102", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "先乘除後加減", "diff": "中等", "type": "計算", "q": "12－(−3)×4 的值是多少？", "o": ["24", "0", "60", "−24"], "sol": "先算乘法：(−3)×4＝−12。再算 12－(−12)＝12＋12＝24。", "w": ["把 －(−12) 當成 －12：12－12＝0。", "沒有先乘除：先算 12－(−3)＝15，再乘 4 得 60。", "把開頭的 12 看成 −12：−12－12＝−24。"], "parent": "先乘除、後加減；減去負數要變成加。"}, {"id": "MA-1-3-M103", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "由除法結果反推被除數", "diff": "中等", "type": "推理", "q": "某數除以 −4 得到 6。這個數是多少？", "o": ["−24", "24", "−1.5", "10"], "sol": "乘法和除法互為逆運算：某數＝6×(−4)＝−24。驗算：−24÷(−4)＝6。", "w": ["正負號錯了：24÷(−4)＝−6。", "用 6÷(−4) 是倒過來算。", "這是乘除，不是加減。"], "parent": "用乘法把除法「倒回去」，再用除法驗算一次。"}, {"id": "MA-1-3-M104", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "除法沒有交換律", "diff": "中等", "type": "觀念辨識", "q": "下列敘述何者正確？", "o": ["12÷(−3) 和 (−3)÷12 的值不相等", "12÷(−3)＝(−3)÷12", "除法和乘法一樣有交換律", "兩數相除，交換位置後結果一定相同"], "sol": "12÷(−3)＝−4，(−3)÷12＝−1/4，兩者不相等。整數除法沒有交換律。", "w": ["算算看：一個是 −4，一個是 −1/4，不相等。", "除法沒有交換律。", "交換位置後，結果通常不同。"], "parent": "10 個糖分給 2 人，和 2 個糖分給 10 人，結果不一樣。"}, {"id": "MA-1-3-M105", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "求平均溫度", "diff": "中等", "type": "生活應用", "q": "某地連續四天的最低氣溫是 −3°C、−1°C、2°C、−6°C。這四天最低氣溫的平均是多少？", "o": ["−2°C", "2°C", "−3°C", "−8°C"], "sol": "平均＝總和÷天數＝(−3－1＋2－6)÷4＝−8÷4＝−2°C。", "w": ["正負號錯了：總和是 −8。", "總和算錯了，或除錯了天數。", "−8 是總和，還要除以 4。"], "parent": "先加總（注意正負），再除以天數。"}, {"id": "MA-1-3-M106", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "找出運算順序錯誤", "diff": "中等", "type": "錯誤分析", "q": "小華計算 −20÷4×(−5) 時，先算 4×(−5)＝−20，再算 −20÷(−20)＝1。正確答案是多少？", "o": ["25", "1", "−25", "−1"], "sol": "只有乘除時要由左到右：−20÷4＝−5；(−5)×(−5)＝25。", "w": ["1 是小華先算右邊的錯誤結果。", "正負號錯了：(−5)×(−5)＝25。", "順序和符號都錯了。"], "parent": "乘除同時出現，由左到右，不要跳著算。"}, {"id": "MA-1-3-M107", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "含括號的四則運算", "diff": "中等", "type": "計算", "q": "[(−3)－5]×(−2)＋6 的值是多少？", "o": ["22", "10", "−10", "−22"], "sol": "先算括號：(−3)－5＝−8；再乘：(−8)×(−2)＝16；最後加：16＋6＝22。", "w": ["最後一步把 ＋6 算成 －6：16－6＝10。", "把 (−8)×(−2) 算成 −16：−16＋6＝−10。", "乘法和最後一步都錯：−16－6＝−22。"], "parent": "括號→乘除→加減，一步一步寫。"}, {"id": "MA-1-3-M108", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "連乘中有 0", "diff": "中等", "type": "推理", "q": "(−1)×(−2)×(−3)×(−4)×(−5)×0 的值是多少？", "o": ["0", "−120", "120", "−1"], "sol": "只要乘式中有一個因數是 0，乘積就是 0。", "w": ["前五個數的乘積是 −120，但最後還乘了 0。", "乘了 0 以後，不論前面是多少都是 0。", "最後乘了 0，結果是 0。"], "parent": "看到乘 0，答案就是 0，不用算前面。"}, {"id": "MA-1-3-M109", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "提出公因數的分配律", "diff": "中等", "type": "計算", "q": "(−7)×13＋(−7)×(−3) 的值是多少？", "o": ["−70", "−112", "70", "−91"], "sol": "提出 (−7)：(−7)×[13＋(−3)]＝(−7)×10＝−70。", "w": ["把 (−7)×(−3) 算成 −21：−91－21＝−112；負負得正應該是 ＋21。", "正負號錯了：(−7)×10＝−70。", "只算了第一項 (−7)×13＝−91，漏了第二項。"], "parent": "兩項都有 (−7)，就把它提出來，括號裡先算。"}, {"id": "MA-1-3-M110", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "情境：連續下降", "diff": "中等", "type": "生活應用", "q": "某水庫的水位每天下降 3 公分。若把下降記作負數，連續 6 天後，水位和原來相比的變化是多少？", "o": ["−18 公分", "18 公分", "−9 公分", "−3 公分"], "sol": "每天 −3 公分，6 天：(−3)×6＝−18 公分，表示比原來低 18 公分。", "w": ["下降要用負數表示。", "這是 6 天連續下降，要用乘法，不是加 6。", "−3 只是一天的變化。"], "parent": "每天一樣多的變化，乘以天數就好；下降是負的。"}, {"id": "MA-1-3-M111", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "連除", "diff": "中等", "type": "計算", "q": "(−35)÷7÷(−5) 的值是多少？", "o": ["1", "−1", "25", "−25"], "sol": "由左到右：(−35)÷7＝−5；(−5)÷(−5)＝1。", "w": ["正負號錯了：兩個負數相除是正的。", "先算了 7÷(−5) 是錯的順序。", "順序和符號都錯了。"], "parent": "連除也由左到右。"}, {"id": "MA-1-3-H101", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "積為負數時負因數的個數", "diff": "困難", "type": "推理", "q": "四個不為 0 的整數相乘，乘積是負數。這四個數中，負數可能有幾個？", "o": ["1 個或 3 個", "只有 1 個", "2 個或 4 個", "只有 3 個"], "sol": "乘積的正負由負數的個數決定：奇數個負數→負，偶數個負數→正。四個數中，負數可能是 1 個或 3 個。", "w": ["3 個負數相乘也是負的，也有可能。", "偶數個負數相乘，乘積是正的。", "1 個負數也會讓乘積是負的。"], "parent": "只要數「負號個數」：奇數個就是負。"}, {"id": "MA-1-3-H102", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "自訂的運算規則", "diff": "困難", "type": "推理", "q": "規定新的運算「a★b＝a×b－(a＋b)」。(−2)★3 的值是多少？", "o": ["−7", "−5", "5", "−1"], "sol": "代入：(−2)×3－[(−2)＋3]＝−6－1＝−7。", "w": ["把 (a＋b) 算成 −1：−6－(−1)＝−5；(−2)＋3＝1。", "正負號錯了。", "只算了 a＋b 的部分。"], "parent": "照著規則把 a、b 換成數字，記得加括號。"}, {"id": "MA-1-3-H103", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "選三數使乘積最大", "diff": "困難", "type": "推理", "q": "從 −3、−2、4、5 四個數中選出三個相乘，乘積最大是多少？", "o": ["30", "40", "24", "−40"], "sol": "要讓乘積最大，乘積要是正的：選兩個負數和一個最大的正數，(−3)×(−2)×5＝30。如果選 4 和 5 再配一個負數，乘積是負的。", "w": ["4×5×(−2)＝−40，是負的；只看數字大小會誤以為是 40。", "(−3)×(−2)×4＝24，沒有選最大的正數 5。", "−40 是負的，不是最大。"], "parent": "先想要正還是負，再挑數字：偶數個負數才會是正的。"}, {"id": "MA-1-3-H104", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "答對加分、答錯扣分", "diff": "困難", "type": "推理", "q": "一份測驗有 20 題，每題都要作答。答對一題得 5 分，答錯一題扣 3 分。小明得了 52 分，他答對幾題？", "o": ["14 題", "13 題", "15 題", "12 題"], "sol": "可以代選項驗算：答對 14 題、答錯 6 題，得分＝14×5＋6×(−3)＝70－18＝52 分，符合。", "w": ["答對 13 題、答錯 7 題：65－21＝44 分。", "答對 15 題、答錯 5 題：75－15＝60 分。", "答對 12 題、答錯 8 題：60－24＝36 分。"], "parent": "把每個選項代進去算算看，哪一個剛好 52 分。"}, {"id": "MA-1-4-E101", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "乘方的意義", "diff": "簡單", "type": "觀念辨識", "q": "2⁵ 表示什麼？", "o": ["2×2×2×2×2", "2×5", "5×5", "2＋2＋2＋2＋2"], "sol": "2⁵ 表示 5 個 2 連乘：2×2×2×2×2＝32。", "w": ["2×5 是乘法，不是乘方。", "5×5 是 5²。", "連加是乘法的意思，不是乘方。"], "parent": "右上角的小數字，表示「自己乘自己幾次」。"}, {"id": "MA-1-4-E102", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "負數的三次方", "diff": "簡單", "type": "計算", "q": "(−2)³ 的值是多少？", "o": ["−8", "8", "−6", "6"], "sol": "(−2)³＝(−2)×(−2)×(−2)＝−8。三個負數相乘是負的。", "w": ["三個負數相乘，結果是負的。", "把乘方當成乘法：(−2)×3＝−6。", "把乘方當成乘法又弄錯符號。"], "parent": "負數的奇數次方是負的，偶數次方是正的。"}, {"id": "MA-1-4-E103", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "10 的次方", "diff": "簡單", "type": "計算", "q": "10⁴ 等於多少？", "o": ["10,000", "1,000", "40", "100,000"], "sol": "10⁴ 是 4 個 10 相乘，1 後面有 4 個 0：10,000。", "w": ["1,000 是 10³。", "10×4＝40，不是乘方。", "100,000 是 10⁵。"], "parent": "10 的幾次方，就是 1 後面幾個 0。"}, {"id": "MA-1-4-E104", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "科學記號還原", "diff": "簡單", "type": "計算", "q": "3.2×10⁵ 寫成一般的數是多少？", "o": ["320,000", "32,000", "3,200,000", "0.000032"], "sol": "10⁵ 表示小數點往右移 5 位：3.2 → 320,000。", "w": ["只移了 4 位。", "移了 6 位。", "次方是正的，小數點往右移，數會變大。"], "parent": "正次方：小數點往右移，數變大。"}, {"id": "MA-1-4-E105", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "用指數記法表示連乘", "diff": "簡單", "type": "觀念辨識", "q": "5×5×5×5 可以用指數記法寫成什麼？", "o": ["5⁴", "4⁵", "5×4", "20"], "sol": "4 個 5 相乘，寫成 5⁴，底數是 5、指數是 4。", "w": ["底數和指數弄反了：4⁵ 是 5 個 4 相乘。", "5×4 是乘法，不是連乘。", "20 是 5×4 的值，不是 5⁴（＝625）。"], "parent": "底數寫「誰在乘」，指數寫「乘幾個」。"}, {"id": "MA-1-4-E106", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "10 的負次方", "diff": "簡單", "type": "計算", "q": "10⁻³ 等於多少？", "o": ["0.001", "−1,000", "−30", "0.0001"], "sol": "10⁻³＝1÷10³＝0.001。負次方表示很小的數，不是負數。", "w": ["負次方不是負數，而是小於 1 的正數。", "負次方和乘法無關。", "0.0001 是 10⁻⁴。"], "parent": "負次方＝「1 除以 10 的幾次方」，是小數，不是負數。"}, {"id": "MA-1-4-M101", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "含負數乘方的比大小", "diff": "中等", "type": "比較判斷", "q": "比較 (−2)⁴、−2⁴、(−2)³、2³，哪一個的值最大？", "o": ["(−2)⁴", "−2⁴", "(−2)³", "2³"], "sol": "(−2)⁴＝16，−2⁴＝−16，(−2)³＝−8，2³＝8。最大的是 16。", "w": ["−2⁴ 的負號在外面，等於 −16。", "(−2)³ 是奇數次方，等於 −8。", "2³＝8，比 16 小。"], "parent": "先算出每個數，再比大小；注意括號和奇偶次方。"}, {"id": "MA-1-4-M102", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "用 10 的次方表示小單位", "diff": "中等", "type": "觀念應用", "q": "1 奈米＝10⁻⁹ 公尺。某病毒的直徑約 100 奈米，用科學記號表示約為多少公尺？", "o": ["1×10⁻⁷ 公尺", "1×10⁻¹¹ 公尺", "1×10² 公尺", "1×10⁻⁹ 公尺"], "sol": "100 奈米＝10²×10⁻⁹ 公尺。10² 表示放大 100 倍，所以小數點往右移 2 位：10⁻⁹ 變成 10⁻⁷ 公尺。", "w": ["方向弄反了：放大 100 倍，次方要從 −9 變成 −7，不是 −11。", "忘了乘上 10⁻⁹，100 公尺太大了。", "10⁻⁹ 公尺只是 1 奈米。"], "parent": "100 奈米比 1 奈米大 100 倍，次方要往「比較大」的方向調 2。"}, {"id": "MA-1-4-M103", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "比較科學記號的大小", "diff": "中等", "type": "比較判斷", "q": "4.5×10⁷ 和 9×10⁶ 比較，下列何者正確？", "o": ["4.5×10⁷ 比較大", "9×10⁶ 比較大", "兩數一樣大", "無法比較"], "sol": "先比次方：10⁷ 比 10⁶ 大 10 倍。4.5×10⁷＝45,000,000，9×10⁶＝9,000,000，前者較大。", "w": ["不能只看前面的 9 比 4.5 大，要先比次方。", "兩數不相等。", "科學記號可以比大小：先比次方，再比前面的數。"], "parent": "比科學記號：先看次方，次方大的就大；次方一樣再比前面。"}, {"id": "MA-1-4-M104", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "次方差 1 的兩數關係", "diff": "中等", "type": "推理", "q": "6.02×10²³ 和 6.02×10²² 之間有什麼關係？", "o": ["前者是後者的 10 倍", "後者是前者的 10 倍", "兩者相等", "前者比後者大 1"], "sol": "兩數前面的 6.02 相同，次方多 1，就是多乘一個 10，所以前者是後者的 10 倍。", "w": ["次方比較大的才是比較大的數。", "次方不同，兩數不相等。", "次方差 1 表示差 10 倍，不是差 1。"], "parent": "10 的次方每多 1，就多乘一個 10。"}, {"id": "MA-1-4-M105", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "(−1) 的乘方相加", "diff": "中等", "type": "計算", "q": "(−1)¹⁰⁰＋(−1)¹⁰¹ 的值是多少？", "o": ["0", "2", "−2", "1"], "sol": "(−1) 的偶數次方是 1，奇數次方是 −1：1＋(−1)＝0。", "w": ["(−1)¹⁰¹ 是奇數次方，等於 −1，不是 1。", "(−1)¹⁰⁰ 是偶數次方，等於 1，不是 −1。", "兩項相加是 1＋(−1)＝0。"], "parent": "(−1) 的次方只看奇偶：偶數→1，奇數→−1。"}, {"id": "MA-1-4-M106", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "相反數與乘方", "diff": "中等", "type": "計算", "q": "−(−3)² 的值是多少？", "o": ["−9", "9", "6", "−6"], "sol": "先算 (−3)²＝9，再取相反數，得 −9。", "w": ["外面還有一個負號，要取相反數。", "把乘方當成乘以 2，又弄錯符號。", "把乘方當成乘以 2。"], "parent": "由裡到外：先算括號的乘方，再處理外面的負號。"}, {"id": "MA-1-4-M107", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "辨識正確的科學記號", "diff": "中等", "type": "觀念辨識", "q": "下列哪一個是「正確的科學記號」寫法？", "o": ["9.9×10³", "10×10²", "0.5×10⁴", "12×10⁻³"], "sol": "科學記號 a×10ⁿ 中，a 要大於或等於 1、小於 10。只有 9.9 符合。", "w": ["10 不小於 10，應寫成 1×10³。", "0.5 小於 1，應寫成 5×10³。", "12 大於 10，應寫成 1.2×10⁻²。"], "parent": "前面的數要在 1 到 10 之間（可以是 1，但不能是 10）。"}, {"id": "MA-1-4-M108", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "兩個乘方相乘", "diff": "中等", "type": "計算", "q": "2³×3² 的值是多少？", "o": ["72", "36", "17", "6⁵"], "sol": "2³＝8，3²＝9，8×9＝72。", "w": ["把乘方當成乘法：2³ 算成 6、3² 算成 6，6×6＝36。", "把 8 和 9 相加了，題目是相乘。", "底數不同，不能把底數相乘、指數相加。"], "parent": "底數不同時，各自先算出來再相乘。"}, {"id": "MA-1-4-M109", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "科學記號表示大距離", "diff": "中等", "type": "生活應用", "q": "地球到月球的平均距離約 384,000 公里。用科學記號表示是哪一個？", "o": ["3.84×10⁵ 公里", "3.84×10⁴ 公里", "384×10³ 公里", "3.84×10⁶ 公里"], "sol": "384,000 的小數點往左移 5 位得 3.84，所以是 3.84×10⁵。", "w": ["只移了 4 位：3.84×10⁴＝38,400。", "384 不在 1 到 10 之間，不是科學記號。", "移了 6 位：3.84×10⁶＝3,840,000。"], "parent": "數一數小數點要往左移幾位，就是 10 的幾次方。"}, {"id": "MA-1-4-M110", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "單位換算與科學記號", "diff": "中等", "type": "計算", "q": "1 公尺＝10⁹ 奈米。0.5 公尺等於多少奈米？", "o": ["5×10⁸ 奈米", "5×10⁹ 奈米", "5×10¹⁰ 奈米", "0.5×10⁸ 奈米"], "sol": "0.5×10⁹＝5×10⁻¹×10⁹＝5×10⁸ 奈米。", "w": ["0.5 要改寫成 5×10⁻¹，次方要減 1。", "次方調整的方向反了。", "0.5 小於 1，不是科學記號；而且數值也錯了。"], "parent": "前面的數變大 10 倍（0.5→5），次方就要減 1。"}, {"id": "MA-1-4-M111", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "負次方的科學記號還原", "diff": "中等", "type": "計算", "q": "5.06×10⁻³ 寫成一般的數是多少？", "o": ["0.00506", "0.0506", "0.000506", "5060"], "sol": "10⁻³ 表示小數點往左移 3 位：5.06 → 0.00506。", "w": ["只移了 2 位。", "移了 4 位。", "負次方要往左移，數會變小，不是變大。"], "parent": "負次方：小數點往左移，數變小。"}, {"id": "MA-1-4-H101", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "比較 2¹⁰ 和 10³", "diff": "困難", "type": "推理", "q": "2¹⁰ 和 10³ 比較，下列何者正確？", "o": ["2¹⁰ 比較大", "10³ 比較大", "兩數相等", "無法比較"], "sol": "2¹⁰＝1,024，10³＝1,000，所以 2¹⁰ 比較大，只大了 24。", "w": ["算算看：2¹⁰＝1,024，比 1,000 大。", "兩數很接近，但不相等。", "兩數都可以算出來比較。"], "parent": "大的乘方不確定時，就一步一步乘出來：2、4、8、…、1024。"}, {"id": "MA-1-4-H102", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "負次方科學記號排序", "diff": "困難", "type": "排序", "q": "把 3×10⁻²、5×10⁻³、2×10⁻¹ 由小到大排列，何者正確？", "o": ["5×10⁻³＜3×10⁻²＜2×10⁻¹", "2×10⁻¹＜3×10⁻²＜5×10⁻³", "3×10⁻²＜5×10⁻³＜2×10⁻¹", "5×10⁻³＜2×10⁻¹＜3×10⁻²"], "sol": "換成小數：5×10⁻³＝0.005，3×10⁻²＝0.03，2×10⁻¹＝0.2。由小到大是 0.005＜0.03＜0.2。", "w": ["以為負次方的數字愈大，數就愈大；其實 10⁻¹ 比 10⁻³ 大。", "只看前面的 3 比 5 小，沒有先比次方。", "2×10⁻¹＝0.2，是三個數中最大的。"], "parent": "負次方：次方愈接近 0（−1 比 −3 大），數愈大。不確定就換成小數比。"}, {"id": "MA-1-4-H103", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "代入負數的乘方比大小", "diff": "困難", "type": "推理", "q": "當 a＝−2 時，a²、a³、−a² 由小到大排列，何者正確？", "o": ["a³＜−a²＜a²", "−a²＜a³＜a²", "a²＜a³＜−a²", "a³＜a²＜−a²"], "sol": "a²＝(−2)²＝4；a³＝(−2)³＝−8；−a²＝−4。由小到大：−8＜−4＜4。", "w": ["−a²＝−4 比 a³＝−8 大。", "a²＝4 是正的，最大。", "−a²＝−4 是負的，比 a²＝4 小。"], "parent": "代入負數時要加括號：a²＝(−2)²，−a²＝−(−2)²。"}, {"id": "MA-1-4-H104", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "乘方個位數的規律", "diff": "困難", "type": "規律推理", "q": "3¹＝3、3²＝9、3³＝27、3⁴＝81、3⁵＝243……3²⁰ 的個位數字是多少？", "o": ["1", "3", "7", "9"], "sol": "個位數依序是 3、9、7、1，每 4 個一循環。20÷4＝5，剛好整除，3²⁰ 的個位數和 3⁴ 一樣，是 1。", "w": ["3 是循環中的第 1 個，對應指數除以 4 餘 1 的情況。", "7 對應指數除以 4 餘 3 的情況。", "9 對應指數除以 4 餘 2 的情況。"], "parent": "先找出個位數的循環，再用指數除以循環長度看餘數。"}, {"id": "EN-GR-E101", "subj": "英語", "unit": "Get Ready", "point": "句首大寫與句點", "diff": "簡單", "type": "句子判斷", "q": "下列哪一個句子的寫法完全正確？", "o": ["I am Lele.", "i am Lele.", "I am lele.", "I am Lele"], "sol": "句子第一個字母要大寫，I 一定大寫，人名開頭也要大寫，句尾要加句點。", "w": ["I（我）不管在哪裡都要大寫。", "人名 Lele 的開頭 L 要大寫。", "句子結尾少了句點。"], "parent": "寫完英文句子檢查三件事：開頭大寫、名字大寫、句尾有標點。", "ex": "I am Lele. My name is Lele."}, {"id": "EN-GR-E102", "subj": "英語", "unit": "Get Ready", "point": "大小寫字母對應", "diff": "簡單", "type": "字母辨識", "q": "大寫字母 G 的小寫是哪一個？", "o": ["g", "q", "j", "d"], "sol": "G 的小寫是 g。", "w": ["q 是 Q 的小寫，形狀和 g 很像，但尾巴方向不同。", "j 是 J 的小寫。", "d 是 D 的小寫。"], "parent": "容易混的小寫字母，可以多寫幾次比比看：g 和 q、b 和 d。", "ex": "Good morning, Grace."}, {"id": "EN-GR-E103", "subj": "英語", "unit": "Get Ready", "point": "母音字母", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一組字母「全部」都是母音字母？", "o": ["a, e, o", "a, b, e", "i, o, y", "e, u, w"], "sol": "英文的母音字母是 a、e、i、o、u 五個，其他都是子音字母。只有 a、e、o 這組全部是母音字母。", "w": ["b 是子音字母。", "y 不在 a、e、i、o、u 裡面，是子音字母。", "w 是子音字母。"], "parent": "母音字母只有五個：a、e、i、o、u，可以背成「a e i o u」。", "ex": "An egg and an apple."}, {"id": "EN-GR-E104", "subj": "英語", "unit": "Get Ready", "point": "早上打招呼", "diff": "簡單", "type": "情境對話", "q": "早上七點，你在校門口遇到老師，你應該說：", "o": ["Good morning.", "Good night.", "Goodbye.", "Thank you."], "sol": "早上見面打招呼說 Good morning.", "w": ["Good night. 是晚上睡前或晚上道別時說的。", "Goodbye. 是道別，不是見面時說的。", "Thank you. 是「謝謝」，不是打招呼。"], "parent": "早上見面說 Good morning，要走的時候才說 Goodbye。", "ex": "Good morning, Mr. Lin."}, {"id": "EN-GR-E105", "subj": "英語", "unit": "Get Ready", "point": "回答名字", "diff": "簡單", "type": "問答配對", "q": "— What is your name?\n— ________", "o": ["My name is Amy.", "I am fine.", "I am twelve.", "Yes, I am."], "sol": "問「你叫什麼名字？」，要回答名字：My name is Amy.", "w": ["I am fine. 是回答「你好嗎？」。", "I am twelve. 是回答年齡。", "Yes, I am. 是回答 Are you…? 這種 Yes/No 問句。"], "parent": "先看問句問什麼：name 問名字，就回答名字。", "ex": "— What is your name? — My name is Amy."}, {"id": "EN-GR-E106", "subj": "英語", "unit": "Get Ready", "point": "回答年齡", "diff": "簡單", "type": "問答配對", "q": "— How old are you?\n— ________", "o": ["I am twelve.", "I am Amy.", "I am fine.", "I am a student."], "sol": "How old 問年齡，要回答幾歲：I am twelve.", "w": ["I am Amy. 是回答名字。", "I am fine. 是回答「你好嗎？」。", "I am a student. 是說身分，不是年齡。"], "parent": "How old＝幾歲，回答要有數字。", "ex": "— How old are you? — I am twelve."}, {"id": "EN-GR-E107", "subj": "英語", "unit": "Get Ready", "point": "數字 40 的拼法", "diff": "簡單", "type": "拼字", "q": "數字 40 的英文是：", "o": ["forty", "fourty", "fourteen", "four"], "sol": "40 是 forty，four 的 u 要拿掉。", "w": ["fourty 多了一個 u，是常見的拼錯。", "fourteen 是 14。", "four 是 4。"], "parent": "40 要特別記：forty 沒有 u。", "ex": "My grandfather is forty-four."}, {"id": "EN-GR-E108", "subj": "英語", "unit": "Get Ready", "point": "主格 I", "diff": "簡單", "type": "選擇填空", "q": "________ am a student.", "o": ["I", "My", "You", "He"], "sol": "句子需要主詞，搭配 am 的主詞是 I。", "w": ["My 是「我的」，後面要接名詞，不能當主詞。", "You 要搭配 are。", "He 要搭配 is。"], "parent": "I 配 am。my 是「我的」，後面一定要接東西。", "ex": "I am a student. My name is Ken."}, {"id": "EN-GR-E109", "subj": "英語", "unit": "Get Ready", "point": "所有格 our", "diff": "簡單", "type": "選擇填空", "q": "Tom and I are classmates. ________ classroom is big.（提示：我們的）", "o": ["Our", "We", "Their", "They"], "sol": "「我們的」是 Our，後面接名詞 classroom。", "w": ["We 是「我們」（主詞），後面不能直接接名詞 classroom。", "Their 是「他們的」，和提示「我們的」不同。", "They 是「他們」，而且是主詞。"], "parent": "「我們」用 we，「我們的」用 our。", "ex": "We are classmates. Our teacher is Ms. Chen."}, {"id": "EN-GR-M101", "subj": "英語", "unit": "Get Ready", "point": "She 與 Her", "diff": "中等", "type": "選擇填空", "q": "______(1) is my friend. ______(2) name is Ann.\n(1)、(2) 依序應填入什麼？", "o": ["She；Her", "Her；She", "She；She", "Her；Her"], "sol": "(1) 句子需要主詞，後面接 is，用 She。(2) 後面接名詞 name，要用所有格 Her（她的）。", "w": ["兩格弄反了：主詞位置用 She，名詞前面用 Her。", "(2) 後面有名詞 name，要用「她的」Her。", "(1) 是主詞的位置，要用 She。"], "parent": "後面接 is → 用 she；後面接名詞 → 用 her。", "ex": "She is my friend. Her name is Ann."}, {"id": "EN-GR-M102", "subj": "英語", "unit": "Get Ready", "point": "自我介紹句型", "diff": "中等", "type": "句子判斷", "q": "Lele 想用英文說「我的名字是 Lele」，下列哪一句正確？", "o": ["My name is Lele.", "My name are Lele.", "I name is Lele.", "My name is lele."], "sol": "name 是單數，搭配 is；「我的名字」要用 My name；人名開頭要大寫。", "w": ["name 是一個名字，要配 is，不是 are。", "「我的名字」要用 My，不是 I。", "人名 Lele 的開頭要大寫。"], "parent": "「我的名字」＝My name，後面配 is。", "ex": "My name is Lele. I am twelve."}, {"id": "EN-GR-M103", "subj": "英語", "unit": "Get Ready", "point": "所有格 its", "diff": "中等", "type": "選擇填空", "q": "This is a rabbit. ________ ears are long.", "o": ["Its", "It", "They", "Their"], "sol": "一隻兔子用 it 代替；「牠的耳朵」要用所有格 Its。", "w": ["It 是「牠」，後面不能直接接名詞 ears。", "They 是「牠們」，而且是主詞，不能放在名詞前面。", "Their 是「牠們的」，但這裡只有一隻兔子。"], "parent": "一隻動物：牠＝it，牠的＝its。", "ex": "This is my cat. Its name is Coco."}, {"id": "EN-GR-M104", "subj": "英語", "unit": "Get Ready", "point": "15 與 50 的區分", "diff": "中等", "type": "拼字", "q": "My aunt is ________ years old.（50）", "o": ["fifty", "fifteen", "fiveteen", "fivety"], "sol": "50 是 fifty。fifteen 是 15。five 變成十位數時寫成 fif-。", "w": ["fifteen 是 15，不是 50。", "fiveteen 拼錯了，15 的正確拼法是 fifteen。", "fivety 拼錯了，50 的正確拼法是 fifty。"], "parent": "-teen 是十幾，-ty 是幾十：fifteen＝15，fifty＝50。", "ex": "My aunt is fifty. My cousin is fifteen."}, {"id": "EN-GR-M105", "subj": "英語", "unit": "Get Ready", "point": "兩位數 99 的寫法", "diff": "中等", "type": "拼字", "q": "數字 99 的英文是：", "o": ["ninety-nine", "nineteen-nine", "ninety-ninety", "nine-ninety"], "sol": "99 是 ninety（90）加 nine（9），中間用連字號：ninety-nine。", "w": ["nineteen 是 19，不是 90。", "後面的個位數是 nine，不是 ninety。", "順序反了：先寫十位數 ninety，再寫個位數 nine。"], "parent": "先說幾十，再說幾個，中間加 -：twenty-one、ninety-nine。", "ex": "My grandmother is ninety-nine."}, {"id": "EN-GR-M106", "subj": "英語", "unit": "Get Ready", "point": "問句的標點與大小寫", "diff": "中等", "type": "句子判斷", "q": "下列哪一個問句的寫法正確？", "o": ["What is your name?", "What is your name.", "what is your name?", "What is Your name?"], "sol": "問句句尾要用問號；句首字母大寫；句子中間的一般單字（your）不用大寫。", "w": ["問句結尾要用問號，不是句點。", "句子第一個字母 W 要大寫。", "your 在句子中間，不是人名，不用大寫。"], "parent": "問句：開頭大寫、結尾問號，中間的普通單字小寫。", "ex": "What is your name? How old are you?"}, {"id": "EN-GR-M107", "subj": "英語", "unit": "Get Ready", "point": "見面打招呼的回應", "diff": "中等", "type": "情境對話", "q": "A: Hello, I am Amy.\nB: ________", "o": ["Hi, Amy. I am Ken.", "Goodbye, Amy.", "Yes, I am.", "My name is Amy."], "sol": "Amy 和 B 打招呼並自我介紹，B 回應打招呼，也介紹自己。", "w": ["Goodbye 是道別，不是見面時的回應。", "Amy 沒有問問題，不用回答 Yes。", "B 是 Ken，不是 Amy；B 說自己的名字是 Amy 不合理。"], "parent": "別人自我介紹時，打個招呼，再介紹自己。", "ex": "A: Hello, I am Amy. B: Hi, Amy. I am Ken."}, {"id": "EN-GR-M108", "subj": "英語", "unit": "Get Ready", "point": "you 與 your", "diff": "中等", "type": "選擇填空", "q": "________ bag is blue.（提示：你的）", "o": ["Your", "You", "You are", "I"], "sol": "「你的」是 Your，後面接名詞 bag。", "w": ["You 是「你」，後面不能直接接名詞 bag。", "You are 是「你是」，You are bag is blue 不是完整的句子。", "I 是「我」，和提示「你的」不同。"], "parent": "you 是「你」，your 是「你的」，後面接東西。", "ex": "You are my friend. Your bag is blue."}, {"id": "EN-GR-M109", "subj": "英語", "unit": "Get Ready", "point": "their 與 there", "diff": "中等", "type": "選擇填空", "q": "Mr. and Mrs. Lin are teachers. ________ son is a student.", "o": ["Their", "They", "His", "There"], "sol": "Mr. and Mrs. Lin 是兩個人；「他們的兒子」要用 Their。", "w": ["They 是主詞「他們」，後面不能直接接名詞 son。", "His 是「他的」，只指一個男生；這裡是林先生和林太太兩個人。", "There 是「那裡」，只是念起來像 Their。"], "parent": "兩個人以上的「…的」用 their。", "ex": "They are my friends. Their names are Tom and Amy."}, {"id": "EN-GR-M110", "subj": "英語", "unit": "Get Ready", "point": "I 在句中也大寫", "diff": "中等", "type": "句子判斷", "q": "想說「Tom 和我是朋友」，下列哪一句正確？", "o": ["Tom and I are friends.", "Tom and i are friends.", "tom and I are friends.", "Tom and I is friends."], "sol": "I 在句子任何位置都要大寫；人名 Tom 開頭大寫；Tom and I 是兩個人，配 are。", "w": ["I 在句子中間也一定要大寫。", "人名 Tom 的開頭要大寫。", "Tom and I 是兩個人，要配 are。"], "parent": "I 永遠大寫；兩個人一起當主詞，用 are。", "ex": "Tom and I are friends."}, {"id": "EN-GR-M111", "subj": "英語", "unit": "Get Ready", "point": "由稱呼判斷 he／she", "diff": "中等", "type": "選擇填空", "q": "This is Mr. Wang. ________ is my teacher.", "o": ["He", "She", "His", "It"], "sol": "Mr. 是用在男士的稱呼，所以用 He（他）當主詞。", "w": ["Mr. 是男士，女士才用 She。", "His 是「他的」，不能當主詞配 is。", "It 用在東西或動物，不用在人。"], "parent": "Mr. 是先生（男生）；Ms./Mrs. 是女士。", "ex": "This is Mr. Wang. He is my teacher."}, {"id": "EN-GR-M112", "subj": "英語", "unit": "Get Ready", "point": "由答句選問句", "diff": "中等", "type": "問答配對", "q": "— ________\n— I am thirteen.", "o": ["How old are you?", "What is your name?", "Who are you?", "How are you?"], "sol": "答句說的是年齡（十三歲），所以問句要問年齡：How old are you?", "w": ["What is your name? 問名字。", "Who are you? 問你是誰。", "How are you? 問你好不好，少了 old 就不是問年齡。"], "parent": "先看答句說了什麼（年齡），再找問那件事的問句。", "ex": "— How old are you? — I am thirteen."}, {"id": "EN-GR-M113", "subj": "英語", "unit": "Get Ready", "point": "I 與 my 的綜合", "diff": "中等", "type": "選擇填空", "q": "I am Kevin. ______(1) sister is ten. ______(2) am twelve.\n(1)、(2) 依序應填入什麼？", "o": ["My；I", "I；My", "My；My", "I；I"], "sol": "(1) 後面接名詞 sister，要用 My（我的）。(2) 後面接 am，需要主詞 I。", "w": ["兩格弄反了。", "(2) 後面是 am，需要主詞 I，不能用 My。", "(1) 後面是名詞 sister，要用「我的」My。"], "parent": "後面接名詞用 my；後面接 am 用 I。", "ex": "I am Kevin. My sister is ten."}, {"id": "EN-GR-H101", "subj": "英語", "unit": "Get Ready", "point": "代名詞與所有格的連續指涉", "diff": "困難", "type": "閱讀推理", "q": "根據上面的短文，Coco 是誰的貓？", "o": ["Tom", "Kate", "Jenny", "Kate 的爸爸"], "sol": "She is my friend → Kate 是 Jenny 的朋友。Her brother is Tom → Kate 的哥哥（或弟弟）是 Tom。His cat is Coco → His 指的是 Tom，所以 Coco 是 Tom 的貓。", "w": ["Her 指的是 Kate，但 Coco 前面的所有格是 His，指的是男生 Tom。", "Jenny 是說話的人，文中沒有說 Coco 是她的貓。", "短文沒有提到 Kate 的爸爸。"], "parent": "每看到 he、she、his、her，就往前找它指的是哪一個人。", "fig": "<div class=\"fig passage\"><p>Hi, I am Jenny. This is Kate. She is my friend. Her brother is Tom. His cat is Coco.</p></div>", "ex": "This is Kate. Her brother is Tom. His cat is Coco."}, {"id": "EN-L1-E101", "subj": "英語", "unit": "Lesson 1", "point": "I 配 am", "diff": "簡單", "type": "選擇填空", "q": "I ________ a student.", "o": ["am", "is", "are", "be"], "sol": "主詞是 I，be 動詞用 am。", "w": ["is 搭配 he、she、it 或單數名詞。", "are 搭配 you、we、they 或複數名詞。", "be 是原形，在這種句子裡要換成 am、is 或 are。"], "parent": "I 配 am，這是固定搭檔。", "ex": "I am a student. I am twelve."}, {"id": "EN-L1-E102", "subj": "英語", "unit": "Lesson 1", "point": "she 配 is", "diff": "簡單", "type": "選擇填空", "q": "She ________ my aunt.", "o": ["is", "am", "are", "be"], "sol": "主詞是 She（她，一個人），be 動詞用 is。", "w": ["am 只搭配 I。", "are 搭配 you、we、they 或複數名詞。", "be 要換成 am、is 或 are 才能用。"], "parent": "he、she、it 都配 is。", "ex": "She is my aunt. She is a teacher."}, {"id": "EN-L1-E103", "subj": "英語", "unit": "Lesson 1", "point": "家族稱謂 uncle", "diff": "簡單", "type": "字彙", "q": "My mother's brother is my ________.（提示：媽媽的兄弟）", "o": ["uncle", "aunt", "grandfather", "brother"], "sol": "媽媽的兄弟是舅舅，英文是 uncle。", "w": ["aunt 是阿姨、姑姑等女性長輩。", "grandfather 是祖父或外祖父。", "brother 是自己的兄弟，不是媽媽的兄弟。"], "parent": "男性長輩（叔、伯、舅）是 uncle；女性長輩（姑、姨）是 aunt。", "ex": "That man is my uncle. He is my mother's brother."}, {"id": "EN-L1-E104", "subj": "英語", "unit": "Lesson 1", "point": "職業字彙 doctor", "diff": "簡單", "type": "字彙", "q": "「醫生」的英文是：", "o": ["doctor", "teacher", "student", "cook"], "sol": "醫生是 doctor。", "w": ["teacher 是老師。", "student 是學生。", "cook 是廚師。"], "parent": "可以用家人的職業造句來記：My father is a doctor.", "ex": "My father is a doctor."}, {"id": "EN-L1-E105", "subj": "英語", "unit": "Lesson 1", "point": "be 動詞否定句", "diff": "簡單", "type": "句型改寫", "q": "把 He is a teacher. 改成否定句：", "o": ["He is not a teacher.", "He not is a teacher.", "He are not a teacher.", "He is a not teacher."], "sol": "be 動詞的否定句，是在 be 動詞後面加 not：He is not a teacher.", "w": ["not 要放在 is 的後面。", "He 要配 is，不是 are。", "not 要緊接在 is 後面，不能放在 a 後面。"], "parent": "否定句：找到 be 動詞，在它後面加 not。", "ex": "He is not a teacher. He is a doctor."}, {"id": "EN-L1-E106", "subj": "英語", "unit": "Lesson 1", "point": "isn't 的意思", "diff": "簡單", "type": "觀念辨識", "q": "isn't 是哪兩個字的縮寫？", "o": ["is not", "is no", "it not", "it is"], "sol": "isn't 是 is not 的縮寫，撇號代替了 not 裡的 o。", "w": ["no 和 not 不一樣；縮寫的是 not。", "isn't 前面是 is，不是 it。", "it is 的縮寫是 it's。"], "parent": "n't 就是 not：isn't＝is not，aren't＝are not。", "ex": "She isn't my sister. She is my cousin."}, {"id": "EN-L1-E107", "subj": "英語", "unit": "Lesson 1", "point": "Who's 的意思", "diff": "簡單", "type": "觀念辨識", "q": "Who's that young man? 句中的 Who's 是哪兩個字的縮寫？", "o": ["Who is", "Who are", "Whose", "Who am"], "sol": "Who's that young man? 的 Who's 是 Who is 的縮寫，意思是「那位年輕男子是誰？」。", "w": ["are 的縮寫是 're，不是 's。", "Whose 是「誰的」，是另一個字，念起來很像。", "am 的縮寫是 'm。"], "parent": "'s 在這裡是 is。Who's＝Who is。", "ex": "Who's that young man? He is my uncle."}, {"id": "EN-L1-E108", "subj": "英語", "unit": "Lesson 1", "point": "形容詞反義 young／old", "diff": "簡單", "type": "字彙", "q": "young（年輕的）的相反詞是：", "o": ["old", "tall", "short", "kind"], "sol": "young（年輕的）的相反詞是 old（年老的）。", "w": ["tall 是「高的」，相反詞是 short。", "short 是「矮的」，相反詞是 tall。", "kind 是「親切的」。"], "parent": "成對記：young／old、tall／short。", "ex": "My grandfather is old. My cousin is young."}, {"id": "EN-L1-M101", "subj": "英語", "unit": "Lesson 1", "point": "改成 Yes/No 問句", "diff": "中等", "type": "句型改寫", "q": "把 She is your sister. 改成問句：", "o": ["Is she your sister?", "She is your sister?", "Are she your sister?", "Is your sister she?"], "sol": "be 動詞的問句，把 is 移到主詞 she 的前面，句尾加問號。", "w": ["只加問號、沒把 is 移到前面，不是標準的問句寫法。", "She 要配 is，不是 are。", "只要把 is 移到最前面，主詞 she 不用跟著搬到最後。"], "parent": "問句：把 be 動詞搬到最前面，其他照原本順序。", "ex": "Is she your sister? Yes, she is."}, {"id": "EN-L1-M102", "subj": "英語", "unit": "Lesson 1", "point": "複數主詞的肯定簡答", "diff": "中等", "type": "問答配對", "q": "— Are they students?\n— Yes, ________.", "o": ["they are", "they're", "they is", "are they"], "sol": "用 they 回答，配 are。肯定的簡答句不用縮寫，要寫 they are。", "w": ["肯定簡答句最後不能用縮寫 they're。", "they 是複數，要配 are。", "回答時主詞在前、be 動詞在後，不能倒過來。"], "parent": "Yes 的簡答不縮寫；No 的簡答才可以縮寫（No, they aren't.）。", "ex": "— Are they students? — Yes, they are."}, {"id": "EN-L1-M103", "subj": "英語", "unit": "Lesson 1", "point": "由稱呼判斷簡答的代名詞", "diff": "中等", "type": "問答配對", "q": "— Is Ms. Lin your teacher?\n— No, ________.", "o": ["she isn't", "he isn't", "she is", "it isn't"], "sol": "Ms. 是女士，回答時用 she；回答是 No，所以用否定 isn't。", "w": ["Ms. 是女士，不能用 he。", "前面說 No，後面就要用否定 isn't。", "it 不能用來指人。"], "parent": "回答要先把人名換成代名詞：Ms.→she，Mr.→he。", "ex": "— Is Ms. Lin your teacher? — No, she isn't."}, {"id": "EN-L1-M104", "subj": "英語", "unit": "Lesson 1", "point": "回答 Who 問句", "diff": "中等", "type": "問答配對", "q": "— Who is that?\n— ________", "o": ["He is my grandfather.", "It is a dog.", "Yes, he is.", "He is tall."], "sol": "Who 問「是誰」，要回答身分或關係，例如「他是我的祖父」。", "w": ["Who 問人，回答動物不合適；問東西或動物要用 What。", "Who 問句不能用 Yes 或 No 回答。", "He is tall. 是說外表，沒有說他是誰。"], "parent": "Who 問人是誰 → 回答「他是我的…」。", "ex": "— Who is that? — He is my grandfather."}, {"id": "EN-L1-M105", "subj": "英語", "unit": "Lesson 1", "point": "「某人 and I」配 are", "diff": "中等", "type": "選擇填空", "q": "My brother and I ________ students.", "o": ["are", "am", "is", "be"], "sol": "My brother and I 是兩個人（等於 we），要配 are。", "w": ["am 只配單獨的 I；這裡主詞是兩個人。", "is 配一個人或一個東西。", "be 要換成 am、is 或 are。"], "parent": "先數主詞有幾個人：兩個以上就用 are。", "ex": "My brother and I are students."}, {"id": "EN-L1-M106", "subj": "英語", "unit": "Lesson 1", "point": "Who are 問複數", "diff": "中等", "type": "選擇填空", "q": "— Who ________ they?\n— They are my cousins.", "o": ["are", "is", "am", "do"], "sol": "主詞 they 是複數，配 are：Who are they?", "w": ["is 配單數主詞；they 是複數。", "am 只配 I。", "do 不是 be 動詞，Who are they? 這種問句要用 be 動詞。"], "parent": "Who 後面的 be 動詞，要看後面的主詞決定。", "ex": "— Who are they? — They are my cousins."}, {"id": "EN-L1-M107", "subj": "英語", "unit": "Lesson 1", "point": "形容詞放在名詞前", "diff": "中等", "type": "句子判斷", "q": "想說「他是一位年輕男子」，下列哪一句正確？", "o": ["He is a young man.", "He is a man young.", "He is young a man.", "He is a youngs man."], "sol": "形容詞放在名詞前面：a young man（一位年輕的男子）。", "w": ["形容詞 young 要放在 man 前面。", "a 要放在 young 前面：a young man。", "形容詞沒有複數，不加 s。"], "parent": "「一位年輕的男子」照中文順序：a＋young＋man。", "ex": "That young man is my uncle."}, {"id": "EN-L1-M108", "subj": "英語", "unit": "Lesson 1", "point": "形容詞不加 s", "diff": "中等", "type": "選擇填空", "q": "My brothers are ________.（提示：高的）", "o": ["tall", "talls", "a tall", "tall is"], "sol": "形容詞放在 be 動詞後面，不會因為主詞是複數就加 s：They are tall.", "w": ["形容詞沒有複數形，不加 s。", "tall 後面沒有名詞，不需要 a。", "句子已經有 are，不能再加 is。"], "parent": "名詞才有複數，形容詞永遠不加 s。", "ex": "My brothers are tall. They are tall boys."}, {"id": "EN-L1-M109", "subj": "英語", "unit": "Lesson 1", "point": "複數主詞否定縮寫", "diff": "中等", "type": "句型改寫", "q": "把 They are teachers. 改成否定句：", "o": ["They aren't teachers.", "They isn't teachers.", "They don't teachers.", "They not are teachers."], "sol": "are 的後面加 not，縮寫成 aren't。", "w": ["They 要配 are，否定是 aren't，不是 isn't。", "be 動詞的否定句，直接在 be 動詞後面加 not，不用 don't。", "not 要放在 are 的後面。"], "parent": "先找出 be 動詞，再在後面加 not。", "ex": "They aren't teachers. They are students."}, {"id": "EN-L1-M110", "subj": "英語", "unit": "Lesson 1", "point": "回答 Are you…?", "diff": "中等", "type": "問答配對", "q": "— Are you Ken?\n— Yes, ________.", "o": ["I am", "you are", "I'm", "he is"], "sol": "別人問「你是 Ken 嗎？」，回答時要說「我是」：Yes, I am.", "w": ["對方問「你」，回答時要換成「我」。", "肯定的簡答句不能縮寫成 I'm。", "回答自己的事，要用 I，不是 he。"], "parent": "問 you，答 I；問 I，答 you。", "ex": "— Are you Ken? — Yes, I am."}, {"id": "EN-L1-M111", "subj": "英語", "unit": "Lesson 1", "point": "家族稱謂 grandmother", "diff": "中等", "type": "字彙", "q": "My father's mother is my ________.", "o": ["grandmother", "aunt", "mother", "sister"], "sol": "爸爸的媽媽是奶奶（祖母），英文是 grandmother。", "w": ["aunt 是姑姑、阿姨等，是爸爸媽媽的姊妹。", "mother 是自己的媽媽。", "sister 是自己的姊妹。"], "parent": "爸爸或媽媽的爸媽，前面都加 grand：grandfather、grandmother。", "ex": "My grandmother is kind."}, {"id": "EN-L1-M112", "subj": "英語", "unit": "Lesson 1", "point": "用代名詞回答 Is that…?", "diff": "中等", "type": "問答配對", "q": "— Is that young woman your aunt?\n— Yes, ________.", "o": ["she is", "it is", "that is", "her is"], "sol": "that young woman 是一位女士，回答時改用 she：Yes, she is.", "w": ["it 用在東西或動物，不用在人。", "回答時要把 that young woman 換成代名詞 she。", "her 是「她的」，不能當主詞。"], "parent": "回答 Yes/No 問句時，先把人換成 he 或 she。", "ex": "— Is that young woman your aunt? — Yes, she is."}, {"id": "EN-L1-M113", "subj": "英語", "unit": "Lesson 1", "point": "形容詞反義 tall／short", "diff": "中等", "type": "選擇填空", "q": "My father is tall, but my mother is not tall. She is ________.", "o": ["short", "young", "old", "tall"], "sol": "不高，就是矮：short。", "w": ["young 是「年輕的」，和高矮無關。", "old 是「年老的」，和高矮無關。", "句子說她 not tall，不可能是 tall。"], "parent": "高 tall 的相反是矮 short。", "ex": "My father is tall. My mother is short."}, {"id": "EN-L1-M114", "subj": "英語", "unit": "Lesson 1", "point": "依答句選 Who 問句", "diff": "中等", "type": "問答配對", "q": "— ________\n— I am Ben's sister.", "o": ["Who are you?", "Who is she?", "Are you Ben?", "How old are you?"], "sol": "回答的人說「我是 Ben 的姊姊（或妹妹）」，問句要問「你是誰？」。", "w": ["Who is she? 問「她」是誰，回答應該是 She is…，不是 I am…。", "Are you Ben? 要用 Yes 或 No 回答。", "How old are you? 要回答年齡。"], "parent": "答句用 I am，問句就是問 you。", "ex": "— Who are you? — I am Ben's sister."}, {"id": "EN-L1-M115", "subj": "英語", "unit": "Lesson 1", "point": "由 aunt 判斷 she", "diff": "中等", "type": "選擇填空", "q": "My aunt is a cook. ________ is kind.", "o": ["She", "He", "Her", "It"], "sol": "aunt 是女性長輩，所以用 She（她）當主詞。", "w": ["He 用在男性；aunt 是女性。", "Her 是「她的」，不能當主詞配 is。", "It 用在東西或動物。"], "parent": "先想這個人是男生還是女生，再決定 he 或 she。", "ex": "My aunt is a cook. She is kind."}, {"id": "EN-L1-M116", "subj": "英語", "unit": "Lesson 1", "point": "前後句意一致", "diff": "中等", "type": "選擇填空", "q": "— Is your brother a student?\n— No, he isn't. He ________ a cook.", "o": ["is", "isn't", "are", "am"], "sol": "他不是學生，接著說他的職業：他是廚師，用 is。", "w": ["前面已經說他不是學生，這句在說他是什麼，要用肯定的 is。", "He 要配 is。", "am 只配 I。"], "parent": "No 之後常會補一句「他其實是…」，要用肯定句。", "ex": "No, he isn't. He is a cook."}, {"id": "EN-L1-H101", "subj": "英語", "unit": "Lesson 1", "point": "由對話推出家族關係", "diff": "困難", "type": "閱讀推理", "q": "根據上面的對話，照片中的 that man 是 Kate 的什麼人？", "o": ["grandfather（祖父）", "uncle（叔伯）", "father（爸爸）", "brother（兄弟）"], "sol": "Kate 說 This is my father.（這是我爸爸），接著說 That man is his father.（那位男子是他的爸爸）。his 指 Kate 的爸爸，爸爸的爸爸就是 Kate 的祖父。", "w": ["uncle 是爸爸的兄弟；his father 是爸爸的爸爸。", "This is my father. 指的是另一個人；that man 是 his father。", "對話中沒有提到 Kate 的兄弟。"], "parent": "先找出 his 指的是誰（Kate 的爸爸），再想「爸爸的爸爸」是誰。", "fig": "<div class=\"fig dialog\"><p><b>Ben:</b> Who is that man in the photo, Kate?</p><p><b>Kate:</b> This is my father. And that man is his father.</p><p><b>Ben:</b> He is old.</p><p><b>Kate:</b> Yes. He is seventy-two.</p></div>", "ex": "This is my father. That man is his father. He is my grandfather."}, {"id": "EN-L1-H102", "subj": "英語", "unit": "Lesson 1", "point": "依短文判斷問答是否正確", "diff": "困難", "type": "閱讀推理", "q": "根據上面的短文，下列哪一組問答完全正確？", "o": ["— Is Sam's mother a doctor?\n— No, she isn't.", "— Is Sam's father a teacher?\n— Yes, he is.", "— Is Sam's sister a student?\n— Yes, he is.", "— Are Sam's parents doctors?\n— Yes, they are."], "sol": "短文說 Sam 的媽媽不是醫生，是老師，所以「No, she isn't.」內容和文法都正確。", "w": ["Sam 的爸爸是醫生，不是老師，答案應該是 No。", "內容對（妹妹是學生），但 sister 要用 she，不是 he。", "只有爸爸是醫生，媽媽是老師，所以不是兩個人都是醫生。"], "parent": "每組都要檢查兩件事：內容和短文一樣嗎？代名詞和 be 動詞用對了嗎？", "fig": "<div class=\"fig passage\"><p>My name is Sam. My father is a doctor. My mother is not a doctor. She is a teacher. My sister is a student. She is ten.</p></div>", "ex": "My mother is not a doctor. She is a teacher."}, {"id": "EN-L1-H103", "subj": "英語", "unit": "Lesson 1", "point": "把中文描述寫成英文", "diff": "困難", "type": "句子判斷", "q": "Lisa 想介紹她的叔叔：「他三十歲，是一位高個子的醫生。」下列哪一個選項最正確？", "o": ["My uncle is thirty. He is a tall doctor.", "My uncle is thirteen. He is a tall doctor.", "My aunt is thirty. She is a tall doctor.", "My uncle is thirty. He is a doctor tall."], "sol": "叔叔是 uncle；三十是 thirty；「一位高個子的醫生」是 a tall doctor，形容詞放在名詞前。", "w": ["thirteen 是 13，thirty 才是 30。", "aunt 是阿姨、姑姑，叔叔是 uncle。", "形容詞 tall 要放在名詞 doctor 前面。"], "parent": "中翻英時，一個一個核對：人物、數字、詞序。", "ex": "My uncle is thirty. He is a tall doctor."}, {"id": "EN-L1-H104", "subj": "英語", "unit": "Lesson 1", "point": "依答句的形式判斷問句", "diff": "困難", "type": "問答配對", "q": "— ________\n— They are my grandparents.", "o": ["Who are they?", "Who is he?", "Are they your grandparents?", "How old are they?"], "sol": "答句說「他們是我的祖父母」，是在說明身分，而且沒有 Yes 或 No，所以問句是 Who are they?", "w": ["Who is he? 問一個人，答句應該是 He is…。", "這是 Yes/No 問句，答句要先說 Yes 或 No。", "How old 問年齡，答句要有數字。"], "parent": "看答句：有沒有 Yes/No？主詞是一個人還是很多人？說的是身分還是年齡？", "ex": "— Who are they? — They are my grandparents."}, {"id": "EN-L2-E101", "subj": "英語", "unit": "Lesson 2", "point": "一般名詞加 s", "diff": "簡單", "type": "拼字", "q": "two ________（cat）", "o": ["cats", "cat", "cates", "caties"], "sol": "兩隻以上要用複數，一般名詞直接加 s：cats。", "w": ["two 後面要用複數。", "cat 字尾不是 s、x、ch、sh，不用加 es。", "cat 字尾沒有 y，不用改成 ies。"], "parent": "兩個以上加 s，大部分的名詞直接加 s 就好。", "ex": "These are two cats."}, {"id": "EN-L2-E102", "subj": "英語", "unit": "Lesson 2", "point": "字尾 ch 加 es", "diff": "簡單", "type": "拼字", "q": "These are ________.（watch）", "o": ["watches", "watchs", "watchies", "watch"], "sol": "watch 字尾是 ch，複數要加 es：watches。", "w": ["字尾是 ch 要加 es，不是只加 s。", "字尾沒有 y，不用改 ies。", "These are 後面要用複數。"], "parent": "s、x、ch、sh 結尾，加 es。", "ex": "These are my watches."}, {"id": "EN-L2-E103", "subj": "英語", "unit": "Lesson 2", "point": "子音＋y 改 ies", "diff": "簡單", "type": "拼字", "q": "baby 的複數是：", "o": ["babies", "babys", "babyes", "baby"], "sol": "baby 字尾是「子音 b＋y」，要把 y 改成 i 再加 es：babies。", "w": ["子音＋y 結尾，不能直接加 s。", "要先把 y 改成 i，再加 es。", "複數不能和單數一樣。"], "parent": "y 前面是子音，就把 y 變 i 加 es。", "ex": "The babies are cute."}, {"id": "EN-L2-E104", "subj": "英語", "unit": "Lesson 2", "point": "母音＋y 直接加 s", "diff": "簡單", "type": "拼字", "q": "boy 的複數是：", "o": ["boys", "boies", "boyes", "boy"], "sol": "boy 的 y 前面是母音 o，直接加 s：boys。", "w": ["y 前面是母音時，不改 ies。", "y 前面是母音，直接加 s 就好。", "複數不能和單數一樣。"], "parent": "看 y 前面一個字母：是母音（a、e、i、o、u）就直接加 s。", "ex": "They are boys."}, {"id": "EN-L2-E105", "subj": "英語", "unit": "Lesson 2", "point": "this 近處單數", "diff": "簡單", "type": "選擇填空", "q": "（Amy 拿著手上的一支筆）\n________ is my pen.", "o": ["This", "These", "Those", "They"], "sol": "近處、一個東西，用 This，配 is。", "w": ["These 是複數，配 are。", "Those 是遠處的複數。", "They 是複數的「它們」，配 are。"], "parent": "近的一個用 this，遠的一個用 that。", "ex": "This is my pen. That is your pen."}, {"id": "EN-L2-E106", "subj": "英語", "unit": "Lesson 2", "point": "that 遠處單數", "diff": "簡單", "type": "選擇填空", "q": "（Ben 指著遠處樹上的一隻鳥）\n________ is a bird.", "o": ["That", "This", "Those", "These"], "sol": "遠處、一隻鳥，用 That，配 is。", "w": ["This 是近處的。", "Those 是遠處的「那些」，是複數。", "These 是近處的「這些」，是複數。"], "parent": "遠的一個 → that；遠的很多個 → those。", "ex": "That is a bird. Those are birds."}, {"id": "EN-L2-E107", "subj": "英語", "unit": "Lesson 2", "point": "回答 What is this?", "diff": "簡單", "type": "問答配對", "q": "— What is this?\n— ________",
