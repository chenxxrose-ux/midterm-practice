<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樂樂的段考模擬練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one question per screen, 2x2 answer grid in landscape, explanation panel below; tuned for a phone mirrored to a TV. Single light theme on purpose for TV legibility. */
:root{
  color-scheme: light;
  --paper:#F5F7FA; --card:#FFFFFF; --ink:#13233A; --muted:#55667B; --line:#CBD5E1;
  --accent:#1F5FAD; --accent-ink:#FFFFFF; --panel:#EAF0F7;
  --ok:#14703F; --okbg:#DFF3E7; --bad:#B42318; --badbg:#FCE6E3;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);margin:0;-webkit-text-size-adjust:100%}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:clamp(12px,2.2vw,28px);display:flex;flex-direction:column;gap:clamp(12px,1.8vw,22px)}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}

/* menu */
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
.brand h1{margin:0;font-weight:900;font-size:clamp(26px,4.2vw,54px);letter-spacing:.02em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:clamp(14px,1.8vw,22px)}
.subjects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.6vw,18px)}
@media (max-width:560px){.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}}
.subj{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:clamp(12px,1.8vw,22px);display:flex;align-items:center;gap:clamp(10px,1.4vw,16px);text-align:left;color:var(--ink);min-width:0}
.subj:hover{border-color:var(--accent)}
.seal{flex:none;width:clamp(44px,5.4vw,70px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:clamp(22px,2.8vw,36px);color:#fff;background:var(--c)}
.subj b{display:block;font-size:clamp(20px,2.6vw,34px);font-weight:700}
.subj small{display:block;color:var(--muted);font-size:clamp(13px,1.4vw,18px);margin-top:2px}
.subj.mix{background:var(--ink);border-color:var(--ink);color:#fff}
.subj.mix small{color:#C9D5E6}
.subj.mix .seal{background:#fff;color:var(--ink)}
.tips{color:var(--muted);font-size:clamp(13px,1.5vw,19px);margin:0;line-height:1.6}

/* quiz header */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .where{font-weight:700;font-size:clamp(16px,2vw,26px);font-variant-numeric:tabular-nums}
.bar .score{margin-left:auto;font-weight:700;font-size:clamp(16px,2vw,26px);color:var(--ok);font-variant-numeric:tabular-nums}
.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 14px;font-size:clamp(14px,1.6vw,20px)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

.q{margin:0;font-weight:700;font-size:clamp(21px,3.4vw,46px);line-height:1.45;text-wrap:pretty}
.tag{display:inline-block;font-size:.5em;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px;vertical-align:middle;margin-right:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,16px)}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:clamp(10px,1.2vw,16px);text-align:left;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:clamp(10px,1.4vw,18px) clamp(12px,1.6vw,20px);color:var(--ink);font-size:clamp(18px,2.8vw,38px);line-height:1.35;min-width:0}
.opt .k{flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-weight:900;font-size:.85em}
.opt span.t{min-width:0;overflow-wrap:anywhere}
.opt:not([disabled]):hover{border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}

.verdict{font-weight:900;font-size:clamp(22px,3vw,40px)}
.verdict.good{color:var(--ok)} .verdict.no{color:var(--bad)}
.ex{background:var(--panel);border-radius:14px;padding:clamp(12px,1.8vw,24px);display:grid;gap:clamp(6px,.9vw,12px);font-size:clamp(16px,2.2vw,30px);line-height:1.55}
.ex p{margin:0;display:grid;grid-template-columns:6.6em minmax(0,1fr);column-gap:.6em}
@media (max-width:520px){.ex p{grid-template-columns:1fr}}
.ex b{font-weight:700}
.ex .lb{font-weight:900}
.ex .r .lb{color:var(--ok)} .ex .w .lb{color:var(--bad)} .ex .e .lb{color:var(--accent)} .ex .m .lb{color:#8A5A00}
.ex .m{font-weight:700}
.next{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:clamp(12px,1.4vw,18px) clamp(22px,2.6vw,40px);font-size:clamp(18px,2.4vw,32px);font-weight:700}

/* result */
.big{font-size:clamp(40px,8vw,110px);font-weight:900;margin:0;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:.4em;color:var(--muted);font-weight:700}
.msg{margin:0;font-size:clamp(17px,2.4vw,30px)}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.acts button{border-radius:14px;padding:clamp(10px,1.3vw,16px) clamp(16px,2vw,28px);font-size:clamp(16px,2.1vw,28px);font-weight:700;border:3px solid var(--accent);background:var(--card);color:var(--accent)}
.acts button.pri{background:var(--accent);color:var(--accent-ink)}
.review{display:grid;gap:clamp(12px,1.6vw,20px)}
.rv{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:clamp(12px,1.6vw,22px);display:grid;gap:10px}
.rv .rq{font-weight:700;font-size:clamp(17px,2.4vw,32px);margin:0;line-height:1.45}
.rv .ans{font-size:clamp(15px,2vw,26px);margin:0}
.rv .ans .bad{color:var(--bad);font-weight:700} .rv .ans .ok{color:var(--ok);font-weight:700}
h2{margin:0;font-size:clamp(20px,2.8vw,36px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.note-top{margin:0;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.4vw,16px) clamp(12px,1.6vw,20px);font-size:clamp(14px,1.7vw,21px);line-height:1.6}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qmeta .tag{font-size:clamp(13px,1.6vw,20px);margin:0}
.dtag{font-size:clamp(13px,1.6vw,20px);font-weight:700;border-radius:99px;padding:1px 12px;border:2px solid}
.d-簡單{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.d-中等{color:var(--accent);border-color:var(--accent);background:#E6EEF9}
.d-困難{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.figwrap{max-width:100%;overflow-x:auto}
.figwrap table.fig{border-collapse:collapse;background:var(--card);font-size:clamp(16px,2.2vw,28px);font-variant-numeric:tabular-nums}
.figwrap table.fig caption{caption-side:top;text-align:left;color:var(--muted);font-size:.75em;padding-bottom:6px}
.figwrap table.fig th,.figwrap table.fig td{border:2px solid var(--line);padding:.35em .7em;text-align:center}
.figwrap table.fig th{background:var(--panel)}
.figwrap .passage,.figwrap .dialog{background:var(--card);border-left:6px solid var(--accent);border-radius:8px;padding:clamp(10px,1.4vw,18px) clamp(12px,1.6vw,22px);font-size:clamp(17px,2.4vw,32px);line-height:1.6}
.figwrap .dialog p,.figwrap .passage p{margin:.15em 0}
.figwrap svg.fig{display:block;width:min(100%,640px);height:auto;background:var(--card);border-radius:10px}
.q{white-space:pre-line}
.after{display:flex;flex-direction:column;gap:clamp(10px,1.4vw,16px)}
.ex .r span b{display:inline}
details.more{border-top:1px dashed var(--line);padding-top:.4em}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:.9em}
details.more p{margin-top:.4em}
.rv .figwrap{font-size:.9em}
.pglist{display:grid;gap:clamp(8px,1.2vw,14px)}
.pg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"s t l" "s d d";align-items:center;gap:4px clamp(10px,1.4vw,16px);text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:clamp(10px,1.4vw,18px);color:var(--ink);font-size:clamp(15px,1.8vw,22px)}
.pg .seal{grid-area:s}.pg .pgt{grid-area:t;min-width:0}.pg .lv{grid-area:l}.pg .dl{grid-area:d;color:var(--muted);font-size:.85em}
.pg b{display:block;font-size:1.2em}.pg small{color:var(--muted)}
.lv{font-weight:700;border-radius:99px;padding:2px 12px;border:2px solid;white-space:nowrap;font-size:clamp(13px,1.5vw,19px)}
.lv0{color:var(--muted);border-color:var(--line)}.lv1{color:var(--bad);border-color:var(--bad);background:var(--badbg)}.lv2{color:#8A5A00;border-color:#C99A2E;background:#FBF3E2}.lv3{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.units{display:grid;gap:10px}
.ur{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:clamp(14px,1.7vw,20px)}
@media (max-width:560px){.ur{grid-template-columns:1fr auto}.ur .ubar{grid-column:1/-1;order:3}}
.un small{display:block;color:var(--muted);font-size:.8em}
.ubar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.ubar i{display:block;height:100%;background:var(--accent)}
.trend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:clamp(16px,2vw,26px)}
.trend span{display:grid;justify-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 14px}
.trend small{color:var(--muted);font-size:.6em}.trend em{color:var(--muted);font-style:normal}
.memo{display:grid;gap:10px}
.mi{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--bad);border-radius:12px;padding:10px 14px;font-size:clamp(15px,1.9vw,24px);line-height:1.55}
.mi p{margin:.2em 0}.mi .mp{font-weight:700}.mi .ma{color:var(--ok);font-weight:700}
.mi .tag{font-size:.7em}
.cmp{font-weight:700;color:var(--accent)}
.figwrap svg.fig{max-height:46vh}
</style>

<script>
const BANK = [{"id": "MA-1-1-E001", "subj": "數學", "unit": "1-1 負數與數線", "point": "負數比大小", "diff": "簡單", "type": "觀念辨識", "q": "下列四個數中，哪一個最小？", "o": ["−7", "−2", "0", "5"], "sol": "在數線上，越左邊的數越小。四個數由左到右是 −7、−2、0、5，所以 −7 最小。", "w": ["−2 在 −7 的右邊，所以 −2＞−7。兩個負數比較時，負號後面的數字越大，這個數反而越小。", "0 比任何負數都大。", "5 是正數，比 0 和負數都大。"], "parent": "把 0 想成大樓一樓，−7 是地下七樓，−2 是地下二樓。地下七樓比地下二樓低，所以 −7 比較小。"}, {"id": "MA-1-1-E002", "subj": "數學", "unit": "1-1 負數與數線", "point": "絕對值的計算", "diff": "簡單", "type": "計算", "q": "|−9|－|4| 的值是多少？", "o": ["5", "−13", "13", "−5"], "sol": "步驟一：先算絕對值，|−9|＝9，|4|＝4。步驟二：9－4＝5。", "w": ["把 |−9| 當成 −9 來算：−9－4＝−13。絕對值表示離 0 的距離，不會是負的。", "把減法看成加法：9＋4＝13。", "先算 −9＋4＝−5，忘了要先取絕對值。"], "parent": "絕對值就是「離 0 有多遠」，距離不會是負的。所以先把 |−9| 變成 9，再去減。"}, {"id": "MA-1-2-E003", "subj": "數學", "unit": "1-2 整數的加減", "point": "異號數相加", "diff": "簡單", "type": "計算", "q": "(−8)＋5 的值是多少？", "o": ["−3", "3", "−13", "13"], "sol": "一正一負相加：先看數字大小，8－5＝3；數字比較大的是 −8，所以答案取負號，得 −3。", "w": ["符號取錯了。數字比較大的是 −8，答案要跟著它取負號。", "一正一負應該相減，不是相加：−8 和 5 不是同號。", "一正一負應該相減，而且答案要跟著數字大的 −8 取負號。"], "parent": "你欠別人 8 元（−8），又拿到 5 元（＋5），還完以後還欠 3 元，也就是 −3。"}, {"id": "MA-1-4-E004", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "把小於 1 的數寫成科學記號", "diff": "簡單", "type": "計算", "q": "0.00056 用科學記號表示，正確的是哪一個？", "o": ["5.6×10⁻⁴", "5.6×10⁴", "56×10⁻⁵", "5.6×10⁻³"], "sol": "科學記號寫成 a×10ⁿ，1≦a＜10。0.00056 的小數點往右移 4 格變成 5.6；原本的數小於 1，所以次方是負的：5.6×10⁻⁴。驗算：5.6÷10000＝0.00056。", "w": ["5.6×10⁴＝56000，是很大的數，但 0.00056 小於 1。", "56 不在 1 到 10 之間，不符合科學記號的寫法（雖然數值相等）。", "5.6×10⁻³＝0.0056，比題目多了 10 倍，小數點只移了 3 格。"], "parent": "科學記號是把很長的數字寫短。小於 1 的數，次方是負的；數一數小數點要移幾格，就是負幾次方。"}, {"id": "MA-1-4-M002", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "負數的乘方與括號", "diff": "中等", "type": "比較判斷", "q": "(−3)² 和 −3² 的值分別是多少？", "o": ["9 和 −9", "−9 和 9", "9 和 9", "−6 和 −6"], "sol": "(−3)² 是 −3 自己乘兩次：(−3)×(−3)＝9。−3² 沒有括號，表示「3² 的相反數」：先算 3²＝9，再取負號，得 −9。", "w": ["剛好弄反了：有括號的 (−3)² 是兩個負數相乘，答案是 9。", "−3² 的負號不在括號裡，不會一起乘，答案是 −9。", "把乘方當成乘以 2：−3×2＝−6；乘方是「自己乘自己」。"], "parent": "括號像便當盒，負號裝在盒子裡，就要跟著一起乘。負號在盒子外面，就等算完再補上去。"}, {"id": "MA-1-3-M003", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "乘除混合由左到右", "diff": "中等", "type": "計算", "q": "36÷(−3)×(−2) 的值是多少？", "o": ["24", "6", "−24", "−6"], "sol": "只有乘和除時，由左到右計算。步驟一：36÷(−3)＝−12。步驟二：(−12)×(−2)＝24。", "w": ["先算了右邊的 (−3)×(−2)＝6，再算 36÷6。只有乘除時要由左到右，整數除法也不能任意改變計算順序。", "正負號錯了：除以一個負數、又乘以一個負數，共兩個負數，答案是正的。", "先算右邊、又弄錯正負號，順序和符號都錯了。"], "parent": "乘和除一起出現時，像排隊買飲料，排前面的先買，所以從左邊先算。"}, {"id": "MA-1-2-M005", "subj": "數學", "unit": "1-2 整數的加減", "point": "表格資料與溫差計算", "diff": "中等", "type": "資料判讀＋計算", "q": "根據上表，哪一個地區當天的溫差（最高氣溫－最低氣溫）最大？", "o": ["乙", "丙", "甲", "丁"], "sol": "逐一計算溫差：甲 5－(−3)＝8；乙 2－(−7)＝9；丙 −1－(−9)＝8；丁 6－0＝6。最大的是乙，9°C。", "w": ["丙的最低溫最低，但溫差是 −1－(−9)＝8，沒有乙大。", "甲的溫差是 5－(−3)＝8，比乙的 9 小。", "丁的最高溫最高，但溫差只有 6－0＝6。"], "parent": "溫差是「最高減最低」，不能只看哪裡最冷或最熱。四個地區都算一次，再比大小。", "fig": "<table class=\"fig\"><caption>某日四個地區的氣溫（單位：°C，自編資料）</caption><tr><th>地區</th><th>甲</th><th>乙</th><th>丙</th><th>丁</th></tr><tr><th>最高氣溫</th><td>5</td><td>2</td><td>−1</td><td>6</td></tr><tr><th>最低氣溫</th><td>−3</td><td>−7</td><td>−9</td><td>0</td></tr></table>"}, {"id": "MA-1-3-M006", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "含乘方的四則運算", "diff": "中等", "type": "多步計算", "q": "−2²×3－(−18)÷(−3)² 的值是多少？", "o": ["−10", "14", "−14", "10"], "sol": "步驟一：先算乘方，−2²＝−4（負號在括號外），(−3)²＝9。步驟二：乘除，(−4)×3＝−12，(−18)÷9＝−2。步驟三：加減，−12－(−2)＝−12＋2＝−10。", "w": ["把 −2² 算成 4：沒有括號時，負號不跟著一起乘方。算成 4×3－(−2)＝14。", "把 (−3)² 算成 −9：(−3)×(−3) 是正的。算成 −12－2＝−14。", "最後一步的正負號弄反了：−12＋2＝−10，不是 10。"], "parent": "先乘方、再乘除、最後加減，一步一步寫下來。最容易錯的是 −2² 和 (−3)²，先把這兩個算對。"}, {"id": "MA-1-4-H002", "subj": "數學", "unit": "1-4 指數記法與科學記號", "point": "(−1) 的乘方與規律", "diff": "困難", "type": "規律推理", "q": "(−1)¹＋(−1)²＋(−1)³＋…＋(−1)⁹⁹ 的值是多少？", "o": ["−1", "0", "1", "−99"], "sol": "(−1) 的奇數次方是 −1，偶數次方是 1。第 1 項到第 98 項，每兩項 (−1)＋1＝0，共 49 組，加起來是 0。最後剩第 99 項 (−1)⁹⁹＝−1，所以總和是 −1。", "w": ["以為剛好兩兩抵銷，但總共有 99 項，最後一項 (−1)⁹⁹ 沒有配對。", "最後一項是奇數次方，(−1)⁹⁹＝−1，不是 1。", "以為每一項都是 −1；其實偶數次方如 (−1)²＝1。"], "parent": "(−1) 乘偶數次是 1，乘奇數次是 −1。−1 和 1 兩個一組會抵銷，看最後多出哪一個就好。"}, {"id": "MA-1-1-H003", "subj": "數學", "unit": "1-1 負數與數線", "point": "絕對值的兩種可能與條件篩選", "diff": "困難", "type": "分類推理", "q": "已知 |a|＝5，|b|＝3，而且 a＜b。a＋b 的值可能是多少？", "o": ["−2 或 −8", "2 或 8", "只有 −2", "只有 8"], "sol": "|a|＝5，a 是 5 或 −5；|b|＝3，b 是 3 或 −3。四種組合中，a＝5 時 b 不論是 3 或 −3 都比 5 小，不合；a＝−5 時 b＝3 或 −3 都比 −5 大，都合。a＋b＝−5＋3＝−2，或 −5＋(−3)＝−8。", "w": ["沒有用到 a＜b 的條件：a＝5 時，b 不可能比 a 大。", "b 也可能是 −3（−5＜−3），a＋b 還可能是 −8。", "符合條件的 a 只有 −5，所以 a＋b 不可能是正的 8。"], "parent": "絕對值是 5 的數有兩個：5 和 −5。先把可能的數都列出來，再用「a 比 b 小」把不合的刪掉。"}, {"id": "MA-1-3-H005", "subj": "數學", "unit": "1-3 整數的乘除與四則運算", "point": "由乘積正負推論各數的正負", "diff": "困難", "type": "符號推理", "q": "a、b、c 都是不為 0 的整數。已知 a＞0，a×b＜0，b×c＞0。下列哪一個敘述一定正確？", "o": ["a×c＜0", "a×b×c＜0", "b＋c＞0", "a＋b＞0"], "sol": "步驟一：a＞0 且 a×b＜0（異號相乘為負），所以 b＜0。步驟二：b×c＞0（同號相乘為正），b＜0，所以 c＜0。步驟三：a 正、c 負，a×c＜0，一定正確。", "w": ["a×b×c＝a×(b×c)，正數乘以正數是正的，所以 a×b×c＞0。", "b 和 c 都是負數，相加還是負數，b＋c＜0。", "不一定。例如 a＝1、b＝−5，a＋b＝−4＜0；只知道 a 正、b 負，無法確定和的正負。"], "parent": "先用「同號相乘為正、異號相乘為負」把每個字母是正是負找出來，再一個一個檢查選項。"}, {"id": "MA-1-2-H006", "subj": "數學", "unit": "1-2 整數的加減（數線上的距離與中點）", "point": "用條件篩選點的位置，再求中點坐標", "diff": "困難", "type": "條件推理", "q": "數線上，A 點的坐標是 −3。B 點和 A 點的距離是 8，而且 B 點在原點的右側。C 點是 AB 的中點，C 點的坐標是多少？", "o": ["1", "−7", "4", "5"], "sol": "步驟一：和 A（−3）距離 8 的點有兩個：−3＋8＝5，或 −3－8＝−11。步驟二：B 在原點右側，坐標要大於 0，所以 B＝5。步驟三：中點坐標＝(−3＋5)÷2＝1。", "w": ["把 B 當成 −11：(−3＋(−11))÷2＝−7。−11 在原點左側，不符合條件。", "只算了距離的一半 8÷2＝4，忘了要從 A 點出發：中點是 −3＋4＝1。", "5 是 B 點的坐標，題目問的是中點 C。"], "parent": "先把「離 A 有 8 格」的兩個位置都找出來，再用「在原點右邊」刪掉一個。最後中點就是兩點坐標相加除以 2。"}, {"id": "SC-0-E001", "subj": "自然", "unit": "緒論 科學方法", "point": "操縱變因", "diff": "簡單", "type": "觀念辨識", "q": "小明想研究「水溫高低對方糖溶解快慢的影響」。這個實驗的操縱變因是什麼？", "o": ["水的溫度", "方糖完全溶解所需的時間", "杯子裡的水量", "方糖的大小"], "sol": "操縱變因是實驗中刻意改變的條件。這個實驗刻意改變的是水的溫度。", "w": ["溶解所需的時間是最後測量的結果，叫應變變因。", "水量要保持相同，是控制變因。", "方糖大小要保持相同，是控制變因。"], "parent": "想知道螢幕亮度會不會讓手機比較耗電，就只改亮度，其他設定都不動。你改的那一樣，就是操縱變因。"}, {"id": "SC-1-1-E002", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "總放大倍率", "diff": "簡單", "type": "計算", "q": "使用複式顯微鏡時，目鏡是 10×，物鏡是 40×，總放大倍率是多少倍？", "o": ["400 倍", "50 倍", "30 倍", "4 倍"], "sol": "總放大倍率＝目鏡倍率×物鏡倍率＝10×40＝400 倍。", "w": ["10＋40＝50，總放大倍率要用乘的，不是加。", "40－10＝30，總放大倍率要用乘的。", "40÷10＝4，總放大倍率要用乘的。"], "parent": "先放大 10 倍，再放大 40 倍，總共就放大了 400 倍。兩個鏡頭的倍數要相乘。"}, {"id": "SC-1-2-E003", "subj": "自然", "unit": "1-2 細胞", "point": "葉綠體的功能", "diff": "簡單", "type": "觀念辨識", "q": "植物細胞中，可以進行光合作用、製造養分的構造是哪一個？", "o": ["葉綠體", "粒線體", "細胞核", "液泡"], "sol": "葉綠體可以利用光進行光合作用，製造養分。", "w": ["粒線體進行呼吸作用，分解養分釋放能量，不是製造養分。", "細胞核含有遺傳物質，控制細胞的生命活動。", "液泡主要儲存水分和其他物質。"], "parent": "葉綠體像細胞裡的太陽能廚房，用陽光做出養分；粒線體像發電廠，負責把養分變成能量。"}, {"id": "SC-2-1-E004", "subj": "自然", "unit": "2-1 食物中的養分", "point": "碘液檢驗澱粉", "diff": "簡單", "type": "觀念辨識", "q": "在饅頭上滴碘液，饅頭變成藍黑色。這表示饅頭含有什麼？", "o": ["澱粉", "葡萄糖", "蛋白質", "脂質"], "sol": "碘液遇到澱粉會變成藍黑色，所以饅頭含有澱粉。", "w": ["檢驗葡萄糖要用本氏液並隔水加熱，碘液變藍黑色不能說明有葡萄糖。", "碘液變藍黑色是澱粉的反應，不是蛋白質。", "碘液變藍黑色是澱粉的反應，不是脂質。"], "parent": "碘液像專門找澱粉的警報器，一碰到澱粉就變藍黑色。饅頭、白飯、馬鈴薯都會讓它變色。"}, {"id": "SC-1-1-M001", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "影像上下左右顛倒與移動玻片", "diff": "中等", "type": "觀念整合", "q": "把寫有「p」的玻片正放在複式顯微鏡下觀察。看到的影像是什麼？若影像在視野的右上方，要把它移到中央，玻片應往哪個方向移動？", "o": ["看到「d」；玻片往右上方移", "看到「d」；玻片往左下方移", "看到「q」；玻片往右上方移", "看到「p」；玻片往左下方移"], "sol": "複式顯微鏡的影像上下、左右都顛倒，等於把字轉 180 度，「p」轉 180 度後是「d」。影像移動的方向和玻片相反：玻片往右上方移，影像會往左下方移，回到中央。", "w": ["影像會和玻片反方向移動：玻片往左下移，影像會往右上跑，離中央更遠。", "「q」是 p 只左右翻轉的樣子；複式顯微鏡是上下、左右都顛倒（轉 180 度），所以是「d」。", "複式顯微鏡的影像上下左右顛倒，不會和原本一樣是「p」。"], "parent": "把課本轉半圈來看，就是複式顯微鏡裡的樣子。影像在哪一邊，玻片就往哪一邊推。"}, {"id": "SC-1-3-M003", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "滲透作用與溶液濃度", "diff": "中等", "type": "比較判斷", "q": "把兩根一樣新鮮的蘿蔔條，分別放入清水和濃鹽水中 30 分鐘。下列推測何者最合理？", "o": ["清水中的蘿蔔條變得更硬挺，濃鹽水中的蘿蔔條變軟", "兩根蘿蔔條都變軟", "清水中的蘿蔔條變軟，濃鹽水中的蘿蔔條變得更硬挺", "兩根蘿蔔條都不會改變"], "sol": "滲透作用中，水會從溶液較淡的一側，移到溶液較濃的一側。清水比蘿蔔細胞內淡，水進入細胞，蘿蔔條變得更硬挺；濃鹽水比細胞內濃，細胞裡的水移到外面，蘿蔔條變軟。", "w": ["在清水中，水會進入蘿蔔細胞，蘿蔔條不會變軟。", "方向剛好相反：失水變軟的是放在濃鹽水中的蘿蔔條。", "細胞內外的濃度不同，水會移動，蘿蔔條會有變化。"], "parent": "醃小黃瓜時撒鹽，小黃瓜會出水變軟；有點軟的青菜泡清水，又會吸水變挺。水往比較濃的那一邊跑。"}, {"id": "SC-1-4-M004", "subj": "自然", "unit": "1-4 從細胞到個體", "point": "動物體的組成層次", "diff": "中等", "type": "排序判斷", "q": "下列哪一組，是依照「由小到大」的組成層次排列？", "o": ["肌肉細胞→肌肉組織→胃→消化系統", "肌肉組織→肌肉細胞→胃→消化系統", "肌肉細胞→胃→肌肉組織→消化系統", "消化系統→胃→肌肉組織→肌肉細胞"], "sol": "動物體由小到大是：細胞→組織→器官→器官系統→個體。肌肉細胞是細胞，肌肉組織是組織，胃是器官，消化系統是器官系統。", "w": ["組織是由許多細胞組成的，細胞要排在組織前面。", "胃（器官）是由肌肉組織等多種組織組成的，組織要排在器官前面。", "這是由大到小的順序，題目問由小到大。"], "parent": "像蓋房子：磚塊（細胞）砌成牆（組織），牆圍成房間（器官），房間組成一層樓（器官系統）。"}, {"id": "SC-1-2-M005", "subj": "自然", "unit": "1-2 細胞", "point": "由觀察結果判斷細胞來源", "diff": "中等", "type": "線索刪去", "q": "某同學用複式顯微鏡觀察一種細胞，看到細胞壁和細胞核，但沒有看到葉綠體。下列四個選項中，這種細胞最可能是哪一種？", "o": ["洋蔥鱗葉的表皮細胞", "菠菜的葉肉細胞", "人的口腔皮膜細胞", "青蛙的紅血球"], "sol": "本題只在四個選項中比較。人的口腔皮膜細胞、青蛙的紅血球是動物細胞，沒有細胞壁，先刪去。剩下兩個植物細胞：菠菜葉肉細胞含有許多葉綠體，和「沒有看到葉綠體」不符；洋蔥鱗葉的表皮細胞有細胞壁和細胞核，觀察時看不到葉綠體，兩個線索都符合。", "w": ["菠菜的葉肉細胞含有許多葉綠體，和觀察結果不符。", "人的口腔皮膜細胞是動物細胞，沒有細胞壁。", "青蛙的紅血球是動物細胞，沒有細胞壁。"], "parent": "把兩個線索一個一個拿去比對四個選項：有沒有細胞壁、有沒有葉綠體。四個選項裡，兩個線索都符合的只有洋蔥鱗葉表皮。"}, {"id": "SC-2-2-H001", "subj": "自然", "unit": "2-2 酵素", "point": "溫度對酵素作用的影響（實驗資料判讀）", "diff": "困難", "type": "資料推論", "q": "根據上表，下列推論何者最合理？", "o": ["在這四個溫度中，37°C 時唾液分解澱粉的效果最好", "溫度越高，唾液分解澱粉的效果越好", "0°C 的試管中，唾液已經被永久破壞", "滴碘液後變藍黑色，代表澱粉已經被分解完"], "sol": "碘液遇澱粉變藍黑色，顏色越不藍，表示剩下的澱粉越少。乙（37°C）滴碘液後不變藍黑，表示澱粉幾乎被分解完，所以在這四個溫度中，37°C 效果最好。", "w": ["100°C 的丁仍是藍黑色，表示澱粉沒有被分解；60°C 也比 37°C 差，所以不是溫度越高越好。", "表格只能看出 0°C 放置 10 分鐘時澱粉沒有被分解，看不出唾液是不是被永久破壞。", "藍黑色代表「還有澱粉」，表示澱粉沒有被分解完。"], "parent": "碘液變藍黑，表示澱粉還在；不變色，表示澱粉被唾液分解掉了。哪一管最不藍，那個溫度的唾液效果就最好。", "fig": "<table class=\"fig\"><caption>四支試管都加入等量的澱粉液和唾液，在不同溫度放置 10 分鐘後，滴入碘液（自編資料）</caption><tr><th>試管</th><th>甲</th><th>乙</th><th>丙</th><th>丁</th></tr><tr><th>溫度</th><td>0°C</td><td>37°C</td><td>60°C</td><td>100°C</td></tr><tr><th>滴碘液後的顏色</th><td>藍黑色</td><td>不變藍黑（碘液原色）</td><td>淺藍色</td><td>藍黑色</td></tr></table>"}, {"id": "SC-0-H005", "subj": "自然", "unit": "緒論 科學方法", "point": "變因控制：選出可以比較的兩組", "diff": "困難", "type": "實驗設計推理", "q": "若要研究「照光時間」的影響，以及「澆水量」的影響，應該分別比較哪兩組？", "o": ["照光：甲和乙；澆水：甲和丙", "照光：乙和丙；澆水：甲和丙", "照光：甲和乙；澆水：乙和丙", "照光：甲和丙；澆水：甲和乙"], "sol": "比較的兩組之間，只能有要研究的那一個條件不同。甲、乙澆水量都是 50 mL，只有照光時間不同，可以研究照光。甲、丙照光都是 8 小時，只有澆水量不同，可以研究澆水。", "w": ["乙和丙的照光時間和澆水量都不同，結果有差異時，無法判斷是哪一個條件造成的。", "乙和丙同時有兩個條件不同，不能用來研究澆水量。", "剛好弄反：甲和丙只有澆水量不同，甲和乙只有照光時間不同。"], "parent": "比較兩組時，先數有幾個條件不一樣。只差一個條件，才能說結果的差別是那個條件造成的。", "fig": "<table class=\"fig\"><caption>綠豆芽實驗設計（每組都種 10 顆同品種綠豆，放在同一個房間）</caption><tr><th>組別</th><th>甲</th><th>乙</th><th>丙</th></tr><tr><th>每天照光</th><td>8 小時</td><td>4 小時</td><td>8 小時</td></tr><tr><th>每天澆水</th><td>50 mL</td><td>50 mL</td><td>100 mL</td></tr></table>"}, {"id": "SC-1-1-H003", "subj": "自然", "unit": "1-1 生命現象（複式顯微鏡）", "point": "倍率改變後細胞數目的推算", "diff": "困難", "type": "多步計算", "q": "用複式顯微鏡觀察，目鏡 10×、物鏡 10× 時，視野直徑上排成一列的細胞有 16 個。目鏡不變，把物鏡換成 40×，視野直徑上大約可以看到幾個細胞？", "o": ["4 個", "1 個", "64 個", "16 個"], "sol": "步驟一：原本總倍率 10×10＝100 倍，換成 10×40＝400 倍，變成原來的 4 倍。步驟二：放大 4 倍時，視野直徑能容納的細胞數變成原來的 1/4：16÷4＝4 個。", "w": ["16÷16＝1 是「細胞佈滿整個視野」時的算法（除以倍數的平方）；題目是排成一列，只要除以 4。", "倍率變大，看到的細胞會變少，不會變多。", "倍率變成 4 倍，看到的細胞數會變少，不會維持 16 個。"], "parent": "照片放大 4 倍，一排原本看到 16 個人，現在只看得到 4 個。注意題目是「排成一列」，只要除一次。"}, {"id": "SC-1-3-H006", "subj": "自然", "unit": "1-3 細胞所需的物質", "point": "由質量變化推論溶液濃度", "diff": "困難", "type": "資料推論", "q": "根據上表，三杯糖水的濃度由低到高排列，何者最合理？", "o": ["甲→乙→丙", "丙→乙→甲", "乙→甲→丙", "甲→丙→乙"], "sol": "變重表示水進入馬鈴薯細胞，外面的糖水比細胞內淡；變輕表示細胞內的水移到外面，外面比細胞內濃。甲增加 0.8 g，最淡；乙減少 0.2 g，比細胞內稍濃；丙減少 1.0 g，失水最多，最濃。由低到高：甲→乙→丙。", "w": ["方向弄反了：變重代表吸水，表示外面的糖水比較淡，不是比較濃。", "乙的變化量最小，只表示乙最接近細胞內的濃度；乙變輕，表示乙比細胞內濃，所以比甲濃。", "丙失水最多，在三杯中最濃，不會比乙淡。"], "parent": "馬鈴薯條像海綿：放進比較淡的水會吸水變重，放進比較濃的水會出水變輕。其他條件都一樣時，出水越多，代表外面越濃。", "fig": "<table class=\"fig\"><caption>三條相同的馬鈴薯條（原本各 10.0 g），分別泡在三杯不同濃度的糖水中 30 分鐘後的質量（自編資料）</caption><tr><th>糖水</th><th>甲</th><th>乙</th><th>丙</th></tr><tr><th>30 分鐘後的質量</th><td>10.8 g</td><td>9.8 g</td><td>9.0 g</td></tr></table>"}, {"id": "EN-L1-E001", "subj": "英語", "unit": "Lesson 1", "point": "複數主詞配 are", "diff": "簡單", "type": "文法填空", "q": "My parents ___ teachers.", "o": ["are", "is", "am", "be"], "sol": "my parents（我的父母）是兩個人，是複數主詞，be 動詞用 are。", "w": ["is 配單數主詞，例如 My father is a teacher.", "am 只配 I，例如 I am a student.", "be 是原形，放在這個句子裡要改成 am、is 或 are。"], "parent": "一個人用 is，兩個人以上用 are。爸爸媽媽是兩個人，所以用 are。", "ex": "My father is a teacher. ／ My parents are teachers."}, {"id": "EN-GR-E002", "subj": "英語", "unit": "Get Ready", "point": "所有格 his", "diff": "簡單", "type": "文法填空", "q": "___ name is Kevin.（提示：他的）", "o": ["His", "He", "Her", "Their"], "sol": "「他的」是 his，後面接名詞 name。", "w": ["He 是「他」（主格），不是「他的」，後面不能直接接名詞。", "Her 是「她的」，指女生。", "Their 是「他們的」，指兩個人以上。"], "parent": "his 就像貼在東西上的姓名貼，後面要跟著東西：his name、his bag。", "ex": "He is my brother. His name is Kevin."}, {"id": "EN-L2-E003", "subj": "英語", "unit": "Lesson 2", "point": "字尾 x 加 es", "diff": "簡單", "type": "文法填空", "q": "These are ___.（box）", "o": ["boxes", "boxs", "box", "box's"], "sol": "these 是複數，要用複數名詞。box 字尾是 x，複數要加 es：boxes。", "w": ["字尾是 x 的名詞，複數要加 es，例如 boxes，不能只加 s。", "these 是複數，後面要用複數名詞，不能用單數 box。", "加 's 是所有格（…的），不是複數。"], "parent": "很多字尾是 s、x、ch、sh 的名詞，複數加 es 才好念，例如 boxes、watches。box 就是其中之一。", "ex": "This is a box. ／ These are boxes."}, {"id": "EN-L1-E005", "subj": "英語", "unit": "Lesson 1", "point": "依答句選疑問詞 Who", "diff": "簡單", "type": "對話判斷", "q": "— ___ is that girl?\n— She is my sister.", "o": ["Who", "What", "How old", "Where"], "sol": "回答說「她是我的姊妹」，是在介紹這個人是誰，所以用 Who。", "w": ["What 問「是什麼」，通常問東西或動物，例如 What is this?", "How old 問「幾歲」，回答要有年齡，例如 She is twelve.", "Where 問「在哪裡」，回答要有地點。"], "parent": "先看回答在說什麼：介紹人是誰用 Who，說東西或動物用 What，說年紀用 How old。", "ex": "— Who is he? — He is my uncle. ／ — What is this? — It is a bird."}, {"id": "EN-L1-M001", "subj": "英語", "unit": "Lesson 1", "point": "否定簡答與代名詞", "diff": "中等", "type": "對話判斷", "q": "— Is your uncle a doctor?\n— ___（不是，他是老師。）", "o": ["No, he isn't. He is a teacher.", "No, he is. He is a teacher.", "No, she isn't. She is a teacher.", "Yes, he is. He is a teacher."], "sol": "uncle（叔叔、伯伯、舅舅等）是男性，要用 he。回答「不是」用否定簡答 No, he isn't.，再補充他是老師。", "w": ["No 後面要接否定的 isn't，不能接肯定的 is。", "uncle 是男性，要用 he，不是 she。", "題目提示「不是」，要用 No 回答。"], "parent": "回答時先想對方問的是男生還是女生，再決定用 he 或 she。說「不是」就用 No 加 isn't。", "ex": "— Is your aunt a nurse? — No, she isn't. She is a cook."}, {"id": "EN-L2-M005", "subj": "英語", "unit": "Lesson 2", "point": "these 與 their 的區分", "diff": "中等", "type": "克漏字", "q": "（Ann 抱著兩隻小狗）\nAnn: ___(1)___ are my dogs. ___(2)___ names are Lucky and Max.\n(1)、(2) 依序應填入什麼？", "o": ["These；Their", "This；Their", "These；They", "These；There"], "sol": "(1) 兩隻狗在身邊，是近處的複數，用 These，配 are。(2) 後面接名詞 names，要用所有格 Their（牠們的）。", "w": ["This 是單數，不能配 are 和兩隻狗。", "They 是「牠們」（主格），後面不能直接接名詞 names；要用 Their（牠們的）。", "There 是「那裡」，不是「牠們的」，雖然念起來和 Their 很像。"], "parent": "(1) 看數量：兩隻狗就用 these。(2) 看後面：後面有名詞，就要用「…的」，也就是 their。", "ex": "They are my friends. Their names are Tom and Amy."}, {"id": "EN-L1-H005", "subj": "英語", "unit": "Review 1", "point": "代名詞指涉（He、They）", "diff": "困難", "type": "閱讀推理", "q": "短文中的 He 和 They，分別指的是誰？", "o": ["He：Lily 的爸爸；They：Tim 和 Sam", "He：Tim；They：Lily 的爸爸和媽媽", "He：Lily 的爸爸；They：Lily 的爸爸和媽媽", "He：Sam；They：Lily 和她的兄弟"], "sol": "He 出現在 The tall man is my father. 後面，指前一句提到的男生：爸爸。They 出現在 The two boys are my brothers, Tim and Sam. 後面，指兩個男孩 Tim 和 Sam。", "w": ["He 的前一句說的是 father，Tim 要到後面才出現。They 緊接在兩個男孩後面，指 Tim 和 Sam。", "They 前一句說的是兩個男孩，不是爸爸媽媽。", "He 出現時，Sam 還沒有被提到；They 也不包含說話的 Lily（包含自己要用 we）。"], "parent": "看到 he、she、they，往前一句找「最近提到、而且人數和性別都對得上的人」。", "ex": "My father is a cook. He is tall. ／ Tim and Sam are my brothers. They are cute.", "fig": "<div class=\"fig passage\">Hi, I'm Lily. Look at this photo. The tall man is my father. He is a cook. The woman next to him is my mother. She is a nurse. The two boys are my brothers, Tim and Sam. They are cute.</div>"}, {"id": "EN-GR-M007", "subj": "英語", "unit": "Get Ready", "point": "Ken and I → We／Our", "diff": "中等", "type": "克漏字", "q": "Ken and I are classmates. ___(1)___ are thirteen. ___(2)___ teacher is Ms. Chen.\n(1)、(2) 依序應填入什麼？", "o": ["We；Our", "They；Their", "We；We", "Our；We"], "sol": "(1) Ken and I 包含說話的「我」，合起來是「我們」，當主詞用 We。(2) 後面接名詞 teacher，要用所有格 Our（我們的）。", "w": ["Ken and I 包含說話的「我」，要用 We（我們），不是 They（他們）。", "(2) 後面接名詞 teacher，要用所有格 Our；We 後面不能直接接名詞。", "剛好放反：句首當主詞用 We，名詞前面用 Our。"], "parent": "「我和誰」合起來就是「我們」。放在句子開頭當主角用 we，後面接東西用 our。", "ex": "Ken and I are friends. We are students. Our school is big."}, {"id": "EN-L2-M006", "subj": "英語", "unit": "Lesson 2", "point": "遠近、代名詞、複數拼字的綜合判斷", "diff": "中等", "type": "克漏字", "q": "（Amy 指著遠處的兩個盒子）\nAmy: What are ___(1)___?\nBen: ___(2)___ are ___(3)___.\n(1)、(2)、(3) 依序應填入什麼？", "o": ["those；They；boxes", "these；They；boxes", "those；It；boxes", "those；They；boxs"], "sol": "(1) 遠處的複數用 those。(2) 回答時，用複數代名詞 They 代替前面的 those。(3) 兩個盒子要用複數，box 的複數是 boxes。", "w": ["盒子在遠處，要用 those；these 是近處的複數。", "兩個盒子是複數，要用 They；It 只代替單數的東西。", "box 的複數要加 es，寫成 boxes，不能只加 s。"], "parent": "一格一格檢查：遠的用 those、近的用 these；很多個用 they；box 的複數是 boxes。", "ex": "— What are those? — They are boxes. ／ — What is this? — It is a box."}, {"id": "EN-L1-H009", "subj": "英語", "unit": "Lesson 1", "point": "由對話反推人物關係", "diff": "困難", "type": "對話推理", "q": "根據上面的對話，下列哪一個人是那位女士的兄弟？", "o": ["Ben 的爸爸", "Ben 的舅舅（媽媽的兄弟）", "Ben", "Amy 的爸爸"], "sol": "Ben 說 She's my dad's sister.（她是我爸爸的姊妹）。她是爸爸的姊妹，反過來說，Ben 的爸爸就是她的兄弟。", "w": ["Ben 回答 No, she isn't.，表示她不是媽媽的姊妹，所以和媽媽那一邊的親戚無關。", "Ben 叫她 aunt，Ben 是她的姪子，不是兄弟。", "對話沒有說 Amy 和這位女士有親戚關係。"], "parent": "先找出關係「她是爸爸的姊妹」，再反過來想：那爸爸就是她的兄弟。", "ex": "— Is he your mom's brother? — No, he isn't. He's my dad's brother.", "fig": "<div class=\"fig dialog\"><p><b>Amy:</b> Who's that woman?</p><p><b>Ben:</b> She's my aunt. She's a teacher.</p><p><b>Amy:</b> Is she your mom's sister?</p><p><b>Ben:</b> No, she isn't. She's my dad's sister.</p></div>"}, {"id": "EN-L1-H010", "subj": "英語", "unit": "Lesson 1", "point": "跨三段短文比對兩個條件", "diff": "困難", "type": "閱讀推理", "q": "根據上面三段自我介紹，誰的家人中有醫生，而且有姊妹？", "o": ["Mia", "Kim", "Leo", "Kim 和 Mia"], "sol": "Kim：爸爸是醫生，但只提到 brother（兄弟），沒有姊妹。Leo：有 sister，但爸爸是廚師，家人中沒有醫生。Mia：媽媽是醫生，也有 sister。兩個條件都符合的只有 Mia。", "w": ["Kim 的爸爸是醫生，但 Kim 提到的是 brother（兄弟），不是 sister。", "Leo 有姊妹，但他的爸爸是 cook（廚師），家人中沒有醫生。", "Kim 只符合「家人中有醫生」，沒有姊妹，不能算進去。"], "parent": "兩個條件要一個一個打勾：有醫生嗎？有姊妹嗎？兩個都打勾的人才是答案。", "ex": "My father is a doctor. ／ My sister is fifteen. She is a student.", "fig": "<div class=\"fig passage\"><p><b>Kim:</b> Hi, I'm Kim. My father is a doctor. My mother is a teacher. My brother is ten.</p><p><b>Leo:</b> I'm Leo. My father is a cook. My sister is fifteen. She is a student.</p><p><b>Mia:</b> I'm Mia. My mother is a doctor. My father is a nurse. My sister is tall.</p></div>"}, {"id": "EN-GR-H011", "subj": "英語", "unit": "Review 1", "point": "由敘述推理年齡", "diff": "困難", "type": "邏輯推理", "q": "根據上面的句子，Ben 幾歲？", "o": ["eleven", "twelve", "thirteen", "無法判斷"], "sol": "三個人分別是 11、12、13 歲。Amy 是 12 歲，剩下 11 和 13 給 Ben 和 Tom。Tom isn't eleven.（Tom 不是 11 歲），所以 Tom 是 13 歲，Ben 是 11 歲（eleven）。", "w": ["twelve（12 歲）是 Amy 的年齡。", "thirteen（13 歲）是 Tom 的年齡：Tom 不是 11 歲，只能是 13 歲。", "資訊足夠推出答案：Amy 12 歲、Tom 不是 11 歲，所以 Ben 11 歲。"], "parent": "像玩數獨：先填確定的（Amy 12 歲），再用「Tom 不是 11 歲」排除，剩下的就是 Ben。", "ex": "Amy is twelve. ／ Tom isn't eleven. He is thirteen.", "fig": "<div class=\"fig passage\">Amy, Ben and Tom are eleven, twelve and thirteen. Amy is twelve. Tom isn't eleven.</div>"}, {"id": "CH-L1-E005", "subj": "國文", "unit": "L1 夏夜", "point": "字音：巒", "diff": "簡單", "type": "字音辨識", "q": "〈夏夜〉詩句「朦朧地，山巒靜靜地睡了」中，「巒」的正確讀音是哪一個？", "o": ["ㄌㄨㄢˊ", "ㄌㄨㄢˋ", "ㄌㄧㄢˋ", "ㄇㄢˊ"], "sol": "「巒」讀ㄌㄨㄢˊ，指連綿的山峰，例如「山巒起伏」。", "w": ["聲調錯了：第四聲ㄌㄨㄢˋ是「亂」的讀音；「巒」是第二聲。", "ㄌㄧㄢˋ是「戀」的讀音。「巒」和「戀」上半部相同，讀音不同。", "ㄇㄢˊ是「蠻」的讀音。「巒」和「蠻」上半部相同，讀音不同。"], "parent": "巒、戀、蠻上半部長得一樣，讀音卻不同。山巒的「巒」下面是「山」，讀ㄌㄨㄢˊ，指一座座的山。"}, {"id": "CH-LS-E004", "subj": "國文", "unit": "L1～L3 作者與文體", "point": "課文與作者配對", "diff": "簡單", "type": "記憶辨識", "q": "下列課文與作者的配對，何者正確？", "o": ["〈吃冰的滋味〉—古蒙仁", "〈夏夜〉—杏林子", "〈生之歌選〉—楊喚", "〈吃冰的滋味〉—楊喚"], "sol": "〈夏夜〉的作者是楊喚，〈生之歌選〉的作者是杏林子，〈吃冰的滋味〉的作者是古蒙仁。", "w": ["〈夏夜〉的作者是楊喚；杏林子寫的是〈生之歌選〉。", "〈生之歌選〉的作者是杏林子；楊喚寫的是〈夏夜〉。", "〈吃冰的滋味〉的作者是古蒙仁；楊喚寫的是〈夏夜〉。"], "parent": "用一句話記：夏夜楊喚、生之歌杏林子、吃冰古蒙仁。"}, {"id": "CH-L2-E006", "subj": "國文", "unit": "L2 生之歌選", "point": "〈手的故事〉的主旨", "diff": "簡單", "type": "課文理解", "q": "〈手的故事〉中，作者認為生命可貴的地方在哪裡？", "o": ["良善的本質，願意為別人付出", "手的外表纖細美麗", "擁有靈巧的技術，能做精細的工作", "功成名就，受到眾人稱讚"], "sol": "作者寫自己因病變形的手，也寫杜瑞的朋友長年做粗活、雙手變得粗糙笨拙。作者要說明：生命可貴的是良善的本質，不在於外表的美醜。", "w": ["作者的手變形、杜瑞朋友的手變粗糙，作者正是要說明價值不在外表。", "杜瑞的朋友再也無法做精細的雕塑，文章仍然肯定他的手，可見重點不是技術。", "文章肯定的是朋友默默付出的手，不是成名的結果。"], "parent": "一雙手漂不漂亮不重要，重要的是用它做了什麼。願意幫助別人的手，就是美的手。"}, {"id": "CH-RH-E001", "subj": "國文", "unit": "修辭（L1～L3）", "point": "擬人（轉化）", "diff": "簡單", "type": "修辭辨識", "q": "下列哪一句使用了「擬人」的修辭？", "o": ["月亮躲進雲裡睡覺了。", "天上的星星像撒落的珍珠。", "夏夜好涼爽，好涼爽。", "蟬聲大得快把屋頂掀開了。"], "sol": "月亮不會躲、也不會睡覺，句子把月亮寫得像人一樣有動作，這是擬人，屬於轉化修辭。", "w": ["用「像」把星星比成珍珠，是譬喻。", "重複「好涼爽」，是類疊。", "蟬聲不可能掀開屋頂，故意說得很誇張，是誇飾。"], "parent": "擬人就是讓「不是人的東西」做人的事。月亮會睡覺、鬧鐘會大叫，都是擬人。"}, {"id": "CH-L1-M005", "subj": "國文", "unit": "L1 夏夜", "point": "以動襯靜（寫法遷移）", "diff": "中等", "type": "寫作手法遷移", "q": "〈夏夜〉在萬物都睡了以後，寫「只有綠色的小河還醒著，低聲地歌唱著」，用仍在活動的聲音襯托夜的寧靜。下列哪一段文字也使用了這種寫法？", "o": ["夜深了，全村都睡了，只有牆角的蟋蟀還在低聲唱歌。", "夜深了，全村都睡了，四周靜得沒有一點聲音。", "夜市裡人聲鼎沸，攤販的叫賣聲此起彼落。", "天亮了，公雞開始啼叫，村民紛紛下田工作。"], "sol": "這種寫法要同時有「靜」和「動」：先寫環境安靜，再寫其中仍在活動、發出聲音的事物，讓安靜更明顯。全村都睡了是靜，蟋蟀低聲唱歌是動。", "w": ["只寫了安靜，沒有仍在活動的事物來襯托。", "整段都在寫熱鬧，沒有安靜的環境。", "這是從夜晚到白天、由安靜轉為熱鬧的時間變化，不是用聲音襯托寧靜。"], "parent": "半夜全家都睡了，只聽到冰箱嗡嗡響，反而覺得家裡更安靜，這就是以動襯靜。"}, {"id": "CH-L2-M004", "subj": "國文", "unit": "L2 生之歌選", "point": "藉事說理的道理遷移", "diff": "中等", "type": "閱讀理解", "q": "上面這段自編短文，和〈一顆珍珠〉想說明的道理，哪一項最接近？", "o": ["痛苦和挫折，也能轉化成成長", "只要有天分，不必努力也能成功", "遇到困難時，最好先避開，等它自己消失", "生命的價值在於幫助別人、為別人付出"], "sol": "〈一顆珍珠〉寫一粒醜陋的沙礫，經過漫長的忍耐與辛酸，變成美麗的珍珠，說明通過苦難的試煉，能成就生命之美。短文中小芳跌倒受傷卻不放棄，終於學會騎車，道理相近。", "w": ["小芳是一再跌倒、不放棄才學會的，不是靠天分。", "小芳沒有避開困難，而是一次次面對它。", "「為別人付出」是〈手的故事〉的重點；這段短文寫的是小芳自己從挫折中成長，沒有寫幫助別人。"], "parent": "一粒醜醜的沙礫，經過長久的忍耐變成珍珠。小芳跌倒很痛，最後學會騎車，都是「困難變成長」。", "fig": "<div class=\"fig passage\">小芳學騎腳踏車時一再跌倒，膝蓋破了好幾次皮。她沒有放棄，一個星期後，終於能穩穩地騎上河堤。她想：「原來每一次跌倒，都讓我離成功更近一點。」</div>"}, {"id": "CH-ZY-M006", "subj": "國文", "unit": "字音字形（L1～L3）", "point": "形聲字不可「有邊讀邊」", "diff": "中等", "type": "字音辨識", "q": "下列「」中的字，哪一個讀音正確？", "o": ["沙「礫」：ㄌㄧˋ", "名聞「遐」邇：ㄒㄧㄚ", "「沁」涼：ㄒㄧㄣ", "垂「涎」：ㄧㄢˊ"], "sol": "「礫」讀ㄌㄧˋ，指小石子，〈一顆珍珠〉中的「沙礫」就是這個字。", "w": ["「遐」讀ㄒㄧㄚˊ（第二聲），意思是遠；不能念成第一聲的ㄒㄧㄚ。", "「沁」讀ㄑㄧㄣˋ；不能照「心」念成ㄒㄧㄣ。", "「涎」讀ㄒㄧㄢˊ，指口水；不能照「延」念成ㄧㄢˊ。"], "parent": "很多字不能「有邊讀邊」：沁涼不是「心」涼，垂涎不是垂「延」。遇到不確定的字，要查注音。"}, {"id": "CH-YT-M007", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "對話中冒號、問號、逗號的判斷", "diff": "中等", "type": "標點判斷", "q": "媽媽問我①「你的作業寫完了嗎②」我回答③「還沒寫完④因為我先去練琴了。」\n①②③④依序應填入哪一組標點？", "o": ["：　？　：　，", "，　？　：　，", "：　。　：　，", "：　？　：　；"], "sol": "① 和 ③ 後面都接說話的內容，用冒號。② 「你的作業寫完了嗎」是在問人，用問號，放在下引號之前。④ 「還沒寫完」和「因為我先去練琴了」是同一句話裡的停頓，用逗號。", "w": ["① 要引出媽媽說的話，應該用冒號，不是逗號。", "② 「…寫完了嗎」是在問人，要用問號，不是句號。", "④ 前後是同一句話裡的原因說明，用逗號；分號用來隔開並列的分句。"], "parent": "一格一格判斷：要說話了用冒號、在問人用問號、句子中間停一下用逗號。"}, {"id": "CH-L2-H005", "subj": "國文", "unit": "L2 生之歌選", "point": "〈一顆珍珠〉與〈手的故事〉的比較", "diff": "困難", "type": "跨篇比較", "q": "下列對〈生之歌選〉中〈一顆珍珠〉與〈手的故事〉的比較，何者正確？", "o": ["前者說明經過苦難的試煉能成就生命之美，後者說明生命可貴在良善的本質而不在外表", "前者強調外表的美最重要，後者強調要靠自己努力成功", "兩篇都只用作者自己的親身經歷作為例子", "〈手的故事〉認為手要靈巧才有價值，所以杜瑞朋友的手失去了價值"], "sol": "〈一顆珍珠〉以沙礫變成珍珠，以及路易斯．勃萊爾「因為一根針而失明，卻也因一根針而發明了盲人點字法」為例，說明通過苦難的試煉，能使生命發出光輝。〈手的故事〉寫作者自己變形的手，以及杜瑞朋友因長年粗活而粗糙的手，說明生命可貴的是良善的本質，不在於外表的美醜。", "w": ["兩篇都沒有主張外表最重要；〈手的故事〉正好說明價值不在外表。", "〈一顆珍珠〉舉了路易斯．勃萊爾，〈手的故事〉舉了杜瑞和他的朋友，不只用作者自己的經歷。", "杜瑞朋友的手變得粗糙笨拙，是因為他長年做粗活，文章肯定的正是這份付出。"], "parent": "兩篇一起看：珍珠講「苦難變成長」，手講「付出比外表重要」。再看每篇用了誰的例子。"}, {"id": "CH-L3-H003", "subj": "國文", "unit": "L3 吃冰的滋味", "point": "今昔對比的寫法與情感", "diff": "困難", "type": "閱讀理解", "q": "上面這段自編短文，和〈吃冰的滋味〉在寫法與情感上最相近的是哪一項？", "o": ["透過今昔對比，抒發對童年吃冰時單純滿足的懷念", "主張現代冰品全都比不上從前，應該恢復傳統做法", "強調以前的冰比較貴，所以小孩子不容易吃到", "讚美現代冰品種類多，比從前進步許多"], "sol": "短文把「小時候」和「現在」的冰拿來比較，最後說吃不出當年期待的滋味，表達對童年的懷念。〈吃冰的滋味〉也比較早年和現代的冰品，結尾寫每到夏天吃冰就想起往事，「像鄉愁般」別有一番古老的滋味，兩者相近。", "w": ["短文和課文都是抒發個人的感受與懷念，沒有主張所有現代冰品都比較差，也沒有要大家恢復傳統做法。", "「存好幾天零用錢」是用來表現當年吃冰很難得、很期待的細節，不是全文的重點。", "短文提到現代冰品種類多，但作者覺得少了當年的滋味，不是在讚美現代比較好。"], "parent": "先找文章在比什麼：以前和現在。再找作者的心情：他想念的是小時候吃冰的快樂，不是在比哪一碗冰比較好。", "fig": "<div class=\"fig passage\">小時候，巷口的冰店只有紅豆冰和綠豆冰，我總要存好幾天的零用錢，才吃得到一碗，捧著它一小口一小口慢慢吃。現在的冰店有芒果雪花冰、抹茶冰淇淋，配料多得數不清，我卻常常吃不出當年那種期待的滋味。</div>"}, {"id": "CH-YT-H006", "subj": "國文", "unit": "語文天地（一）標點符號", "point": "雙層引號與問號位置", "diff": "困難", "type": "標點綜合", "q": "下列哪一句的引號與標點使用完全正確？", "o": ["媽媽問我：「老師是不是說『明天要考國文』？」", "媽媽問我：『老師是不是說「明天要考國文」？』", "媽媽問我：「老師是不是說『明天要考國文？』」", "媽媽問我，「老師是不是說『明天要考國文』。」"], "sol": "① 引號先用「」，裡面再引用時改用『』。② 老師說的「明天要考國文」是一句陳述，不是問句；整句「老師是不是說……」才是媽媽的問話，所以問號放在』之後、」之前。③ 引出媽媽說的話用冒號。", "w": ["引號的層次弄反了：外層先用「」，內層才用『』。", "問號放錯位置：老師說的話不是問句，問號屬於媽媽的整句問話，要放在』的外面。", "引出說話內容要用冒號；而且媽媽是在發問，句末要用問號。"], "parent": "先分清楚誰在說話：外面一層是媽媽的話，用「」；裡面老師的話，用『』。問號跟著真正在問問題的人放。"}, {"id": "CH-L1-H007", "subj": "國文", "unit": "L1 夏夜", "point": "時間順序、擬人與以動襯靜的綜合分析", "diff": "困難", "type": "閱讀＋寫作手法", "q": "關於上面這段自編短文的分析，何者正確？", "o": ["依時間由黃昏寫到深夜，並在大家入睡後，用仍醒著、發出聲音的風鈴襯托寧靜", "「只有巷口的老風鈴還醒著」使用了譬喻", "全段只寫安靜的景物，沒有寫到聲音", "「路燈一盞一盞亮起來」表示時間由深夜轉為清晨"], "sol": "短文用「黃昏時」「天黑了」「夜深了」標出時間順序；深夜整條街都睡著了是靜，老風鈴還醒著、輕輕唱歌是動，用聲音襯托夜的寧靜，和〈夏夜〉「只有……還醒著」的寫法相近。", "w": ["風鈴不會「醒著」，這是把風鈴寫成人，屬於擬人；句中沒有把兩樣東西相比，不是譬喻。", "短文寫了麻雀吱吱喳喳、風鈴叮叮噹噹，有聲音。", "路燈亮起的前一句是「天黑了」，表示時間由白天進入夜晚，不是轉為清晨。"], "parent": "分析短文要一句一句找線索：時間詞看順序，「還醒著」看擬人，有沒有聲音看動靜。", "fig": "<div class=\"fig passage\">黃昏時，麻雀吱吱喳喳地飛回樹梢。天黑了，路燈一盞一盞亮起來。夜深了，整條街都睡著了，只有巷口的老風鈴還醒著，叮叮噹噹地輕輕唱歌。</div>"}, {"id": "HI-L1-E001", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "西元換算民國", "diff": "簡單", "type": "計算", "q": "西元 2026 年是民國幾年？", "o": ["115 年", "114 年", "116 年", "126 年"], "sol": "民國元年是西元 1912 年，所以西元－1911＝民國。2026－1911＝115，是民國 115 年。", "w": ["減成 1912 了：民國元年是 1912 年，要減的是 1911。", "多算了 1 年：2026－1911＝115。", "減成 1900 了：要減的是 1911。"], "parent": "民國元年是西元 1912 年，所以西元減 1911 就是民國。今年就是民國 115 年。"}, {"id": "HI-L1-E002", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "舊石器時代的工具", "diff": "簡單", "type": "觀念辨識", "q": "舊石器時代的人，主要使用哪一種工具？", "o": ["打製石器", "磨製石器", "鐵器", "青銅器"], "sol": "舊石器時代的人用敲擊的方式把石頭做成工具，叫做打製石器。", "w": ["磨製石器是新石器時代才普遍使用的。", "鐵器要到金屬器時代才出現。", "舊石器時代的人還不會製作金屬器。"], "parent": "工具越來越進步：先是敲石頭（舊石器），再是磨石頭（新石器），最後用金屬（金屬器）。"}, {"id": "HI-L2-E003", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "荷蘭據點的位置", "diff": "簡單", "type": "記憶辨識", "q": "1624 年，荷蘭人在臺灣的哪裡建立據點、興建熱蘭遮城？", "o": ["大員（今臺南安平一帶）", "雞籠（今基隆）", "淡水", "蛤仔難（今宜蘭）"], "sol": "1624 年，荷蘭人在臺灣南部的大員（今臺南安平一帶）興建熱蘭遮城。", "w": ["雞籠是西班牙人在 1626 年占領的地方。", "淡水也是西班牙人在臺灣北部的據點。", "蛤仔難（今宜蘭）是西班牙人由北部向外擴展的地區。"], "parent": "荷蘭在南、西班牙在北：荷蘭先到南部的大員，兩年後西班牙才占領北部的雞籠。"}, {"id": "HI-L1-E004", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "史前時代與歷史時代的分界", "diff": "簡單", "type": "觀念辨識", "q": "「史前時代」和「歷史時代」主要是用什麼來區分？", "o": ["有沒有文字紀錄", "有沒有人類居住", "有沒有使用陶器", "有沒有搭建房屋"], "sol": "沒有文字記載的時代叫史前時代，有文字紀錄之後叫歷史時代。", "w": ["史前時代就已經有人類生活了。", "新石器時代就會製作陶器，陶器不是分界。", "史前時代的人也會搭建居所。"], "parent": "沒寫日記、也沒拍照的事，只能靠留下來的東西去猜；有文字記下來，才知道發生了什麼事。"}, {"id": "HI-L1-M001", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "世紀的換算與整百年", "diff": "中等", "type": "計算", "q": "西元 1600 年和西元 1601 年，分別屬於第幾世紀？", "o": ["16 世紀、17 世紀", "16 世紀、16 世紀", "17 世紀、17 世紀", "15 世紀、16 世紀"], "sol": "第 16 世紀是西元 1501～1600 年，第 17 世紀是西元 1601～1700 年。所以 1600 年是 16 世紀的最後一年，1601 年是 17 世紀的第一年。", "w": ["1601 年已經是 17 世紀的第一年。", "1600 年是 16 世紀的最後一年，還在 16 世紀。", "兩個年份都少算了一個世紀。"], "parent": "一個世紀是 100 年，從「01 年」開始，到「00 年」結束。所以整百年要特別小心，它是那個世紀的最後一年。"}, {"id": "HI-L1-M002", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "綜合出土遺物判斷最可能的時代", "diff": "中等", "type": "資料推論", "q": "考古學家在某個遺址發現：磨製石器、陶器碎片、農具和聚落的遺跡，目前沒有發現鐵器等金屬器。根據這些線索，這個遺址最可能屬於哪一個時代？", "o": ["新石器時代", "舊石器時代", "金屬器時代", "歷史時代"], "sol": "磨製石器、陶器、農具和聚落遺跡，都是新石器時代常見的特徵；目前也沒有發現金屬器。綜合這些線索，最可能屬於新石器時代。要注意：「沒有發現」不等於當時一定沒有，所以答案是依現有證據判斷的「最可能」。", "w": ["舊石器時代以打製石器為主，這個遺址已出現磨製石器、陶器和農具。", "金屬器時代的遺址常出土鐵器等金屬器物；這個遺址目前沒有相關發現，現有線索比較符合新石器時代。", "題目提供的線索都是出土遺物，沒有任何文字紀錄的線索，無法判斷是歷史時代。"], "parent": "像偵探看線索：磨製石器、陶器、種田、聚落，加起來最像新石器時代。沒找到鐵器只是少了一個證據，所以說「最可能」。"}, {"id": "HI-L2-M003", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "事件先後順序", "diff": "中等", "type": "排序", "q": "下列事件依照發生先後排列，何者正確？\n甲、西班牙人占領臺灣北部的雞籠\n乙、荷蘭人在臺灣南部的大員興建熱蘭遮城\n丙、荷蘭人把西班牙人趕出臺灣北部\n丁、鄭成功率軍攻臺，荷蘭人隔年退出臺灣", "o": ["乙→甲→丙→丁", "甲→乙→丙→丁", "乙→丙→甲→丁", "乙→甲→丁→丙"], "sol": "乙 1624 年荷蘭在大員興建熱蘭遮城 → 甲 1626 年西班牙占領雞籠 → 丙 1642 年荷蘭驅逐北部的西班牙人 → 丁 1661 年鄭成功率軍攻臺，1662 年荷蘭人退出臺灣。", "w": ["荷蘭（1624）比西班牙（1626）早到臺灣。", "西班牙要先占領北部（1626），荷蘭才能在 1642 年把他們趕走。", "荷蘭在 1642 年先趕走西班牙，1662 年才被鄭成功趕走。"], "parent": "荷蘭先占南部，西班牙再占北部，荷蘭把西班牙趕走，最後鄭成功又把荷蘭趕走。"}, {"id": "HI-L2-M006", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "年代間隔與世紀判斷", "diff": "中等", "type": "兩步計算", "q": "荷蘭人在 1624 年於大員興建熱蘭遮城，1661 年鄭成功率軍包圍熱蘭遮城。這兩件事相隔幾年？都發生在第幾世紀？", "o": ["37 年；17 世紀", "37 年；16 世紀", "47 年；17 世紀", "27 年；18 世紀"], "sol": "步驟一：1661－1624＝37 年。步驟二：第 17 世紀是西元 1601～1700 年，1624 和 1661 都在這個範圍內，屬於第 17 世紀。", "w": ["1601～1700 年是 17 世紀；16 世紀是 1501～1600 年。", "1661－1624＝37，不是 47，相減時十位數算錯了。", "1661－1624＝37，不是 27；而且 1601～1700 年是 17 世紀，不是 18 世紀。"], "parent": "先用減法算經過幾年；再看年份落在哪一百年：1601～1700 年就是 17 世紀。"}, {"id": "HI-L2-H006", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "同一年南北兩地的控制勢力", "diff": "困難", "type": "時間線推理", "q": "西元 1640 年，一艘商船從日本出發，先停靠臺灣北部的雞籠，再南下到大員。當時這兩個港口分別由哪一個勢力控制？", "o": ["雞籠：西班牙；大員：荷蘭", "雞籠：荷蘭；大員：荷蘭", "雞籠：西班牙；大員：鄭氏", "雞籠：荷蘭；大員：西班牙"], "sol": "步驟一：荷蘭 1624 年在大員建立據點，到 1662 年才被鄭成功逐出臺灣，所以 1640 年大員由荷蘭控制。步驟二：西班牙 1626 年占領雞籠，到 1642 年才被荷蘭驅逐，所以 1640 年雞籠仍由西班牙控制。", "w": ["荷蘭要到 1642 年才把西班牙人趕出北部，1640 年雞籠還在西班牙手中。", "鄭成功要到 1661 年才率軍攻臺，1640 年大員由荷蘭控制。", "南北弄反了：荷蘭在南部的大員，西班牙在北部的雞籠。"], "parent": "畫一條時間線：1624 荷蘭到南部、1626 西班牙到北部、1642 荷蘭趕走西班牙、1661 鄭成功攻臺。把 1640 放上去，看南北各是誰。"}, {"id": "HI-L2-H003", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "由商品來源與去向判斷轉口貿易", "diff": "困難", "type": "資料推論", "q": "根據上表，下列敘述何者正確？", "o": ["生絲不是臺灣生產的，在大員轉手賣出，顯示大員有轉口貿易的功能", "鹿皮和生絲都是臺灣生產的商品", "荷蘭人在大員的貿易對象只有中國", "表中的兩種商品都運往歐洲"], "sol": "生絲的來源是中國，運到大員後，再轉賣到日本和歐洲。貨物不是本地生產、只是在這裡轉手賣出，就是轉口貿易，所以大員扮演貿易轉運站的角色。", "w": ["表中寫生絲的來源是中國，不是臺灣。", "表中的商品運往日本、歐洲，生絲也來自中國，貿易對象不只中國。", "鹿皮主要運往日本，不是歐洲。"], "parent": "先看貨從哪裡來，再看貨要去哪裡。不是自己生產、只是經過這裡再轉賣出去，就叫轉口。", "fig": "<table class=\"fig\"><caption>荷蘭東印度公司在大員經手的兩種商品（簡表）</caption><tr><th>商品</th><th>主要來源</th><th>主要運往</th></tr><tr><td>鹿皮</td><td>臺灣</td><td>日本</td></tr><tr><td>生絲</td><td>中國</td><td>日本、歐洲</td></tr></table>"}, {"id": "HI-L1-H004", "subj": "歷史", "unit": "L1 史前文化與原住民族", "point": "由特色判斷時代並排序", "diff": "困難", "type": "跨概念排序", "q": "甲：發現大量石板棺和精美的玉器。\n乙：出土煉鐵的遺跡和外來的金屬飾品。\n丙：發現打製石器，人們以採集、狩獵、漁撈為生。\n這三種史前文化，依時代由早到晚排列，何者正確？", "o": ["丙→甲→乙", "甲→丙→乙", "丙→乙→甲", "乙→甲→丙"], "sol": "丙是舊石器時代的特色（打製石器、採集漁獵，例如長濱文化）；甲是新石器時代晚期的特色（石板棺、玉器，例如卑南文化）；乙是金屬器時代的特色（煉鐵，例如十三行文化）。由早到晚：丙→甲→乙。", "w": ["使用打製石器的丙屬於舊石器時代，比甲更早。", "會煉鐵的乙屬於金屬器時代，是三者中最晚的。", "這是由晚到早的順序。"], "parent": "先替每個線索找時代：敲石頭是舊石器、石板棺玉器是新石器、煉鐵是金屬器。再照「敲→磨→鐵」排。"}, {"id": "HI-L2-H008", "subj": "歷史", "unit": "L2 大航海時代各方勢力在臺灣", "point": "由史料中的南北線索推論年代區間", "diff": "困難", "type": "史料推論", "q": "這段紀錄最可能寫於哪一段期間？", "o": ["1642～1662 年之間", "1626～1642 年之間", "1624～1626 年之間", "1662 年以後"], "sol": "線索一：北部雞籠由荷蘭控制，表示在 1642 年荷蘭驅逐西班牙人之後。線索二：南部大員仍由荷蘭管理，表示在 1662 年荷蘭退出臺灣之前。兩個線索都符合的，只有 1642～1662 年。", "w": ["這段期間雞籠由西班牙控制，城堡上不會是荷蘭的旗子。", "1624～1626 年荷蘭只在南部的大員，還沒有控制北部的雞籠。", "1662 年荷蘭已退出臺灣，大員不再由荷蘭管理。"], "parent": "先找史料裡的兩個線索：北部是誰的、南部是誰的。再放到時間線上，看哪一段兩個條件都成立。", "fig": "<div class=\"fig passage\">（自編史料）一位日本商人寫道：「這次我們的船先到臺灣北部的雞籠，港口的城堡上飄著荷蘭的旗子；接著南下大員，那裡同樣由荷蘭人管理，碼頭上忙著把鹿皮裝上船。」</div>"}, {"id": "GE-L1-E001", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "絕對位置與相對位置", "diff": "簡單", "type": "觀念辨識", "q": "下列哪一個是用「絕對位置」描述地點？", "o": ["某校位於北緯 22.6°、東經 120.3°", "臺灣位在歐亞大陸的東南方", "臺灣位在日本的西南方", "學校在火車站北方約 2 公里處"], "sol": "絕對位置是用一套固定的系統（例如經緯度座標、門牌地址）直接標出的位置，不需要拿另一個地點當參考。北緯 22.6°、東經 120.3° 是經緯度座標，是絕對位置。", "w": ["以歐亞大陸當參考點說明方位，是相對位置。", "以日本當參考點說明方位，是相對位置。", "雖然有距離數字，但仍以火車站當參考點，是相對位置。"], "parent": "用經緯度或門牌講位置，像用座位號碼找人，是絕對位置；說「在誰的哪個方向」，就是相對位置。"}, {"id": "GE-L1-E002", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "赤道的意義", "diff": "簡單", "type": "觀念辨識", "q": "下列關於「赤道」的敘述，何者正確？", "o": ["是緯度 0° 的緯線，把地球分成南、北半球", "是經度 0° 的經線", "是區分東、西半球的分界線", "是緯度最高的緯線"], "sol": "赤道是緯度 0° 的緯線，把地球分成北半球和南半球。", "w": ["經度 0° 的經線叫本初經線，不是赤道。", "赤道把地球分成南、北半球，不是東、西半球。", "赤道是緯度 0°，是緯度最低的緯線；越往南北兩極，緯度越高。"], "parent": "赤道像地球腰上的皮帶，剛好在正中間，是緯度的起點 0°，把地球分成上下（南北）兩半。"}, {"id": "GE-L2-E003", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "臺灣的行政區：直轄市", "diff": "簡單", "type": "記憶辨識", "q": "下列哪一個是「直轄市」？", "o": ["高雄市", "新竹市", "嘉義市", "屏東縣"], "sol": "臺灣目前有 6 個直轄市：臺北市、新北市、桃園市、臺中市、臺南市、高雄市。", "w": ["新竹市名稱有「市」，但不是直轄市。", "嘉義市名稱有「市」，但不是直轄市。", "屏東縣是縣，不是直轄市。"], "parent": "六個直轄市的口訣：北北桃中南高。你住的高雄就是其中一個。"}, {"id": "GE-L1-E004", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "經度與時間的關係", "diff": "簡單", "type": "觀念辨識", "q": "地球自轉一圈約 24 小時。依照這個關係，經度每相差幾度，時間大約相差 1 小時？", "o": ["15°", "10°", "24°", "30°"], "sol": "地球轉一圈是 360°，約需 24 小時，360÷24＝15，所以經度每差 15°，時間差 1 小時。", "w": ["360÷24＝15，不是 10。", "24 是一天的小時數，不是度數。", "相差 30° 會差 2 小時。"], "parent": "一整圈 360 度分給 24 個小時，每個小時分到 15 度。"}, {"id": "GE-L1-M001", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "比例尺計算", "diff": "中等", "type": "計算", "q": "一張地圖的比例尺是 1：50,000，地圖上兩地相距 4 公分，實際距離是多少？", "o": ["2 公里", "20 公里", "0.2 公里", "200 公里"], "sol": "步驟一：4×50,000＝200,000 公分。步驟二：200,000 公分＝2,000 公尺＝2 公里。", "w": ["單位換算多乘了 10：200,000 公分是 2 公里。", "單位換算少乘了 10：200,000 公分＝2,000 公尺＝2 公里。", "單位換算多乘了 100。"], "parent": "比例尺 1：50,000 的意思是：地圖上 1 公分，真實世界是 50,000 公分。先乘，再把公分換成公里。"}, {"id": "GE-L1-M005", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "緯度高低與氣溫", "diff": "中等", "type": "排序推理", "q": "在海拔高度、離海遠近等其他條件都相同時，下列三地的年平均氣溫由高到低排列，何者正確？\n甲：北緯 60°\n乙：北緯 5°\n丙：南緯 30°", "o": ["乙→丙→甲", "甲→丙→乙", "乙→甲→丙", "丙→乙→甲"], "sol": "氣溫要看離赤道多遠，也就是緯度的度數，不看南北。乙 5° 最靠近赤道，最熱；丙 30° 第二；甲 60° 離赤道最遠，最冷。所以是乙→丙→甲。", "w": ["順序剛好反了：緯度越低越靠近赤道，氣溫越高。", "把「南緯」當成比較冷；南緯 30° 離赤道比北緯 60° 近，比較熱。", "以為南半球比較熱；南緯 30° 比北緯 5° 離赤道遠，氣溫比較低。"], "parent": "只看緯度的數字：數字越小越靠近赤道、越熱，數字越大越冷。南緯、北緯只是說在赤道的哪一邊。"}, {"id": "GE-L2-M004", "subj": "地理", "unit": "L2 位置對臺灣的影響", "point": "海上交通位置帶來的影響", "diff": "中等", "type": "因果判斷", "q": "臺灣位在東亞海上交通的要道上。下列哪一項最能說明「交通位置」帶來的影響？", "o": ["船隻往來頻繁，有利於發展國際貿易", "夏秋季節常有颱風侵襲", "島上特有種生物眾多", "南北各地的氣溫有差異"], "sol": "位在海上交通要道，各國船隻經過、停靠方便，有利於臺灣發展國際貿易，成為經濟發展的重要基礎。", "w": ["颱風是天氣現象，和「交通要道帶來船隻往來」無關。", "特有種多是臺灣生態多樣性的表現，和「交通要道帶來船隻往來」無關。", "南北氣溫不同和緯度高低有關（第 1 課緯度與氣候），不是交通位置的影響。"], "parent": "題目問的是「交通」：船多、人多、貨多，就容易做生意。其他選項也是臺灣的特色，但和交通位置無關。"}, {"id": "GE-L1-H001", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "跨日的時差計算", "diff": "困難", "type": "多步計算", "q": "甲地位於東經 120°，當地時間是 10 月 13 日上午 8 點。依照經度每相差 15° 時間相差 1 小時計算，位於西經 75° 的乙地，當地時間是幾月幾日幾點？", "o": ["10 月 12 日晚上 7 點", "10 月 13 日晚上 9 點", "10 月 13 日上午 5 點", "10 月 13 日晚上 7 點"], "sol": "步驟一：東經和西經在本初經線兩側，經度相差 120°＋75°＝195°。步驟二：195÷15＝13 小時。步驟三：乙在甲的西邊，時間比較晚，要減 13 小時：10 月 13 日上午 8 點往前推 13 小時，是 10 月 12 日晚上 7 點。", "w": ["方向弄反了：乙在西邊，時間比較晚，要減，不是加。", "把兩個經度直接相減（120－75＝45°，差 3 小時）；東經和西經在本初經線兩側，要相加。", "時間往前推過了午夜，日期也要往前一天。"], "parent": "先算差幾度：東經和西經在兩邊，要相加。再除以 15 得到差幾小時。西邊比較晚，要往回減；過了半夜，日期也要減一天。"}, {"id": "GE-L1-M007", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "經緯線格線圖判讀：方位與時差", "diff": "中等", "type": "圖表判讀＋計算", "q": "根據上面的經緯線格線圖，從甲地看，乙地位在哪個方位？兩地的時間相差多少？（經度每相差 15°，時間相差 1 小時）", "o": ["東南方；40 分鐘", "西北方；40 分鐘", "東南方；10 小時", "東南方；1 小時"], "sol": "步驟一：讀圖，甲在北緯 25°、東經 115°；乙在北緯 20°、東經 125°。步驟二：乙的緯度較小、在南邊，經度較大、在東邊，所以乙在甲的東南方。步驟三：經度相差 125－115＝10°，10÷15＝2/3 小時，也就是 40 分鐘。", "w": ["方位弄反了：西北方是「從乙看甲」的方位。", "把經度差 10° 直接當成 10 小時；要先除以 15。", "以為每差 10° 就差 1 小時；應該是每 15° 差 1 小時，10° 是 40 分鐘。"], "parent": "先從圖上讀出兩點的經緯度，比南北、比東西得到方位；再用經度差除以 15 算時間差。", "fig": "<svg class=\"fig\" viewBox=\"0 0 360 250\" role=\"img\" aria-label=\"經緯線格線圖，標示甲、乙、丙、丁四點\"><title>經緯線格線圖</title><rect x=\"40\" y=\"30\" width=\"290\" height=\"190\" fill=\"#F4F8FB\" stroke=\"#9AA9B8\"/><g stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"><line x1=\"40\" y1=\"70\" x2=\"330\" y2=\"70\"/><line x1=\"40\" y1=\"180\" x2=\"330\" y2=\"180\"/><line x1=\"80\" y1=\"30\" x2=\"80\" y2=\"220\"/><line x1=\"185\" y1=\"30\" x2=\"185\" y2=\"220\"/><line x1=\"290\" y1=\"30\" x2=\"290\" y2=\"220\"/></g><g font-size=\"13\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\"><text x=\"4\" y=\"74\">25°N</text><text x=\"4\" y=\"184\">20°N</text><text x=\"62\" y=\"240\">115°E</text><text x=\"167\" y=\"240\">120°E</text><text x=\"272\" y=\"240\">125°E</text><text x=\"314\" y=\"24\">北↑</text></g><g fill=\"#B42318\"><circle cx=\"80\" cy=\"70\" r=\"6\"/><circle cx=\"290\" cy=\"180\" r=\"6\"/><circle cx=\"290\" cy=\"70\" r=\"6\"/><circle cx=\"80\" cy=\"180\" r=\"6\"/></g><g font-size=\"16\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\"><text x=\"90\" y=\"62\">甲</text><text x=\"300\" y=\"200\">乙</text><text x=\"300\" y=\"62\">丙</text><text x=\"90\" y=\"200\">丁</text></g></svg>"}, {"id": "GE-L1-H005", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "太陽光斜射與氣溫（模型推論）", "diff": "困難", "type": "實驗推論", "q": "老師用上面的小實驗說明「緯度與氣溫的關係」。下列推論何者最合理？", "o": ["高緯度地區太陽光斜射，同樣的陽光分散到較大的面積，所以氣溫較低", "高緯度地區太陽光直射，所以氣溫較高", "光圈變大，表示照到的地方比較熱", "南、北緯度數相同的兩地，只因為在不同半球，年平均氣溫就會差很多"], "sol": "斜照時，同樣的光分散到比較大的面積，每一小塊得到的光和熱比較少。高緯度地區太陽光比較斜，所以氣溫較低；低緯度地區照射角度比較接近垂直，氣溫較高。", "w": ["方向弄反了：高緯度地區太陽光是斜射，不是直射。", "光圈變大，同樣的光分散開來，每一處反而比較暗、得到的熱比較少。", "緯度數相同代表離赤道一樣遠；其他條件相同時，年平均氣溫應該相近。"], "parent": "同一支手電筒，正著照很亮，斜著照比較暗。太陽在高緯度地區就是斜斜地照，所以比較冷。", "fig": "<div class=\"fig passage\">小實驗（自編）：用手電筒從同樣的距離照向白紙。垂直照時，光圈小、很亮；斜斜地照時，光圈變大、變暗。</div>"}, {"id": "GE-L1-H007", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "由時間差反推經度差與東西方向", "diff": "困難", "type": "逆向推理", "q": "同一時刻，甲、乙、丙三地的當地時間分別是：甲 上午 8 點、乙 上午 10 點、丙 上午 5 點。依照經度每相差 15° 時間相差 1 小時，下列推論何者最合理？", "o": ["乙在甲的東方，兩地經度約相差 30°", "丙在甲的東方，兩地經度約相差 45°", "乙的時間比甲快，表示乙在甲的北方", "三地的時間不同，表示三地位在不同的半球"], "sol": "地球由西向東自轉，東邊的地方時間比較快（東早西晚）。乙比甲快 2 小時，乙在甲的東方，經度相差 2×15＝30°。丙比甲慢 3 小時，丙在甲的西方，相差 45°。", "w": ["丙的時間比甲慢 3 小時，表示丙在甲的西方，不是東方。", "時間快慢只和經度（東西）有關，不能用來判斷南北。", "時間不同只表示經度不同；例如三地經度最多相差 75°，可能都在同一個半球。"], "parent": "時間快慢只看東西：越東邊越早天亮、時間越快。差 1 小時就是差 15°，但看不出誰在南、誰在北。"}, {"id": "GE-L1-H008", "subj": "地理", "unit": "L1 緯度與氣候＋L2 臺灣的位置", "point": "北回歸線與屏東縣、臺北市的氣候帶", "diff": "困難", "type": "跨課整合", "q": "熱帶與溫帶大約以緯度 23.5° 的回歸線為界。北回歸線通過臺灣的嘉義縣和花蓮縣。依照這個分界，屏東縣和臺北市分別位在哪一個氣候帶？", "o": ["屏東縣在熱帶，臺北市在溫帶", "屏東縣在溫帶，臺北市在熱帶", "兩地都在熱帶", "兩地都在溫帶"], "sol": "北回歸線通過嘉義縣。屏東縣在嘉義縣的南邊（中間隔著臺南市、高雄市），位在北回歸線以南，屬於熱帶；臺北市在嘉義縣的北邊，位在北回歸線以北，屬於溫帶。", "w": ["南北弄反了：屏東在北回歸線以南，臺北在北回歸線以北。", "臺北市在北回歸線以北，已經超出熱帶的範圍。", "屏東縣在北回歸線以南，仍在熱帶的範圍內。"], "parent": "北回歸線像一條橫線穿過嘉義：線的南邊是熱帶，北邊是溫帶。屏東在嘉義南邊，臺北在嘉義北邊。"}, {"id": "CI-L1-E001", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "人性尊嚴的意義", "diff": "簡單", "type": "觀念辨識", "q": "「人性尊嚴」的意思，最接近下列哪一個？", "o": ["每個人身為人，都有不能被任意貶低的價值", "表現好、守規矩的人，才享有尊嚴", "別人不尊重你，你就失去了尊嚴", "有尊嚴就是可以不受任何限制，做任何自己想做的事"], "sol": "人性尊嚴是指作為一個人所應具有的尊嚴和價值。不論成績、外表、家庭背景，每個人都有同樣的價值，不能被任意貶低。", "w": ["尊嚴不是靠表現換來的，表現不好的人也有尊嚴。", "別人不尊重你，是對方侵害了你的尊嚴，不是你失去了尊嚴。", "重視自己的尊嚴，也要尊重別人，不能想做什麼就做什麼。"], "parent": "你不喜歡被別人取笑，別人也一樣。每個人都一樣珍貴，這就是人性尊嚴。"}, {"id": "CI-L1-E002", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "人權的普遍性", "diff": "簡單", "type": "觀念辨識", "q": "人權具有「普遍性」，意思是什麼？", "o": ["不分國籍、種族、性別，每個人都應該享有", "只有具備本國國籍、在本國出生的國民才能享有", "只有成年人才能享有", "繳了稅的人才能享有"], "sol": "人權應超越國籍、種族、族群、文化、性別、身心障礙等界限，每個人都應該享有，這就是普遍性。", "w": ["人權超越國籍，外國人在臺灣也享有基本人權。", "小孩也享有人權，不需要等到成年。", "人權不是用繳稅換來的，每個人身為人就應該享有。"], "parent": "人權像每個人出生就有的基本保護，不管你是誰、從哪裡來，都一樣有。"}, {"id": "CI-L2-E003", "subj": "公民", "unit": "L2 性別平等", "point": "性別刻板印象", "diff": "簡單", "type": "情境辨識", "q": "有人說：「女生一定比較文靜。」這句話屬於什麼？", "o": ["性別刻板印象", "性別歧視", "性別平等", "合理的性別差異"], "sol": "把所有女生都想成同一個樣子（一定比較文靜），用性別替每個人貼標籤，是性別刻板印象。", "w": ["歧視是做出不公平對待的行為；這句話只是一種想法，還沒有做出行為。", "性別平等是尊重每個人的差異和選擇；這句話卻把女生都想成一樣。", "每個人的個性不同，用「一定」把所有女生都說成文靜，不是真實的差異。"], "parent": "每個人都不一樣，有的女生很活潑、喜歡跳舞。用「男生一定、女生一定」來說人，就是刻板印象。"}, {"id": "CI-L2-E005", "subj": "公民", "unit": "L2 性別平等", "point": "辨識性別不平等的現象", "diff": "簡單", "type": "情境判斷", "q": "下列哪一個情境，屬於性別不平等的現象？", "o": ["公司只因為應徵者是女性，認為她婚後會辭職，就不錄用她", "學校依照每個人的身高安排座位，讓坐在後面的同學也看得到黑板", "體育課依照每個人的體能分組練習", "班上同學投票，選出一位男生擔任班長"], "sol": "只因為性別，就推測對方會怎樣，並拒絕給她工作機會，是因性別造成的不公平對待，屬於性別不平等。", "w": ["依身高安排座位，是依照每個人的需要，和性別無關。", "依體能分組，看的是每個人的狀況，不是性別。", "投票選出班長，是大家選擇的結果；當選的人剛好是男生，不代表性別不平等。"], "parent": "判斷時問自己：這個人是不是「只因為性別」就被不公平對待？如果是，就是性別不平等。"}, {"id": "CI-L1-M005", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "保障人權的方式：政府提供基本生活保障", "diff": "中等", "type": "分類判斷", "q": "保障人權、維護人性尊嚴的方式有很多。下列哪一項屬於「政府提供基本生活保障」？", "o": ["政府為經濟困難的家庭提供生活補助", "政府制定法律，處罰侵害他人權利的行為", "民間團體發起募款，幫助受災的家庭", "學生自己存錢，買想要的參考書"], "sol": "政府提供補助，讓經濟困難的人也能維持基本生活，屬於政府提供基本生活保障。", "w": ["制定法律處罰侵害權利的行為，是「立法禁止侵害人權」，和提供生活保障是不同的方式。", "民間團體募款是民間的善行，不是政府提供的保障。", "這是個人自己的安排，不是政府提供的保障。"], "parent": "政府保護人權常見的做法有兩種：一是訂法律，不准別人侵害；二是幫有困難的人過基本的生活。"}, {"id": "CI-L2-M002", "subj": "公民", "unit": "L2 性別平等", "point": "刻板印象、偏見、歧視的區分", "diff": "中等", "type": "情境分類", "q": "小安認為「男生都不會照顧小孩」（甲），因此看不起擔任保母的男性（乙）；後來在徵才時，只因為應徵者是男性就拒絕錄取他（丙）。甲、乙、丙依序屬於什麼？", "o": ["刻板印象、偏見、歧視", "偏見、刻板印象、歧視", "歧視、偏見、刻板印象", "刻板印象、歧視、偏見"], "sol": "甲把所有男生想成一樣，是刻板印象（固定、僵化的看法）；乙因此產生看不起的負面態度，是偏見；丙把偏見化為行動、做出不公平的對待，是歧視。", "w": ["甲是把一群人想成一樣的固定看法（刻板印象），還沒有帶著負面態度。", "丙是實際做出來的行為（歧視），甲只是想法。", "乙是心裡的負面態度（偏見），丙才是做出來的行為（歧視）。"], "parent": "先有一個「以為大家都一樣」的想法，接著變成看不起的感覺，最後真的做出不公平的事。想法→態度→行為。"}, {"id": "CI-L1-M001", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "有助於弱勢者受到平等尊重的差別待遇", "diff": "中等", "type": "情境判斷", "q": "依人性尊嚴的理念，給予弱勢者適當的差別待遇，可以幫助他們受到平等的尊重。下列哪一項做法符合這個理念？", "o": ["肢體障礙的考生可以申請延長考試時間", "餐廳規定身心障礙者只能坐在角落，以免影響其他客人", "公司只錄取年輕人，因為覺得年紀大的人學得比較慢", "學校讓成績好的學生優先選社團"], "sol": "肢體障礙可能影響寫字速度，延長考試時間是為了讓他和其他考生有一樣的機會，這種差別待遇有助於弱勢者受到平等的尊重。", "w": ["雖然也是「特別安排」，但目的是把身障者隔開，不是幫助他們，反而貶低了他們。", "只因年齡就推測對方學得慢並拒絕錄取，是不合理的對待。", "這是讓原本有優勢的人更有優勢，不是幫助弱勢者。"], "parent": "近視的同學坐前面，是為了讓他看得到黑板。看差別待遇是不是「為了讓弱勢的人有一樣的機會」。"}, {"id": "CI-L2-M004", "subj": "公民", "unit": "L2 性別平等", "point": "符合性別平等的分工", "diff": "中等", "type": "比較判斷", "q": "班上要分配打掃工作，哪一種做法最符合性別平等？", "o": ["依照每個人的能力和意願分配，並定期輪流", "男生力氣比較大，搬重物的工作全部交給男生", "為了公平，每個人都做完全一樣的工作，不考慮身體狀況", "需要細心整理的工作，交給女生負責"], "sol": "依照每個人的能力和意願分配，並定期輪流，不因為性別限制誰做哪些工作，最符合性別平等。", "w": ["力氣大小每個人不同，有些女生力氣也很大；只用性別決定，是性別刻板印象。", "每個人身體狀況不同，完全一樣、不考慮需要，不一定公平。", "細心和性別無關；只用性別決定，是性別刻板印象。"], "parent": "有些女生力氣很大，有些男生很會整理。看的是每個人的狀況，不是男生還是女生。"}, {"id": "CI-L1-H006", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "評論規定：目的與方式是否尊重人性尊嚴", "diff": "困難", "type": "情境評論", "q": "某校規定：「每次段考後，把全班後十名學生的名字公告在走廊上，提醒他們用功。」下列評論何者最符合尊重人性尊嚴的觀念？", "o": ["目的雖好，但公開名字可能讓學生被嘲笑，應改用不貶低人的方式", "規定對全班每個人都一樣，所以沒有問題", "只要目的是讓學生用功，用什麼方式都可以", "成績不好的學生就是不夠努力，把名字公告出來是他們應得的懲罰"], "sol": "評論一個規定，要同時看目的和方式。讓學生用功的目的沒有問題，但公開後十名的名字，可能讓學生被嘲笑、被貼上標籤，傷害人性尊嚴；可以改用私下輔導等不貶低人的方式。", "w": ["規定對每個人一樣，不代表方式就恰當；公開名字仍可能傷害被公告的學生。", "目的好，方式也要尊重人；不能為了目的而貶低別人。", "成績不好的原因很多，不一定是不努力；就算要督促，也不能用羞辱的方式。"], "parent": "判斷一個規定時，問兩件事：目的好不好？方式有沒有讓人被看不起？兩個都要過關。"}, {"id": "CI-L2-H002", "subj": "公民", "unit": "L2 性別平等", "point": "表格資料判讀與謹慎推論", "diff": "困難", "type": "資料判讀", "q": "根據上表，下列推論何者最合理？", "o": ["男女人數差距可能和刻板印象影響選擇有關，值得進一步了解", "表格證明機器人社的男生比女生更擅長科技", "為了達到性別平等，學校應規定每個社團的男女人數都必須完全相同", "這個表格已經證明烹飪社對男生有性別歧視"], "sol": "表格只顯示人數差距。差距可能和社會對性別的期待（刻板印象）影響學生的選擇有關，但還需要進一步了解原因，不能直接下定論。", "w": ["表格只有人數，沒有能力的資料，不能證明誰比較擅長。", "強制每個社團男女人數相同，會限制學生依興趣選擇。", "表格只有人數，沒有證據顯示社團做出不公平的對待，不能直接說是歧視。"], "parent": "看資料要小心：資料只告訴你「人數差很多」，不能直接說是誰的錯。可以推測可能的原因，再去了解。", "fig": "<table class=\"fig\"><caption>某校社團成員人數（自編資料）</caption><tr><th>社團</th><th>男生</th><th>女生</th></tr><tr><td>機器人社</td><td>28</td><td>2</td></tr><tr><td>烹飪社</td><td>1</td><td>25</td></tr><tr><td>籃球社</td><td>20</td><td>10</td></tr></table>"}, {"id": "CI-L1-H003", "subj": "公民", "unit": "L1 人性尊嚴與人權保障", "point": "表達意見與尊重他人尊嚴的界線", "diff": "困難", "type": "情境判斷", "q": "小剛在社群網站發文，說學校餐廳的菜不好吃，同時貼出負責打菜同學的照片和班級，要大家去罵他。關於這件事，下列敘述何者最恰當？", "o": ["可以批評餐點，但公開同學資料、號召別人罵他就越界了", "只要是自己的帳號，想發什麼都可以", "小剛不應該在網路上說出任何對學校的不滿", "因為菜真的很不好吃，所以把打菜同學的照片貼出來讓大家知道也沒關係"], "sol": "要把事情分開看：說出對餐點的看法，是表達自己的意見；但公開同學的照片、班級，號召別人去罵他，會讓同學受到羞辱，傷害他的人性尊嚴。", "w": ["自己的帳號也要尊重別人，不能用來羞辱或攻擊他人。", "小剛可以表達對餐點的意見，問題在於他攻擊了同學。", "就算意見是事實，也不能因此羞辱別人；菜好不好吃，也不是打菜同學一個人造成的。"], "parent": "你可以說菜不好吃，但不能把打菜同學的照片貼出來讓大家罵他。批評事情可以，攻擊人不行。"}, {"id": "CI-L2-H005", "subj": "公民", "unit": "L2 性別平等", "point": "消除性別刻板印象的做法", "diff": "困難", "type": "做法評估", "q": "某醫院的護理師大多是女性。院方希望吸引更多不同性別的人投入護理工作，下列哪一種做法最能減少性別刻板印象的影響，又不限制個人選擇？", "o": ["在招募資料中呈現不同性別的護理師，歡迎有興趣的人應徵", "之後只錄取男性護理師，直到男女人數相同", "規定男女錄取人數一定要完全相同，就算應徵者能力不足也要錄取", "不需要調整，因為女性天生比較會照顧人"], "sol": "讓大家看到不同性別的人都能做好護理工作，可以打破「護理是女生的工作」的刻板印象；同時開放每個人依興趣應徵，不限制任何人的選擇。", "w": ["只錄取男性，等於因為性別拒絕女性，是另一種不公平。", "只看人數、不看能力，會讓錄取失去公平，也可能排除適合的人。", "「女性天生比較會照顧人」本身就是性別刻板印象。"], "parent": "想改變「某些工作只適合某個性別」的想法，好方法是讓大家看到更多可能，再讓每個人自己選。"}, {"id": "GE-L1-E101", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "相對位置以參考點描述", "diff": "簡單", "type": "觀念辨識", "q": "「便利商店在學校大門的右手邊，走路約 1 分鐘。」這句話描述位置時，用的參考點是什麼？", "o": ["學校大門", "便利商店", "走路的人", "1 分鐘"], "sol": "相對位置要先選一個參考點，再說明目標在參考點的哪個方向、多遠。這句話以「學校大門」為參考點，說明便利商店在它的右手邊。", "w": ["便利商店是要找的目標，不是參考點。", "走路的人只是移動的人，句子是拿學校大門當比較的基準。", "1 分鐘是距離的描述，不是參考點。"], "parent": "問路時說「在某某旁邊」，那個「某某」就是參考點。"}, {"id": "GE-L1-E102", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "方位代號", "diff": "簡單", "type": "觀念辨識", "q": "地圖上的方位常用英文字母表示。代表「東方」的字母是哪一個？", "o": ["E", "N", "W", "S"], "sol": "N 是北（North）、S 是南（South）、E 是東（East）、W 是西（West）。", "w": ["N 代表北方。", "W 代表西方。", "S 代表南方。"], "parent": "指北針上的 N 指北，順時針依序是 N 北、E 東、S 南、W 西。"}, {"id": "GE-L1-E103", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "地圖上的方向：未標示時上北下南", "diff": "簡單", "type": "觀念辨識", "q": "一張地圖上沒有畫指北針。依一般慣例，地圖的「左方」是哪個方向？", "o": ["西方", "東方", "北方", "南方"], "sol": "地圖沒有特別標示方向時，通常是上北、下南、左西、右東，所以左方是西方。", "w": ["右方才是東方。", "上方才是北方。", "下方才是南方。"], "parent": "記口訣「上北下南，左西右東」。"}, {"id": "GE-L1-M101", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "旋轉的指北針判讀方位", "diff": "中等", "type": "圖表判讀", "q": "下面的街區圖中，指北針「N」指向圖的右方。圖書館在學校的哪一個方位？", "o": ["北方", "東方", "南方", "西方"], "sol": "指北針指向右方，所以圖的右方是北。圖書館畫在學校的右邊，因此圖書館在學校的北方。", "w": ["如果用「上北下南」來看，會以為右邊是東；但這張圖的指北針指向右方，右方是北。", "南方在圖的左方，圖書館不在學校左邊。", "西方在圖的上方，圖書館不在學校上方。"], "parent": "先找指北針，指北針指到哪裡，哪裡就是北，不一定是上面。", "fig": "<svg class=\"fig\" viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"街區圖（指北針指向右方）\"><title>街區圖（指北針指向右方）</title><rect x=\"20\" y=\"20\" width=\"280\" height=\"240\" fill=\"#F4F8FB\" stroke=\"#9AA9B8\"/><line x1=\"90.0\" y1=\"20\" x2=\"90.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"80.0\" x2=\"300\" y2=\"80.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"160.0\" y1=\"20\" x2=\"160.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"140.0\" x2=\"300\" y2=\"140.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"230.0\" y1=\"20\" x2=\"230.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"200.0\" x2=\"300\" y2=\"200.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><rect x=\"67.0\" y=\"131.0\" width=\"18\" height=\"18\" fill=\"#1F5FAD\"/><text x=\"89.0\" y=\"146.0\" font-size=\"16\" font-weight=\"700\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">學校</text><polygon points=\"216.0,129.0 206.0,148.0 226.0,148.0\" fill=\"#14703F\"/><text x=\"229.0\" y=\"146.0\" font-size=\"16\" font-weight=\"700\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">圖書館</text><g transform=\"rotate(90 360 55)\"><line x1=\"360\" y1=\"83\" x2=\"360\" y2=\"33\" stroke=\"#13233A\" stroke-width=\"3\"/><polygon points=\"360,21 352,37 368,37\" fill=\"#13233A\"/><text x=\"360\" y=\"15\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">N</text></g><rect x=\"310\" y=\"98\" width=\"14\" height=\"14\" fill=\"#1F5FAD\"/><text x=\"330\" y=\"110\" font-size=\"13\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">學校</text><polygon points=\"317,121 309,136 325,136\" fill=\"#14703F\"/><text x=\"330\" y=\"134\" font-size=\"13\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">圖書館</text></svg>"}, {"id": "GE-L1-M102", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "由座位表判斷相對位置", "diff": "中等", "type": "推理", "q": "教室座位共有 5 排、每排 6 個位子，講臺在教室的北邊。小安坐第 2 排第 3 個位子，小華坐第 4 排第 3 個位子（排數愈大離講臺愈遠）。小華在小安的哪個方位？", "o": ["南方", "北方", "東方", "西方"], "sol": "講臺在北邊，排數愈大離講臺愈遠，也就是愈往南。小華在第 4 排、小安在第 2 排，同樣是第 3 個位子，所以小華在小安的正南方。", "w": ["北方是靠近講臺的方向，小華比小安離講臺更遠。", "兩人都坐第 3 個位子，左右位置相同，不是東西關係。", "兩人都坐第 3 個位子，左右位置相同，不是東西關係。"], "parent": "先找出「北」在哪裡（講臺），離北邊愈遠就愈南。"}, {"id": "GE-L1-M103", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "絕對位置的例子", "diff": "中等", "type": "觀念辨識", "q": "下列哪一個描述屬於「絕對位置」？", "o": ["電影票上寫著「8 排 12 號」", "電影院就在百貨公司的正對面那棟", "我的座位在小明左手邊的第二個", "從捷運站出口右轉走兩分鐘就到了"], "sol": "絕對位置是用一套固定的系統直接標出位置，不用拿別的地點比較。電影票的「8 排 12 號」是座位編號系統，看編號就能找到，屬於絕對位置。", "w": ["以百貨公司當參考點，是相對位置。", "以小明當參考點，是相對位置。", "以捷運站出口當參考點，是相對位置。"], "parent": "座位號碼、門牌、經緯度都是「系統給的號碼」，屬於絕對位置。"}, {"id": "GE-L1-H101", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "旋轉地圖後的方位判斷", "diff": "困難", "type": "空間推理", "q": "小美把一張「上北下南」的地圖，逆時針轉了 90 度後放在桌上。這時候地圖上的「北方」會在桌面的哪一邊？", "o": ["左方", "右方", "下方", "上方"], "sol": "逆時針轉 90 度，原本在上方的北會轉到左方（上→左→下→右是逆時針的方向）。所以北方在桌面的左方。", "w": ["轉的方向想反了：順時針轉 90 度，北才會到右方。", "轉 180 度，北才會到下方。", "地圖已經轉動，北方不會留在上方。"], "parent": "拿一張紙寫上「北」在上面，實際轉轉看，最不會錯。"}, {"id": "GE-L1-E104", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "圖例的功能", "diff": "簡單", "type": "觀念辨識", "q": "地圖上用「▲」代表山峰、「—」代表道路，說明這些符號意思的部分叫做什麼？", "o": ["圖例", "圖名", "比例尺", "方向標"], "sol": "圖例是用簡化的符號代表地表上的各種現象，並說明每個符號的意思。", "w": ["圖名是地圖的名稱，告訴你這張圖在畫什麼。", "比例尺表示地圖縮小的程度，用來換算距離。", "方向標（指北針）告訴你哪裡是北方。"], "parent": "圖例像地圖的「字典」，看不懂符號就查圖例。"}, {"id": "GE-L1-E105", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "圖名的功能", "diff": "簡單", "type": "觀念辨識", "q": "想要最快知道一張地圖主要在畫什麼內容，應該先看地圖的哪一部分？", "o": ["圖名", "圖例", "比例尺", "方向標"], "sol": "圖名是地圖的名稱，例如「高雄市觀光地圖」，看圖名就知道地圖的主題。", "w": ["圖例說明符號的意思，要先知道主題才知道要查哪些符號。", "比例尺用來換算距離，不能告訴你地圖的主題。", "方向標只告訴你方向。"], "parent": "看書先看書名，看地圖先看圖名。"}, {"id": "GE-L1-E106", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "比例尺的意義", "diff": "簡單", "type": "觀念辨識", "q": "比例尺「1：100,000」的意思是什麼？", "o": ["地圖上 1 公分，代表實際距離 100,000 公分", "地圖上 100,000 公分，代表實際距離 1 公分", "地圖上 1 公分，代表實際距離 100,000 公尺", "地圖上 1 公分，代表實際距離 1 公里的十萬倍"], "sol": "比例尺前面是圖上距離、後面是實際距離，單位相同。1：100,000 表示圖上 1 公分代表實際 100,000 公分（也就是 1 公里）。", "w": ["前後弄反了：前面的 1 是地圖上的距離。", "單位要相同：前面是公分，後面也是公分，不是公尺。", "100,000 公分就是 1 公里，不是 1 公里的十萬倍。"], "parent": "比例尺像「縮小倍數」：1：100,000 就是把真實世界縮小十萬倍。"}, {"id": "GE-L1-M104", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "線段比例尺換算", "diff": "中等", "type": "圖表判讀", "q": "一張地圖使用下方的線段比例尺（整條線段代表實際距離 1 公里），線段長 2 公分。地圖上甲、乙兩地相距 7 公分，實際距離是多少？", "o": ["3.5 公里", "7 公里", "14 公里", "1.75 公里"], "sol": "線段長 2 公分代表 1 公里，所以地圖上 1 公分代表 0.5 公里。7 公分代表 7×0.5＝3.5 公里。", "w": ["以為 1 公分就代表 1 公里，沒注意線段長 2 公分。", "把倍數弄反：2 公分代表 1 公里，不是 1 公分代表 2 公里。", "多除了一次 2：7÷2＝3.5 公里，不是再除以 2。"], "parent": "先算「1 公分代表多少公里」，再乘以圖上的公分數。", "fig": "<svg class=\"fig\" viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"地圖的線段比例尺\"><title>地圖的線段比例尺</title><rect x=\"20\" y=\"20\" width=\"280\" height=\"240\" fill=\"#F4F8FB\" stroke=\"#9AA9B8\"/><line x1=\"90.0\" y1=\"20\" x2=\"90.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"80.0\" x2=\"300\" y2=\"80.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"160.0\" y1=\"20\" x2=\"160.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"140.0\" x2=\"300\" y2=\"140.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"230.0\" y1=\"20\" x2=\"230.0\" y2=\"260\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><line x1=\"20\" y1=\"200.0\" x2=\"300\" y2=\"200.0\" stroke=\"#DCE3EC\" stroke-width=\"10\"/><circle cx=\"62.0\" cy=\"140.0\" r=\"8\" fill=\"#B42318\"/><text x=\"75.0\" y=\"146.0\" font-size=\"16\" font-weight=\"700\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">甲</text><circle cx=\"258.0\" cy=\"140.0\" r=\"8\" fill=\"#B42318\"/><text x=\"271.0\" y=\"146.0\" font-size=\"16\" font-weight=\"700\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">乙</text><g transform=\"rotate(0 360 55)\"><line x1=\"360\" y1=\"83\" x2=\"360\" y2=\"33\" stroke=\"#13233A\" stroke-width=\"3\"/><polygon points=\"360,21 352,37 368,37\" fill=\"#13233A\"/><text x=\"360\" y=\"15\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">N</text></g><line x1=\"310\" y1=\"270\" x2=\"390\" y2=\"270\" stroke=\"#13233A\" stroke-width=\"3\"/><line x1=\"310\" y1=\"264\" x2=\"310\" y2=\"276\" stroke=\"#13233A\" stroke-width=\"2\"/><line x1=\"390\" y1=\"264\" x2=\"390\" y2=\"276\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"350\" y=\"260\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">2 公分＝1 公里</text></svg>"}, {"id": "GE-L1-M105", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "比例尺大小的比較", "diff": "中等", "type": "比較判斷", "q": "下列四個比例尺中，哪一個是「最大」的比例尺？", "o": ["1：1,000", "1：10,000", "1：100,000", "1：1,000,000"], "sol": "比例尺大小看比值 1÷後面的數，後面的數愈小，比值愈大。1：1,000 的後面數字最小，所以比例尺最大。", "w": ["1：10,000 的比值比 1：1,000 小。", "1：100,000 的比值更小。", "1：1,000,000 後面的數最大，是最小的比例尺。"], "parent": "比例尺是分數：1/1,000 比 1/1,000,000 大得多。分母愈小，比例尺愈大。"}, {"id": "GE-L1-M106", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "比例尺大小與範圍、詳細程度", "diff": "中等", "type": "觀念整合", "q": "兩張紙張大小相同的地圖，甲圖比例尺 1：5,000，乙圖比例尺 1：500,000。下列比較何者正確？", "o": ["甲圖範圍較小、內容較詳細", "甲圖範圍較大、內容較詳細", "甲圖範圍較小、內容較簡略", "兩張圖範圍一樣，只是字的大小不同"], "sol": "比例尺愈大，涵蓋範圍愈小、內容愈詳細。甲圖 1：5,000 是比較大的比例尺，所以範圍較小、內容較詳細。", "w": ["比例尺大，範圍會變小，不會變大。", "比例尺大，內容會比較詳細，不會比較簡略。", "紙張一樣大時，比例尺不同，畫出的範圍就不同。"], "parent": "像手機地圖放大：看得到巷子（詳細），但只看得到附近（範圍小）。"}, {"id": "GE-L1-M107", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "依用途選比例尺", "diff": "中等", "type": "情境應用", "q": "山區救難隊要在一座小山谷中進行詳細搜索，最適合使用下列哪一張地圖？", "o": ["1：250", "1：25,000", "1：250,000", "1：2,500,000"], "sol": "詳細搜索需要看到最多細節，應選比例尺最大的地圖，也就是 1：250。", "w": ["1：25,000 的細節比 1：250 少。", "1：250,000 範圍大，細節更少。", "1：2,500,000 適合看很大的區域，看不到山谷的細節。"], "parent": "要找細節，就把地圖「放大」，選後面數字最小的比例尺。"}, {"id": "GE-L1-M108", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "同一地區在不同比例尺地圖上的長度", "diff": "中等", "type": "比較判斷", "q": "同一條長 3 公里的河流，畫在比例尺 1：50,000 和 1：100,000 的地圖上，長度分別是多少？", "o": ["6 公分和 3 公分", "3 公分和 6 公分", "6 公分和 6 公分", "60 公分和 30 公分"], "sol": "3 公里＝300,000 公分。300,000÷50,000＝6 公分；300,000÷100,000＝3 公分。比例尺較大的圖，畫出來較長。", "w": ["兩張圖弄反了：比例尺較大的 1：50,000 畫得比較長。", "比例尺不同，同一條河畫出來的長度一定不同。", "單位換算錯了：3 公里是 300,000 公分，不是 3,000,000 公分。"], "parent": "先把公里換成公分，再除以比例尺後面的數。"}, {"id": "GE-L1-H102", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "比例尺與面積的關係", "diff": "困難", "type": "推理", "q": "一座島畫在比例尺 1：10,000 的地圖上，面積是 4 平方公分。如果改畫在比例尺 1：20,000、大小相同的紙上，這座島在地圖上的面積是多少？", "o": ["1 平方公分", "2 平方公分", "4 平方公分", "8 平方公分"], "sol": "比例尺從 1：10,000 變成 1：20,000，長和寬都縮小成原來的一半。面積＝長×寬，所以變成原來的 1/2×1/2＝1/4，4×1/4＝1 平方公分。", "w": ["只把長度縮小一半，忘了寬也縮小一半；面積要縮小成 1/4。", "島的實際大小沒變，但比例尺變小，畫出的面積會變小。", "方向弄反了：1：20,000 比 1：10,000 小，畫出的島會變小。"], "parent": "長變一半、寬也變一半，面積就變成四分之一。可以畫一個正方形試試看。"}, {"id": "GE-L1-E108", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "經線與緯線的方向", "diff": "簡單", "type": "觀念辨識", "q": "關於經線與緯線的方向，下列何者正確？", "o": ["經線南北向，緯線東西向", "經線東西向，緯線南北向", "經線和緯線都是東西向", "經線和緯線都是南北向"], "sol": "經線連接南北兩極，是南北向的線；緯線和赤道平行，是東西向的線。", "w": ["剛好弄反了：經線連接南北極，是南北向。", "經線是南北向，不是東西向。", "緯線和赤道平行，是東西向。"], "parent": "經線像西瓜的條紋（上下），緯線像腰上的皮帶（左右）。"}, {"id": "GE-L1-E109", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "本初經線", "diff": "簡單", "type": "觀念辨識", "q": "經度 0° 的經線叫做什麼？", "o": ["本初經線", "赤道", "北回歸線", "國際換日線"], "sol": "經度 0° 的經線叫本初經線，通過英國倫敦的格林威治，是東經與西經的起點。", "w": ["赤道是緯度 0° 的緯線。", "北回歸線是約北緯 23.5° 的緯線。", "國際換日線大致沿著 180° 經線，不是 0°。"], "parent": "經度從本初經線（0°）開始算，緯度從赤道（0°）開始算。"}, {"id": "GE-L1-M109", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "緯線長度的變化", "diff": "中等", "type": "觀念辨識", "q": "關於緯線的長度，下列敘述何者正確？", "o": ["赤道最長，愈靠近兩極愈短", "赤道最短，愈靠近兩極愈長", "所有緯線一樣長", "北半球的緯線比南半球的長"], "sol": "緯線是繞地球一圈的圓，赤道繞過地球最胖的地方，所以最長；愈靠近南北極，圓圈愈小，緯線愈短。", "w": ["剛好弄反了：赤道是最長的緯線。", "緯線是大小不同的圓圈，長度不一樣。", "南北半球相同緯度的緯線一樣長。"], "parent": "把地球想成一顆柳丁，中間切一圈最長，靠近頂端切一圈就很短。"}, {"id": "GE-L1-M110", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "經線長度的特性", "diff": "中等", "type": "觀念辨識", "q": "關於經線，下列敘述何者正確？", "o": ["每一條經線都一樣長，都連接兩極", "愈靠近本初經線的經線就愈長", "經線和赤道平行，是東西向的線", "經度最大和緯度一樣是 90°"], "sol": "經線都是從北極到南極的半圓，每一條長度都相同。", "w": ["經線一樣長，不會因靠近本初經線而變長。", "和赤道平行、東西向的是緯線；經線是南北向。", "經度最大是 180°；緯度最大才是 90°。"], "parent": "經線像橘子瓣的分界線，每一條都從頂端到底端，一樣長。"}, {"id": "GE-L1-M111", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "經緯格線讀座標（南、西半球）", "diff": "中等", "type": "圖表判讀", "q": "根據下面的經緯線格線圖，甲點的位置是哪一個？", "o": ["南緯 20°、西經 40°", "北緯 20°、西經 40°", "南緯 20°、東經 40°", "南緯 40°、西經 20°"], "sol": "甲點在 20°S 的緯線上、40°W 的經線上，所以是南緯 20°、西經 40°。寫法通常先寫緯度再寫經度。", "w": ["甲在赤道以南（20°S），是南緯，不是北緯。", "甲在本初經線以西（40°W），是西經，不是東經。", "經度和緯度的數字對調了：緯度看水平的緯線，經度看直的經線。"], "parent": "先找甲點在哪一條橫線（緯線），再找哪一條直線（經線）。", "fig": "<svg class=\"fig\" viewBox=\"0 0 480 300\" role=\"img\" aria-label=\"經緯線格線圖（含赤道與本初經線）\"><title>經緯線格線圖（含赤道與本初經線）</title><rect x=\"70\" y=\"30\" width=\"380\" height=\"220\" fill=\"#F4F8FB\" stroke=\"#9AA9B8\"/><line x1=\"70\" y1=\"30.0\" x2=\"450\" y2=\"30.0\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"62\" y=\"35.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">20°N</text><line x1=\"70\" y1=\"140.0\" x2=\"450\" y2=\"140.0\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"62\" y=\"145.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0°</text><line x1=\"70\" y1=\"250.0\" x2=\"450\" y2=\"250.0\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"62\" y=\"255.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">20°S</text><line x1=\"70.0\" y1=\"30\" x2=\"70.0\" y2=\"250\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"70.0\" y=\"272\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">40°W</text><line x1=\"260.0\" y1=\"30\" x2=\"260.0\" y2=\"250\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"260.0\" y=\"272\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0°</text><line x1=\"450.0\" y1=\"30\" x2=\"450.0\" y2=\"250\" stroke=\"#9AA9B8\" stroke-dasharray=\"4 3\"/><text x=\"450.0\" y=\"272\" font-size=\"14\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">40°E</text><text x=\"468\" y=\"20\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">北↑</text><circle cx=\"70.0\" cy=\"250.0\" r=\"6\" fill=\"#B42318\"/><text x=\"79.0\" y=\"241.0\" font-size=\"17\" font-weight=\"700\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text></svg>"}, {"id": "GE-L1-M112", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "對蹠點的半球判斷", "diff": "中等", "type": "推理", "q": "從地球中心穿過臺灣（北半球、東半球）畫一條直線，到地球另一面的那一點，位在哪兩個半球？", "o": ["南半球、西半球", "北半球、西半球", "南半球、東半球", "北半球、東半球"], "sol": "穿過地球中心到另一面，南北會相反，東西也會相反。臺灣在北半球、東半球，所以另一面的點在南半球、西半球。", "w": ["只想到東西相反，忘了南北也會相反。", "只想到南北相反，忘了東西也會相反。", "穿過地球到另一面，不會還在同一個半球。"], "parent": "拿一顆球，從上面刺一根筷子穿到另一面：上下相反、左右也相反。"}, {"id": "GE-L1-H103", "subj": "地理", "unit": "L1 位置、地圖與座標系統", "point": "由經緯度判斷兩地方位與半球", "diff": "困難", "type": "整合推理", "q": "甲地位於（北緯 10°，西經 170°），乙地位於（北緯 10°，東經 170°）。下列敘述何者正確？", "o": ["緯度相同，經度差 20°，隔著 180° 經線", "兩地經度相差 340°，距離非常遠", "甲在東半球，乙在西半球，緯度相同", "兩地中間隔著本初經線，經度差 340°"], "sol": "甲在西經 170°，乙在東經 170°，兩地都靠近 180° 經線。從 170°W 往西到 180° 是 10°，再到 170°E 又 10°，相差 20°，中間隔著 180° 經線。兩地都在北緯 10°，緯度相同。", "w": ["直接把 170＋170 相加是 340°；但經度繞一圈 360°，跨過 180° 經線那一側只差 20°。", "西經在西半球、東經在東半球：甲在西半球，乙在東半球。", "本初經線（0°）在另一側，兩地之間最近是隔著 180° 經線。"], "parent": "東經、西經都數到 180° 就會碰在一起。在 180° 附近的東經、西經其實很近。"}, {"id": "GE-L1-E111", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "東早西晚的原因", "diff": "簡單", "type": "觀念辨識", "q": "東邊的地方比西邊的地方先看到日出，主要原因是什麼？", "o": ["地球由西向東自轉", "地球由東向西自轉", "太陽繞著地球轉", "東邊的地方離太陽比較近"], "sol": "地球由西向東自轉，東邊的地方會先轉到面向太陽的位置，所以先日出，時間也比較早。", "w": ["地球自轉的方向是由西向東。", "太陽沒有繞著地球轉，是地球自轉造成日出日落。", "東邊並沒有離太陽比較近，日出早晚和自轉方向有關。"], "parent": "坐在旋轉椅上往東轉，東邊的人總是先看到前面的東西。"}, {"id": "GE-L1-E112", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "全球時區數", "diff": "簡單", "type": "計算", "q": "地球一圈 360°，依照每 15° 劃為一個時區，全球大約分為幾個時區？", "o": ["24 個", "12 個", "15 個", "360 個"], "sol": "360÷15＝24，全球大約分成 24 個時區，剛好對應一天 24 小時。", "w": ["360÷15＝24，不是 12。", "15 是每個時區的經度寬度，不是時區數。", "360 是一圈的度數，不是時區數。"], "parent": "一天 24 小時，一圈分 24 個時區，每個 15°。"}, {"id": "GE-L1-E113", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "同經度無時差", "diff": "簡單", "type": "觀念辨識", "q": "下列哪兩地的地方時相同（沒有時差）？", "o": ["（50°N，100°E）和（20°N，100°E）", "（20°N，100°E）和（20°N，110°E）", "（30°N，60°W）和（30°N，60°E）", "（10°N，0°）和（10°N，15°E）"], "sol": "地方時由經度決定。第一組兩地經度都是 100°E，雖然緯度不同，時間仍相同。", "w": ["經度差 10°，地方時不同。", "一個西經、一個東經，經度差 120°，相差 8 小時。", "經度差 15°，相差 1 小時。"], "parent": "時間只看經度（東西），不看緯度（南北）。"}, {"id": "GE-L1-M113", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "臺灣與倫敦的時差", "diff": "中等", "type": "計算", "q": "臺灣使用東經 120° 的時間，英國倫敦使用經度 0° 的時間。兩地相差幾小時？哪一地比較早？", "o": ["相差 8 小時，臺灣比較早", "相差 8 小時，倫敦比較早", "相差 12 小時，臺灣比較早", "相差 120 小時，臺灣比較早"], "sol": "經度相差 120°，120÷15＝8 小時。臺灣在東邊，東早西晚，所以臺灣比倫敦早 8 小時。", "w": ["臺灣在倫敦的東邊，時間比較早，不是倫敦比較早。", "120÷15＝8，不是 12。", "經度差要除以 15 才是小時數。"], "parent": "經度差除以 15 是時差；誰在東邊，誰的時間就比較早。"}, {"id": "GE-L1-M114", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "由時差推算當地時間", "diff": "中等", "type": "計算", "q": "高雄是下午 6 點時，英國倫敦（比臺灣慢 8 小時）是幾點？", "o": ["上午 10 點", "凌晨 2 點", "下午 2 點", "晚上 10 點"], "sol": "倫敦比臺灣慢 8 小時，下午 6 點（18 點）往前推 8 小時是 10 點，也就是上午 10 點。", "w": ["往前推 16 小時才會到凌晨 2 點；只要推 8 小時。", "只推了 4 小時；要推 8 小時。", "倫敦比較慢，要往前推（減），不是往後加。"], "parent": "慢就減、快就加：18－8＝10，是上午 10 點。"}, {"id": "GE-L1-M115", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "出國調整手錶", "diff": "中等", "type": "情境應用", "q": "小明從臺灣（東經 120° 的時間）飛到日本東京（東經 135° 的時間）。下飛機後，他的手錶應該怎麼調？", "o": ["撥快 1 小時", "撥慢 1 小時", "撥快 15 小時", "不用調整"], "sol": "東京在臺灣東邊 15°，時間比臺灣早 1 小時，所以手錶要撥快 1 小時。", "w": ["東京在東邊，時間比較早，要撥快，不是撥慢。", "經度差 15° 是 1 小時，不是 15 小時。", "經度不同，時間就不同，需要調整。"], "parent": "往東走，時間變早，手錶要撥快；往西走，手錶要撥慢。"}, {"id": "GE-L1-M116", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "由經度示意圖找同時刻的事件", "diff": "中等", "type": "圖表判讀", "q": "下圖中甲、乙、丙三地在經度軸上的位置如圖。臺灣（東經 120°）晚上 8 點時，哪一地剛好是中午 12 點？", "o": ["乙（0°）", "甲（135°E）", "丙（90°W）", "三地都不是"], "sol": "中午 12 點比晚上 8 點（20 點）慢 8 小時，要在臺灣西邊 8×15＝120° 的地方，也就是經度 0°。圖中乙在 0°。", "w": ["甲在臺灣東邊，時間比臺灣早，會是晚上 9 點。", "丙（90°W）和臺灣相差 210°，相差 14 小時，是早上 6 點。", "乙（0°）剛好是中午 12 點。"], "parent": "先算差幾小時（8 小時），再算差幾度（8×15＝120°），慢的往西找。", "fig": "<svg class=\"fig\" viewBox=\"0 0 600 130\" role=\"img\" aria-label=\"經度與地方時示意圖\"><title>經度與地方時示意圖</title><line x1=\"40\" y1=\"60\" x2=\"560\" y2=\"60\" stroke=\"#13233A\" stroke-width=\"2\"/><text x=\"40\" y=\"25\" font-size=\"14\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">西</text><text x=\"560\" y=\"25\" font-size=\"14\" text-anchor=\"end\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">東</text><line x1=\"40.0\" y1=\"54\" x2=\"40.0\" y2=\"66\" stroke=\"#13233A\"/><text x=\"40.0\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">180°W</text><line x1=\"105.0\" y1=\"54\" x2=\"105.0\" y2=\"66\" stroke=\"#13233A\"/><text x=\"105.0\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">135°W</text><line x1=\"170.0\" y1=\"54\" x2=\"170.0\" y2=\"66\" stroke=\"#13233A\"/><text x=\"170.0\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">90°W</text><line x1=\"235.0\" y1=\"54\" x2=\"235.0\" y2=\"66\" stroke=\"#13233A\"/><text x=\"235.0\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">45°W</text><line x1=\"300.0\" y1=\"54\" x2=\"300.0\" y2=\"66\" stroke=\"#13233A\"/><text x=\"300.0\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">0°</text><line x1=\"365.0\" y1=\"54\" x2=\"365.0\" y2=\"66\" stroke=\"#13233A\"/><text x=\"365.0\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">45°E</text><line x1=\"430.0\" y1=\"54\" x2=\"430.0\" y2=\"66\" stroke=\"#13233A\"/><text x=\"430.0\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">90°E</text><line x1=\"495.0\" y1=\"54\" x2=\"495.0\" y2=\"66\" stroke=\"#13233A\"/><text x=\"495.0\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">135°E</text><line x1=\"560.0\" y1=\"54\" x2=\"560.0\" y2=\"66\" stroke=\"#13233A\"/><text x=\"560.0\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#13233A\" font-family=\"Noto Sans TC, sans-serif\">180°E</text><circle cx=\"495.0\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"495.0\" y=\"44\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><text x=\"495.0\" y=\"112\" font-size=\"13\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">135°E</text><circle cx=\"300.0\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"300.0\" y=\"44\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">乙</text><text x=\"300.0\" y=\"112\" font-size=\"13\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">0°</text><circle cx=\"170.0\" cy=\"60\" r=\"7\" fill=\"#B42318\"/><text x=\"170.0\" y=\"44\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">丙</text><text x=\"170.0\" y=\"112\" font-size=\"13\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">90°W</text></svg>"}, {"id": "GE-L1-M117", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "時區劃分的依據", "diff": "中等", "type": "觀念辨識", "q": "全球劃分時區的主要依據是什麼？", "o": ["經度，每 15° 劃一個時區", "緯度，每 15° 劃一個時區", "國家面積的大小", "各地日出的時間"], "sol": "時間差和經度有關，每 15° 經度差 1 小時，所以時區依經度劃分。", "w": ["緯度和時間早晚無關。", "時區不是依國家面積劃分；面積大的國家可能跨好幾個時區。", "日出時間也會受季節、緯度影響，不是劃分時區的依據。"], "parent": "時間看經度，氣候看緯度。"}, {"id": "GE-L1-H106", "subj": "地理", "unit": "L1 位置、地圖與座標系統（經度與時區）", "point": "時差與航程的整合", "diff": "困難", "type": "整合推理", "q": "一架飛機在臺灣時間 10 月 13 日晚上 11 點從臺灣起飛，飛行 12 小時後抵達倫敦（比臺灣慢 8 小時）。抵達時倫敦的當地時間是幾點？", "o": ["10 月 14 日凌晨 3 點", "10 月 14 日上午 11 點", "10 月 14 日晚上 7 點", "10 月 13 日晚上 7 點"], "sol": "步驟一：抵達時的臺灣時間是 10 月 13 日 23 點＋12 小時＝10 月 14 日 11 點。步驟二：倫敦比臺灣慢 8 小時，11－8＝3，是 10 月 14 日凌晨 3 點。", "w": ["只加了飛行時間，沒有換成倫敦的時間。", "把時差加上去了；倫敦比臺灣慢，要減 8 小時。", "只減了時差，忘了加上飛行的 12 小時。"], "parent": "先算「臺灣時間幾點到」，再換成「當地時間」，兩步分開做。"}, {"id": "GE-L1-E114", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "熱帶與溫帶的分界", "diff": "簡單", "type": "觀念辨識", "q": "熱帶與溫帶大約以哪一條緯線為分界？", "o": ["23.5° 的回歸線", "66.5° 的極圈", "赤道", "本初經線"], "sol": "熱帶在南、北回歸線（23.5°）之間；回歸線以外到極圈（66.5°）是溫帶。", "w": ["66.5° 的極圈是溫帶和寒帶的分界。", "赤道在熱帶的中間，不是分界。", "本初經線是經線，用來分東西，不分氣候帶。"], "parent": "記兩個數字：23.5 分熱帶和溫帶，66.5 分溫帶和寒帶。"}, {"id": "GE-L1-E115", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "寒帶的位置", "diff": "簡單", "type": "觀念辨識", "q": "寒帶位在哪裡？", "o": ["極圈（66.5°）到極點之間", "赤道到回歸線（23.5°）之間", "回歸線到極圈（66.5°）之間", "南、北回歸線之間的地區"], "sol": "寒帶在南、北極圈（66.5°）以內，靠近兩極的地方。", "w": ["赤道到回歸線之間是熱帶。", "回歸線到極圈之間是溫帶。", "南、北回歸線之間是熱帶。"], "parent": "熱帶在腰、溫帶在中間、寒帶在頭頂和腳底。"}, {"id": "GE-L1-M118", "subj": "地理", "unit": "L1 位置、地圖與座標系統（緯度與氣候）", "point": "陽光照射角度圖", "diff": "中等", "type": "圖表判讀", "q": "下圖中甲、乙兩處接受同樣寬度的一束陽光。下列敘述何者正確？", "o": ["甲處陽光較集中，地面較容易變熱", "乙處陽光較集中，地面較容易變熱", "兩處受熱程度一樣，因為陽光的量相同", "乙處照到的面積較小"], "sol": "甲處陽光垂直照射，同樣的陽光集中在較小的面積；乙處斜射，陽光分散到較大的面積。所以甲處每一小塊得到的熱較多，較容易變熱。", "w": ["乙處是斜射，陽光分散在較大的面積上，不是較集中。", "陽光的量相同，但分到的面積不同，每一小塊得到的熱就不同。", "乙處斜射，照到的面積較大，不是較小。"], "parent": "同一把手電筒，正照光圈小又亮，斜照光圈大又暗。", "fig": "<svg class=\"fig\" viewBox=\"0 0 460 220\" role=\"img\" aria-label=\"陽光照射角度示意圖\"><title>陽光照射角度示意圖</title><line x1=\"20\" y1=\"180\" x2=\"440\" y2=\"180\" stroke=\"#13233A\" stroke-width=\"3\"/><line x1=\"80\" y1=\"30\" x2=\"80\" y2=\"176\" stroke=\"#E0A100\" stroke-width=\"3\"/><line x1=\"110\" y1=\"30\" x2=\"110\" y2=\"176\" stroke=\"#E0A100\" stroke-width=\"3\"/><line x1=\"140\" y1=\"30\" x2=\"140\" y2=\"176\" stroke=\"#E0A100\" stroke-width=\"3\"/><rect x=\"80\" y=\"182\" width=\"60\" height=\"8\" fill=\"#E0A100\"/><text x=\"110\" y=\"210\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B42318\" font-family=\"Noto Sans TC, sans-serif\">甲</text><line x1=\"134.0\" y1=\"30\" x2=\"280.0\" y2=\"176\" stroke=\"#E0A100\" stroke-width=\"3\"/><line x1=\"176.4\" y1=\"30\" x2=\"322.4\" y2=\"176\" stroke=\"#E0A100\" stroke-width=\"3\"/><line x1=\"218.9\" y1=\"30\" x2=\"364.9\" y2=\"176\" stroke=\"#E0A100\" stroke-width=\"3\"/><rect x=\"280\" y=\"182\" width=\"84.9\" height=\"8\" fill=\"#E0A100\"/><text x=\"322.4\" y=\"210\" font-size=\"16\" font-weight=\"700
